# ============================================================
# Course Parameters (Single Source of Truth)
# ============================================================
# Change these values once; they propagate everywhere via
# {{< meta params.X >}} in any .qmd file.

params:
  # Course identity
  course-code: "ASTR 101"
  course-title: "Principles of Astronomy"
  semester: "Spring 2026"

  # Instructor
  instructor: "Dr. Anna Rosen"
  email: "alrosen@sdsu.edu"
  office: "Physics 239"
  office-hours: "Fridays 11:00 am–1:00 pm (and by appointment)"

  # Class logistics
  class-time: "MWF 10:00–10:50 AM"
  location: "LH 345"

  # URLs
  website-url: "https://astrobytes-edu.github.io/astr101-sp26"
  canvas-url: "https://sdsu.instructure.com"

  # Textbook
  textbook: "Lecture readings and slides provided on the course website"
  textbook-reference: "OpenStax *Astronomy 2e* (free online) — optional reference"

  # Assets (for includes)
  logo: "assets/astr101-logo.png"

# ============================================================

author: "Dr. Anna Rosen"

# Profiles for different audiences
# Usage: quarto render --profile instructor
profile:
  default: student
  group:
    - student
    - instructor

# ============================================================

