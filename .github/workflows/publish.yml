name: Publish Quarto site to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Quarto (with TinyTeX for PDF)
        uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          tinytex: true

      - name: Install LaTeX packages for PDF
        run: |
          set -euo pipefail
          export PATH="$HOME/.TinyTeX/bin/x86_64-linux:$PATH"
          repos=(
            "https://mirror.math.princeton.edu/pub/CTAN/systems/texlive/tlnet"
            "https://ctan.math.illinois.edu/systems/texlive/tlnet"
            "https://mirrors.mit.edu/CTAN/systems/texlive/tlnet"
          )

          for repo in "${repos[@]}"; do
            echo "Trying TeX Live repository: $repo"
            tlmgr option repository "$repo"
            if tlmgr install titling; then
              exit 0
            fi
          done

          echo "Unable to install required LaTeX package 'titling' from configured CTAN mirrors." >&2
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate tokens from brand
        run: |
          pip install pyyaml
          python scripts/brand_to_scss.py

      - name: Render site
        run: |
          quarto render
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
