name: CI (Render HTML + check links)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC (weekly link-rot patrol)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.1.9
        with:
          tinytex: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: Generate tokens from brand
        run: |
          pip install pyyaml
          python scripts/brand_to_scss.py

      - name: Check tokens are up-to-date
        run: |
          if ! git diff --quiet assets/theme/_tokens_generated.scss; then
            echo "ERROR: _tokens_generated.scss is out of date"
            echo "Run: python scripts/brand_to_scss.py"
            echo ""
            echo "Diff:"
            git diff assets/theme/_tokens_generated.scss
            exit 1
          fi

      - name: Render site (HTML + PDFs)
        run: |
          quarto render
          touch _site/.nojekyll

      - name: Normalize RevealJS lazy images for HTML-Proofer
        run: |
          python3 scripts/normalize_html_for_proofer.py _site

      - name: Install HTMLProofer
        run: gem install html-proofer -v 5.2.0

      - name: Validate links/images/scripts
        run: ruby scripts/run_htmlproofer.rb _site
