# Glossary Registry
# Terms and definitions for ASTR 101
#
# Usage:
#   {{< term id >}}           - Inline term with margin note
#   {{< glossary lecture=3 >}} - All terms from lecture 3
#   {{< glossary module=1 >}}  - All terms from module 1
#
# Schema:
#   term: display name
#   definition: short definition (1-2 sentences)
#   context: (optional) additional context or formula
#   lecture: numeric lecture number (for filtering)
#   module: which module introduces this
#   tier: "core" (★ exam-essential) or "supporting" (◇ helpful context)

# =============================================================
# Module 1: Foundations
# =============================================================

# -------------------------------------------------------------
# Lecture 1: Spoiler Alerts — The Universe Is Weird
# -------------------------------------------------------------

inference:
  term: "Inference"
  definition: "Drawing conclusions about quantities we cannot directly access (like a star's temperature) from quantities we can measure (like its color)."
  context: "Inference requires a model—a physical relationship connecting observable to unobservable."
  lecture: 1
  module: 1
  tier: core

observable:
  term: "Observable"
  definition: "A quantity that can be directly measured—brightness, position, wavelength, timing."
  context: "Astronomers have remarkably few types of observables; nearly everything else is inferred."
  lecture: 1
  module: 1
  tier: core

model:
  term: "Model"
  definition: "A mathematical relationship encoding physical assumptions that connects what we measure to what we want to know."
  context: "Models can be tested by comparing their predictions to new observations."
  lecture: 1
  module: 1
  tier: core

photon:
  term: "Photon"
  definition: "A discrete packet of electromagnetic energy; the quantum of light."
  context: "Each photon carries energy $E = h\\nu$, where $h$ is Planck's constant and $\\nu$ is frequency."
  lecture: 1
  module: 1
  tier: core

wavelength:
  term: "Wavelength (λ)"
  definition: "The spatial period of a light wave—the distance between successive crests."
  context: "Measured in nanometers (nm) for visible light, centimeters for radio. Related to frequency by $c = \\lambda\\nu$."
  lecture: 1
  module: 1
  tier: core

frequency:
  term: "Frequency (ν)"
  definition: "The number of wave cycles passing a point per second, measured in Hertz (Hz)."
  context: "Higher frequency means higher energy photons: $E = h\\nu$."
  lecture: 1
  module: 1
  tier: core

spectrum:
  term: "Spectrum"
  definition: "Brightness measured as a function of wavelength—the distribution of light across different colors/energies."
  context: "A spectrum contains far more information than a single brightness measurement."
  lecture: 1
  module: 1
  tier: core

spectroscopy:
  term: "Spectroscopy"
  definition: "The technique of spreading light into its component wavelengths to analyze composition, temperature, and motion."
  context: "Spectroscopy transformed astronomy from cataloging what's there to understanding what it's made of."
  lecture: 1
  module: 1
  tier: core

flux:
  term: "Flux (F)"
  definition: "The amount of light energy arriving at a detector per unit time per unit area."
  context: "Measured in erg s⁻¹ cm⁻². Flux depends on both luminosity and distance: $F = L/(4\\pi d^2)$."
  lecture: 1
  module: 1
  tier: core

luminosity:
  term: "Luminosity (L)"
  definition: "The total light energy emitted by a source per unit time—its intrinsic brightness."
  context: "Measured in erg/s or solar luminosities ($L_\\odot$). Luminosity is what the object emits; flux is what we receive."
  lecture: 1
  module: 1
  tier: core

standard_candle:
  term: "Standard candle"
  definition: "An object whose intrinsic luminosity can be determined independently, allowing distance to be calculated from observed brightness."
  context: "Examples: Cepheid variables (period → luminosity), Type Ia supernovae (consistent peak brightness)."
  lecture: 1
  module: 1
  tier: supporting

inverse_square_law:
  term: "Inverse-square law"
  definition: "The principle that flux decreases with the square of distance: double the distance, quarter the brightness."
  context: "$F = L/(4\\pi d^2)$. This geometric spreading is why distance determination is central to astronomy."
  lecture: 1
  module: 1
  tier: core

emission:
  term: "Emission"
  definition: "Light produced and sent out by a source, often at specific wavelengths determined by atomic transitions."
  context: "Emission lines appear bright against a darker background."
  lecture: 1
  module: 1
  tier: core

absorption:
  term: "Absorption"
  definition: "Light removed from a beam by intervening material, often at specific wavelengths where atoms absorb photons."
  context: "Absorption lines appear dark against a brighter continuum."
  lecture: 1
  module: 1
  tier: core

ionized:
  term: "Ionized"
  definition: "An atom that has lost one or more electrons, leaving it with a net positive charge."
  context: "Ionization requires energy (heat or UV radiation). Ionized gas emits different spectral lines than neutral gas."
  lecture: 1
  module: 1
  tier: supporting

neutral:
  term: "Neutral"
  definition: "An atom with equal numbers of protons and electrons, having no net electric charge."
  context: "Neutral hydrogen emits at 21 cm (radio); ionized hydrogen emits at 656 nm (optical)."
  lecture: 1
  module: 1
  tier: supporting

thermal_radiation:
  term: "Thermal radiation"
  definition: "Light emitted by an object due to its temperature—all objects above absolute zero emit thermal radiation."
  context: "Hotter objects emit more light at shorter wavelengths (Wien's law)."
  lecture: 1
  module: 1
  tier: supporting

blackbody:
  term: "Blackbody"
  definition: "An idealized object that absorbs all incident radiation and emits a characteristic spectrum determined only by its temperature."
  context: "Stars approximate blackbodies. The blackbody spectrum peaks at $\\lambda_{\\text{peak}} = b/T$ (Wien's law)."
  lecture: 1
  module: 1
  tier: core

extinction:
  term: "Extinction"
  definition: "The dimming of light by dust through a combination of absorption and scattering."
  context: "Extinction is wavelength-dependent: blue light is extinguished more than red (interstellar reddening)."
  lecture: 1
  module: 1
  tier: supporting

lookback_time:
  term: "Lookback time"
  definition: "The time light takes to travel from a distant object to us—we see the object as it was that long ago."
  context: "Looking at the Andromeda Galaxy (2.5 million light-years away), we see it as it was 2.5 million years ago."
  lecture: 1
  module: 1
  tier: supporting

light_year:
  term: "Light-year"
  definition: "The distance light travels in one year—approximately $10^{18}$ cm or about 63,000 AU."
  context: "A unit of distance, not time. Proxima Centauri is 4.2 light-years away."
  lecture: 1
  module: 1
  tier: core

planck_constant:
  term: "Planck's constant (h)"
  definition: "A fundamental constant that relates photon energy to frequency: $h = 6.63 \\times 10^{-27}$ erg·s."
  context: "The appearance of $h$ in an equation signals that quantum mechanics is involved."
  lecture: 1
  module: 1
  tier: supporting

speed_of_light:
  term: "Speed of light (c)"
  definition: "The speed at which light travels in vacuum: $c = 3 \\times 10^{10}$ cm/s."
  context: "A universal constant—the speed limit of the universe. Nothing with mass can reach this speed."
  lecture: 1
  module: 1
  tier: core

# Cosmology Spoilers (still L1, but supporting tier)
dark-matter:
  term: "Dark Matter"
  definition: "Invisible matter that does not emit, absorb, or reflect light but exerts gravitational influence."
  context: "Dark matter outweighs ordinary matter ~5:1 and is essential for explaining galaxy rotation curves and cosmic structure formation."
  lecture: 1
  module: 1
  tier: supporting

dark-energy:
  term: "Dark Energy"
  definition: "The unknown cause of the accelerating expansion of the universe, comprising ~68% of the cosmic energy budget."
  context: "Often modeled as a cosmological constant (Λ), but its physical origin remains one of the deepest mysteries in physics."
  lecture: 1
  module: 1
  tier: supporting

hubble-constant:
  term: "Hubble Constant (H₀)"
  definition: "The current expansion rate of the universe, approximately 70 km/s/Mpc."
  context: "A galaxy 1 Mpc away recedes at ~70 km/s; one 10 Mpc away recedes at ~700 km/s. The inverse of H₀ gives a rough estimate of the universe's age."
  lecture: 1
  module: 1
  tier: supporting

rotation-curve:
  term: "Rotation Curve"
  definition: "A plot of orbital speed versus distance from a galaxy's center."
  context: "Flat rotation curves—where speed stays constant at large radii—are the primary evidence for dark matter halos around galaxies."
  lecture: 1
  module: 1
  tier: supporting

redshift-cosmological:
  term: "Redshift (Cosmological)"
  definition: "The stretching of light wavelengths due to the expansion of space."
  context: "More distant galaxies show larger redshifts because light has traveled through more expanding space to reach us."
  lecture: 1
  module: 1
  tier: supporting

lcdm:
  term: "ΛCDM"
  definition: "The standard cosmological model: Λ (cosmological constant/dark energy) + CDM (Cold Dark Matter)."
  context: "Fits observations remarkably well with only six free parameters, but leaves dark matter and dark energy unexplained."
  lecture: 1
  module: 1
  tier: supporting

cosmic-web:
  term: "Cosmic Web"
  definition: "The large-scale structure of the universe: galaxies arranged in filaments, walls, and clusters, separated by vast voids."
  context: "The cosmic web is still evolving—gravity continues to pull matter from voids into filaments and clusters."
  lecture: 1
  module: 1
  tier: supporting

# -------------------------------------------------------------
# Lecture 2: Tools of the Trade — Math Survival Kit
# -------------------------------------------------------------

scientific_notation:
  term: "Scientific notation"
  definition: "A way of writing numbers as a coefficient times a power of ten, e.g., $3.0 \\times 10^8$ m/s."
  context: "Essential for handling the extreme scales in astronomy without drowning in zeros."
  lecture: 2
  module: 1
  tier: core

si_prefix:
  term: "SI prefix"
  definition: "Prefixes that denote powers of ten: kilo (10³), mega (10⁶), giga (10⁹), micro (10⁻⁶), nano (10⁻⁹), etc."
  context: "Allows compact notation: 1 km = 1000 m; 1 nm = 10⁻⁹ m."
  lecture: 2
  module: 1
  tier: supporting

ratio_method:
  term: "Ratio method"
  definition: "A problem-solving technique that compares two situations using the same physical law, canceling constants and simplifying calculations."
  context: "Avoids big-number pain: instead of computing absolute values, compare ratios."
  lecture: 2
  module: 1
  tier: core

astronomical_unit:
  term: "Astronomical Unit (AU)"
  definition: "The average distance from Earth to the Sun, approximately $1.5 \\times 10^{11}$ m."
  context: "A convenient unit for solar system distances. Neptune is ~30 AU from the Sun."
  lecture: 2
  module: 1
  tier: core

parsec:
  term: "Parsec (pc)"
  definition: "The distance at which 1 AU subtends an angle of 1 arcsecond; approximately 3.26 light-years or $3.1 \\times 10^{16}$ m."
  context: "Derived from 'parallax arcsecond.' The nearest star is about 1.3 pc away."
  lecture: 2
  module: 1
  tier: core

# -------------------------------------------------------------
# Lecture 3: The Sky Is a Map
# -------------------------------------------------------------

constellation:
  term: "Constellation"
  definition: "A named pattern of stars on the sky."
  context: "Constellations are defined by directions (angles) on the celestial sphere; the stars in a constellation are not necessarily close together in space."
  lecture: 3
  module: 1
  tier: supporting

celestial_sphere:
  term: "Celestial sphere"
  definition: "An imaginary sphere centered on the observer onto which all celestial objects are projected."
  context: "A coordinate system for directions on the sky, not a representation of actual distances."
  lecture: 3
  module: 1
  tier: core

celestial_pole:
  term: "Celestial pole"
  definition: "A point on the celestial sphere directly above Earth's geographic pole."
  context: "Stars appear to circle the celestial poles due to Earth's rotation."
  lecture: 3
  module: 1
  tier: core

celestial_equator:
  term: "Celestial equator"
  definition: "Earth's equator projected outward onto the celestial sphere."
  context: "A great circle that divides the celestial sphere into northern and southern hemispheres."
  lecture: 3
  module: 1
  tier: core

ecliptic:
  term: "Ecliptic"
  definition: "The Sun's apparent yearly path across the celestial sphere, corresponding to the plane of Earth's orbit."
  context: "Tilted by about 23.5° relative to the celestial equator; the zodiac constellations lie along it."
  lecture: 3
  module: 1
  tier: core

horizon:
  term: "Horizon"
  definition: "The great circle that marks the boundary between directions above and below your local ground plane."
  context: "Depends on your location on Earth."
  lecture: 3
  module: 1
  tier: supporting

zenith:
  term: "Zenith"
  definition: "The point on the celestial sphere directly overhead for a given observer."
  context: "Depends on your location on Earth."
  lecture: 3
  module: 1
  tier: supporting

great_circle:
  term: "Great circle"
  definition: "Any circle on a sphere whose plane passes through the sphere's center."
  context: "The celestial equator, ecliptic, and horizon are all great circles."
  lecture: 3
  module: 1
  tier: supporting

solstice:
  term: "Solstice"
  definition: "A time when the Sun reaches its farthest angular distance north or south of the celestial equator, producing the longest or shortest day."
  context: "Occurs around June 21 and December 21; from Latin for 'Sun stands still'."
  lecture: 3
  module: 1
  tier: core

equinox:
  term: "Equinox"
  definition: "A time when the Sun crosses the celestial equator, making day and night approximately equal in length worldwide."
  context: "Occurs around March 20 and September 22; exact day length depends slightly on refraction and the Sun's finite size."
  lecture: 3
  module: 1
  tier: core

angular_size:
  term: "Angular size"
  definition: "The angle an object subtends as seen by an observer, measured in degrees, arcminutes, or arcseconds."
  context: "Angular size depends on physical size and distance; for small angles, θ (radians) ≈ D/d where D is diameter and d is distance."
  lecture: 3
  module: 1
  tier: core

axial_tilt:
  term: "Axial tilt"
  definition: "The angle between a planet's rotational axis and its orbital axis; Earth's tilt is 23.5°."
  context: "The cause of Earth's seasons—NOT distance from the Sun."
  lecture: 3
  module: 1
  tier: core

# -------------------------------------------------------------
# Lecture 4: Moon Geometry
# -------------------------------------------------------------

eclipse:
  term: "Eclipse"
  definition: "An astronomical event where one celestial body passes into the shadow of another."
  context: "Solar eclipses occur when the Moon's shadow falls on Earth; lunar eclipses occur when the Moon passes through Earth's shadow."
  lecture: 4
  module: 1
  tier: core

solar_eclipse:
  term: "Solar eclipse"
  definition: "An eclipse that occurs when the Moon's shadow falls on Earth."
  context: "Possible only at new moon when the Moon is near a node; visible only from a limited area (the shadow path)."
  lecture: 4
  module: 1
  tier: core

lunar_eclipse:
  term: "Lunar eclipse"
  definition: "An eclipse that occurs when the Moon passes through Earth's shadow."
  context: "Possible only at full moon when the Moon is near a node; visible from the entire night side of Earth."
  lecture: 4
  module: 1
  tier: core

annular_eclipse:
  term: "Annular eclipse"
  definition: "A solar eclipse in which the Moon appears smaller than the Sun, leaving a ring ('annulus') of sunlight visible."
  context: "Occurs when the Moon is near apogee in its elliptical orbit."
  lecture: 4
  module: 1
  tier: supporting

totality:
  term: "Totality"
  definition: "The phase of a total eclipse when the Sun (solar eclipse) or Moon (lunar eclipse) is completely blocked or immersed in shadow."
  context: "During total solar eclipses, the corona becomes visible."
  lecture: 4
  module: 1
  tier: supporting

umbra:
  term: "Umbra"
  definition: "The darkest, central portion of a shadow where the light source is completely blocked."
  context: "The Moon entering Earth's umbra creates a total or partial lunar eclipse."
  lecture: 4
  module: 1
  tier: core

penumbra:
  term: "Penumbra"
  definition: "The lighter, outer portion of a shadow where only part of the light source is blocked."
  context: "The Moon passing through Earth's penumbra creates a subtle penumbral lunar eclipse."
  lecture: 4
  module: 1
  tier: supporting

blood_moon:
  term: "Blood moon"
  definition: "Colloquial term for the reddish appearance of the Moon during a total lunar eclipse."
  context: "Caused by Earth's atmosphere filtering and refracting sunlight into the shadow zone."
  lecture: 4
  module: 1
  tier: supporting

node:
  term: "Node"
  definition: "One of two points where the Moon's orbital plane intersects the ecliptic plane."
  context: "Eclipses can only occur when the Moon is near a node during new moon (solar) or full moon (lunar) phase."
  lecture: 4
  module: 1
  tier: core

ascending_node:
  term: "Ascending node"
  definition: "The point where the Moon crosses the ecliptic plane moving from south to north."
  context: "One of two points where the Moon's tilted orbit intersects the ecliptic."
  lecture: 4
  module: 1
  tier: supporting

descending_node:
  term: "Descending node"
  definition: "The point where the Moon crosses the ecliptic plane moving from north to south."
  context: "One of two points where the Moon's tilted orbit intersects the ecliptic."
  lecture: 4
  module: 1
  tier: supporting

eclipse_season:
  term: "Eclipse season"
  definition: "A period of about 34–35 days during which eclipses are possible, occurring when the Sun is near one of the Moon's orbital nodes."
  context: "Two eclipse seasons occur each year, about 173 days apart."
  lecture: 4
  module: 1
  tier: supporting

saros_cycle:
  term: "Saros cycle"
  definition: "A period of approximately 18 years, 11 days, and 8 hours after which similar eclipses repeat."
  context: "Results from the alignment of the synodic, draconic, and anomalistic months."
  lecture: 4
  module: 1
  tier: supporting

apogee:
  term: "Apogee"
  definition: "The point in the Moon's orbit when it is farthest from Earth (~406,700 km)."
  context: "At apogee, the Moon appears smallest; if a solar eclipse occurs, it cannot be total."
  lecture: 4
  module: 1
  tier: supporting

perigee:
  term: "Perigee"
  definition: "The point in the Moon's orbit when it is closest to Earth (~356,500 km)."
  context: "At perigee, the Moon appears largest; total solar eclipses are possible."
  lecture: 4
  module: 1
  tier: supporting

new_moon:
  term: "New moon"
  definition: "The lunar phase when the Moon is between Earth and the Sun, with the illuminated side facing away from Earth."
  context: "The Moon is lost in the Sun's glare during this phase."
  lecture: 4
  module: 1
  tier: core

first_quarter:
  term: "First quarter"
  definition: "The lunar phase when the Moon is 90° east of the Sun."
  context: "Right half illuminated (as seen from the Northern Hemisphere); rises around noon."
  lecture: 4
  module: 1
  tier: core

full_moon:
  term: "Full moon"
  definition: "The lunar phase when the Moon is opposite the Sun, with essentially 100% of the Earth-facing side illuminated."
  context: "Rises at sunset and sets at sunrise."
  lecture: 4
  module: 1
  tier: core

third_quarter:
  term: "Third quarter"
  definition: "The lunar phase when the Moon is 90° west of the Sun."
  context: "Left half illuminated (as seen from the Northern Hemisphere); rises around midnight."
  lecture: 4
  module: 1
  tier: core

gibbous:
  term: "Gibbous"
  definition: "A lunar phase between quarter and full, with more than half but less than all of the Moon's face illuminated."
  context: "From Latin 'gibbosus' meaning 'humpbacked'."
  lecture: 4
  module: 1
  tier: supporting

crescent:
  term: "Crescent (Moon)"
  definition: "A Moon phase with less than half of the Earth-facing disk appearing illuminated."
  context: "A waxing crescent occurs after new moon; a waning crescent occurs before new moon."
  lecture: 4
  module: 1
  tier: supporting

waxing:
  term: "Waxing"
  definition: "Increasing in illumination; the Moon is waxing between new moon and full moon."
  context: "From Old English 'weaxan' meaning 'to grow'."
  lecture: 4
  module: 1
  tier: supporting

waning:
  term: "Waning"
  definition: "Decreasing in illumination; the Moon is waning between full moon and new moon."
  context: "From Old English 'wanian' meaning 'to lessen'."
  lecture: 4
  module: 1
  tier: supporting

synodic_month:
  term: "Synodic month"
  definition: "The time for the Moon to complete one cycle of phases (new moon to new moon), approximately 29.5 days."
  context: "Longer than the sidereal month because Earth is also moving around the Sun."
  lecture: 4
  module: 1
  tier: core

conjunction:
  term: "Conjunction"
  definition: "An alignment where two objects appear in nearly the same direction on the sky."
  context: "New moon corresponds to conjunction of the Moon with the Sun as seen from Earth."
  lecture: 4
  module: 1
  tier: supporting

opposition:
  term: "Opposition"
  definition: "An alignment where two objects appear 180° apart on the sky."
  context: "Full moon corresponds to opposition of the Moon relative to the Sun."
  lecture: 4
  module: 1
  tier: supporting

lunar_phase:
  term: "Phase (lunar)"
  definition: "The apparent shape of the Moon's illuminated portion as seen from Earth, determined by the Moon's position relative to the Sun."
  context: "The eight traditional phases cycle over about 29.5 days."
  lecture: 4
  module: 1
  tier: core

# -------------------------------------------------------------
# Lecture 5: From Ancient Skies to Kepler's Laws
# -------------------------------------------------------------

kepler_first_law:
  term: "Kepler's First Law"
  definition: "Planets orbit the Sun in ellipses, with the Sun at one focus."
  context: "Replaced the ancient assumption of perfect circular orbits."
  lecture: 5
  module: 1
  tier: core

kepler_second_law:
  term: "Kepler's Second Law"
  definition: "A line from the Sun to a planet sweeps out equal areas in equal times."
  context: "Planets move faster when closer to the Sun, slower when farther."
  lecture: 5
  module: 1
  tier: core

kepler_third_law:
  term: "Kepler's Third Law"
  definition: "The square of a planet's orbital period is proportional to the cube of its semi-major axis: $P^2 \\propto a^3$."
  context: "In solar system units, $P^2 = a^3$ (years, AU). Connects orbital size to orbital time."
  lecture: 5
  module: 1
  tier: core

ellipse:
  term: "Ellipse"
  definition: "An oval shape defined by two foci; the sum of distances from any point to both foci is constant."
  context: "A circle is a special ellipse where both foci coincide."
  lecture: 5
  module: 1
  tier: core

semi_major_axis:
  term: "Semi-major axis (a)"
  definition: "Half the longest diameter of an ellipse; the average distance from the orbiting body to the focus."
  context: "For planetary orbits, it's the 'average' orbital radius used in Kepler's Third Law."
  lecture: 5
  module: 1
  tier: core

eccentricity:
  term: "Eccentricity (e)"
  definition: "A measure of how elongated an ellipse is, ranging from 0 (circle) to just under 1 (very elongated)."
  context: "Earth's orbit has e ≈ 0.017 (nearly circular); Pluto's has e ≈ 0.25."
  lecture: 5
  module: 1
  tier: core

perihelion:
  term: "Perihelion"
  definition: "The point in a planet's orbit when it is closest to the Sun."
  context: "Earth reaches perihelion in early January."
  lecture: 5
  module: 1
  tier: core

aphelion:
  term: "Aphelion"
  definition: "The point in a planet's orbit when it is farthest from the Sun."
  context: "Earth reaches aphelion in early July."
  lecture: 5
  module: 1
  tier: core

empirical_law:
  term: "Empirical law"
  definition: "A pattern or relationship derived from observations, without a theoretical explanation for why it holds."
  context: "Kepler's laws were empirical—they described what happens but not why."
  lecture: 5
  module: 1
  tier: core

retrograde_motion:
  term: "Retrograde motion"
  definition: "The apparent backward (westward) motion of a planet against the background stars."
  context: "Caused by Earth overtaking outer planets or being overtaken by inner planets."
  lecture: 5
  module: 1
  tier: supporting

# -------------------------------------------------------------
# Lecture 6: Newton's Revolution — From Patterns to Physics
# -------------------------------------------------------------

newton_first_law:
  term: "Newton's First Law"
  definition: "An object at rest stays at rest, and an object in motion stays in motion at constant velocity, unless acted upon by a net external force."
  context: "Also called the law of inertia."
  lecture: 6
  module: 1
  tier: core

newton_second_law:
  term: "Newton's Second Law"
  definition: "The acceleration of an object is proportional to the net force and inversely proportional to its mass: $\\vec{F}_{net} = m\\vec{a}$."
  context: "Force causes acceleration, not velocity."
  lecture: 6
  module: 1
  tier: core

newton_third_law:
  term: "Newton's Third Law"
  definition: "For every action, there is an equal and opposite reaction."
  context: "Forces come in pairs acting on different objects."
  lecture: 6
  module: 1
  tier: core

universal_gravitation:
  term: "Universal Gravitation"
  definition: "Every mass attracts every other mass with force $F = GMm/r^2$, where G is the gravitational constant."
  context: "The same law governs falling apples and orbiting moons."
  lecture: 6
  module: 1
  tier: core

gravitational_constant:
  term: "Gravitational constant (G)"
  definition: "The fundamental constant in Newton's law of gravitation: $G = 6.67 \\times 10^{-11}$ N·m²/kg²."
  context: "Determines the strength of gravity; measured by Cavendish in 1798."
  lecture: 6
  module: 1
  tier: supporting

centripetal_force:
  term: "Centripetal force"
  definition: "The net inward force required to keep an object moving in a circle: $F = mv^2/r$."
  context: "For orbital motion, gravity provides the centripetal force."
  lecture: 6
  module: 1
  tier: core

orbital_velocity:
  term: "Orbital velocity"
  definition: "The speed required for a stable circular orbit: $v = \\sqrt{GM/r}$."
  context: "Depends on the central mass and orbital radius, not the orbiting object's mass."
  lecture: 6
  module: 1
  tier: core

kepler_newton:
  term: "Newton's form of Kepler's Third Law"
  definition: "The relationship $P^2 = 4\\pi^2 a^3 / (GM)$ that allows mass to be determined from orbital measurements."
  context: "This is how we 'weigh' stars, planets, and galaxies."
  lecture: 6
  module: 1
  tier: core

# -------------------------------------------------------------
# Lecture 7: The Cosmic Messenger — Light Carries Information
# -------------------------------------------------------------

electromagnetic_spectrum:
  term: "Electromagnetic spectrum"
  definition: "The full range of electromagnetic radiation, from radio waves (long wavelength) to gamma rays (short wavelength)."
  context: "Visible light is a tiny slice; most of the spectrum is invisible to human eyes."
  lecture: 7
  module: 1
  tier: core

radio_waves:
  term: "Radio waves"
  definition: "Electromagnetic radiation with the longest wavelengths (> 1 mm), used to study cold gas and cosmic backgrounds."
  context: "Radio telescopes can observe day or night, through clouds."
  lecture: 7
  module: 1
  tier: supporting

infrared:
  term: "Infrared (IR)"
  definition: "Electromagnetic radiation between radio and visible, with wavelengths ~1 μm to 1 mm."
  context: "Reveals warm dust and can penetrate through gas clouds that block visible light."
  lecture: 7
  module: 1
  tier: supporting

ultraviolet:
  term: "Ultraviolet (UV)"
  definition: "Electromagnetic radiation between visible and X-rays, with wavelengths ~10–400 nm."
  context: "Absorbed by Earth's ozone layer; requires space telescopes to observe."
  lecture: 7
  module: 1
  tier: supporting

xrays:
  term: "X-rays"
  definition: "High-energy electromagnetic radiation with wavelengths ~0.01–10 nm."
  context: "Emitted by hot gas (millions of K) around black holes and in galaxy clusters."
  lecture: 7
  module: 1
  tier: supporting

gamma_rays:
  term: "Gamma rays"
  definition: "The highest-energy electromagnetic radiation, with wavelengths < 0.01 nm."
  context: "Produced in extreme events: supernovae, pulsars, active galactic nuclei."
  lecture: 7
  module: 1
  tier: supporting

rayleigh_scattering:
  term: "Rayleigh scattering"
  definition: "The scattering of light by particles much smaller than the wavelength, with efficiency proportional to 1/λ⁴."
  context: "Explains why the sky is blue (blue light scattered more than red) and sunsets are red."
  lecture: 7
  module: 1
  tier: supporting

atmospheric_window:
  term: "Atmospheric window"
  definition: "A range of wavelengths that can pass through Earth's atmosphere without being absorbed."
  context: "Visible and radio windows allow ground-based astronomy; other wavelengths require space telescopes."
  lecture: 7
  module: 1
  tier: supporting

# -------------------------------------------------------------
# Lecture 8: Reading the Glow — Temperature Written in Light
# -------------------------------------------------------------

wiens_law:
  term: "Wien's Law"
  definition: "The peak wavelength of a blackbody spectrum is inversely proportional to temperature: $\\lambda_{peak} = b/T$."
  context: "Hotter objects peak at shorter (bluer) wavelengths; b = 2.9 × 10⁶ nm·K."
  lecture: 8
  module: 1
  tier: core

stefan_boltzmann:
  term: "Stefan-Boltzmann Law"
  definition: "The total power radiated by a blackbody is proportional to the fourth power of temperature: $L = 4\\pi R^2 \\sigma T^4$."
  context: "Doubling temperature increases luminosity by 16×."
  lecture: 8
  module: 1
  tier: core

blackbody_spectrum:
  term: "Blackbody spectrum"
  definition: "The characteristic continuous spectrum emitted by an idealized thermal radiator, determined only by temperature."
  context: "The shape is universal; only the peak position and height change with temperature."
  lecture: 8
  module: 1
  tier: core

luminosity_temperature_radius:
  term: "L-T-R Relation"
  definition: "The relationship $L = 4\\pi R^2 \\sigma T^4$ connecting luminosity, radius, and temperature."
  context: "Knowing any two quantities allows calculation of the third."
  lecture: 8
  module: 1
  tier: core

# -------------------------------------------------------------
# Lecture 9: Decoding Starlight — Spectral Lines
# -------------------------------------------------------------

kirchhoff_first:
  term: "Kirchhoff's First Law"
  definition: "A hot, dense gas or solid produces a continuous spectrum (all wavelengths)."
  context: "Examples: the interior of a star, a glowing filament."
  lecture: 9
  module: 1
  tier: core

kirchhoff_second:
  term: "Kirchhoff's Second Law"
  definition: "A hot, low-density gas produces an emission-line spectrum (bright lines at specific wavelengths)."
  context: "Examples: neon signs, nebulae."
  lecture: 9
  module: 1
  tier: core

kirchhoff_third:
  term: "Kirchhoff's Third Law"
  definition: "A cool gas in front of a hot source produces an absorption-line spectrum (dark lines at specific wavelengths)."
  context: "This is what we see in stellar spectra—absorption lines from the cooler outer atmosphere."
  lecture: 9
  module: 1
  tier: core

spectral_line:
  term: "Spectral line"
  definition: "A bright or dark feature at a specific wavelength in a spectrum, corresponding to an atomic transition."
  context: "Each element has a unique pattern of lines—its 'fingerprint'."
  lecture: 9
  module: 1
  tier: core

balmer_series:
  term: "Balmer series"
  definition: "The set of hydrogen emission/absorption lines corresponding to transitions to/from the n=2 energy level."
  context: "Includes Hα (656 nm, red), Hβ (486 nm, blue-green), Hγ (434 nm, violet)."
  lecture: 9
  module: 1
  tier: core

energy_level:
  term: "Energy level"
  definition: "A discrete allowed energy state for an electron in an atom; electrons can only occupy specific levels."
  context: "Transitions between levels produce photons with specific energies (and wavelengths)."
  lecture: 9
  module: 1
  tier: core

ground_state:
  term: "Ground state"
  definition: "The lowest energy level of an atom; the n=1 level for hydrogen."
  context: "Atoms 'prefer' the ground state; excited atoms quickly return to it."
  lecture: 9
  module: 1
  tier: supporting

excited_state:
  term: "Excited state"
  definition: "Any energy level above the ground state; atoms in excited states tend to emit photons and drop to lower levels."
  context: "An atom can be excited by absorbing a photon or through collisions."
  lecture: 9
  module: 1
  tier: supporting

obafgkm:
  term: "OBAFGKM"
  definition: "The spectral classification sequence for stars, ordered from hottest (O, ~40,000 K) to coolest (M, ~3,000 K)."
  context: "Mnemonic: 'Oh Be A Fine Girl/Guy, Kiss Me.' Based on line strengths, which depend on temperature."
  lecture: 9
  module: 1
  tier: core

# -------------------------------------------------------------
# Lecture 10: Motion Revealed — Doppler Effect
# -------------------------------------------------------------

doppler_effect:
  term: "Doppler effect"
  definition: "The change in observed wavelength due to relative motion between source and observer."
  context: "Approaching sources are blueshifted; receding sources are redshifted."
  lecture: 10
  module: 1
  tier: core

blueshift:
  term: "Blueshift"
  definition: "A shift to shorter wavelengths, indicating the source is approaching the observer."
  context: "$\\lambda_{obs} < \\lambda_0$; negative $\\Delta\\lambda$."
  lecture: 10
  module: 1
  tier: core

redshift:
  term: "Redshift"
  definition: "A shift to longer wavelengths, indicating the source is receding from the observer."
  context: "$\\lambda_{obs} > \\lambda_0$; positive $\\Delta\\lambda$."
  lecture: 10
  module: 1
  tier: core

radial_velocity:
  term: "Radial velocity"
  definition: "The component of an object's velocity along the line of sight (toward or away from the observer)."
  context: "This is what Doppler measurements detect; transverse motion produces no Doppler shift."
  lecture: 10
  module: 1
  tier: core

transverse_velocity:
  term: "Transverse velocity"
  definition: "The component of an object's velocity perpendicular to the line of sight (across the sky)."
  context: "Produces proper motion but no Doppler shift."
  lecture: 10
  module: 1
  tier: supporting

rest_wavelength:
  term: "Rest wavelength (λ₀)"
  definition: "The wavelength of a spectral line as measured in the laboratory, with no relative motion."
  context: "The reference against which Doppler shifts are measured."
  lecture: 10
  module: 1
  tier: core

light_gathering_power:
  term: "Light-gathering power"
  definition: "A telescope's ability to collect light, proportional to the area of its primary mirror: $\\propto D^2$."
  context: "Doubling diameter quadruples the light collected."
  lecture: 10
  module: 1
  tier: core

angular_resolution:
  term: "Angular resolution"
  definition: "A telescope's ability to distinguish closely-spaced objects; limited by $\\theta \\approx 1.22\\lambda/D$."
  context: "Larger aperture and shorter wavelength give finer resolution."
  lecture: 10
  module: 1
  tier: core

rayleigh_criterion:
  term: "Rayleigh criterion"
  definition: "The formula $\\theta = 1.22\\lambda/D$ for diffraction-limited angular resolution."
  context: "Sets the fundamental limit; atmospheric seeing often dominates for ground telescopes."
  lecture: 10
  module: 1
  tier: supporting

interferometry:
  term: "Interferometry"
  definition: "Combining signals from multiple telescopes to achieve the resolution of a single telescope the size of their separation."
  context: "Used extensively in radio astronomy; enabled imaging of a black hole's shadow."
  lecture: 10
  module: 1
  tier: supporting

# -------------------------------------------------------------
# Lecture 11: Our Cosmic Backyard — Solar System
# -------------------------------------------------------------

terrestrial_planet:
  term: "Terrestrial planet"
  definition: "A rocky planet with a solid surface; Mercury, Venus, Earth, and Mars in our solar system."
  context: "Small, dense, close to the Sun; formed inside the frost line."
  lecture: 11
  module: 1
  tier: core

gas_giant:
  term: "Gas giant"
  definition: "A large planet composed primarily of hydrogen and helium; Jupiter and Saturn."
  context: "No solid surface; formed beyond the frost line where more material was available."
  lecture: 11
  module: 1
  tier: core

ice_giant:
  term: "Ice giant"
  definition: "A large planet composed primarily of heavier volatiles (water, ammonia, methane); Uranus and Neptune."
  context: "Distinguished from gas giants by their composition and smaller size."
  lecture: 11
  module: 1
  tier: core

frost_line:
  term: "Frost line"
  definition: "The distance from the Sun (~3 AU) beyond which water ice could condense in the early solar nebula."
  context: "Explains why rocky planets are close and gas/ice giants are far."
  lecture: 11
  module: 1
  tier: core

nebular_hypothesis:
  term: "Nebular hypothesis"
  definition: "The theory that the solar system formed from a rotating disk of gas and dust around the young Sun."
  context: "Explains common orbital direction, planetary spacing, and composition gradient."
  lecture: 11
  module: 1
  tier: core

protoplanetary_disk:
  term: "Protoplanetary disk"
  definition: "A rotating disk of gas and dust around a young star from which planets form."
  context: "Observed around many young stars; confirms the nebular hypothesis."
  lecture: 11
  module: 1
  tier: supporting

kuiper_belt:
  term: "Kuiper Belt"
  definition: "A region of icy bodies beyond Neptune, from ~30 to ~50 AU."
  context: "Home to Pluto, Eris, and many other dwarf planets and comets."
  lecture: 11
  module: 1
  tier: supporting

oort_cloud:
  term: "Oort Cloud"
  definition: "A hypothetical spherical shell of icy objects at ~10,000–100,000 AU, the source of long-period comets."
  context: "Never directly observed; inferred from comet orbits."
  lecture: 11
  module: 1
  tier: supporting

# -------------------------------------------------------------
# Lecture 12: Climates and Exoplanets
# -------------------------------------------------------------

greenhouse_effect:
  term: "Greenhouse effect"
  definition: "The warming of a planet's surface when atmospheric gases absorb and re-emit infrared radiation."
  context: "CO₂, H₂O, CH₄ are key greenhouse gases; Venus is an extreme example."
  lecture: 12
  module: 1
  tier: core

habitable_zone:
  term: "Habitable zone"
  definition: "The range of orbital distances from a star where liquid water could exist on a planet's surface."
  context: "Also called the 'Goldilocks zone'; depends on stellar luminosity."
  lecture: 12
  module: 1
  tier: core

transit_method:
  term: "Transit method"
  definition: "Detecting exoplanets by measuring the tiny dimming when a planet passes in front of its star."
  context: "Gives planet size; requires edge-on orbital alignment."
  lecture: 12
  module: 1
  tier: core

radial_velocity_method:
  term: "Radial velocity method"
  definition: "Detecting exoplanets by measuring the Doppler shift caused by the star's wobble around the system's center of mass."
  context: "Gives minimum planet mass; most effective for massive planets close to their stars."
  lecture: 12
  module: 1
  tier: core

exoplanet:
  term: "Exoplanet"
  definition: "A planet orbiting a star other than the Sun."
  context: "Over 5,000 confirmed as of 2024; many are unlike anything in our solar system."
  lecture: 12
  module: 1
  tier: core

hot_jupiter:
  term: "Hot Jupiter"
  definition: "A gas giant exoplanet orbiting very close to its star (< 0.1 AU), with orbital periods of days."
  context: "Easiest to detect but puzzling—gas giants should form far from their stars."
  lecture: 12
  module: 1
  tier: supporting

runaway_greenhouse:
  term: "Runaway greenhouse"
  definition: "A feedback loop where rising temperatures evaporate more water, which traps more heat, leading to extreme warming."
  context: "May explain Venus's current state; a cautionary tale for Earth's climate."
  lecture: 12
  module: 1
  tier: supporting

equilibrium_temperature:
  term: "Equilibrium temperature"
  definition: "The temperature a planet would have if absorbed sunlight balanced emitted thermal radiation, ignoring atmospheric greenhouse warming."
  context: "For a planet at distance d with albedo A: $T_{\\mathrm{eq}} \\propto [(1-A)/d^2]^{1/4}$."
  lecture: 12
  module: 1
  tier: core

albedo_bond:
  term: "Bond albedo"
  definition: "The fraction of total incoming stellar energy reflected back to space by a planet, averaged over wavelength and direction."
  context: "Energy balance uses absorbed fraction $(1-A)$, where $A$ is Bond albedo."
  lecture: 12
  module: 1
  tier: core

planetary_climate:
  term: "Planetary climate"
  definition: "The long-term thermal and atmospheric state of a planet, set by energy input, energy loss, and atmospheric/oceanic processes."
  context: "In this lecture: sunlight in, infrared out, plus greenhouse feedbacks."
  lecture: 12
  module: 1
  tier: core

planetary_atmosphere:
  term: "Planetary atmosphere"
  definition: "A layer of gases surrounding a planet that can absorb, emit, and transport energy."
  context: "Atmospheric thickness and composition control greenhouse warming strength."
  lecture: 12
  module: 1
  tier: core

greenhouse_gas:
  term: "Greenhouse gas"
  definition: "A gas that absorbs and re-emits infrared radiation, tending to warm a planet's surface."
  context: "Key examples include H$_2$O, CO$_2$, CH$_4$, and N$_2$O."
  lecture: 12
  module: 1
  tier: core

effective_emission_level:
  term: "Effective emission level"
  definition: "The characteristic altitude in an atmosphere from which most thermal radiation escapes to space."
  context: "If greenhouse opacity increases, this level shifts higher and colder, so the surface must warm to restore balance."
  lecture: 12
  module: 1
  tier: supporting

transit_depth:
  term: "Transit depth"
  definition: "The fractional drop in stellar brightness during a transit."
  context: "To first order, depth $\\approx (R_p/R_*)^2$, so depth constrains planet radius."
  lecture: 12
  module: 1
  tier: core

transit_probability:
  term: "Transit probability"
  definition: "The chance that an exoplanet system is aligned so a transit is visible from Earth."
  context: "Approximately scales as $R_*/a$ for circular orbits, so close-in planets transit more often."
  lecture: 12
  module: 1
  tier: supporting

orbital_inclination:
  term: "Orbital inclination (i)"
  definition: "The tilt of an orbit relative to the observer's line of sight."
  context: "Transits require nearly edge-on geometry ($i \\approx 90^{\\circ}$)."
  lecture: 12
  module: 1
  tier: core

minimum_mass_msin_i:
  term: "Minimum mass ($M_p\\sin i$)"
  definition: "The lower bound on planet mass measured by radial velocity when inclination is unknown."
  context: "If a planet also transits, then $\\sin i \\approx 1$ and radial velocity gives near-true mass."
  lecture: 12
  module: 1
  tier: core

bulk_density:
  term: "Bulk density"
  definition: "Average density of a planet, computed from mass and radius."
  context: "$\\rho = M/(\\tfrac{4}{3}\\pi R^3)$; used to infer broad composition classes (rocky vs gas-rich)."
  lecture: 12
  module: 1
  tier: core

insolation_flux:
  term: "Insolation flux"
  definition: "The stellar energy flux received by a planet at its orbit."
  context: "Often reported in Earth-flux units to compare irradiation levels across exoplanets."
  lecture: 12
  module: 1
  tier: supporting

planetary_habitability:
  term: "Planetary habitability"
  definition: "The potential of a planet to support life, commonly evaluated first by the possibility of stable liquid water."
  context: "Habitable zone membership is a starting screen, not a guarantee of habitability."
  lecture: 12
  module: 1
  tier: core

chemical_disequilibrium:
  term: "Chemical disequilibrium"
  definition: "A state where reactive atmospheric gases coexist away from thermodynamic equilibrium and require continuous replenishment."
  context: "Coexisting O$_2$ and CH$_4$ is a canonical biosignature candidate."
  lecture: 12
  module: 1
  tier: core

transmission_spectroscopy:
  term: "Transmission spectroscopy"
  definition: "Measuring wavelength-dependent starlight filtering through a transiting planet's atmosphere to identify atmospheric gases."
  context: "Compare in-transit and out-of-transit spectra to isolate atmospheric absorption features."
  lecture: 12
  module: 1
  tier: core

exoplanet_atmosphere:
  term: "Exoplanet atmosphere"
  definition: "The gaseous envelope around an exoplanet, inferred remotely through spectra and transit/eclipse observations."
  context: "Atmospheric composition constrains climate, chemistry, and possible biosignatures."
  lecture: 12
  module: 1
  tier: supporting

# -------------------------------------------------------------
# Lecture 13: Are We Alone?
# -------------------------------------------------------------

drake_equation:
  term: "Drake Equation"
  definition: "A framework for estimating the number of communicating civilizations in the galaxy: N = R* × fp × ne × fl × fi × fc × L."
  context: "Not a calculation but a way to organize our ignorance about astrobiology."
  lecture: 13
  module: 1
  tier: core

fermi_paradox:
  term: "Fermi Paradox"
  definition: "The apparent contradiction between the high probability of extraterrestrial civilizations and the lack of evidence for them."
  context: "'Where is everybody?' — Enrico Fermi, 1950."
  lecture: 13
  module: 1
  tier: core

biosignature:
  term: "Biosignature"
  definition: "A detectable sign of life, such as atmospheric gases (O₂, CH₄) that are unlikely without biological processes."
  context: "A key target for future telescope observations of exoplanet atmospheres."
  lecture: 13
  module: 1
  tier: core

seti:
  term: "SETI"
  definition: "Search for Extraterrestrial Intelligence; the scientific effort to detect signals from alien civilizations."
  context: "Primarily searches for artificial radio or optical signals."
  lecture: 13
  module: 1
  tier: supporting

great_filter:
  term: "Great Filter"
  definition: "A hypothetical barrier in the evolution of life that makes advanced civilizations extremely rare."
  context: "Could be in our past (we passed it) or our future (we haven't reached it yet)."
  lecture: 13
  module: 1
  tier: supporting

abiogenesis:
  term: "Abiogenesis"
  definition: "The natural process by which life arises from non-living matter."
  context: "How common is this? We have one example (Earth) and don't know the probability."
  lecture: 13
  module: 1
  tier: supporting

# =============================================================
# Module 2: Stars & Stellar Evolution
# =============================================================

l14-alpha-particle:
  term: "Alpha particle"
  definition: "A helium-4 nucleus; consists of two protons and two neutrons bound together. The final product of the proton-proton chain."
  lecture: 14
  module: 2
  tier: core

l14-chromosphere:
  term: "Chromosphere"
  definition: "The thin layer of the Sun's atmosphere above the photosphere, with a temperature of about 10,000 Kelvin. Visible as a red rim during total solar eclipses."
  lecture: 14
  module: 2
  tier: core

l14-convection:
  term: "Convection"
  definition: "The transport of energy through the bulk motion of gas or liquid. Hot material rises; cool material sinks. Dominates energy transport in the Sun's outer layers."
  lecture: 14
  module: 2
  tier: core

l14-coronal-mass-ejection:
  term: "Coronal Mass Ejection (CME)"
  definition: "A sudden eruption of plasma from the Sun's corona into interplanetary space, often associated with solar flares. Can reach speeds exceeding 1,000 km/s."
  lecture: 14
  module: 2
  tier: core

l14-corona:
  term: "Corona"
  definition: "The Sun's outer atmosphere, extending millions of kilometers into space. Temperature is 1–3 million Kelvin, much hotter than the photosphere."
  lecture: 14
  module: 2
  tier: core

l14-coulomb-barrier:
  term: "Coulomb barrier"
  definition: "The electrostatic repulsion between two positively charged nuclei. Must be overcome (through heat, pressure, or quantum tunneling) for nuclear fusion to occur."
  lecture: 14
  module: 2
  tier: core

l14-dynamo:
  term: "Dynamo"
  definition: "A mechanism by which moving conductive fluid (plasma) generates a magnetic field. The solar dynamo in the convective zone generates the Sun's magnetic field."
  lecture: 14
  module: 2
  tier: core

l14-fusion:
  term: "Fusion"
  definition: "A nuclear reaction in which two light nuclei combine to form a heavier nucleus, releasing energy. Occurs in the Sun's core via the proton-proton chain."
  lecture: 14
  module: 2
  tier: core

l14-granulation:
  term: "Granulation"
  definition: "The patchwork of bright and dark features visible on the solar photosphere, representing the tops of convection cells in the convective zone."
  lecture: 14
  module: 2
  tier: core

l14-helioseismology:
  term: "Helioseismology"
  definition: "The study of vibrations and sound waves in the Sun, used to probe the Sun's interior structure and properties."
  lecture: 14
  module: 2
  tier: core

l14-hydrostatic-equilibrium:
  term: "Hydrostatic equilibrium"
  definition: "A balance between outward pressure and inward gravitational force, maintaining a stable structure. The Sun is in hydrostatic equilibrium."
  lecture: 14
  module: 2
  tier: core

l14-neutrino:
  term: "Neutrino"
  definition: "An electrically neutral particle with extremely small mass, produced in nuclear reactions such as fusion in the Sun's core. Because it interacts only through the weak nuclear force, it can pass through matter almost unhindered and escape directly from the Sun."
  lecture: 14
  module: 2
  tier: core

l14-photosphere:
  term: "Photosphere"
  definition: "The visible surface of the Sun, about 500 km thick, where photons escape and reach Earth. Temperature about 5,800 Kelvin."
  lecture: 14
  module: 2
  tier: core

l14-plasma:
  term: "Plasma"
  definition: "A state of matter consisting of ionized gas — electrons and nuclei separated and moving freely. Most of the Sun's interior is plasma."
  lecture: 14
  module: 2
  tier: core

l14-proton-proton-chain:
  term: "Proton-proton chain (PP chain)"
  definition: "A sequence of nuclear fusion reactions that converts four hydrogen nuclei (protons) into one helium-4 nucleus, releasing energy and neutrinos. The dominant fusion process in the Sun."
  lecture: 14
  module: 2
  tier: core

l14-radiative-transport:
  term: "Radiative transport"
  definition: "Energy transport via the absorption and re-emission of photons. Dominates the Sun's core and radiative zone."
  lecture: 14
  module: 2
  tier: core

l14-solar-cycle:
  term: "Solar cycle"
  definition: "A roughly 11-year periodic variation in the number and intensity of sunspots and other solar magnetic activity."
  lecture: 14
  module: 2
  tier: core

l14-solar-flare:
  term: "Solar flare"
  definition: "A sudden, bright eruption on the solar surface, releasing as much energy as a million nuclear bombs. Powered by magnetic reconnection."
  lecture: 14
  module: 2
  tier: core

l14-solar-neutrino-problem:
  term: "Solar neutrino problem"
  definition: "The discrepancy between the predicted and observed rates of solar neutrinos arriving at Earth, resolved by the discovery of neutrino oscillations."
  lecture: 14
  module: 2
  tier: core

l14-solar-wind:
  term: "Solar wind"
  definition: "A continuous stream of charged particles flowing from the Sun's corona at about 400 km/s, carrying the Sun's magnetic field."
  lecture: 14
  module: 2
  tier: core

l14-sunspot:
  term: "Sunspot"
  definition: "A dark, magnetically intense region on the solar photosphere, typically 1,000–100,000 km across, cooler than surrounding areas."
  lecture: 14
  module: 2
  tier: core

l15-apparent-brightness:
  term: "Apparent brightness"
  definition: "Flux of light energy arriving at Earth from a star"
  context: "Symbol: $b$; Units/context: W/m²"
  lecture: 15
  module: 2
  tier: core

l15-apparent-magnitude:
  term: "Apparent magnitude"
  definition: "Historical brightness scale (brighter = smaller number)"
  context: "Symbol: $m$; Units/context: dimensionless"
  lecture: 15
  module: 2
  tier: core

l15-absolute-magnitude:
  term: "Absolute magnitude"
  definition: "Apparent magnitude at standard distance of 10 pc"
  context: "Symbol: $M$; Units/context: dimensionless"
  lecture: 15
  module: 2
  tier: core

l15-distance-modulus:
  term: "Distance modulus"
  definition: "Relationship between apparent magnitude, absolute magnitude, and distance"
  context: "Symbol: $m - M$; Units/context: dimensionless"
  lecture: 15
  module: 2
  tier: core

l15-luminosity:
  term: "Luminosity"
  definition: "Total power radiated by a star in all directions"
  context: "Symbol: $L$; Units/context: W (watts)"
  lecture: 15
  module: 2
  tier: core

l15-parallax-angle:
  term: "Parallax angle"
  definition: "Half the total angular shift in a star's position over 6 months"
  context: "Symbol: $p$; Units/context: arcseconds (″)"
  lecture: 15
  module: 2
  tier: core

l15-parsec:
  term: "Parsec"
  definition: "Distance unit: distance at which parallax angle = 1 arcsecond"
  context: "Symbol: pc; Units/context: 3.086 × 10¹⁶ m"
  lecture: 15
  module: 2
  tier: core

l15-light-year:
  term: "Light-year"
  definition: "Distance light travels in one year"
  context: "Symbol: ly; Units/context: 9.46 × 10¹⁵ m"
  lecture: 15
  module: 2
  tier: core

l15-inverse-square-law:
  term: "Inverse-square law"
  definition: "Flux decreases with distance squared"
  context: "Symbol: $b = L / 4\\pi d^2$"
  lecture: 15
  module: 2
  tier: core

l15-solar-luminosity:
  term: "Solar luminosity"
  definition: "The Sun's luminosity; standard reference"
  context: "Symbol: L☉; Units/context: 3.8 × 10²⁶ W"
  lecture: 15
  module: 2
  tier: core

l15-spectral-type:
  term: "Spectral type"
  definition: "Classification of stars by temperature (OBAFGKM)"
  context: "Units/context: categorical"
  lecture: 15
  module: 2
  tier: core

l15-distance-ladder:
  term: "Distance ladder"
  definition: "Sequence of methods for measuring cosmic distances"
  context: "Units/context: conceptual"
  lecture: 15
  module: 2
  tier: core

l15-gaia:
  term: "Gaia"
  definition: "European space mission for precise parallax measurement"
  context: "Units/context: proper noun"
  lecture: 15
  module: 2
  tier: core

l16-absolute-magnitude:
  term: "Absolute Magnitude"
  definition: "The brightness a star would have if placed at a standard distance of 10 parsecs. A logarithmic scale (lower/more negative = brighter)."
  lecture: 16
  module: 2
  tier: core

l16-hertzsprung-russell-diagram:
  term: "Hertzsprung-Russell Diagram (H-R Diagram)"
  definition: "A scatter plot of stellar luminosity (y-axis) vs. temperature (x-axis). Reveals that stars are not randomly distributed but organized by physical processes."
  lecture: 16
  module: 2
  tier: core

l16-main-sequence:
  term: "Main Sequence"
  definition: "The diagonal band on an H-R diagram containing ~90% of all stars. Stars on the main sequence burn hydrogen in their cores; their position is determined by mass."
  lecture: 16
  module: 2
  tier: core

l16-red-giant:
  term: "Red Giant"
  definition: "A star in an advanced evolutionary phase with a huge radius (10–100 solar radii), cool surface (K or M spectral type), but enormous luminosity. Located in the upper-right region of the H-R diagram."
  lecture: 16
  module: 2
  tier: core

l16-red-supergiant:
  term: "Red Supergiant"
  definition: "An even larger and more luminous version of a red giant, with radius 100–1,000 solar radii. Examples: Betelgeuse, Antares."
  lecture: 16
  module: 2
  tier: core

l16-spectral-class-type:
  term: "Spectral Class/Type"
  definition: "A classification of stars based on the pattern of their spectral lines, which directly reflects surface temperature. Sequence: O, B, A, F, G, K, M (hot to cool)."
  lecture: 16
  module: 2
  tier: core

l16-stefan-boltzmann-law:
  term: "Stefan-Boltzmann Law"
  definition: "$L = 4\\pi R^2 \\sigma T^4$. Luminosity is proportional to surface area and the fourth power of temperature. Shows why large stars can be luminous despite being cool."
  lecture: 16
  module: 2
  tier: core

l16-white-dwarf:
  term: "White Dwarf"
  definition: "A dense stellar remnant, roughly Earth-sized, with a very hot surface (often >10,000 K) but low luminosity. Located in the lower-left region of the H-R diagram."
  lecture: 16
  module: 2
  tier: core

l16-wien-s-displacement-law:
  term: "Wien's Displacement Law"
  definition: "$\\lambda_{\\max} \\propto 1/T$. The peak wavelength of a star's thermal radiation is inversely proportional to its temperature. Hotter stars are bluer; cooler stars are redder."
  lecture: 16
  module: 2
  tier: core

l17-binary-star-system:
  term: "Binary star system"
  definition: "Two stars orbiting a shared center of mass under mutual gravity."
  lecture: 17
  module: 2
  tier: core

l17-visual-binary:
  term: "Visual binary"
  definition: "A binary system where both stars are bright and far apart enough to resolve as separate objects."
  lecture: 17
  module: 2
  tier: core

l17-eclipsing-binary:
  term: "Eclipsing binary"
  definition: "A binary system oriented edge-on, so one star periodically passes in front of the other, dimming the total light."
  lecture: 17
  module: 2
  tier: core

l17-spectroscopic-binary:
  term: "Spectroscopic binary"
  definition: "A binary system detected through Doppler shifts in stellar spectra as the stars orbit. Often too close to resolve visually."
  lecture: 17
  module: 2
  tier: core

l17-radial-velocity:
  term: "Radial velocity"
  definition: "The component of motion toward or away from the observer, measured via Doppler shift."
  lecture: 17
  module: 2
  tier: core

l17-center-of-mass:
  term: "Center of mass"
  definition: "The point that two orbiting objects both orbit. Located closer to the more massive object."
  lecture: 17
  module: 2
  tier: core

l17-semi-major-axis:
  term: "Semi-major axis"
  definition: "The long axis of an elliptical orbit, or equivalently, the average separation for a circular orbit."
  lecture: 17
  module: 2
  tier: core

l17-orbital-period:
  term: "Orbital period"
  definition: "The time it takes for two stars to complete one full orbit around their center of mass."
  lecture: 17
  module: 2
  tier: core

l17-mass-luminosity-relation:
  term: "Mass-luminosity relation"
  definition: "The empirical relationship for main-sequence stars: $L \\propto M^{3.5}$."
  lecture: 17
  module: 2
  tier: core

l17-main-sequence:
  term: "Main sequence"
  definition: "The band on the H-R diagram where stars spend ~90% of their lives fusing hydrogen to helium. The mass-luminosity relation applies here."
  lecture: 17
  module: 2
  tier: core

l17-kepler-s-third-law:
  term: "Kepler's third law (Newton's form)"
  definition: "$M_1 + M_2 = \\frac{a^3}{P^2}$ (in solar units). Relates orbital period and separation to the total mass of a binary."
  lecture: 17
  module: 2
  tier: core

l17-roche-lobe:
  term: "Roche lobe"
  definition: "The region of space around a star where its gravity dominates. If one star expands beyond its Roche lobe, mass can transfer to its companion."
  lecture: 17
  module: 2
  tier: core

l17-mass-transfer:
  term: "Mass transfer"
  definition: "The process by which material flows from one star to another in a binary system, often during the red giant phase."
  lecture: 17
  module: 2
  tier: core

l17-white-dwarf:
  term: "White dwarf"
  definition: "A stellar remnant (the core of a dead star) about the size of Earth but with roughly the mass of the Sun. Sirius B is a classic example. Algol B is not a white dwarf; it is an evolved star in a mass-transfer binary."
  lecture: 17
  module: 2
  tier: core

l18-accretion-disk:
  term: "Accretion disk"
  definition: "A rotating disk of gas and dust surrounding a protostar or young star, from which material falls inward onto the star."
  lecture: 18
  module: 2
  tier: core

l18-dark-nebula:
  term: "Dark nebula"
  definition: "A cloud of dust so dense and opaque that it blocks visible light from stars behind it. These are sites of active star formation."
  lecture: 18
  module: 2
  tier: core

l18-emission-nebula:
  term: "Emission nebula"
  definition: "A region of ionized hydrogen gas that glows in visible light due to radiation from nearby hot stars. Also called an H II region."
  lecture: 18
  module: 2
  tier: core

l18-giant-molecular-cloud:
  term: "Giant molecular cloud (GMC)"
  definition: "A massive, cold accumulation of molecular gas (typically ~10⁵ M☉, temperature ~10 K) in which star formation occurs."
  lecture: 18
  module: 2
  tier: core

l18-h-ii-region:
  term: "H II region"
  definition: "Ionized hydrogen gas surrounding hot O- or B-type stars, which emit ultraviolet radiation. The Roman numeral II denotes singly ionized hydrogen."
  lecture: 18
  module: 2
  tier: core

l18-interstellar-extinction:
  term: "Interstellar extinction"
  definition: "The dimming of starlight as it passes through dust clouds, caused by absorption and scattering of light by dust grains."
  lecture: 18
  module: 2
  tier: core

l18-interstellar-medium:
  term: "Interstellar medium (ISM)"
  definition: "The gas, dust, magnetic fields, and cosmic rays filling the space between stars. It makes up only a few percent of the Milky Way's mass, but it is the raw material for new stars."
  lecture: 18
  module: 2
  tier: core

l18-interstellar-reddening:
  term: "Interstellar reddening"
  definition: "The shift in the color of starlight toward the red due to preferential scattering of blue light by dust grains."
  lecture: 18
  module: 2
  tier: core

l18-jeans-criterion:
  term: "Jeans criterion"
  definition: "The rule that a cloud collapses when its mass exceeds the Jeans mass, so gravity beats thermal pressure."
  lecture: 18
  module: 2
  tier: core

l18-jeans-mass:
  term: "Jeans mass"
  definition: "The threshold mass needed for a region of gas to collapse. Colder, denser regions have lower Jeans masses."
  lecture: 18
  module: 2
  tier: core

l18-kelvin-helmholtz-contraction:
  term: "Kelvin-Helmholtz contraction"
  definition: "The gradual heating and contraction of a gas cloud under its own gravity. The process by which a protostar approaches the main sequence."
  lecture: 18
  module: 2
  tier: core

l18-molecular-cloud:
  term: "Molecular cloud"
  definition: "A region of cold (~10–100 K), dense gas in which molecules (predominantly H₂) are the dominant form of hydrogen."
  lecture: 18
  module: 2
  tier: core

l18-nebula:
  term: "Nebula"
  definition: "A cloud of gas and dust in space. The term originally referred to any fuzzy patch visible through a telescope."
  lecture: 18
  module: 2
  tier: core

l18-protoplanetary-disk:
  term: "Protoplanetary disk"
  definition: "A flat, rotating disk of gas and dust surrounding a young star, where planets form through collisions and mergers of dust grains and planetesimals."
  lecture: 18
  module: 2
  tier: core

l18-protostar:
  term: "Protostar"
  definition: "A forming star whose energy comes mainly from gravitational contraction, not sustained hydrogen fusion, while it remains embedded in infalling gas and dust."
  lecture: 18
  module: 2
  tier: core

l18-rayleigh-scattering:
  term: "Rayleigh scattering"
  definition: "The preferential scattering of short-wavelength (blue) light by particles much smaller than the wavelength. This explains why the sky is blue and why reflection nebulae are blue."
  lecture: 18
  module: 2
  tier: core

l18-reflection-nebula:
  term: "Reflection nebula"
  definition: "A cloud of dust and gas that shines by scattering nearby starlight. It often looks blue because dust scatters shorter wavelengths more efficiently."
  lecture: 18
  module: 2
  tier: core

l18-t-tauri-star:
  term: "T Tauri star"
  definition: "A young star in the pre-main-sequence phase, characterized by irregular variability, intense stellar winds, and accretion from a surrounding disk. Named after the prototype T Tauri in Taurus."
  lecture: 18
  module: 2
  tier: core

l19-hydrostatic-equilibrium:
  term: "Hydrostatic Equilibrium"
  definition: "The balance between the outward pressure force and the inward gravitational force that keeps a star from collapsing or exploding. A stable star is in hydrostatic equilibrium."
  lecture: 19
  module: 2
  tier: core

l19-thermostat:
  term: "Thermostat (Stellar)"
  definition: "The self-regulating feedback mechanism in a star: if the core contracts and heats up, pressure increases and pushes back; if it expands and cools, gravity wins again. This keeps main-sequence stars stable."
  lecture: 19
  module: 2
  tier: core

l19-main-sequence:
  term: "Main Sequence"
  definition: "The diagonal band on an H-R diagram where ~90% of stars lie and ~90% of stellar lifetimes are spent. All main-sequence stars are burning hydrogen in their cores."
  lecture: 19
  module: 2
  tier: core

l19-main-sequence-lifetime:
  term: "Main-Sequence Lifetime"
  definition: "The total time a star spends burning hydrogen in its core, given by $t_{\\text{MS}} \\propto M^{-2.5}$. Massive stars have short lifetimes; low-mass stars have long lifetimes."
  lecture: 19
  module: 2
  tier: core

l19-shell-burning:
  term: "Shell Burning"
  definition: "Nuclear fusion occurring in a thin shell surrounding an inert core, rather than in the core itself. Shell-burning luminosity can exceed core-burning luminosity."
  lecture: 19
  module: 2
  tier: core

l19-red-giant:
  term: "Red Giant"
  definition: "An evolved star whose outer layers have expanded after core hydrogen is exhausted. Red giants have cool surfaces, large radii, and high luminosities, and are powered mainly by shell burning around a compact core."
  lecture: 19
  module: 2
  tier: core

l19-red-giant-branch:
  term: "Red Giant Branch (RGB)"
  definition: "The region of the H-R diagram (upper right) where red giants lie. Stars move from the main sequence to the red giant branch when core hydrogen is exhausted."
  lecture: 19
  module: 2
  tier: core

l19-horizontal-branch:
  term: "Horizontal Branch"
  definition: "A phase of stable helium-core burning that follows the red-giant phase in many low-mass stars. In some stellar populations, similar helium-burning stars appear as the red clump."
  lecture: 19
  module: 2
  tier: core

l19-helium-flash:
  term: "Helium Flash"
  definition: "A thermonuclear runaway in the degenerate helium core of a low-mass red giant. The energy release is enormous, but it mainly restructures the core rather than producing a dramatic visible explosion of the star."
  lecture: 19
  module: 2
  tier: core

l19-asymptotic-giant-branch:
  term: "Asymptotic Giant Branch (AGB)"
  definition: "A late evolutionary phase of low- and intermediate-mass stars in which hydrogen and helium burn in shells around a compact core. The star becomes very luminous, unstable, and loses mass through a strong wind."
  lecture: 19
  module: 2
  tier: core

l19-evolutionary-track:
  term: "Evolutionary Track"
  definition: "The path a star traces on the H-R diagram as it evolves through different stages of its life (main sequence → red giant → white dwarf, etc.). Different masses follow different tracks."
  lecture: 19
  module: 2
  tier: core

l19-white-dwarf:
  term: "White Dwarf"
  definition: "The compact remnant left behind after a low- or intermediate-mass star loses its outer layers. A white dwarf is small, dense, and no longer powered by core fusion; it is supported mainly by electron degeneracy pressure."
  lecture: 19
  module: 2
  tier: core

l19-supergiant:
  term: "Supergiant"
  definition: "A massive, evolved star with enormous radius (>100 $R_\\odot$) and high luminosity. High-mass stars become supergiants before exploding as supernovae."
  lecture: 19
  module: 2
  tier: core

l19-turnoff-point:
  term: "Turnoff Point"
  definition: "On the H-R diagram of a star cluster, the point where the main sequence ends — the most massive stars still burning hydrogen in their cores. Because massive stars leave the main sequence first, the turnoff point can be used to estimate cluster age."
  lecture: 19
  module: 2
  tier: core

l19-isochrone:
  term: "Isochrone"
  definition: "A curve on the H-R diagram representing all stars of the same age but different masses. Isochrone fitting compares observed clusters to theoretical models to determine age."
  lecture: 19
  module: 2
  tier: core

l19-degenerate-matter:
  term: "Degenerate Matter"
  definition: "Matter so dense that it is supported by quantum effects (electron degeneracy pressure) rather than thermal pressure. Found in white dwarfs and low-mass red giant cores."
  lecture: 19
  module: 2
  tier: core

l19-stefan-boltzmann-law:
  term: "Stefan-Boltzmann Law"
  definition: "$L = 4\\pi R^2 \\sigma T^4$, relating luminosity to radius and surface temperature. Shows that cooler, larger stars can be as luminous as hotter, smaller stars."
  lecture: 19
  module: 2
  tier: core

l20-asymptotic-giant-branch:
  term: "Asymptotic Giant Branch (AGB)"
  definition: "Evolutionary stage of low-mass stars characterized by helium shell burning and intense mass loss via stellar winds."
  lecture: 20
  module: 2
  tier: core

l20-binding-energy:
  term: "Binding energy"
  definition: "Energy required to completely disassemble a nucleus into separate protons and neutrons."
  lecture: 20
  module: 2
  tier: core

l20-chandrasekhar-limit:
  term: "Chandrasekhar limit"
  definition: "Maximum mass (~1.4 M☉) that can be supported by electron degeneracy pressure in a white dwarf. Above this mass, electron degeneracy fails and core collapse occurs."
  lecture: 20
  module: 2
  tier: core

l20-core-collapse:
  term: "Core collapse"
  definition: "Catastrophic gravitational collapse of a massive star's iron core when degeneracy pressure fails at nuclear density. Occurs in ~0.3 seconds."
  lecture: 20
  module: 2
  tier: core

l20-degeneracy-pressure:
  term: "Degeneracy pressure"
  definition: "Quantum mechanical pressure arising from the Pauli exclusion principle. Electrons (or neutrons) resist compression by exerting outward pressure."
  lecture: 20
  module: 2
  tier: core

l20-ejecta:
  term: "Ejecta"
  definition: "Material ejected from an explosion, typically referring to supernova ejecta moving at >10,000 km/s."
  lecture: 20
  module: 2
  tier: core

l20-electron-capture:
  term: "Electron capture"
  definition: "Process in which an atomic nucleus captures an inner-shell electron, converting a proton to a neutron."
  lecture: 20
  module: 2
  tier: core

l20-iron-core:
  term: "Iron core"
  definition: "Inert core of a massive star (mass ~1.4 M☉) composed primarily of iron-56 and nickel-56. Iron fusion is endothermic and does not provide energy support."
  lecture: 20
  module: 2
  tier: core

l20-neutron-drip-line:
  term: "Neutron drip line"
  definition: "Density at which neutrons cannot be bound to nuclei and are forced to exist as free particles. Occurs at ~10^{14} g/cm³."
  lecture: 20
  module: 2
  tier: core

l20-nuclear-density:
  term: "Nuclear density"
  definition: "Density at which atomic nuclei are compressed to the point where protons and neutrons are in contact. ~10^{14}–10^{15} g/cm³."
  lecture: 20
  module: 2
  tier: core

l20-nucleosynthesis:
  term: "Nucleosynthesis"
  definition: "Process of creating atomic nuclei through nuclear reactions. Occurs in stellar cores (stellar nucleosynthesis) and in supernovae (explosive nucleosynthesis)."
  lecture: 20
  module: 2
  tier: core

l20-onion-shell-structure:
  term: "Onion-shell structure"
  definition: "Internal structure of a massive star near the end of its life, consisting of concentric shells of different fusing elements (H, He, C, O, Ne, Si, Fe)."
  lecture: 20
  module: 2
  tier: core

l20-pauli-exclusion-principle:
  term: "Pauli exclusion principle"
  definition: "Quantum mechanical principle stating that no two identical fermions (e.g., electrons) can occupy the same quantum state."
  lecture: 20
  module: 2
  tier: core

l20-planetary-nebula:
  term: "Planetary nebula"
  definition: "Glowing shell of gas ejected by a dying low-mass star, illuminated by ultraviolet radiation from the exposed white dwarf core."
  lecture: 20
  module: 2
  tier: core

l20-progenitor:
  term: "Progenitor"
  definition: "Original star that led to a given outcome (e.g., white dwarf, neutron star, supernova)."
  lecture: 20
  module: 2
  tier: core

l20-shock-wave:
  term: "Shock wave"
  definition: "Supersonic disturbance in which pressure, density, and temperature increase abruptly. In supernovae, the outward-propagating shock wave powered by core-bounce energy."
  lecture: 20
  module: 2
  tier: core

l20-standard-candle:
  term: "Standard candle"
  definition: "Astronomical object of known intrinsic brightness, used to measure distances via inverse-square law."
  lecture: 20
  module: 2
  tier: core

l20-thermonuclear-detonation:
  term: "Thermonuclear detonation"
  definition: "Uncontrolled nuclear burning propagating as a shock through stellar material. Occurs in Type Ia supernovae when the burning front reaches the speed of sound."
  lecture: 20
  module: 2
  tier: core

l20-type-ia-supernova:
  term: "Type Ia supernova"
  definition: "Thermonuclear explosion of a white dwarf in a binary system. Material accreted from a companion reaches the Chandrasekhar limit and detonates."
  lecture: 20
  module: 2
  tier: core

l20-type-ii-supernova:
  term: "Type II supernova"
  definition: "Core-collapse supernova: the catastrophic explosion of a massive star's iron core after gravitational collapse and shock wave revival."
  lecture: 20
  module: 2
  tier: core

l20-white-dwarf:
  term: "White dwarf"
  definition: "Stellar remnant of a low-mass star: the exposed, cooling core left behind after planetary nebula phase. Supported by electron degeneracy pressure."
  lecture: 20
  module: 2
  tier: core

l21-accretion-disk:
  term: "Accretion Disk"
  definition: "A rotating disk of material spiraling onto a compact object (neutron star or black hole), typically emitting high-energy radiation."
  lecture: 21
  module: 2
  tier: core

l21-black-hole:
  term: "Black Hole"
  definition: "A region of spacetime bounded by an event horizon, from which nothing, including light, can escape."
  lecture: 21
  module: 2
  tier: core

l21-chandrasekhar-limit:
  term: "Chandrasekhar Limit"
  definition: "The maximum mass (~1.4 M☉) of a white dwarf supported by electron degeneracy pressure."
  lecture: 21
  module: 2
  tier: core

l21-event-horizon:
  term: "Event Horizon"
  definition: "The boundary around a black hole defined by the Schwarzschild radius, from which escape is impossible."
  lecture: 21
  module: 2
  tier: core

l21-gravitational-wave:
  term: "Gravitational Wave"
  definition: "A ripple in the fabric of spacetime produced by accelerating masses, propagating at the speed of light."
  lecture: 21
  module: 2
  tier: core

l21-magnetar:
  term: "Magnetar"
  definition: "A neutron star with an exceptionally strong magnetic field (~10¹⁵ gauss), capable of producing giant flares."
  lecture: 21
  module: 2
  tier: core

l21-neutron-degeneracy-pressure:
  term: "Neutron Degeneracy Pressure"
  definition: "The quantum mechanical resistance of neutrons to compression, supporting a neutron star against gravity."
  lecture: 21
  module: 2
  tier: core

l21-neutron-star:
  term: "Neutron Star"
  definition: "A stellar remnant composed primarily of neutrons, ~10 km in radius, with a mass of 1.4–3 M☉."
  lecture: 21
  module: 2
  tier: core

l21-pulsar:
  term: "Pulsar"
  definition: "A rapidly rotating neutron star whose magnetic axis is tilted relative to its rotation axis, producing a periodic beam of radio emission."
  lecture: 21
  module: 2
  tier: core

l21-schwarzschild-radius:
  term: "Schwarzschild Radius"
  definition: "The radius $R_s = 2GM/c^2$ that defines the event horizon of a non-rotating black hole."
  lecture: 21
  module: 2
  tier: core

l21-singularity:
  term: "Singularity"
  definition: "The point (or region) at the center of a black hole where density becomes infinite and general relativity ceases to apply."
  lecture: 21
  module: 2
  tier: core

l21-spaghettification:
  term: "Spaghettification"
  definition: "The tidal effect near a black hole's event horizon, in which gravity is much stronger on one part of an object than another, stretching the object."
  lecture: 21
  module: 2
  tier: core

l21-tov-limit:
  term: "TOV Limit"
  definition: "The maximum mass (~2–3 M☉) of a neutron star supported by neutron degeneracy pressure; above this, collapse to a black hole occurs."
  lecture: 21
  module: 2
  tier: core

l21-x-ray-binary:
  term: "X-ray Binary"
  definition: "A binary system containing a compact object (neutron star or black hole) accreting material from a companion star, producing X-ray emission."
  lecture: 21
  module: 2
  tier: core
