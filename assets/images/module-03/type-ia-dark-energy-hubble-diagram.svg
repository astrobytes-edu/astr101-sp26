<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Type Ia supernova Hubble diagram schematic</title>
  <desc id="desc">Schematic plot of distance modulus versus redshift. A blue accelerating-universe curve lies above a gray matter-only decelerating curve at high redshift, with a highlighted supernova above the matter-only curve labeled dimmer and farther.</desc>
  <rect width="1200" height="760" fill="#101827"/>
  <rect x="120" y="80" width="900" height="560" rx="18" fill="#f8fafc"/>
  <line x1="210" y1="560" x2="900" y2="560" stroke="#1f2937" stroke-width="4"/>
  <line x1="210" y1="560" x2="210" y2="150" stroke="#1f2937" stroke-width="4"/>
  <g stroke="#cbd5e1" stroke-width="2">
    <line x1="348" y1="560" x2="348" y2="150"/>
    <line x1="486" y1="560" x2="486" y2="150"/>
    <line x1="624" y1="560" x2="624" y2="150"/>
    <line x1="762" y1="560" x2="762" y2="150"/>
    <line x1="900" y1="560" x2="900" y2="150"/>
    <line x1="210" y1="458" x2="900" y2="458"/>
    <line x1="210" y1="356" x2="900" y2="356"/>
    <line x1="210" y1="254" x2="900" y2="254"/>
    <line x1="210" y1="152" x2="900" y2="152"/>
  </g>
  <text x="555" y="700" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="34" text-anchor="middle">Redshift</text>
  <text x="58" y="360" fill="#e5e7eb" font-family="Inter, Arial, sans-serif" font-size="34" text-anchor="middle" transform="rotate(-90 58 360)">Distance modulus</text>
  <text x="210" y="606" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle">0</text>
  <text x="555" y="606" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle">0.5</text>
  <text x="900" y="606" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle">1.0</text>
  <path d="M210 520 C360 425 520 350 690 280 C780 243 840 220 900 203" fill="none" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
  <path d="M210 520 C355 414 515 326 690 235 C780 188 845 162 900 145" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
  <circle cx="762" cy="198" r="16" fill="#f97316" stroke="#7c2d12" stroke-width="5"/>
  <line x1="762" y1="243" x2="762" y2="198" stroke="#f97316" stroke-width="4" stroke-dasharray="9 7"/>
  <path d="M788 235 C850 248 895 286 930 335" fill="none" stroke="#f97316" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
  </defs>
  <rect x="640" y="402" width="320" height="96" rx="18" fill="#fff7ed" stroke="#fed7aa" stroke-width="3"/>
  <text x="800" y="438" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="24" text-anchor="middle" font-weight="700">Above the line</text>
  <text x="800" y="473" fill="#9a3412" font-family="Inter, Arial, sans-serif" font-size="22" text-anchor="middle">dimmer = farther</text>
  <rect x="645" y="116" width="380" height="114" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
  <line x1="675" y1="150" x2="745" y2="150" stroke="#2563eb" stroke-width="9" stroke-linecap="round"/>
  <text x="765" y="158" fill="#1e3a8a" font-family="Inter, Arial, sans-serif" font-size="22">accelerating universe</text>
  <line x1="675" y1="195" x2="745" y2="195" stroke="#64748b" stroke-width="9" stroke-linecap="round"/>
  <text x="765" y="203" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="22">matter-only deceleration</text>
  <text x="120" y="48" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800">Type Ia Supernovae and Cosmic Acceleration</text>
</svg>
