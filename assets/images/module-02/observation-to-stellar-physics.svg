<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">From Observation to Stellar Physics</title>
  <desc id="desc">Flowchart showing how position change and brightness measurements lead to distance, luminosity, and ultimately the Hertzsprung-Russell diagram.</desc>
  <rect width="1200" height="440" fill="#07111f"/>
  <text x="600" y="46" fill="#f2f6fb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">From Observation to Stellar Physics</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="80" y="110" width="220" height="70" rx="16" fill="#15314d" stroke="#5fa8dd"/>
    <text x="190" y="138" fill="#f2f6fb" font-size="22" text-anchor="middle" font-weight="700">Position change</text>
    <text x="190" y="165" fill="#d0e4f5" font-size="17" text-anchor="middle">observable on the sky</text>

    <rect x="80" y="255" width="220" height="70" rx="16" fill="#15314d" stroke="#5fa8dd"/>
    <text x="190" y="283" fill="#f2f6fb" font-size="22" text-anchor="middle" font-weight="700">Brightness / flux</text>
    <text x="190" y="310" fill="#d0e4f5" font-size="17" text-anchor="middle">light arriving at Earth</text>

    <rect x="380" y="110" width="220" height="70" rx="16" fill="#234b33" stroke="#86d19c"/>
    <text x="490" y="138" fill="#f2f6fb" font-size="22" text-anchor="middle" font-weight="700">Parallax</text>
    <text x="490" y="165" fill="#ddf4e3" font-size="17" text-anchor="middle">geometry model</text>

    <rect x="380" y="255" width="220" height="70" rx="16" fill="#234b33" stroke="#86d19c"/>
    <text x="490" y="283" fill="#f2f6fb" font-size="22" text-anchor="middle" font-weight="700">Inverse-square law</text>
    <text x="490" y="310" fill="#ddf4e3" font-size="17" text-anchor="middle">physics model</text>

    <rect x="680" y="110" width="180" height="70" rx="16" fill="#51391d" stroke="#f2c078"/>
    <text x="770" y="138" fill="#f2f6fb" font-size="22" text-anchor="middle" font-weight="700">Distance</text>
    <text x="770" y="165" fill="#fde9c8" font-size="17" text-anchor="middle">inferred</text>

    <rect x="680" y="255" width="180" height="70" rx="16" fill="#51391d" stroke="#f2c078"/>
    <text x="770" y="283" fill="#f2f6fb" font-size="22" text-anchor="middle" font-weight="700">Luminosity</text>
    <text x="770" y="310" fill="#fde9c8" font-size="17" text-anchor="middle">inferred</text>

    <rect x="940" y="180" width="190" height="90" rx="16" fill="#53263d" stroke="#e19ab8"/>
    <text x="1035" y="210" fill="#f2f6fb" font-size="22" text-anchor="middle" font-weight="700">H-R diagram</text>
    <text x="1035" y="238" fill="#f8dbe8" font-size="17" text-anchor="middle">combine luminosity</text>
    <text x="1035" y="260" fill="#f8dbe8" font-size="17" text-anchor="middle">with temperature</text>

    <line x1="300" y1="145" x2="380" y2="145" stroke="#9fd1f2" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="300" y1="290" x2="380" y2="290" stroke="#9fd1f2" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="600" y1="145" x2="680" y2="145" stroke="#b8e5c4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="600" y1="290" x2="680" y2="290" stroke="#b8e5c4" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="860" y1="145" x2="940" y2="205" stroke="#f2d39a" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="860" y1="290" x2="940" y2="245" stroke="#f2d39a" stroke-width="4" marker-end="url(#arrow)"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#e6eef8"/>
    </marker>
  </defs>
</svg>
