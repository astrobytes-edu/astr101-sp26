<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Stellar evolution overview</title>
  <desc id="desc">A teaching diagram showing a main-sequence star evolving into a red giant, then branching toward a white dwarf outcome for lower-mass stars and a supernova-remnant outcome for higher-mass stars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef3fb"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b87"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#9aa9c0" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="480" y="52" text-anchor="middle" font-size="30" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#20324a">Stellar Evolution At A Glance</text>
  <text x="480" y="84" text-anchor="middle" font-size="16" font-family="Inter, Arial, sans-serif" fill="#4a5b73">When the core fuel changes, the star's structure changes - and mass controls the broad fate.</text>

  <line x1="250" y1="210" x2="420" y2="210" stroke="#5a6b87" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="610" y1="180" x2="760" y2="122" stroke="#5a6b87" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="610" y1="240" x2="760" y2="330" stroke="#5a6b87" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="78" y="138" width="180" height="170" rx="24" fill="#ffffff" stroke="#cfd8e6"/>
    <circle cx="168" cy="198" r="38" fill="#ffd45c" stroke="#f4a300" stroke-width="6"/>
    <circle cx="168" cy="198" r="18" fill="#fff4bf"/>
    <text x="168" y="262" text-anchor="middle" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#20324a">Main Sequence</text>
    <text x="168" y="287" text-anchor="middle" font-size="14" font-family="Inter, Arial, sans-serif" fill="#4a5b73">Stable core hydrogen fusion</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="110" width="190" height="210" rx="24" fill="#ffffff" stroke="#cfd8e6"/>
    <circle cx="515" cy="188" r="58" fill="#f59c78" stroke="#d86a4b" stroke-width="8"/>
    <circle cx="515" cy="188" r="15" fill="#ffe7d5"/>
    <circle cx="515" cy="188" r="29" fill="none" stroke="#fbe9d8" stroke-width="10" stroke-dasharray="8 8"/>
    <text x="515" y="274" text-anchor="middle" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#20324a">Red Giant</text>
    <text x="515" y="299" text-anchor="middle" font-size="14" font-family="Inter, Arial, sans-serif" fill="#4a5b73">Core contracts</text>
    <text x="515" y="319" text-anchor="middle" font-size="14" font-family="Inter, Arial, sans-serif" fill="#4a5b73">Shell burning expands envelope</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="44" width="140" height="156" rx="22" fill="#ffffff" stroke="#cfd8e6"/>
    <circle cx="830" cy="96" r="10" fill="#fff7dc"/>
    <g stroke="#5a8fd8" stroke-width="6" stroke-linecap="round">
      <line x1="830" y1="54" x2="830" y2="138"/>
      <line x1="788" y1="96" x2="872" y2="96"/>
      <line x1="800" y1="66" x2="860" y2="126"/>
      <line x1="860" y1="66" x2="800" y2="126"/>
    </g>
    <text x="830" y="164" text-anchor="middle" font-size="19" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#20324a">Higher-Mass</text>
    <text x="830" y="185" text-anchor="middle" font-size="13" font-family="Inter, Arial, sans-serif" fill="#4a5b73">Supernova path</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="760" y="260" width="140" height="156" rx="22" fill="#ffffff" stroke="#cfd8e6"/>
    <circle cx="830" cy="322" r="34" fill="#f6fbff" stroke="#bfcfdf" stroke-width="8"/>
    <circle cx="830" cy="322" r="10" fill="#e8f2fb"/>
    <text x="830" y="382" text-anchor="middle" font-size="19" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#20324a">Lower-Mass</text>
    <text x="830" y="403" text-anchor="middle" font-size="13" font-family="Inter, Arial, sans-serif" fill="#4a5b73">White dwarf path</text>
  </g>

  <rect x="92" y="442" width="776" height="64" rx="18" fill="#ffffff" stroke="#d8e0ec"/>
  <text x="480" y="470" text-anchor="middle" font-size="17" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#20324a">What to notice</text>
  <text x="480" y="493" text-anchor="middle" font-size="14" font-family="Inter, Arial, sans-serif" fill="#4a5b73">The red-giant stage is the structural turning point: once the core fuel changes, the star leaves the main sequence, and mass determines which broad fate follows.</text>
</svg>
