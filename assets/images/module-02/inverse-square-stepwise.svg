<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Inverse-Square Geometry</title>
  <desc id="desc">Two-panel diagram showing that at distance d light covers area 4 pi d squared, while at distance 2d it covers area 16 pi d squared and brightness falls to one quarter.</desc>
  <rect width="1200" height="420" fill="#07111f"/>
  <text x="600" y="48" fill="#f2f6fb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">Why Brightness Falls as 1 / d^2</text>
  <line x1="600" y1="90" x2="600" y2="370" stroke="#2f4d6f" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="300" y="100" fill="#f2f6fb" font-size="26" text-anchor="middle" font-weight="700">At distance d</text>
    <circle cx="300" cy="220" r="22" fill="#ffd47a"/>
    <circle cx="300" cy="220" r="90" fill="none" stroke="#7fd0ff" stroke-width="4"/>
    <line x1="300" y1="220" x2="390" y2="220" stroke="#bde6ff" stroke-width="3"/>
    <text x="345" y="210" fill="#d8eaff" font-size="18" text-anchor="middle">d</text>
    <text x="300" y="335" fill="#d8eaff" font-size="22" text-anchor="middle">Area = 4 pi d^2</text>
    <text x="300" y="365" fill="#8be29f" font-size="20" text-anchor="middle">Brightness = 1 unit</text>

    <text x="900" y="100" fill="#f2f6fb" font-size="26" text-anchor="middle" font-weight="700">At distance 2d</text>
    <circle cx="900" cy="220" r="22" fill="#ffd47a"/>
    <circle cx="900" cy="220" r="180" fill="none" stroke="#7fd0ff" stroke-width="4"/>
    <line x1="900" y1="220" x2="1080" y2="220" stroke="#bde6ff" stroke-width="3"/>
    <text x="990" y="210" fill="#d8eaff" font-size="18" text-anchor="middle">2d</text>
    <text x="900" y="335" fill="#d8eaff" font-size="22" text-anchor="middle">Area = 16 pi d^2</text>
    <text x="900" y="365" fill="#ffb9c8" font-size="20" text-anchor="middle">Brightness = 1/4 unit</text>
  </g>
</svg>
