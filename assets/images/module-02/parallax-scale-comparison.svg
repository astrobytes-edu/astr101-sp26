<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">How Small Is Stellar Parallax?</title>
  <desc id="desc">Bar chart comparing the angular size of the Full Moon, Jupiter, a typical stellar parallax, and Gaia precision in arcseconds.</desc>
  <rect width="1200" height="430" fill="#07111f"/>
  <text x="600" y="48" fill="#f2f6fb" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle">How Small Is Stellar Parallax?</text>
  <text x="600" y="82" fill="#c9d7e6" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">Familiar sky angles dwarf the tiny shifts that stellar astronomy must measure.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="145" fill="#f2f6fb" font-size="22">Full Moon</text>
    <rect x="280" y="120" width="760" height="36" rx="8" fill="#f7d37c"/>
    <text x="1060" y="145" fill="#f2f6fb" font-size="20">1800 arcsec</text>

    <text x="80" y="215" fill="#f2f6fb" font-size="22">Jupiter</text>
    <rect x="280" y="190" width="220" height="36" rx="8" fill="#7fd0ff"/>
    <text x="520" y="215" fill="#f2f6fb" font-size="20">50 arcsec</text>

    <text x="80" y="285" fill="#f2f6fb" font-size="22">Typical stellar parallax</text>
    <rect x="280" y="260" width="12" height="36" rx="5" fill="#8be29f"/>
    <text x="330" y="285" fill="#f2f6fb" font-size="20">0.01 arcsec</text>

    <text x="80" y="355" fill="#f2f6fb" font-size="22">Gaia precision (best targets)</text>
    <rect x="280" y="330" width="4" height="36" rx="4" fill="#ff9bc2"/>
    <text x="330" y="355" fill="#f2f6fb" font-size="20">0.00001 arcsec</text>
  </g>
  <text x="600" y="402" fill="#ffd47a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">That is why high-precision astrometry is revolutionary: the geometry is simple, but the angle is vanishingly small.</text>
</svg>
