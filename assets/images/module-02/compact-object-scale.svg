<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Compact object size comparison</title>
  <desc id="desc">Comparison figure showing Earth and a white dwarf at the same displayed scale, plus a separate 600-times zoomed panel showing a neutron star and a 3-solar-mass black hole event horizon as true circles rather than stretched shapes.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcfcfe"/>
      <stop offset="100%" stop-color="#f3f5fa"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#b7bfcc" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7e8799" flood-opacity="0.18"/>
    </filter>
    <style>
      :root{
        --bg:#f7f8fc;
        --panel:#191b2f;
        --panel-edge:#2c3555;
        --text:#142538;
        --muted:#6a7690;
        --faint:#aab1c3;
        --earth-fill:#d9e9fb;
        --earth-stroke:#4e89c7;
        --wd-fill:#def4f2;
        --wd-stroke:#4f9ea0;
        --ns-fill:#f9ead0;
        --ns-stroke:#cc9043;
        --bh-ring:#9b5b7d;
        --bh-core:#151821;
        --accent:#b08d43;
      }
      text{
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        fill: var(--text);
      }
      .title{ font-size: 29px; font-weight: 700; }
      .subtitle{ font-size: 15px; fill: #8a94ac; }
      .card-title{ font-size: 18px; font-weight: 700; fill: #eef1ff; }
      .card-subtitle{ font-size: 13px; fill: #d2d8eb; }
      .label{ font-size: 17px; font-weight: 700; }
      .earth-label{ fill: #86bbff; }
      .wd-label{ fill: #69d5d5; }
      .ns-label{ fill: #f4bc66; }
      .bh-label{ fill: #d58ab1; }
      .small{ font-size: 13px; fill: #d2d8eb; }
      .tiny{ font-size: 12px; fill: #b3bbd1; }
      .footer-title{ font-size: 14px; font-weight: 700; fill: #eef1ff; }
      .footer-text{ font-size: 13px; fill: #d2d8eb; }
      .panel{
        fill: var(--panel);
        stroke: var(--panel-edge);
        stroke-width: 1.5;
        rx: 22;
      }
      .divider{
        stroke: #e4e8ef;
        stroke-width: 1.5;
      }
      .stat{
        font-size: 13px;
        fill: var(--muted);
      }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="url(#bgGrad)"/>

  <text x="60" y="56" class="title">Compact Objects: Size, Not Just Mass</text>
  <text x="60" y="80" class="subtitle">Earth and a white dwarf are similar in size. Neutron stars and stellar-mass black holes are hundreds of times smaller.</text>

  <rect x="50" y="108" width="360" height="314" class="panel" filter="url(#cardShadow)"/>
  <rect x="432" y="108" width="478" height="314" class="panel" filter="url(#cardShadow)"/>

  <text x="74" y="140" class="card-title">Same Scale</text>
  <text x="74" y="160" class="card-subtitle">Earth and a white dwarf are both about 6,000 km in radius.</text>

  <line x1="230" y1="176" x2="230" y2="398" class="divider"/>

  <text x="138" y="198" text-anchor="middle" class="label earth-label">Earth</text>
  <circle cx="138" cy="272" r="63" fill="var(--earth-fill)" stroke="var(--earth-stroke)" stroke-width="3" filter="url(#softShadow)"/>
  <text x="138" y="358" text-anchor="middle" class="stat">R ≈ 6,371 km</text>
  <text x="138" y="376" text-anchor="middle" class="stat">ρ ≈ 5.5 g/cm³</text>

  <text x="322" y="198" text-anchor="middle" class="label wd-label">White Dwarf</text>
  <circle cx="322" cy="272" r="63" fill="var(--wd-fill)" stroke="var(--wd-stroke)" stroke-width="3" filter="url(#softShadow)"/>
  <text x="322" y="358" text-anchor="middle" class="stat">R ≈ 6,000 km</text>
  <text x="322" y="376" text-anchor="middle" class="stat">M ≈ 0.6 M<tspan baseline-shift="-30%" font-size="75%">sun</tspan></text>

  <text x="455" y="140" class="card-title">600× Zoom</text>
  <text x="455" y="160" class="card-subtitle">The objects on the right are magnified so you can see them clearly.</text>

  <text x="455" y="186" class="tiny">On the left panel's scale, these would be almost invisible.</text>
  <circle cx="775" cy="182" r="2.4" fill="var(--ns-stroke)"/>
  <circle cx="807" cy="182" r="2.0" fill="var(--bh-ring)"/>

  <line x1="673" y1="176" x2="673" y2="398" class="divider"/>

  <text x="551" y="208" text-anchor="middle" class="label ns-label">Neutron Star</text>
  <circle cx="551" cy="274" r="40" fill="var(--ns-fill)" stroke="var(--ns-stroke)" stroke-width="4" filter="url(#softShadow)"/>
  <circle cx="551" cy="274" r="11" fill="#fff6ea" opacity="0.85"/>
  <text x="551" y="356" text-anchor="middle" class="stat">R ≈ 10–12 km</text>
  <text x="551" y="374" text-anchor="middle" class="stat">M ≈ 1.4–2 M<tspan baseline-shift="-30%" font-size="75%">sun</tspan></text>

  <text x="795" y="208" text-anchor="middle" class="label bh-label">Black Hole</text>
  <text x="795" y="226" text-anchor="middle" class="small">3 M<tspan baseline-shift="-30%" font-size="75%">sun</tspan> case</text>
  <circle cx="795" cy="274" r="33" fill="none" stroke="var(--bh-ring)" stroke-width="7" filter="url(#softShadow)"/>
  <circle cx="795" cy="274" r="20" fill="var(--bh-core)"/>
  <text x="795" y="356" text-anchor="middle" class="stat">R<tspan baseline-shift="-30%" font-size="75%">s</tspan> ≈ 8.9 km</text>
  <text x="795" y="374" text-anchor="middle" class="stat">event horizon, not a surface</text>

  <rect x="50" y="444" width="860" height="68" class="panel"/>
  <text x="72" y="472" class="footer-title">Key idea</text>
  <text x="72" y="490" class="footer-text">The big visual jump is about radius, not just mass. A white dwarf stays Earth-sized,</text>
  <text x="72" y="507" class="footer-text">while a neutron star or stellar-mass black hole compresses similar mass into a city-scale region.</text>
</svg>
