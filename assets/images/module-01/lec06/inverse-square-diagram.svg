<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>The Inverse-Square Law</title>
  <desc>Diagram showing a central gold source with three concentric circles at distances r, 2r, and 3r with decreasing opacity. Radial arrows show energy spreading outward. Right panel table shows strength = 1 at r, strength = 1/4 at 2r, strength = 1/9 at 3r. Explains the inverse-square relationship between strength and distance.</desc>

  <defs>
    <style>
      :root{
        --bg:#ffffff; --surface:#eef1f5; --border:#d4d0cc; --border-light:#e8e5e1;
        --navy:#1a3a52; --text:#0d1f2d; --muted:#5c6470; --faint:#a99f99;
        --teal:#6b9fa1; --teal-light:#8fbfc0; --teal-dark:#4a7e80;
        --gold:#c9a66b; --gold-light:#dcc194; --gold-dark:#7f6d44;
        --mauve:#8b7a8b; --mauve-light:#b8a8b8; --mauve-dark:#6b5a6b;
        --grid:#e0ddd8; --sun:#d4a843;
      }

      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle { font-size: 18px; font-weight: 600; fill: var(--navy); }
      .label { font-size: 15px; fill: var(--muted); }
      .small { font-size: 13px; fill: var(--muted); }
      .strength { font-size: 14px; font-weight: 600; }

      marker { overflow: visible; }
    </style>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--gold)" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="45" text-anchor="middle" class="title">The Inverse-Square Law</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Energy spreading over larger spheres</text>

  <!-- Central source -->
  <circle cx="280" cy="280" r="10" fill="var(--sun)"/>

  <!-- Three concentric circles at r, 2r, 3r with decreasing stroke width and opacity -->
  <!-- Circle at r (r=80) -->
  <circle cx="280" cy="280" r="80" fill="none" stroke="var(--teal)" stroke-width="2.5" opacity="1.0"/>

  <!-- Circle at 2r (r=160) -->
  <circle cx="280" cy="280" r="160" fill="none" stroke="var(--teal)" stroke-width="2" opacity="0.6"/>

  <!-- Circle at 3r (r=240) — clipped but visible -->
  <circle cx="280" cy="280" r="240" fill="none" stroke="var(--teal)" stroke-width="1.5" opacity="0.3"/>

  <!-- Radial arrows showing energy spreading (4 at 45° intervals) -->
  <!-- Arrow at 45° -->
  <line x1="343" y1="217" x2="413" y2="147" stroke="var(--gold)" stroke-width="2.5" opacity="1.0" marker-end="url(#arrowGold)"/>

  <!-- Arrow at 135° -->
  <line x1="217" y1="217" x2="147" y2="147" stroke="var(--gold)" stroke-width="2" opacity="0.7" marker-end="url(#arrowGold)"/>

  <!-- Arrow at 225° -->
  <line x1="217" y1="343" x2="147" y2="413" stroke="var(--gold)" stroke-width="2" opacity="0.7" marker-end="url(#arrowGold)"/>

  <!-- Arrow at 315° -->
  <line x1="343" y1="343" x2="413" y2="413" stroke="var(--gold)" stroke-width="2.5" opacity="1.0" marker-end="url(#arrowGold)"/>

  <!-- Distance markers and labels -->
  <!-- Label at r -->
  <text x="370" y="295" class="label" fill="var(--navy)" font-weight="600">r</text>

  <!-- Label at 2r -->
  <text x="450" y="295" class="label" fill="var(--navy)" font-weight="600">2r</text>

  <!-- Right-side info panel -->
  <rect x="560" y="140" width="370" height="300" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5" rx="4"/>

  <!-- Panel title -->
  <text x="745" y="170" text-anchor="middle" class="label" fill="var(--navy)" font-weight="600">Strength vs. Distance</text>

  <!-- Table entries -->
  <text x="590" y="215" class="strength" fill="var(--gold)">At r:</text>
  <text x="880" y="215" text-anchor="end" class="strength" fill="var(--gold)">strength = 1</text>
  <line x1="570" y1="222" x2="920" y2="222" stroke="var(--border-light)" stroke-width="1"/>

  <text x="590" y="265" class="strength" fill="var(--teal)">At 2r:</text>
  <text x="880" y="265" text-anchor="end" class="strength" fill="var(--teal)">strength = 1/4</text>
  <line x1="570" y1="272" x2="920" y2="272" stroke="var(--border-light)" stroke-width="1"/>

  <text x="590" y="315" class="strength" fill="var(--muted)">At 3r:</text>
  <text x="880" y="315" text-anchor="end" class="strength" fill="var(--muted)">strength = 1/9</text>

  <!-- Formula explanation -->
  <text x="745" y="365" text-anchor="middle" class="small" fill="var(--muted)">Area ∝ r²</text>
  <text x="745" y="383" text-anchor="middle" class="small" fill="var(--muted)">Strength ∝ 1/r²</text>

  <!-- Bottom callout -->
  <rect x="80" y="450" width="800" height="60" fill="none" stroke="var(--navy)" stroke-width="2" rx="4"/>
  <text x="480" y="475" text-anchor="middle" class="label" fill="var(--navy)" font-weight="600">Double distance → 4× area → 1/4 strength</text>
  <text x="480" y="497" text-anchor="middle" class="small" fill="var(--muted)">(inverse-square law)</text>

</svg>
