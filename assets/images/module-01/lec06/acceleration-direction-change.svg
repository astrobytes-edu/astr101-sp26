<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Acceleration Includes Direction Changes</title>
  <desc>A circular path showing six evenly-spaced object positions. At each position, a tangent velocity arrow (teal) points along the circle. At the rightmost position, a gold arrow points inward toward the center, labeled as acceleration. The diagram illustrates that even at constant speed, changing direction requires acceleration.</desc>

  <defs>
    <style>
      :root{
        --bg:#ffffff; --surface:#eef1f5; --border:#d4d0cc; --border-light:#e8e5e1;
        --navy:#1a3a52; --text:#0d1f2d; --muted:#5c6470; --faint:#a99f99;
        --teal:#6b9fa1; --teal-light:#8fbfc0; --teal-dark:#4a7e80;
        --gold:#c9a66b; --gold-light:#dcc194; --gold-dark:#7f6d44;
        --mauve:#8b7a8b; --mauve-light:#b8a8b8; --mauve-dark:#6b5a6b;
        --grid:#e0ddd8; --sun:#d4a843;
      }

      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle { font-size: 18px; font-weight: 600; fill: var(--navy); }
      .label { font-size: 15px; fill: var(--muted); }
      .small { font-size: 13px; fill: var(--muted); }

      marker { overflow: visible; }
    </style>

    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--teal)" />
    </marker>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--gold)" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="45" text-anchor="middle" class="title">Acceleration Includes Direction Changes</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Even at constant speed, changing direction means acceleration</text>

  <!-- Circular path -->
  <circle cx="480" cy="280" r="135" fill="none" stroke="var(--teal)" stroke-width="2.5"/>

  <!-- Center dot -->
  <circle cx="480" cy="280" r="4" fill="var(--navy)"/>
  <text x="480" y="310" text-anchor="middle" class="label">center</text>

  <!-- Six object positions around circle (evenly spaced at 60° intervals) -->
  <!-- Top position (0°) -->
  <circle cx="480" cy="145" r="5" fill="var(--navy)"/>
  <line x1="480" y1="145" x2="555" y2="145" stroke="var(--teal)" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Upper right (60°) -->
  <circle cx="592" cy="162" r="5" fill="var(--navy)"/>
  <line x1="592" y1="162" x2="640" y2="95" stroke="var(--teal)" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Lower right (120°) -->
  <circle cx="592" cy="398" r="5" fill="var(--navy)"/>
  <line x1="592" y1="398" x2="640" y2="465" stroke="var(--teal)" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Bottom position (180°) -->
  <circle cx="480" cy="415" r="5" fill="var(--navy)"/>
  <line x1="480" y1="415" x2="480" y2="470" stroke="var(--teal)" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Lower left (240°) -->
  <circle cx="368" cy="398" r="5" fill="var(--navy)"/>
  <line x1="368" y1="398" x2="320" y2="465" stroke="var(--teal)" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Upper left (300°) -->
  <circle cx="368" cy="162" r="5" fill="var(--navy)"/>
  <line x1="368" y1="162" x2="320" y2="95" stroke="var(--teal)" stroke-width="2.5" marker-end="url(#arrowTeal)"/>

  <!-- Rightmost position with acceleration arrow -->
  <!-- Overwrite one of the velocity arrows with a labeled one -->
  <circle cx="615" cy="280" r="5" fill="var(--navy)"/>
  <line x1="615" y1="280" x2="685" y2="280" stroke="var(--teal)" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="705" y="285" class="label">v</text>

  <!-- Gold inward acceleration arrow at rightmost position -->
  <line x1="615" y1="280" x2="545" y2="280" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="570" y="300" text-anchor="middle" class="label" fill="var(--gold)">a</text>

  <!-- Bottom annotations -->
  <text x="480" y="500" text-anchor="middle" class="small" fill="var(--muted)">v always tangent • a always inward (centripetal)</text>
  <text x="480" y="520" text-anchor="middle" class="small" fill="var(--muted)">direction changes → acceleration exists</text>

</svg>
