<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>The Apple and the Moon</title>
  <desc>Two-panel diagram comparing falling motion on Earth and in orbit. Left panel shows a person on the ground with an apple above, with a gravity arrow pointing downward. Right panel shows the Moon orbiting Earth with both a gravity arrow pointing toward Earth and a velocity arrow pointing tangent to the orbit. The diagram illustrates how sideways speed determines whether an object falls straight down or keeps missing everything.</desc>

  <defs>
    <style>
      :root{
        --bg:#ffffff; --surface:#eef1f5; --border:#d4d0cc; --border-light:#e8e5e1;
        --navy:#1a3a52; --text:#0d1f2d; --muted:#5c6470; --faint:#a99f99;
        --teal:#6b9fa1; --teal-light:#8fbfc0; --teal-dark:#4a7e80;
        --gold:#c9a66b; --gold-light:#dcc194; --gold-dark:#7f6d44;
        --mauve:#8b7a8b; --mauve-light:#b8a8b8; --mauve-dark:#6b5a6b;
        --grid:#e0ddd8; --sun:#d4a843;
      }

      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle { font-size: 18px; font-weight: 600; fill: var(--navy); }
      .label { font-size: 15px; fill: var(--muted); }
      .small { font-size: 13px; fill: var(--muted); }

      marker { overflow: visible; }
    </style>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--gold)" />
    </marker>

    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--teal)" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="45" text-anchor="middle" class="title">The Apple and the Moon</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Same gravity, different sideways speed</text>

  <!-- Vertical divider line -->
  <line x1="480" y1="100" x2="480" y2="500" stroke="var(--border-light)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT PANEL: On Earth -->
  <text x="240" y="100" text-anchor="middle" class="subtitle" fill="var(--navy)">On Earth</text>

  <!-- Ground line -->
  <line x1="80" y1="420" x2="380" y2="420" stroke="var(--navy)" stroke-width="3"/>
  <polygon points="80,420 85,425 75,425" fill="var(--navy)"/>
  <polygon points="380,420 375,425 385,425" fill="var(--navy)"/>

  <!-- Person: geometric shapes (circle head, rounded rect torso, rect legs) -->
  <circle cx="240" cy="360" r="12" fill="var(--navy)"/>
  <rect x="228" y="375" width="24" height="28" rx="6" fill="var(--navy)"/>
  <rect x="232" y="403" width="7" height="15" fill="var(--navy)"/>
  <rect x="244" y="403" width="7" height="15" fill="var(--navy)"/>

  <!-- Apple: gold circle with stem -->
  <circle cx="240" cy="315" r="7" fill="var(--gold)"/>
  <line x1="240" y1="308" x2="240" y2="295" stroke="var(--navy)" stroke-width="1.5"/>
  <path d="M 245 300 Q 248 298 246 295" fill="none" stroke="var(--navy)" stroke-width="1"/>

  <!-- Gravity arrow (downward) -->
  <line x1="240" y1="325" x2="240" y2="390" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="270" y="360" class="label" fill="var(--gold)">gravity</text>

  <!-- Text annotation -->
  <text x="240" y="460" text-anchor="middle" class="small" fill="var(--muted)">no sideways speed</text>
  <text x="240" y="480" text-anchor="middle" class="small" fill="var(--muted)">→ falls straight down</text>

  <!-- RIGHT PANEL: In Orbit -->
  <text x="720" y="100" text-anchor="middle" class="subtitle" fill="var(--navy)">In Orbit</text>

  <!-- Earth -->
  <circle cx="720" cy="285" r="60" fill="var(--navy)"/>
  <circle cx="720" cy="285" r="57" fill="none" stroke="var(--teal)" stroke-width="2.5"/>

  <!-- Orbital path (dashed) -->
  <circle cx="720" cy="285" r="110" fill="none" stroke="var(--mauve)" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Moon on orbit -->
  <circle cx="835" cy="285" r="6" fill="var(--navy)"/>

  <!-- Gravity arrow (from Moon toward Earth) -->
  <line x1="828" y1="285" x2="770" y2="285" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="800" y="270" text-anchor="middle" class="label" fill="var(--gold)">gravity</text>

  <!-- Velocity arrow (tangent, upward from Moon) -->
  <line x1="835" y1="285" x2="835" y2="215" stroke="var(--teal)" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="860" y="255" class="label" fill="var(--teal)">v</text>

  <!-- Text annotation -->
  <text x="720" y="460" text-anchor="middle" class="small" fill="var(--muted)">sideways speed</text>
  <text x="720" y="480" text-anchor="middle" class="small" fill="var(--muted)">→ keeps missing Earth</text>
  <text x="720" y="500" text-anchor="middle" class="small" fill="var(--muted)">everything falls together</text>

</svg>
