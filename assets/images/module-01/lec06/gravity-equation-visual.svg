<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Newton's Law of Gravitation</title>
  <desc>Diagram showing two masses m₁ and m₂ with equal-and-opposite gravitational force arrows. Center-to-center distance labeled r. Equation box shows F = G m₁m₂/r². Left callout shows inverse-square law. Right callout shows Newton's Third Law.</desc>

  <defs>
    <style>
      :root{
        --bg:#ffffff; --surface:#eef1f5; --border:#d4d0cc; --border-light:#e8e5e1;
        --navy:#1a3a52; --text:#0d1f2d; --muted:#5c6470; --faint:#a99f99;
        --teal:#6b9fa1; --teal-light:#8fbfc0; --teal-dark:#4a7e80;
        --gold:#c9a66b; --gold-light:#dcc194; --gold-dark:#7f6d44;
        --mauve:#8b7a8b; --mauve-light:#b8a8b8; --mauve-dark:#6b5a6b;
        --grid:#e0ddd8; --sun:#d4a843;
      }

      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle { font-size: 18px; font-weight: 600; fill: var(--navy); }
      .label { font-size: 15px; fill: var(--muted); }
      .small { font-size: 13px; fill: var(--muted); }
      .equation { font-size: 22px; fill: var(--navy); font-weight: 600; letter-spacing: 0.5px; }

      marker { overflow: visible; }
    </style>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--gold)" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="45" text-anchor="middle" class="title">Newton's Law of Gravitation</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Every mass attracts every other mass</text>

  <!-- m₁ sphere (left, larger) -->
  <circle cx="280" cy="240" r="38" fill="var(--teal)" opacity="0.85"/>
  <circle cx="280" cy="240" r="38" fill="none" stroke="var(--navy)" stroke-width="2"/>
  <text x="280" y="250" text-anchor="middle" class="label" fill="white" font-weight="600" font-size="18">m₁</text>

  <!-- m₂ sphere (right, smaller) -->
  <circle cx="680" cy="240" r="28" fill="var(--teal-dark)" opacity="0.85"/>
  <circle cx="680" cy="240" r="28" fill="none" stroke="var(--navy)" stroke-width="2"/>
  <text x="680" y="250" text-anchor="middle" class="label" fill="white" font-weight="600" font-size="18">m₂</text>

  <!-- Center-to-center dashed line -->
  <line x1="318" y1="240" x2="652" y2="240" stroke="var(--navy)" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="485" y="215" text-anchor="middle" class="label" fill="var(--navy)" font-size="16">r</text>

  <!-- Force arrow on m₁ (pointing right toward m₂) -->
  <line x1="318" y1="240" x2="410" y2="240" stroke="var(--gold)" stroke-width="3.5" marker-end="url(#arrowGold)"/>
  <text x="365" y="215" text-anchor="middle" class="label" fill="var(--gold)">F on m₁</text>

  <!-- Force arrow on m₂ (pointing left toward m₁) -->
  <line x1="652" y1="240" x2="560" y2="240" stroke="var(--gold)" stroke-width="3.5" marker-end="url(#arrowGold)"/>
  <text x="605" y="215" text-anchor="middle" class="label" fill="var(--gold)">F on m₂</text>

  <!-- Equation box -->
  <rect x="160" y="320" width="640" height="90" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5" rx="4"/>

  <!-- Equation text using Unicode subscripts and superscripts -->
  <text x="480" y="375" text-anchor="middle" class="equation">F = G m₁m₂ / r²</text>

  <!-- Callout 1: Inverse-square law -->
  <g>
    <rect x="80" y="440" width="280" height="70" fill="none" stroke="var(--mauve)" stroke-width="2" rx="4"/>
    <text x="220" y="465" text-anchor="middle" class="label" fill="var(--mauve)" font-weight="600">Double r → ¼ force</text>
    <text x="220" y="485" text-anchor="middle" class="small" fill="var(--muted)">(inverse-square law)</text>
  </g>

  <!-- Callout 2: Newton's Third Law -->
  <g>
    <rect x="600" y="440" width="280" height="70" fill="none" stroke="var(--navy)" stroke-width="2" rx="4"/>
    <text x="740" y="465" text-anchor="middle" class="label" fill="var(--navy)" font-weight="600">Equal forces →</text>
    <text x="740" y="485" text-anchor="middle" class="small" fill="var(--muted)">different accelerations</text>
  </g>

</svg>
