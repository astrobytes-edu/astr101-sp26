<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Newton’s cannon: orbiting is falling</title>
  <desc id="desc">Earth is shown as a circle with a mountain and cannon firing horizontally. Four trajectories illustrate increasing sideways speed: slow projectiles crash quickly, faster ones crash farther away, an orbital-speed projectile keeps missing Earth and circles, and an even faster projectile escapes. A gravity arrow indicates inward acceleration on all paths.</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --panel:#13162a;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --faint:#8f92ad;
        --grid:#1a1c28;
        --grid-strong:#24263a;

        --aurora-teal:#028391;
        --aurora-teal-bright:#41A2AC;
        --aurora-teal-dim:#02626D;
        --aurora-teal-pale:#A6D4D8;

        --aurora-pink:#BE5A83;
        --aurora-pink-bright:#CE83A2;
        --aurora-pink-dim:#8E4462;
        --aurora-pink-pale:#E8C5D4;

        --aurora-violet:#7077A1;
        --aurora-violet-bright:#9499B8;
        --aurora-violet-dim:#545979;
        --aurora-violet-pale:#CDCFDE;

        --teal:var(--aurora-teal);
        --teal-bright:var(--aurora-teal-bright);
        --teal-dim:var(--aurora-teal-dim);
        --teal-pale:var(--aurora-teal-pale);

        --pink:var(--aurora-pink);
        --pink-bright:var(--aurora-pink-bright);
        --pink-dim:var(--aurora-pink-dim);
        --pink-pale:var(--aurora-pink-pale);

        --violet:var(--aurora-violet);
        --violet-bright:var(--aurora-violet-bright);
        --violet-dim:var(--aurora-violet-dim);
        --violet-pale:var(--aurora-violet-pale);

        --earth:#1b2238;
      }

      text{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        fill: var(--fg);
      }
      .title{ font-size: 28px; font-weight: 750; }
      .subtitle{ font-size: 18px; fill: var(--muted); }
      .label{ font-size: 20px; font-weight: 700; }
      .small{ font-size: 18px; letter-spacing: 0.2px; fill: var(--muted); }
      .outline{ paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
      .panel{ fill: var(--panel); stroke: var(--violet); stroke-width: 1.5; opacity: 0.96; }
      .dash{ stroke-dasharray: 10 10; }
    </style>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="earthFill" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="var(--grid-strong)" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="var(--earth)" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="var(--panel)" stop-opacity="1.0"/>
    </radialGradient>

    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--teal)"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pink)"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Header -->
  <text x="48" y="56" class="title">Newton’s cannon</text>
  <text x="48" y="82" class="subtitle">Orbiting is falling — with enough sideways speed, you keep missing Earth.</text>

  <!-- Main panel -->
  <g>
    <rect x="48" y="110" width="864" height="340" rx="16" class="panel"/>

    <!-- Earth (kept fully inside the panel) -->
    <circle cx="480" cy="280" r="110" fill="url(#earthFill)" stroke="var(--teal)" stroke-width="4" opacity="0.98"/>
    <circle cx="480" cy="280" r="116" fill="none" stroke="var(--teal-pale)" stroke-width="2" opacity="0.35"/>

    <!-- Surface highlight arc -->
    <path d="M 378 240 A 110 110 0 0 1 582 240" fill="none" stroke="var(--grid-strong)" stroke-width="2.3" opacity="0.55"/>

    <!-- Mountain + cannon (on the top of Earth, firing sideways) -->
    <path d="M 470 170 L 510 170 L 494 148 L 456 170 Z" fill="var(--grid-strong)" opacity="0.95"/>
    <rect x="508" y="152" width="40" height="12" rx="4" fill="var(--violet)" opacity="0.95"/>
    <circle cx="552" cy="158" r="4" fill="var(--violet-bright)" opacity="0.95"/>
    <text x="482" y="146" class="small outline" text-anchor="middle">cannon</text>

    <!-- Launch point -->
    <circle cx="552" cy="158" r="4.5" fill="var(--pink)" filter="url(#softGlow)"/>

    <!-- Trajectories (stylized; increasing sideways speed) -->
    <!-- 1: slow — crashes quickly -->
    <path d="M 552 158 C 590 168 612 186 564 209"
          fill="none" stroke="var(--teal-dim)" stroke-width="3.1" stroke-linecap="round" opacity="0.95"/>
    <!-- 2: faster — crashes farther -->
    <path d="M 552 158 C 668 178 692 262 564 351"
          fill="none" stroke="var(--teal)" stroke-width="3.1" stroke-linecap="round" opacity="0.92"/>
    <!-- 3: orbital — keeps missing (closed path around Earth) -->
    <circle cx="480" cy="280" r="160" fill="none" stroke="var(--pink)" stroke-width="4.6" opacity="0.92" filter="url(#softGlow)"/>
    <!-- 4: escape — leaves -->
    <path d="M 552 158 C 716 138 860 132 912 120"
          fill="none" stroke="var(--violet)" stroke-width="3.4" stroke-linecap="round" opacity="0.9" marker-end="url(#arrow-violet)"/>

    <!-- Impact markers (on Earth’s surface) -->
    <circle cx="564" cy="209" r="5.5" fill="var(--teal-dim)" opacity="0.9"/>
    <circle cx="564" cy="351" r="5.5" fill="var(--teal)" opacity="0.9"/>

    <!-- Labels -->
    <text x="606" y="226" class="small outline" fill="var(--teal-dim)">too slow — hits Earth</text>
    <text x="606" y="366" class="small outline" fill="var(--teal)">faster — still hits</text>
    <text x="132" y="220" class="label outline" fill="var(--pink)">orbital speed</text>
    <text x="132" y="244" class="small outline">keeps missing Earth</text>
    <text x="770" y="146" class="small outline" fill="var(--violet)">escape</text>

    <!-- Speed direction cue (moved inside the panel) -->
    <line x1="132" y1="154" x2="300" y2="154" stroke="var(--muted)" stroke-width="2.2" marker-end="url(#arrow-teal)" opacity="0.8"/>
    <text x="132" y="142" class="small">increasing sideways speed</text>

    <!-- Gravity cue (inward acceleration on all paths) -->
    <line x1="820" y1="334" x2="716" y2="292" stroke="var(--pink)" stroke-width="3.0" marker-end="url(#arrow-pink)" opacity="0.9"/>
    <text x="888" y="332" class="small outline" fill="var(--pink)" text-anchor="end">gravity pulls inward</text>
  </g>

  <!-- Footer takeaway -->
  <g transform="translate(48,470)">
    <rect x="0" y="0" width="864" height="70" rx="12" class="panel"/>
    <text x="18" y="30" class="label">
      Key idea: an orbit is <tspan fill="var(--pink)" font-weight="800">continuous free fall</tspan>, not “no gravity.”
    </text>
    <text x="18" y="54" class="small">
      With enough sideways speed, the surface curves away at the same rate you fall.
    </text>
  </g>
</svg>
