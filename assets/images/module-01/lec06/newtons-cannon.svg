<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Newton's Cannon</title>
  <desc>Illustration of Newton's Cannon thought experiment showing Earth with a cannon on a mountain. Four trajectories demonstrate increasing muzzle velocity: projectiles that crash at increasing distances (navy), a circular orbit (teal), and an escape trajectory (mauve dashed). Left side shows a speed progression arrow. Gravity arrow points toward Earth's center.</desc>

  <defs>
    <style>
      :root{
        --bg:#ffffff; --surface:#eef1f5; --border:#d4d0cc; --border-light:#e8e5e1;
        --navy:#1a3a52; --text:#0d1f2d; --muted:#5c6470; --faint:#a99f99;
        --teal:#6b9fa1; --teal-light:#8fbfc0; --teal-dark:#4a7e80;
        --gold:#c9a66b; --gold-light:#dcc194; --gold-dark:#7f6d44;
        --mauve:#8b7a8b; --mauve-light:#b8a8b8; --mauve-dark:#6b5a6b;
        --grid:#e0ddd8; --sun:#d4a843;
      }

      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle { font-size: 18px; font-weight: 600; fill: var(--navy); }
      .label { font-size: 15px; fill: var(--muted); }
      .annotation { font-size: 13px; fill: var(--muted); }

      marker { overflow: visible; }
    </style>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--gold)" />
    </marker>

    <marker id="arrowGoldSmall" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,6 L6,3 z" fill="var(--gold)" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="45" text-anchor="middle" class="title">Newton's Cannon</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Orbiting is falling sideways fast enough to miss everything</text>

  <!-- Earth circle -->
  <circle cx="480" cy="360" r="130" fill="var(--navy)"/>
  <circle cx="480" cy="360" r="130" fill="none" stroke="var(--teal)" stroke-width="2.5"/>

  <!-- Mountain peak on top (triangle) -->
  <polygon points="480,230 455,255 505,255" fill="var(--navy)"/>

  <!-- Cannon: barrel + wheel assembly -->
  <!-- Cannon barrel (tapered, tilted) -->
  <g transform="translate(480, 250) rotate(-15)">
    <!-- Barrel (tapered rectangle) -->
    <polygon points="0,0 35,-4 40,0 35,4" fill="var(--navy)"/>
    <!-- Breech (wider back) -->
    <circle cx="-8" cy="0" r="5" fill="var(--navy)"/>
  </g>

  <!-- Cannon wheel -->
  <circle cx="480" cy="270" r="12" fill="var(--navy)"/>
  <circle cx="480" cy="270" r="12" fill="none" stroke="var(--teal)" stroke-width="1.5"/>
  <!-- Wheel hub and spokes -->
  <circle cx="480" cy="270" r="4" fill="var(--navy)"/>
  <line x1="480" y1="266" x2="480" y2="274" stroke="var(--navy)" stroke-width="1"/>
  <line x1="476" y1="270" x2="484" y2="270" stroke="var(--navy)" stroke-width="1"/>

  <!-- Gravity arrow pointing toward Earth center -->
  <line x1="480" y1="290" x2="480" y2="330" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="515" y="315" class="label" fill="var(--gold)">gravity</text>

  <!-- Trajectory 1: crashes nearby (thin navy, labeled "too slow") -->
  <path d="M 510 245 Q 540 270 535 340" fill="none" stroke="var(--navy)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="535" cy="340" r="2.5" fill="var(--navy)" opacity="0.7"/>
  <text x="565" y="280" class="annotation" fill="var(--muted)">too slow</text>

  <!-- Trajectory 2: crashes farther (medium navy, labeled "faster") -->
  <path d="M 510 245 Q 580 260 570 330" fill="none" stroke="var(--navy)" stroke-width="1.5" opacity="0.75"/>
  <circle cx="570" cy="330" r="2.5" fill="var(--navy)" opacity="0.8"/>
  <text x="610" y="270" class="annotation" fill="var(--muted)">faster</text>

  <!-- Trajectory 3: circular orbit (teal, labeled "orbital speed") -->
  <circle cx="480" cy="360" r="150" fill="none" stroke="var(--teal)" stroke-width="2.5"/>
  <text x="650" y="360" class="annotation" fill="var(--teal)" font-weight="600">orbital</text>
  <text x="650" y="378" class="annotation" fill="var(--teal)" font-weight="600">speed</text>

  <!-- Trajectory 4: escape trajectory (mauve dashed, labeled "escape speed") -->
  <path d="M 510 245 Q 650 180 760 120" fill="none" stroke="var(--mauve)" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="680" y="155" class="annotation" fill="var(--mauve)">escape</text>
  <text x="680" y="173" class="annotation" fill="var(--mauve)">speed</text>

  <!-- Left side speed progression arrow and label -->
  <g>
    <!-- Vertical arrow showing increasing speed -->
    <line x1="120" y1="480" x2="120" y2="250" stroke="var(--gold)" stroke-width="2.5" marker-end="url(#arrowGold)"/>
    <text x="105" y="370" text-anchor="end" class="annotation" fill="var(--gold)" font-weight="600">increasing</text>
    <text x="105" y="388" text-anchor="end" class="annotation" fill="var(--gold)" font-weight="600">speed</text>
  </g>

</svg>
