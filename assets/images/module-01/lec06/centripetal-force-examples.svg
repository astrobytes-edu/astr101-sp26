<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Centripetal Force Examples</title>
  <desc>Three panels showing different sources of centripetal force. Panel 1: Orbit with gravity providing the inward force. Panel 2: Ball on string with tension providing the inward force. Panel 3: Car turning with friction providing the inward force. All three demonstrate the same inward centripetal acceleration a = v²/r.</desc>

  <defs>
    <style>
      :root{
        --bg:#ffffff; --surface:#eef1f5; --border:#d4d0cc; --border-light:#e8e5e1;
        --navy:#1a3a52; --text:#0d1f2d; --muted:#5c6470; --faint:#a99f99;
        --teal:#6b9fa1; --teal-light:#8fbfc0; --teal-dark:#4a7e80;
        --gold:#c9a66b; --gold-light:#dcc194; --gold-dark:#7f6d44;
        --mauve:#8b7a8b; --mauve-light:#b8a8b8; --mauve-dark:#6b5a6b;
        --grid:#e0ddd8; --sun:#d4a843;
      }

      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle { font-size: 18px; font-weight: 600; fill: var(--navy); }
      .label { font-size: 15px; fill: var(--muted); }
      .panelTitle { font-size: 16px; font-weight: 600; fill: var(--navy); }
      .small { font-size: 13px; fill: var(--muted); }

      marker { overflow: visible; }
    </style>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--gold)" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="45" text-anchor="middle" class="title">Centripetal Force Examples</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Different forces, same inward role</text>

  <!-- PANEL 1: Orbit -->
  <g>
    <!-- Panel background -->
    <rect x="36" y="110" width="270" height="300" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="2"/>

    <!-- Title -->
    <text x="171" y="135" text-anchor="middle" class="panelTitle">Orbit</text>

    <!-- Circular orbit -->
    <circle cx="171" cy="240" r="70" fill="none" stroke="var(--teal)" stroke-width="2.5"/>

    <!-- Sun at center -->
    <circle cx="171" cy="240" r="10" fill="var(--sun)"/>

    <!-- Planet on orbit (right side) -->
    <circle cx="241" cy="240" r="6" fill="var(--navy)"/>

    <!-- Inward arrow from planet to Sun -->
    <line x1="235" y1="240" x2="181" y2="240" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
    <text x="210" y="225" text-anchor="middle" class="label" fill="var(--gold)">gravity</text>
  </g>

  <!-- PANEL 2: Ball on String -->
  <g>
    <!-- Panel background -->
    <rect x="345" y="110" width="270" height="300" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="2"/>

    <!-- Title -->
    <text x="480" y="135" text-anchor="middle" class="panelTitle">Ball on String</text>

    <!-- Circular path (dashed) -->
    <circle cx="480" cy="240" r="80" fill="none" stroke="var(--teal)" stroke-width="2.5" stroke-dasharray="5,5"/>

    <!-- Center point -->
    <circle cx="480" cy="240" r="4" fill="var(--navy)"/>

    <!-- Ball on path -->
    <circle cx="560" cy="240" r="6" fill="var(--navy)"/>

    <!-- String line from ball to center -->
    <line x1="554" y1="240" x2="484" y2="240" stroke="var(--navy)" stroke-width="2"/>

    <!-- Inward arrow -->
    <line x1="554" y1="240" x2="490" y2="240" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
    <text x="520" y="225" text-anchor="middle" class="label" fill="var(--gold)">tension</text>
  </g>

  <!-- PANEL 3: Car Turning -->
  <g>
    <!-- Panel background -->
    <rect x="654" y="110" width="270" height="300" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="2"/>

    <!-- Title -->
    <text x="789" y="135" text-anchor="middle" class="panelTitle">Car Turning</text>

    <!-- Curved road arc (teal) -->
    <path d="M 685 310 Q 735 160 845 240" fill="none" stroke="var(--teal)" stroke-width="8" opacity="0.5"/>

    <!-- Car body (tapered rectangle, rounded) -->
    <rect x="750" y="228" width="58" height="24" rx="8" fill="var(--navy)"/>

    <!-- Car windshield -->
    <rect x="763" y="232" width="28" height="8" rx="2" fill="var(--teal)" opacity="0.5"/>

    <!-- Front wheel -->
    <circle cx="765" cy="254" r="5" fill="var(--navy)"/>
    <circle cx="765" cy="254" r="3" fill="var(--teal)" opacity="0.4"/>

    <!-- Rear wheel -->
    <circle cx="797" cy="254" r="5" fill="var(--navy)"/>
    <circle cx="797" cy="254" r="3" fill="var(--teal)" opacity="0.4"/>

    <!-- Inward friction arrow pointing toward curve center -->
    <line x1="789" y1="240" x2="745" y2="210" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
    <text x="755" y="215" text-anchor="middle" class="label" fill="var(--gold)">friction</text>
  </g>

  <!-- Bottom callout -->
  <rect x="80" y="440" width="800" height="70" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5" rx="4"/>
  <text x="480" y="465" text-anchor="middle" class="label" fill="var(--navy)" font-weight="600">All three: different forces, same inward role → centripetal acceleration</text>
  <text x="480" y="490" text-anchor="middle" class="small" fill="var(--muted)">a = v²/r</text>

</svg>
