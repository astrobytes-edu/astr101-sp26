<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Weightlessness Is Free Fall</title>
  <desc>Two-panel diagram comparing standing on Earth and orbiting in free fall. Left panel shows a person standing on ground with gravity arrow pointing down and normal force arrow pointing up. Right panel shows a floating astronaut in a space station with only a gravity arrow and no normal force. The diagram illustrates that weightlessness is the sensation of free fall, not the absence of gravity.</desc>

  <defs>
    <style>
      :root{
        --bg:#ffffff; --surface:#eef1f5; --border:#d4d0cc; --border-light:#e8e5e1;
        --navy:#1a3a52; --text:#0d1f2d; --muted:#5c6470; --faint:#a99f99;
        --teal:#6b9fa1; --teal-light:#8fbfc0; --teal-dark:#4a7e80;
        --gold:#c9a66b; --gold-light:#dcc194; --gold-dark:#7f6d44;
        --mauve:#8b7a8b; --mauve-light:#b8a8b8; --mauve-dark:#6b5a6b;
        --grid:#e0ddd8; --sun:#d4a843;
      }

      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle { font-size: 18px; font-weight: 600; fill: var(--navy); }
      .label { font-size: 15px; fill: var(--muted); }
      .panelTitle { font-size: 16px; font-weight: 600; fill: var(--navy); }
      .small { font-size: 13px; fill: var(--muted); }

      marker { overflow: visible; }
    </style>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--gold)" />
    </marker>

    <marker id="arrowTeal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L8,4 z" fill="var(--teal)" />
    </marker>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="45" text-anchor="middle" class="title">Weightlessness Is Free Fall</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Gravity is still there — the floor just isn't pushing back</text>

  <!-- Vertical divider -->
  <line x1="480" y1="100" x2="480" y2="500" stroke="var(--border-light)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- LEFT PANEL: Standing on Earth -->
  <text x="240" y="100" text-anchor="middle" class="panelTitle">Standing on Earth</text>

  <!-- Ground line -->
  <line x1="80" y1="400" x2="380" y2="400" stroke="var(--navy)" stroke-width="3"/>
  <polygon points="80,400 85,405 75,405" fill="var(--navy)"/>
  <polygon points="380,400 375,405 385,405" fill="var(--navy)"/>

  <!-- Person standing: geometric shapes (circle head, rounded rect torso, rect legs) -->
  <circle cx="240" cy="335" r="12" fill="var(--navy)"/>
  <rect x="228" y="350" width="24" height="30" rx="6" fill="var(--navy)"/>
  <rect x="232" y="380" width="7" height="18" fill="var(--navy)"/>
  <rect x="244" y="380" width="7" height="18" fill="var(--navy)"/>

  <!-- Gravity arrow pointing down from head -->
  <line x1="240" y1="300" x2="240" y2="345" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="270" y="325" class="label" fill="var(--gold)">gravity</text>

  <!-- Normal force arrow pointing UP from ground -->
  <line x1="240" y1="398" x2="240" y2="350" stroke="var(--teal)" stroke-width="3" marker-end="url(#arrowTeal)"/>
  <text x="275" y="375" class="label" fill="var(--teal)">normal force</text>

  <!-- Text annotation -->
  <text x="240" y="460" text-anchor="middle" class="small" fill="var(--muted)">you feel weight</text>
  <text x="240" y="478" text-anchor="middle" class="small" fill="var(--muted)">the floor pushes back</text>

  <!-- RIGHT PANEL: Orbit (Free Fall) -->
  <text x="720" y="100" text-anchor="middle" class="panelTitle">Orbit (Free Fall)</text>

  <!-- Space station frame (rectangular) -->
  <rect x="670" y="260" width="100" height="110" fill="none" stroke="var(--navy)" stroke-width="2" rx="4"/>

  <!-- Interior grid to suggest space station -->
  <line x1="685" y1="260" x2="685" y2="370" stroke="var(--border-light)" stroke-width="1" opacity="0.5"/>
  <line x1="700" y1="260" x2="700" y2="370" stroke="var(--border-light)" stroke-width="1" opacity="0.5"/>
  <line x1="740" y1="260" x2="740" y2="370" stroke="var(--border-light)" stroke-width="1" opacity="0.5"/>
  <line x1="755" y1="260" x2="755" y2="370" stroke="var(--border-light)" stroke-width="1" opacity="0.5"/>

  <!-- Floating person (rotated 20°): geometric shapes -->
  <g transform="translate(720, 315) rotate(20)">
    <!-- Head -->
    <circle cx="0" cy="-18" r="10" fill="var(--navy)"/>
    <!-- Torso -->
    <rect x="-10" y="-6" width="20" height="28" rx="6" fill="var(--navy)"/>
    <!-- Legs -->
    <rect x="-6" y="22" width="6" height="18" fill="var(--navy)"/>
    <rect x="0" y="22" width="6" height="18" fill="var(--navy)"/>
  </g>

  <!-- Gravity arrow pointing down from astronaut -->
  <line x1="720" y1="355" x2="720" y2="405" stroke="var(--gold)" stroke-width="3" marker-end="url(#arrowGold)"/>
  <text x="755" y="375" class="label" fill="var(--gold)">gravity</text>
  <text x="760" y="395" class="small" fill="var(--gold)">still acts!</text>

  <!-- Text annotation -->
  <text x="720" y="460" text-anchor="middle" class="small" fill="var(--muted)">no floor push</text>
  <text x="720" y="478" text-anchor="middle" class="small" fill="var(--muted)">→ weightless sensation</text>
  <text x="720" y="496" text-anchor="middle" class="small" fill="var(--muted)">everything falls together</text>

</svg>
