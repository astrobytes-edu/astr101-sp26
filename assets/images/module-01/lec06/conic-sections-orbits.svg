<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Conic Section Orbits</title>
  <desc>A 2x2 grid of panels showing four conic section orbit types. Top-left: Circle (e=0). Top-right: Ellipse (0&lt;e&lt;1). Bottom-left: Parabola (e=1). Bottom-right: Hyperbola (e&gt;1). Center annotation notes that bound orbits close while escape orbits do not.</desc>

  <defs>
    <style>
      :root{
        --bg:#ffffff; --surface:#eef1f5; --border:#d4d0cc; --border-light:#e8e5e1;
        --navy:#1a3a52; --text:#0d1f2d; --muted:#5c6470; --faint:#a99f99;
        --teal:#6b9fa1; --teal-light:#8fbfc0; --teal-dark:#4a7e80;
        --gold:#c9a66b; --gold-light:#dcc194; --gold-dark:#7f6d44;
        --mauve:#8b7a8b; --mauve-light:#b8a8b8; --mauve-dark:#6b5a6b;
        --grid:#e0ddd8; --sun:#d4a843;
      }

      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle { font-size: 18px; font-weight: 600; fill: var(--navy); }
      .label { font-size: 15px; fill: var(--muted); }
      .panelTitle { font-size: 16px; font-weight: 600; fill: var(--navy); }
      .small { font-size: 13px; fill: var(--muted); }
    </style>
  </defs>

  <rect width="960" height="540" fill="#ffffff"/>

  <text x="480" y="45" text-anchor="middle" class="title">Conic Section Orbits</text>
  <text x="480" y="70" text-anchor="middle" class="subtitle">Inverse-square gravity produces four possible orbit shapes</text>

  <!-- TOP-LEFT: Circle (e=0) -->
  <g>
    <!-- Panel background -->
    <rect x="48" y="90" width="420" height="190" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="4"/>

    <!-- Circle -->
    <circle cx="232" cy="180" r="50" fill="none" stroke="var(--teal)" stroke-width="2.5"/>

    <!-- Central mass (center = focus) -->
    <circle cx="232" cy="180" r="7" fill="var(--gold)"/>

    <!-- Label -->
    <text x="232" y="260" text-anchor="middle" class="panelTitle">Circle (e = 0)</text>
    <text x="232" y="275" text-anchor="middle" class="small">focus at center</text>
  </g>

  <!-- TOP-RIGHT: Ellipse (0 < e < 1) -->
  <g>
    <!-- Panel background -->
    <rect x="492" y="90" width="420" height="190" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="4"/>

    <!-- Ellipse -->
    <ellipse cx="702" cy="180" rx="70" ry="50" fill="none" stroke="var(--teal)" stroke-width="2.5"/>

    <!-- Left focus (Sun) -->
    <circle cx="642" cy="180" r="7" fill="var(--gold)"/>

    <!-- Right focus (empty) -->
    <circle cx="762" cy="180" r="4" fill="var(--mauve)"/>

    <!-- Faint line showing focal distance -->
    <line x1="642" y1="180" x2="762" y2="180" stroke="var(--border-light)" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Label -->
    <text x="702" y="260" text-anchor="middle" class="panelTitle">Ellipse (0 &lt; e &lt; 1)</text>
    <text x="702" y="275" text-anchor="middle" class="small">Sun at one focus</text>
  </g>

  <!-- Divider annotation between rows -->
  <text x="480" y="305" text-anchor="middle" class="small" fill="var(--muted)" font-weight="600">Bound orbits close. Escape orbits do not.</text>

  <!-- BOTTOM-LEFT: Parabola (e = 1) -->
  <g>
    <!-- Panel background -->
    <rect x="48" y="320" width="420" height="190" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="4"/>

    <!-- Parabolic curve opening right -->
    <path d="M 120 430 Q 155 380 175 365 Q 155 350 120 300" fill="none" stroke="var(--teal)" stroke-width="2.5"/>

    <!-- Focus -->
    <circle cx="200" cy="365" r="7" fill="var(--gold)"/>

    <!-- Label -->
    <text x="232" y="455" text-anchor="middle" class="panelTitle">Parabola (e = 1)</text>
    <text x="232" y="470" text-anchor="middle" class="small" fill="var(--muted)">escape threshold</text>
  </g>

  <!-- BOTTOM-RIGHT: Hyperbola (e > 1) -->
  <g>
    <!-- Panel background -->
    <rect x="492" y="320" width="420" height="190" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="4"/>

    <!-- Hyperbolic curve (one branch, opens rightward) -->
    <path d="M 560 300 Q 600 340 630 365 Q 600 390 560 430" fill="none" stroke="var(--teal)" stroke-width="2.5"/>

    <!-- Focus -->
    <circle cx="650" cy="365" r="7" fill="var(--gold)"/>

    <!-- Asymptote suggestions (faint) -->
    <line x1="650" y1="290" x2="560" y2="440" stroke="var(--border-light)" stroke-width="1" opacity="0.5"/>
    <line x1="650" y1="290" x2="760" y2="440" stroke="var(--border-light)" stroke-width="1" opacity="0.5"/>

    <!-- Label -->
    <text x="702" y="455" text-anchor="middle" class="panelTitle">Hyperbola (e &gt; 1)</text>
    <text x="702" y="470" text-anchor="middle" class="small" fill="var(--muted)">unbound trajectory</text>
  </g>

</svg>
