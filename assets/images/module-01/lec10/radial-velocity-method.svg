<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Radial Velocity Method</title>
  <desc>Exoplanet detection via star's radial velocity wobble caused by orbiting planet.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .title-text { font-size: 15px; font-weight: 600; fill: #1a3a52; }
      .label-text { font-size: 12px; fill: #1a3a52; }
      .small-text { font-size: 13px; fill: #5c6470; }
      .axis-label { font-size: 13px; fill: #5c6470; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- LEFT PANEL: Geometry -->
  <g>
    <text x="230" y="35" class="title-text" text-anchor="middle">Geometry</text>

    <!-- Observer (telescope shape) -->
    <g transform="translate(100, 150)">
      <!-- Telescope barrel (trapezoid) -->
      <polygon points="0,5 15,0 15,15 0,20" fill="#5c6470"/>
      <!-- Lens (circle) -->
      <circle cx="17" cy="10" r="4" fill="#5c6470" stroke="#d4d0cc" stroke-width="0.5"/>
    </g>

    <!-- Line of sight (dashed) -->
    <line x1="120" y1="155" x2="350" y2="155" stroke="#d4d0cc" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Barycenter -->
    <circle cx="240" cy="280" r="6" fill="#1a3a52"/>
    <text x="240" y="310" class="small-text" text-anchor="middle">barycenter</text>

    <!-- Star orbit (small circle) -->
    <circle cx="240" cy="280" r="30" fill="none" stroke="#d4d0cc" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Star at approaching position (left of barycenter) -->
    <circle cx="210" cy="280" r="8" fill="#c9a66b"/>
    <text x="210" y="305" class="small-text" text-anchor="middle" fill="#4da6d6">blueshift</text>

    <!-- Star at receding position (right of barycenter) -->
    <circle cx="270" cy="280" r="8" fill="#c9a66b" opacity="0.5" stroke="#d4d0cc" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="270" y="305" class="small-text" text-anchor="middle" fill="#c75050">redshift</text>

    <!-- Planet (larger orbit) -->
    <circle cx="240" cy="280" r="60" fill="none" stroke="#d4d0cc" stroke-width="0.5" stroke-dasharray="3,2"/>
    <circle cx="300" cy="280" r="6" fill="#6b9fa1" opacity="0.6"/>
    <text x="310" y="285" class="small-text">planet</text>
  </g>

  <!-- RIGHT PANEL: Radial Velocity Curve -->
  <g>
    <text x="730" y="35" class="title-text" text-anchor="middle">Radial Velocity Curve</text>

    <!-- Axes -->
    <line x1="550" y1="420" x2="900" y2="420" stroke="#d4d0cc" stroke-width="1.5"/>
    <line x1="550" y1="80" x2="550" y2="420" stroke="#d4d0cc" stroke-width="1.5"/>

    <!-- Axis labels -->
    <text x="540" y="300" class="axis-label" text-anchor="end">velocity</text>
    <text x="725" y="445" class="axis-label" text-anchor="middle">time</text>

    <!-- Zero velocity line (dashed) -->
    <line x1="550" y1="250" x2="900" y2="250" stroke="#d4d0cc" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Sinusoidal RV curve (parametric sine wave) -->
    <!-- Using sine wave: y = 250 - 70*sin(phase), x increases linearly -->
    <!-- Points at phase = 0, π/4, π/2, 3π/4, π, 5π/4, 3π/2, 7π/4, 2π -->
    <path d="M 550,250 L 570,224 L 590,200 L 610,182 L 630,170 L 650,165 L 670,170 L 690,182 L 710,200 L 730,224 L 750,250 L 770,276 L 790,300 L 810,318 L 830,330 L 850,335 L 870,330 L 880,320 L 900,250"
          stroke="#6b9fa1" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Semi-amplitude arrow -->
    <line x1="920" y1="180" x2="920" y2="320" stroke="#c9a66b" stroke-width="2"/>
    <polygon points="920,180 916,190 924,190" fill="#c9a66b"/>
    <polygon points="920,320 916,310 924,310" fill="#c9a66b"/>
    <text x="940" y="255" class="small-text" fill="#c9a66b">K</text>

    <!-- Trough label (at peak velocity, minimum y) -->
    <text x="650" y="145" class="small-text" text-anchor="middle" fill="#4da6d6">approaching (blueshift)</text>

    <!-- Peak label (at trough velocity, maximum y) -->
    <text x="830" y="360" class="small-text" text-anchor="middle" fill="#c75050">receding (redshift)</text>

    <!-- Period annotation -->
    <line x1="570" y1="100" x2="750" y2="100" stroke="#8b7a8b" stroke-width="1" stroke-dasharray="2,2"/>
    <polygon points="570,100 574,95 574,105" fill="#8b7a8b"/>
    <polygon points="750,100 746,95 746,105" fill="#8b7a8b"/>
    <text x="660" y="90" class="small-text" text-anchor="middle" fill="#8b7a8b">Period P</text>
  </g>
</svg>
