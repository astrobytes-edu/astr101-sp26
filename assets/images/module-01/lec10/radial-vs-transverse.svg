<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Radial vs Transverse Motion</title>
  <desc>Comparison of line-of-sight (Doppler detectable) and perpendicular (not Doppler detectable) stellar motion.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .panel-title { font-size: 15px; font-weight: 600; fill: #1a3a52; }
      .label-text { font-size: 12px; fill: #1a3a52; }
      .small-text { font-size: 13px; fill: #5c6470; }
      .result-text { font-size: 13px; font-weight: 600; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- LEFT PANEL: Radial (Line-of-Sight) -->
  <g>
    <text x="230" y="35" class="panel-title" text-anchor="middle">Radial (Line-of-Sight)</text>

    <!-- Observer (telescope) -->
    <g transform="translate(80, 150)">
      <polygon points="0,5 15,0 15,15 0,20" fill="#5c6470"/>
      <circle cx="17" cy="10" r="4" fill="#5c6470" stroke="#d4d0cc" stroke-width="0.5"/>
    </g>

    <!-- Line of sight (dashed) -->
    <line x1="100" y1="160" x2="300" y2="160" stroke="#d4d0cc" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Star -->
    <circle cx="280" cy="160" r="10" fill="#c9a66b"/>

    <!-- Velocity arrow (parallel to LOS, horizontal toward observer) -->
    <line x1="280" y1="160" x2="200" y2="160" stroke="#c9a66b" stroke-width="3"/>
    <polygon points="200,160 210,156 210,164" fill="#c9a66b"/>
    <text x="240" y="145" class="small-text" fill="#c9a66b">velocity</text>

    <!-- Spectrum comparison -->
    <!-- Rest spectrum -->
    <rect x="60" y="250" width="120" height="60" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="2"/>
    <text x="120" y="270" class="small-text" text-anchor="middle" fill="#5c6470">Rest</text>
    <!-- Absorption lines in rest spectrum -->
    <line x1="95" y1="285" x2="95" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
    <line x1="120" y1="285" x2="120" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
    <line x1="145" y1="285" x2="145" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>

    <!-- Observed spectrum (shifted blue) -->
    <rect x="210" y="250" width="120" height="60" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="2"/>
    <text x="270" y="270" class="small-text" text-anchor="middle" fill="#5c6470">Observed</text>
    <!-- Absorption lines shifted LEFT (blueshift, inside the Observed box) -->
    <line x1="235" y1="285" x2="235" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
    <line x1="260" y1="285" x2="260" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
    <line x1="285" y1="285" x2="285" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>

    <!-- Result box -->
    <rect x="60" y="335" width="270" height="50" fill="#4da6d6" rx="4"/>
    <text x="195" y="365" class="result-text" text-anchor="middle">Blueshift detected</text>

    <!-- Arrow connecting spectrum to result -->
    <line x1="195" y1="315" x2="195" y2="335" stroke="#4da6d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- RIGHT PANEL: Transverse (Perpendicular) -->
  <g>
    <text x="730" y="35" class="panel-title" text-anchor="middle">Transverse (Sideways)</text>

    <!-- Observer (telescope) -->
    <g transform="translate(580, 150)">
      <polygon points="0,5 15,0 15,15 0,20" fill="#5c6470"/>
      <circle cx="17" cy="10" r="4" fill="#5c6470" stroke="#d4d0cc" stroke-width="0.5"/>
    </g>

    <!-- Line of sight (dashed, horizontal) -->
    <line x1="600" y1="160" x2="800" y2="160" stroke="#d4d0cc" stroke-width="1.5" stroke-dasharray="3,2"/>

    <!-- Star -->
    <circle cx="780" cy="160" r="10" fill="#c9a66b"/>

    <!-- Right angle marker -->
    <rect x="765" y="160" width="15" height="15" fill="none" stroke="#d4d0cc" stroke-width="1"/>

    <!-- Velocity arrow (perpendicular to LOS, downward) -->
    <line x1="780" y1="175" x2="780" y2="230" stroke="#8b7a8b" stroke-width="3"/>
    <polygon points="780,230 776,220 784,220" fill="#8b7a8b"/>
    <text x="795" y="210" class="small-text" fill="#8b7a8b">velocity</text>

    <!-- Spectrum comparison -->
    <!-- Rest spectrum -->
    <rect x="560" y="250" width="120" height="60" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="2"/>
    <text x="620" y="270" class="small-text" text-anchor="middle" fill="#5c6470">Rest</text>
    <!-- Absorption lines in rest spectrum -->
    <line x1="595" y1="285" x2="595" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
    <line x1="620" y1="285" x2="620" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
    <line x1="645" y1="285" x2="645" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>

    <!-- Observed spectrum (NO shift) -->
    <rect x="710" y="250" width="120" height="60" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="2"/>
    <text x="770" y="270" class="small-text" text-anchor="middle" fill="#5c6470">Observed</text>
    <!-- Absorption lines at SAME position (no Doppler shift) -->
    <line x1="745" y1="285" x2="745" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
    <line x1="770" y1="285" x2="770" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>
    <line x1="795" y1="285" x2="795" y2="305" stroke="#3a3a3a" stroke-width="1.5" opacity="0.8"/>

    <!-- Result box -->
    <rect x="560" y="335" width="270" height="50" fill="#c9a66b" rx="4"/>
    <text x="695" y="355" class="result-text" text-anchor="middle" font-size="13px">No Doppler shift</text>
    <text x="695" y="372" class="result-text" text-anchor="middle" font-size="13px">detected via proper motion</text>

    <!-- Arrow connecting spectrum to result -->
    <line x1="695" y1="315" x2="695" y2="335" stroke="#c9a66b" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>
</svg>
