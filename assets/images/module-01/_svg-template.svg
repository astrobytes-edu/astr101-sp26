<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SVG Template (ASTR 101 — Academic Brand)</title>
  <desc id="desc">Template for course SVG figures using the academic brand palette: cream background, navy text, teal/gold/mauve accents.</desc>

  <defs>
    <style>
      :root{
        /* ===== Background & Surface ===== */
        --bg:#ffffff;
        --surface:#eef1f5;
        --border:#d4d0cc;
        --border-light:#e8e5e1;

        /* ===== Text ===== */
        --text:#0d1f2d;
        --navy:#1a3a52;
        --muted:#5c6470;
        --faint:#a99f99;

        /* ===== Accents ===== */
        --teal:#6b9fa1;
        --teal-light:#8fbfc0;
        --teal-dark:#4a7e80;

        --gold:#c9a66b;
        --gold-light:#dcc194;
        --gold-dark:#7f6d44;

        --mauve:#8b7a8b;
        --mauve-light:#b8a8b8;
        --mauve-dark:#6b5a6b;

        /* ===== Semantic ===== */
        --sun:#d4a843;
        --orbit:var(--teal);
        --force:var(--gold);
        --annotation:var(--mauve);

        /* ===== Grid ===== */
        --grid:#e0ddd8;
        --grid-strong:#d4d0cc;

        /* ===== Figure constants ===== */
        --orbitW:2;
        --guideW:1.5;
      }

      text{
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        fill: var(--navy);
      }
      .title{ font-size: 26px; font-weight: 650; fill: var(--navy); }
      .subtitle{ font-size: 16px; font-weight: 400; fill: var(--muted); }
      .label{ font-size: 18px; font-weight: 600; fill: var(--navy); }
      .small{ font-size: 15px; letter-spacing: 0.15px; fill: var(--muted); }
      .tiny{ font-size: 13px; letter-spacing: 0.15px; fill: var(--muted); }
      .faint{ fill: var(--faint); }
      .dash{ stroke-dasharray: 8 6; }

      /* Text readability on colored fills */
      .outline{
        paint-order: stroke;
        stroke: var(--bg);
        stroke-width: 5px;
        stroke-linejoin: round;
      }

      /* Panels / callout boxes */
      .panel{
        fill: var(--surface);
        stroke: var(--border);
        stroke-width: 1;
        rx: 8;
      }
      .panel-title{ font-size: 15px; font-weight: 650; fill: var(--navy); letter-spacing: 0.2px; }

      .accent-teal{ fill: var(--teal); }
      .accent-gold{ fill: var(--gold); }
      .accent-mauve{ fill: var(--mauve); }

      .math{ font-style: italic; }
    </style>

    <!-- Arrow markers -->
    <marker id="arrow-navy" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--navy)"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--teal)"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--gold)"/>
    </marker>
    <marker id="arrow-mauve" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--mauve)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Header -->
  <text x="48" y="48" class="title">Figure Title</text>
  <text x="48" y="72" class="subtitle">What to notice — keep short; detail goes in the figure registry caption.</text>

  <!-- Diagram area -->
  <g transform="translate(0,0)">
    <!-- Your figure goes here -->
    <circle cx="480" cy="300" r="6" fill="var(--teal)"/>
    <text x="500" y="305" class="label">Example</text>
  </g>
</svg>
