<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Rayleigh scattering makes the sky blue</title>
  <desc id="desc">Cross-section schematic of sunlight entering Earth's atmosphere. Short-wavelength (blue) light is scattered in many directions by air molecules, while longer-wavelength (red) light mostly continues forward. An observer on the ground sees blue light coming from the sky.</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --panel:#13162a;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --faint:#8f92ad;

        --aurora-teal:#028391;
        --aurora-teal-bright:#41A2AC;
        --aurora-teal-dim:#02626D;
        --aurora-pink:#BE5A83;
        --aurora-violet:#7077A1;
        --aurora-violet-bright:#9499B8;

        --teal:var(--aurora-teal);
        --teal-bright:var(--aurora-teal-bright);
        --teal-dim:var(--aurora-teal-dim);
        --pink:var(--aurora-pink);
        --violet:var(--aurora-violet);
        --violet-bright:var(--aurora-violet-bright);

        --sun:#f6d55c;
        --blue:#5aa8ff;
        --red:#ff7a5c;
      }

      text{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        fill: var(--fg);
      }
      .title{ font-size: 34px; font-weight: 800; }
      .subtitle{ font-size: 18px; fill: var(--muted); }
      .label{ font-size: 20px; font-weight: 750; }
      .small{ font-size: 18px; fill: var(--muted); }
      .tiny{ font-size: 16px; fill: var(--muted); }
      .outline{ paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }

      .panel{ fill: var(--panel); stroke: var(--violet); stroke-width: 1.6; opacity: 0.96; }
      .atm{ fill: none; stroke: var(--violet-bright); stroke-width: 3.5; opacity: 0.75; }
      .ground{ stroke: var(--teal-dim); stroke-width: 6; opacity: 0.9; }
      .molecule{ fill: var(--violet); opacity: 0.65; }

      .beam{ stroke: var(--fg); stroke-width: 6; opacity: 0.25; }
      .blueRay{ stroke: var(--blue); stroke-width: 4.5; opacity: 0.85; marker-end: url(#arrow-blue); }
      .redRay{ stroke: var(--red); stroke-width: 4.5; opacity: 0.75; marker-end: url(#arrow-red); }
      .note{ fill: #101327; stroke: var(--violet); stroke-width: 1.2; opacity: 0.96; }
    </style>

    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="var(--blue)"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="var(--red)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Header -->
  <text x="44" y="58" class="title">Rayleigh scattering makes the sky blue</text>
  <text x="44" y="86" class="subtitle">Shorter wavelengths scatter much more strongly (∝ 1/λ⁴).</text>

  <rect x="36" y="110" width="888" height="340" rx="18" class="panel"/>

  <!-- Scene -->
  <g>
    <!-- Sun -->
    <circle cx="720" cy="168" r="22" fill="var(--sun)" opacity="0.98"/>
    <circle cx="720" cy="168" r="40" fill="none" stroke="var(--sun)" stroke-width="10" opacity="0.12"/>
    <text x="748" y="176" class="tiny outline">Sunlight</text>

    <!-- Atmosphere arc -->
    <path d="M160 402 C 300 250, 660 250, 800 402" class="atm"/>
    <text x="480" y="240" text-anchor="middle" class="tiny outline">atmosphere (air molecules)</text>

    <!-- Ground -->
    <line x1="160" y1="402" x2="800" y2="402" class="ground"/>

    <!-- Incoming beam -->
    <path d="M720 190 C 650 250, 590 310, 540 392" class="beam"/>

    <!-- Molecules -->
    <g>
      <circle cx="600" cy="300" r="5" class="molecule"/>
      <circle cx="560" cy="330" r="4.5" class="molecule"/>
      <circle cx="520" cy="310" r="4" class="molecule"/>
      <circle cx="640" cy="320" r="4.5" class="molecule"/>
      <circle cx="580" cy="260" r="4" class="molecule"/>
      <circle cx="500" cy="340" r="4.5" class="molecule"/>
      <circle cx="660" cy="280" r="4" class="molecule"/>
      <circle cx="610" cy="356" r="4" class="molecule"/>
    </g>

    <!-- Blue scattered rays (many directions) -->
    <path d="M600 300 C 530 280, 430 250, 340 220" class="blueRay"/>
    <path d="M560 330 C 500 350, 420 372, 330 390" class="blueRay"/>
    <path d="M520 310 C 470 270, 430 230, 390 190" class="blueRay"/>
    <path d="M640 320 C 700 320, 770 300, 820 270" class="blueRay"/>
    <text x="322" y="216" class="tiny outline">blue scatters</text>
    <text x="322" y="236" class="tiny outline">in many directions</text>

    <!-- Red mostly forward -->
    <path d="M660 280 C 640 320, 610 360, 560 402" class="redRay"/>
    <text x="662" y="418" class="tiny outline">more red continues forward</text>

    <!-- Observer -->
    <g transform="translate(0,0)">
      <circle cx="300" cy="388" r="6" fill="var(--fg)" opacity="0.9"/>
      <path d="M292 402 L308 402 L300 418 Z" fill="var(--fg)" opacity="0.8"/>
      <text x="250" y="376" class="tiny outline">observer</text>
      <path d="M330 374 C 380 346, 450 320, 520 310" stroke="var(--blue)" stroke-width="3.5" opacity="0.6" fill="none" marker-end="url(#arrow-blue)"/>
      <text x="334" y="350" class="tiny outline">sees scattered blue</text>
    </g>
  </g>

  <!-- Footer -->
  <rect x="36" y="468" width="888" height="56" rx="16" class="panel"/>
  <text x="60" y="502" class="label">
    <tspan class="small">Key idea:</tspan>
    <tspan> the sky looks blue because</tspan>
    <tspan class="small"> blue light is scattered into your line of sight.</tspan>
  </text>
</svg>

