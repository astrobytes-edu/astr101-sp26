<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">What we learn from starlight</title>
  <desc id="desc">A central star labeled as an example nearby star, with arrows pointing to callouts for temperature, composition, motion, distance, and planets. The figure emphasizes that these properties are inferred from analyzing light.</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --panel:#13162a;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --faint:#8f92ad;

        --aurora-teal:#028391;
        --aurora-teal-bright:#41A2AC;
        --aurora-teal-dim:#02626D;
        --aurora-pink:#BE5A83;
        --aurora-pink-bright:#CE83A2;
        --aurora-violet:#7077A1;
        --aurora-violet-bright:#9499B8;

        --teal:var(--aurora-teal);
        --teal-bright:var(--aurora-teal-bright);
        --teal-dim:var(--aurora-teal-dim);
        --pink:var(--aurora-pink);
        --pink-bright:var(--aurora-pink-bright);
        --violet:var(--aurora-violet);
        --violet-bright:var(--aurora-violet-bright);

        --star:#ffcf6a;
      }

      text{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        fill: var(--fg);
      }
      .title{ font-size: 34px; font-weight: 800; }
      .subtitle{ font-size: 18px; fill: var(--muted); }
      .label{ font-size: 20px; font-weight: 750; }
      .small{ font-size: 18px; fill: var(--muted); }
      .tiny{ font-size: 16px; fill: var(--muted); }
      .outline{ paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }

      .panel{ fill: var(--panel); stroke: var(--violet); stroke-width: 1.6; opacity: 0.96; }
      .callout{ fill: #101327; stroke: var(--violet); stroke-width: 1.2; opacity: 0.96; }

      .star{ fill: var(--star); opacity: 0.98; }
      .starGlow{ fill: none; stroke: var(--star); stroke-width: 22; opacity: 0.14; }
      .starGlow2{ fill: none; stroke: var(--star); stroke-width: 10; opacity: 0.22; }

      .arrow{ stroke: var(--teal-bright); stroke-width: 4.5; fill: none; marker-end: url(#arrow-teal); }
      .arrowPink{ stroke: var(--pink); stroke-width: 4.5; fill: none; marker-end: url(#arrow-pink); }
      .icon{ fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.95; }
    </style>

    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="var(--teal-bright)"/>
    </marker>
    <marker id="arrow-pink" markerWidth="12" markerHeight="12" refX="8" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="var(--pink)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Header -->
  <text x="44" y="58" class="title">What we learn from starlight</text>
  <text x="44" y="86" class="subtitle">We can infer physical properties without visiting — by analyzing a star’s light.</text>

  <rect x="36" y="110" width="888" height="340" rx="18" class="panel"/>

  <!-- Central star -->
  <g>
    <circle cx="480" cy="290" r="96" class="starGlow"/>
    <circle cx="480" cy="290" r="54" class="starGlow2"/>
    <circle cx="480" cy="290" r="40" class="star"/>
    <text x="480" y="284" text-anchor="middle" class="label outline">Example star</text>
    <text x="480" y="312" text-anchor="middle" class="small outline">(e.g., Proxima Centauri)</text>
  </g>

  <!-- Callouts -->
  <!-- Temperature -->
  <rect x="86" y="150" width="250" height="78" rx="14" class="callout"/>
  <g transform="translate(0,0)">
    <!-- thermometer icon -->
    <line x1="108" y1="204" x2="108" y2="172" class="icon"/>
    <circle cx="108" cy="210" r="10" class="icon"/>
    <line x1="108" y1="180" x2="120" y2="180" class="icon" opacity="0.7"/>
    <line x1="108" y1="190" x2="120" y2="190" class="icon" opacity="0.7"/>
    <text x="132" y="182" class="label">Temperature</text>
    <text x="132" y="206" class="tiny">from spectrum shape</text>
  </g>
  <path d="M336 190 C 392 206, 418 230, 448 266" class="arrow"/>

  <!-- Composition -->
  <rect x="624" y="150" width="250" height="78" rx="14" class="callout"/>
  <g transform="translate(0,0)">
    <!-- barcode icon -->
    <line x1="646" y1="172" x2="646" y2="210" class="icon"/>
    <line x1="656" y1="176" x2="656" y2="210" class="icon" opacity="0.7"/>
    <line x1="666" y1="172" x2="666" y2="210" class="icon"/>
    <line x1="676" y1="176" x2="676" y2="210" class="icon" opacity="0.7"/>
    <line x1="686" y1="172" x2="686" y2="210" class="icon"/>
    <text x="706" y="182" class="label">Composition</text>
    <text x="706" y="206" class="tiny">from spectral lines</text>
  </g>
  <path d="M624 190 C 568 206, 542 230, 512 266" class="arrow"/>

  <!-- Motion -->
  <rect x="86" y="330" width="250" height="78" rx="14" class="callout"/>
  <g transform="translate(0,0)">
    <!-- Doppler arrow icon -->
    <line x1="108" y1="370" x2="142" y2="370" class="icon"/>
    <path d="M142 370 L132 364 L132 376 Z" fill="var(--fg)" opacity="0.95"/>
    <line x1="108" y1="354" x2="142" y2="354" class="icon" opacity="0.7"/>
    <text x="162" y="362" class="label">Motion</text>
    <text x="162" y="386" class="tiny">from line shifts</text>
  </g>
  <path d="M336 368 C 394 356, 420 330, 452 308" class="arrowPink"/>

  <!-- Distance -->
  <rect x="624" y="330" width="250" height="78" rx="14" class="callout"/>
  <g transform="translate(0,0)">
    <!-- ruler icon -->
    <line x1="646" y1="356" x2="696" y2="356" class="icon"/>
    <line x1="656" y1="348" x2="656" y2="364" class="icon" opacity="0.7"/>
    <line x1="668" y1="348" x2="668" y2="364" class="icon" opacity="0.7"/>
    <line x1="680" y1="348" x2="680" y2="364" class="icon" opacity="0.7"/>
    <text x="706" y="362" class="label">Distance</text>
    <text x="706" y="386" class="tiny">from brightness + models</text>
  </g>
  <path d="M624 368 C 566 356, 540 330, 508 308" class="arrowPink"/>

  <!-- Planets -->
  <rect x="354" y="216" width="252" height="78" rx="14" class="callout"/>
  <g transform="translate(0,0)">
    <!-- small planet icon -->
    <circle cx="380" cy="252" r="10" fill="var(--teal-bright)" opacity="0.9"/>
    <path d="M368 252 C 376 242, 392 242, 400 252 C 392 262, 376 262, 368 252 Z" fill="none" stroke="var(--fg)" stroke-width="2.4" opacity="0.7"/>
    <text x="404" y="246" class="label">Planets</text>
    <text x="404" y="270" class="tiny">from transits or wobble</text>
  </g>
  <path d="M480 254 C 480 260, 480 266, 480 274" class="arrow"/>

  <!-- Footer -->
  <rect x="36" y="468" width="888" height="56" rx="16" class="panel"/>
  <text x="60" y="502" class="label">
    <tspan class="small">Key idea:</tspan>
    <tspan> astronomy is inference from light</tspan>
    <tspan class="small"> — photons are our messengers.</tspan>
  </text>
</svg>

