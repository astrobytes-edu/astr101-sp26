<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Giant vs Dwarf Stars</title>
  <desc>Comparison of star sizes at the same temperature showing different luminosities due to surface area differences.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .title-text { font-size: 20px; font-weight: 600; fill: #1a3a52; }
      .label-text { font-size: 14px; fill: #1a3a52; }
      .formula-text { font-size: 13px; fill: #5c6470; }
      .small-text { font-size: 13px; fill: #5c6470; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- LEFT PANEL: Red Dwarf -->
  <g>
    <!-- Small star -->
    <circle cx="150" cy="220" r="25" fill="#c9a66b"/>

    <!-- Radius arrow (left side) -->
    <line x1="150" y1="220" x2="125" y2="220" stroke="#c9a66b" stroke-width="2"/>
    <polygon points="125,220 132,216 132,224" fill="#c9a66b"/>
    <line x1="125" y1="230" x2="125" y2="210" stroke="#c9a66b" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <text x="115" y="240" class="small-text">R</text>

    <!-- Temperature reference line -->
    <line x1="150" y1="265" x2="810" y2="265" stroke="#d4d0cc" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Label -->
    <text x="150" y="300" class="label-text" text-anchor="middle">Red dwarf</text>
    <text x="150" y="320" class="small-text" text-anchor="middle">Small R → low L</text>
  </g>

  <!-- RIGHT PANEL: Red Giant -->
  <g>
    <!-- Large star -->
    <circle cx="810" cy="220" r="90" fill="#c9a66b"/>

    <!-- Radius arrow (right side) -->
    <line x1="810" y1="220" x2="720" y2="220" stroke="#c9a66b" stroke-width="2"/>
    <polygon points="720,220 727,216 727,224" fill="#c9a66b"/>
    <line x1="720" y1="230" x2="720" y2="210" stroke="#c9a66b" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
    <text x="700" y="240" class="small-text">R</text>

    <!-- Label -->
    <text x="810" y="335" class="label-text" text-anchor="middle">Red giant</text>
    <text x="810" y="355" class="small-text" text-anchor="middle">Large R → high L</text>
  </g>

  <!-- Temperature reference label -->
  <text x="480" y="285" class="small-text" text-anchor="middle">same surface temperature</text>

  <!-- Bottom formula panel -->
  <rect x="20" y="400" width="920" height="110" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="4"/>
  <text x="480" y="430" class="formula-text" text-anchor="middle">L ∝ R² T⁴</text>
  <text x="480" y="455" class="formula-text" text-anchor="middle">At fixed temperature, luminosity scales with surface area</text>
  <text x="480" y="480" class="small-text" text-anchor="middle">Larger surface = more photons emitted = higher luminosity</text>
</svg>
