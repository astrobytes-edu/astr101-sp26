<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Infrared Thermal Image</title>
  <desc>Comparison of visible light and infrared imaging showing thermal signatures invisible to human eyes.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .panel-title { font-size: 15px; font-weight: 600; fill: #1a3a52; }
      .temp-label { font-size: 12px; fill: #5c6470; }
    </style>
    <linearGradient id="tempGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#6b9fa1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a66b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a66b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Main title -->
  <text x="480" y="28" font-size="20" font-weight="600" fill="#1a3a52" text-anchor="middle">Seeing in Infrared</text>

  <!-- LEFT PANEL: Visible Light -->
  <g>
    <!-- Panel background -->
    <rect x="20" y="20" width="420" height="500" fill="#3a3a3a" stroke="#d4d0cc" stroke-width="1" rx="4"/>
    
    <!-- Title -->
    <text x="230" y="50" class="panel-title" text-anchor="middle" fill="#ffffff">Visible Light — In the Dark</text>
    
    <!-- Person silhouette: geometric shapes at low opacity -->
    <!-- Head -->
    <circle cx="230" cy="150" r="20" fill="#d4d0cc" opacity="0.25"/>
    
    <!-- Torso -->
    <rect x="210" y="175" width="40" height="70" rx="10" fill="#d4d0cc" opacity="0.25"/>
    
    <!-- Left arm -->
    <rect x="165" y="190" width="45" height="15" rx="8" fill="#d4d0cc" opacity="0.25"/>
    
    <!-- Right arm -->
    <rect x="255" y="190" width="45" height="15" rx="8" fill="#d4d0cc" opacity="0.25"/>
    
    <!-- Left leg -->
    <rect x="200" y="250" width="18" height="80" rx="9" fill="#d4d0cc" opacity="0.25"/>
    
    <!-- Right leg -->
    <rect x="242" y="250" width="18" height="80" rx="9" fill="#d4d0cc" opacity="0.25"/>
  </g>

  <!-- RIGHT PANEL: Infrared -->
  <g>
    <!-- Panel background -->
    <rect x="520" y="20" width="420" height="500" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="4"/>
    
    <!-- Title -->
    <text x="730" y="50" class="panel-title" text-anchor="middle">Infrared Camera</text>
    
    <!-- Temperature gradient legend -->
    <rect x="870" y="120" width="20" height="250" fill="url(#tempGrad)" stroke="#d4d0cc" stroke-width="1"/>
    <text x="905" y="135" class="temp-label">warmer</text>
    <text x="910" y="390" class="temp-label">cooler</text>
    
    <!-- Person silhouette with thermal coloring -->
    <!-- Head (warm, gold) -->
    <circle cx="730" cy="150" r="20" fill="#c9a66b" opacity="0.95"/>
    
    <!-- Torso (warm, gold) -->
    <rect x="710" y="175" width="40" height="70" rx="10" fill="#c9a66b" opacity="0.95"/>
    
    <!-- Left arm (cool, teal) -->
    <rect x="665" y="190" width="45" height="15" rx="8" fill="#6b9fa1" opacity="0.95"/>
    
    <!-- Right arm (cool, teal) -->
    <rect x="755" y="190" width="45" height="15" rx="8" fill="#6b9fa1" opacity="0.95"/>
    
    <!-- Left leg (cool, teal) -->
    <rect x="700" y="250" width="18" height="80" rx="9" fill="#6b9fa1" opacity="0.95"/>
    
    <!-- Right leg (cool, teal) -->
    <rect x="742" y="250" width="18" height="80" rx="9" fill="#6b9fa1" opacity="0.95"/>
  </g>
</svg>
