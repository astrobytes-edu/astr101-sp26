<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Kepler’s Third Law on a log–log plot</title>
  <desc id="desc">Log–log plot of orbital period versus semimajor axis for the eight planets. The points fall on a straight line with slope 3/2, illustrating the power-law relationship P proportional to a to the three-halves power for objects orbiting the Sun.</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --panel:#13162a;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --faint:#8f92ad;
        --grid:#1a1c28;
        --grid-strong:#24263a;

        --aurora-teal:#028391;
        --aurora-teal-bright:#41A2AC;
        --aurora-teal-dim:#02626D;
        --aurora-teal-pale:#A6D4D8;

        --aurora-pink:#BE5A83;
        --aurora-pink-bright:#CE83A2;
        --aurora-pink-dim:#8E4462;
        --aurora-pink-pale:#E8C5D4;

        --aurora-violet:#7077A1;
        --aurora-violet-bright:#9499B8;
        --aurora-violet-dim:#545979;
        --aurora-violet-pale:#CDCFDE;

        --teal:var(--aurora-teal);
        --teal-bright:var(--aurora-teal-bright);
        --teal-dim:var(--aurora-teal-dim);
        --teal-pale:var(--aurora-teal-pale);

        --pink:var(--aurora-pink);
        --pink-bright:var(--aurora-pink-bright);
        --pink-dim:var(--aurora-pink-dim);
        --pink-pale:var(--aurora-pink-pale);

        --violet:var(--aurora-violet);
        --violet-bright:var(--aurora-violet-bright);
        --violet-dim:var(--aurora-violet-dim);
        --violet-pale:var(--aurora-violet-pale);
      }

      text{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        fill: var(--fg);
      }
      .title{ font-size: 28px; font-weight: 750; }
      .subtitle{ font-size: 18px; fill: var(--muted); }
      .label{ font-size: 20px; font-weight: 700; }
      .small{ font-size: 18px; letter-spacing: 0.2px; fill: var(--muted); }
      .tiny{ font-size: 16px; letter-spacing: 0.2px; fill: var(--muted); }
      .outline{ paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
      .panel{ fill: var(--panel); stroke: var(--violet); stroke-width: 1.5; opacity: 0.96; }
      .dash{ stroke-dasharray: 10 10; }
    </style>

    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Header -->
  <text x="48" y="56" class="title">Kepler’s Third Law</text>
  <text x="48" y="82" class="subtitle">On a log–log plot, a power law becomes a straight line (slope = 3/2).</text>

  <!-- Plot area -->
  <!-- Plot box: x=[160,820], y=[140,430] -->
  <g>
    <rect x="120" y="110" width="780" height="350" rx="16" class="panel"/>

    <!-- Gridlines (log ticks) -->
    <g opacity="0.6">
      <!-- vertical -->
      <line x1="211.1" y1="140" x2="211.1" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="310.5" y1="140" x2="310.5" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="409.8" y1="140" x2="409.8" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="541.1" y1="140" x2="541.1" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="640.5" y1="140" x2="640.5" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="739.8" y1="140" x2="739.8" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="797.9" y1="140" x2="797.9" y2="430" stroke="var(--grid)" stroke-width="1.5"/>

      <!-- horizontal -->
      <line x1="160" y1="425.7" x2="820" y2="425.7" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="388.3" x2="820" y2="388.3" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="360.0" x2="820" y2="360.0" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="331.8" x2="820" y2="331.8" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="294.4" x2="820" y2="294.4" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="266.1" x2="820" y2="266.1" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="237.8" x2="820" y2="237.8" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="200.4" x2="820" y2="200.4" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="172.2" x2="820" y2="172.2" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="160" y1="143.9" x2="820" y2="143.9" stroke="var(--grid)" stroke-width="1.5"/>
    </g>

    <!-- Axes -->
    <line x1="160" y1="430" x2="820" y2="430" stroke="var(--teal)" stroke-width="3.2"/>
    <line x1="160" y1="430" x2="160" y2="140" stroke="var(--teal)" stroke-width="3.2"/>

    <!-- Tick labels -->
    <g class="tiny">
      <!-- x ticks -->
      <text x="211.1" y="454" text-anchor="middle">0.5</text>
      <text x="310.5" y="454" text-anchor="middle">1</text>
      <text x="409.8" y="454" text-anchor="middle">2</text>
      <text x="541.1" y="454" text-anchor="middle">5</text>
      <text x="640.5" y="454" text-anchor="middle">10</text>
      <text x="739.8" y="454" text-anchor="middle">20</text>
      <text x="797.9" y="454" text-anchor="middle">30</text>

      <!-- y ticks -->
      <text x="146" y="429.7" text-anchor="end">0.2</text>
      <text x="146" y="392.3" text-anchor="end">0.5</text>
      <text x="146" y="364.0" text-anchor="end">1</text>
      <text x="146" y="335.8" text-anchor="end">2</text>
      <text x="146" y="298.4" text-anchor="end">5</text>
      <text x="146" y="270.1" text-anchor="end">10</text>
      <text x="146" y="241.8" text-anchor="end">20</text>
      <text x="146" y="204.4" text-anchor="end">50</text>
      <text x="146" y="176.2" text-anchor="end">100</text>
      <text x="146" y="147.9" text-anchor="end">200</text>
    </g>

    <!-- Axis titles -->
    <text x="490" y="492" class="small" text-anchor="middle">Semimajor axis, <tspan font-style="italic">a</tspan> (AU) — log scale</text>
    <text x="92" y="288" class="small" text-anchor="middle" transform="rotate(-90 92 288)">Orbital period, <tspan font-style="italic">P</tspan> (years) — log scale</text>

    <!-- Best-fit (Kepler III) line: P ∝ a^(3/2) -->
    <line x1="160.0" y1="424.3" x2="820.0" y2="142.5" stroke="var(--violet)" stroke-width="3.5" opacity="0.85"/>
    <path d="M 620 223 L 700 189" fill="none" stroke="var(--violet)" stroke-width="0" marker-end="url(#arrow-violet)"/>
    <text x="690" y="196" class="label outline" fill="var(--violet)" text-anchor="end">
      slope = 3<tspan baseline-shift="super" font-size="70%">/</tspan>2
    </text>

    <!-- Planet points (positions computed in log space; P shown here follows P = a^(3/2) in years) -->
    <g>
      <circle cx="175.5" cy="417.7" r="6.5" fill="var(--pink)"/>
      <text x="188" y="422" class="tiny outline">Mercury</text>

      <circle cx="263.4" cy="380.1" r="6.5" fill="var(--pink)"/>
      <text x="275" y="384" class="tiny outline">Venus</text>

      <circle cx="310.5" cy="360.0" r="7.5" fill="var(--pink-bright)"/>
      <text x="324" y="364" class="tiny outline">Earth</text>

      <circle cx="370.5" cy="334.4" r="6.5" fill="var(--pink)"/>
      <text x="384" y="338" class="tiny outline">Mars</text>

      <circle cx="546.7" cy="259.2" r="6.5" fill="var(--pink)"/>
      <text x="560" y="263" class="tiny outline">Jupiter</text>

      <circle cx="633.7" cy="222.0" r="6.5" fill="var(--pink)"/>
      <text x="647" y="226" class="tiny outline">Saturn</text>

      <circle cx="733.9" cy="179.2" r="6.5" fill="var(--pink)"/>
      <text x="747" y="183" class="tiny outline">Uranus</text>

      <circle cx="798.4" cy="151.7" r="6.5" fill="var(--pink)"/>
      <text x="812" y="156" class="tiny outline">Neptune</text>
    </g>
  </g>

  <!-- Footer takeaway -->
  <g transform="translate(48,470)">
    <rect x="0" y="0" width="864" height="70" rx="12" class="panel"/>
    <text x="18" y="30" class="label">
      Key idea: <tspan font-style="italic">P</tspan><tspan baseline-shift="super" font-size="70%">2</tspan> ∝ <tspan font-style="italic">a</tspan><tspan baseline-shift="super" font-size="70%">3</tspan> becomes a straight line in log–log space.
    </text>
    <text x="18" y="54" class="small">
      A power law turns into “line + slope” — the slope here encodes the 3/2 exponent.
    </text>
  </g>
</svg>
