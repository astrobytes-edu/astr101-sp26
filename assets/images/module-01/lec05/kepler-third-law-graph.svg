<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Kepler's Third Law: Log-Log Plot</title>
  <desc>A logarithmic-scale plot of orbital period P (years) versus semi-major axis a (AU). On log-log axes, the power law P = a^(3/2) becomes a straight line with slope 3/2. All planets lie on this best-fit line.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .axis-label { font-size: 14px; font-weight: 500; fill: #1a3a52; }
      .tick-label { font-size: 12px; fill: #5c6470; }
      .grid-line { stroke: #ccc7c0; stroke-width: 1; }
      .axis-line { stroke: #1a3a52; stroke-width: 2; }
      .fit-line { fill: none; stroke: #6b9fa1; stroke-width: 2.5; }
      .planet-dot { fill: #c9a66b; }
      .earth-dot { fill: #c9a66b; stroke: #1a3a52; stroke-width: 2; }
      .planet-label { font-size: 13px; fill: #5c6470; text-anchor: middle; }
      .annotation { font-size: 13px; fill: #6b9fa1; font-weight: 600; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="30" font-size="18" font-weight="600" fill="#1a3a52" text-anchor="middle">
    Kepler's Third Law: Log-Log Plot
  </text>
  <text x="480" y="50" font-size="13" fill="#5c6470" text-anchor="middle">
    On log scales, power law becomes a straight line (slope = 3/2)
  </text>

  <!-- Main plot area background -->
  <rect x="160" y="100" width="660" height="330" fill="white" stroke="#d4d0cc" stroke-width="1"/>

  <!-- Axes -->
  <line x1="160" y1="100" x2="160" y2="430" class="axis-line"/>
  <line x1="820" y1="100" x2="820" y2="430" class="axis-line"/>
  <line x1="160" y1="430" x2="820" y2="430" class="axis-line"/>

  <!-- Vertical grid lines at log(a) positions for 0.5, 1, 2, 5, 10, 20 AU -->
  <!-- log(0.5)=-0.301, log(1)=0, log(2)=0.301, log(5)=0.699, log(10)=1, log(20)=1.301 -->
  <!-- Range: log(0.3)=-0.523 to log(40)=1.602, span=2.125 -->
  <!-- px = 160 + 660*(log(a)+0.523)/2.125 -->
  <line x1="215.8" y1="100" x2="215.8" y2="430" class="grid-line"/>
  <line x1="310.2" y1="100" x2="310.2" y2="430" class="grid-line"/>
  <line x1="404.6" y1="100" x2="404.6" y2="430" class="grid-line"/>
  <line x1="581.5" y1="100" x2="581.5" y2="430" class="grid-line"/>
  <line x1="675.8" y1="100" x2="675.8" y2="430" class="grid-line"/>
  <line x1="770.2" y1="100" x2="770.2" y2="430" class="grid-line"/>

  <!-- Horizontal grid lines at log(P) positions for 0.2, 0.5, 1, 2, 5, 10, 20, 50, 100, 200 yr -->
  <!-- log(0.2)=-0.699, log(0.5)=-0.301, log(1)=0, log(2)=0.301, log(5)=0.699, log(10)=1, log(20)=1.301, log(50)=1.699, log(100)=2, log(200)=2.301 -->
  <!-- Range: log(0.2)=-0.699 to log(200)=2.301, span=3.0 -->
  <!-- py = 430 - 330*(log(P)+0.699)/3.0 -->
  <line x1="160" y1="403.3" x2="820" y2="403.3" class="grid-line"/>
  <line x1="160" y1="369.0" x2="820" y2="369.0" class="grid-line"/>
  <line x1="160" y1="334.7" x2="820" y2="334.7" class="grid-line"/>
  <line x1="160" y1="300.4" x2="820" y2="300.4" class="grid-line"/>
  <line x1="160" y1="249.7" x2="820" y2="249.7" class="grid-line"/>
  <line x1="160" y1="215.4" x2="820" y2="215.4" class="grid-line"/>
  <line x1="160" y1="181.1" x2="820" y2="181.1" class="grid-line"/>
  <line x1="160" y1="130.4" x2="820" y2="130.4" class="grid-line"/>

  <!-- X-axis tick marks and labels -->
  <line x1="215.8" y1="430" x2="215.8" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="215.8" y="455" class="tick-label">0.5</text>

  <line x1="310.2" y1="430" x2="310.2" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="310.2" y="455" class="tick-label">1</text>

  <line x1="404.6" y1="430" x2="404.6" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="404.6" y="455" class="tick-label">2</text>

  <line x1="581.5" y1="430" x2="581.5" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="581.5" y="455" class="tick-label">5</text>

  <line x1="675.8" y1="430" x2="675.8" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="675.8" y="455" class="tick-label">10</text>

  <line x1="770.2" y1="430" x2="770.2" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="770.2" y="455" class="tick-label">20</text>

  <!-- Y-axis tick marks and labels -->
  <line x1="150" y1="403.3" x2="160" y2="403.3" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="407" class="tick-label" text-anchor="end">0.2</text>

  <line x1="150" y1="369.0" x2="160" y2="369.0" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="373" class="tick-label" text-anchor="end">0.5</text>

  <line x1="150" y1="334.7" x2="160" y2="334.7" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="338" class="tick-label" text-anchor="end">1</text>

  <line x1="150" y1="300.4" x2="160" y2="300.4" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="304" class="tick-label" text-anchor="end">2</text>

  <line x1="150" y1="249.7" x2="160" y2="249.7" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="253" class="tick-label" text-anchor="end">5</text>

  <line x1="150" y1="215.4" x2="160" y2="215.4" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="219" class="tick-label" text-anchor="end">10</text>

  <line x1="150" y1="181.1" x2="160" y2="181.1" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="185" class="tick-label" text-anchor="end">20</text>

  <line x1="150" y1="130.4" x2="160" y2="130.4" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="134" class="tick-label" text-anchor="end">50</text>

  <!-- Axis labels -->
  <text x="490" y="500" class="axis-label" text-anchor="middle">a (AU)</text>
  <text x="90" y="265" class="axis-label" text-anchor="middle" transform="rotate(-90 90 265)">P (years)</text>

  <!-- Best-fit line: P = a^(3/2), or log(P) = 1.5 * log(a) -->
  <!-- Sample points: a=0.3 (px=160), a=1 (px=310), a=10 (px=630), a=40 (px=820) -->
  <!-- P=0.164 (py=421), P=1 (py=335), P=31.6 (py=219), P=253 (py=132) -->
  <polyline points="160,421 310,335 630,219 820,132" class="fit-line"/>

  <!-- Planet data points -->
  <!-- Mercury: a=0.387, log(a)=-0.411, P=0.241, log(P)=-0.618 -->
  <!-- px = 160 + 660*(-0.411+0.523)/2.125 = 177.1, py = 430 - 330*(-0.618+0.699)/3 = 418.1 -->
  <circle cx="177" cy="418" r="3.5" class="planet-dot"/>
  <text x="177" y="435" class="planet-label">Me</text>

  <!-- Venus: a=0.723, log(a)=-0.141, P=0.615, log(P)=-0.211 -->
  <!-- px = 160 + 660*(-0.141+0.523)/2.125 = 238.9, py = 430 - 330*(-0.211+0.699)/3 = 376.8 -->
  <circle cx="239" cy="377" r="3.5" class="planet-dot"/>
  <text x="239" y="394" class="planet-label">V</text>

  <!-- Earth: a=1.000, log(a)=0, P=1.000, log(P)=0 -->
  <!-- px = 160 + 660*(0+0.523)/2.125 = 310.2, py = 430 - 330*(0+0.699)/3 = 334.7 -->
  <circle cx="310" cy="335" r="4.5" class="earth-dot"/>
  <text x="310" y="352" class="planet-label">Earth</text>

  <!-- Mars: a=1.524, log(a)=0.183, P=1.881, log(P)=0.274 -->
  <!-- px = 160 + 660*(0.183+0.523)/2.125 = 347.1, py = 430 - 330*(0.274+0.699)/3 = 321.7 -->
  <circle cx="347" cy="322" r="3.5" class="planet-dot"/>
  <text x="347" y="339" class="planet-label">Ma</text>

  <!-- Jupiter: a=5.203, log(a)=0.716, P=11.86, log(P)=1.074 -->
  <!-- px = 160 + 660*(0.716+0.523)/2.125 = 537.4, py = 430 - 330*(1.074+0.699)/3 = 266.4 -->
  <circle cx="537" cy="266" r="4" class="planet-dot"/>
  <text x="537" y="283" class="planet-label">Jupiter</text>

  <!-- Saturn: a=9.537, log(a)=0.980, P=29.46, log(P)=1.469 -->
  <!-- px = 160 + 660*(0.980+0.523)/2.125 = 638.0, py = 430 - 330*(1.469+0.699)/3 = 237.5 -->
  <circle cx="638" cy="238" r="4" class="planet-dot"/>
  <text x="638" y="255" class="planet-label">Saturn</text>

  <!-- Uranus: a=19.19, log(a)=1.283, P=84.01, log(P)=1.924 -->
  <!-- px = 160 + 660*(1.283+0.523)/2.125 = 753.0, py = 430 - 330*(1.924+0.699)/3 = 205.3 -->
  <circle cx="753" cy="205" r="4" class="planet-dot"/>
  <text x="753" y="222" class="planet-label">Uranus</text>

  <!-- Neptune: a=30.07, log(a)=1.478, P=164.8, log(P)=2.217 -->
  <!-- px = 160 + 660*(1.478+0.523)/2.125 = 815.0, py = 430 - 330*(2.217+0.699)/3 = 176.0 -->
  <circle cx="815" cy="176" r="4" class="planet-dot"/>
  <text x="815" y="193" class="planet-label">Neptune</text>

  <!-- Slope annotation -->
  <text x="745" y="160" class="annotation">slope = 3/2</text>

  <!-- Bottom insight -->
  <text x="480" y="525" font-size="12" fill="#5c6470" text-anchor="middle" font-style="italic">
    All planets fit one straight line → same central mass (the Sun)
  </text>
</svg>
