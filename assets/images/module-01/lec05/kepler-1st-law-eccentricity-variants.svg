<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark">
  <title id="title">Kepler’s First Law: Eccentricity changes orbit shape and focus offset</title>
  <desc id="desc">Three side-by-side orbits with the same semimajor axis. Panel 1 shows a circle (e=0) with the foci at the center. Panel 2 shows a mildly elliptical orbit (e=0.3) with the Sun at the left focus. Panel 3 shows a more elongated ellipse (e=0.6) with a larger focus offset. Each panel marks the center and foci.</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --grid:#1a1c28;

        /* Jewel Aurora */
        --aurora-teal:#028391;
        --aurora-pink:#BE5A83;
        --aurora-violet:#7077A1;

        /* Deep Jewel */
        --deep-teal:#257180;
        --deep-pink:#A35C7A;
        --deep-violet:#655D8A;

        /* Default mapping (dark) */
        --teal:var(--aurora-teal);
        --pink:var(--aurora-pink);
        --violet:var(--aurora-violet);

        --sun:#f6d55c;
        --orbitW:6;
        --guideW:2.5;
      }

      svg[data-theme="light"]{
        --bg:#ffffff;
        --fg:#111218;
        --muted:#3a3d52;
        --grid:#e7e8f0;
        --teal:var(--deep-teal);
        --pink:var(--deep-pink);
        --violet:var(--deep-violet);
      }

      text{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        fill: var(--fg);
      }
      .title{ font-size: 28px; font-weight: 750; }
      .subtitle{ font-size: 18px; fill: var(--muted); }
      .panel-title{ font-size: 18px; font-weight: 750; fill: var(--muted); letter-spacing: 0.2px; }
      .label{ font-size: 18px; font-weight: 650; }
      .small{ font-size: 16px; fill: var(--muted); }
      .dash{ stroke-dasharray: 10 10; }
    </style>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow-pink" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="var(--pink)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.22">
    <path d="M0 90 H960 M0 180 H960 M0 270 H960 M0 360 H960 M0 450 H960" stroke="var(--grid)" stroke-width="1"/>
    <path d="M120 0 V540 M240 0 V540 M360 0 V540 M480 0 V540 M600 0 V540 M720 0 V540 M840 0 V540" stroke="var(--grid)" stroke-width="1"/>
  </g>

  <!-- Header -->
  <text x="48" y="56" class="title">Kepler I: Shape and Focus Offset</text>
  <text x="48" y="82" class="subtitle">Eccentricity <tspan fill="var(--pink)" font-weight="750">e</tspan> controls how “stretched” the orbit is—and how far the focus is from the center.</text>

  <!-- Panel separators -->
  <line x1="320" y1="118" x2="320" y2="420" stroke="var(--grid)" stroke-width="2"/>
  <line x1="640" y1="118" x2="640" y2="420" stroke="var(--grid)" stroke-width="2"/>

  <!-- Panels: each uses same semimajor axis a = 120 -->
  <!-- Panel centers: (160,270), (480,270), (800,270) -->
  <!-- Panel 1: e = 0.0, b = 120, focus offset c = e*a = 0 -->
  <g>
    <text x="160" y="132" class="panel-title" text-anchor="middle">e = 0 (circle)</text>

    <ellipse cx="160" cy="270" rx="120" ry="120" fill="none" stroke="var(--teal)" stroke-width="var(--orbitW)" filter="url(#softGlow)"/>

    <!-- major axis guide -->
    <line x1="40" y1="270" x2="280" y2="270" stroke="var(--violet)" stroke-width="var(--guideW)" class="dash" opacity="0.9"/>

    <!-- center marker -->
    <line x1="152" y1="270" x2="168" y2="270" stroke="var(--muted)" stroke-width="2"/>
    <line x1="160" y1="262" x2="160" y2="278" stroke="var(--muted)" stroke-width="2"/>
    <text x="160" y="294" class="small" text-anchor="middle">center</text>

    <!-- foci coincide -->
    <circle cx="160" cy="270" r="16" fill="var(--sun)" filter="url(#softGlow)"/>
    <text x="160" y="238" class="label" text-anchor="middle">foci coincide</text>
  </g>

  <!-- Panel 2: e = 0.3, b = a*sqrt(1-e^2) ≈ 114.47, c = 36 -->
  <g>
    <text x="480" y="132" class="panel-title" text-anchor="middle">e = 0.3 (mild ellipse)</text>

    <ellipse cx="480" cy="270" rx="120" ry="114.5" fill="none" stroke="var(--teal)" stroke-width="var(--orbitW)" filter="url(#softGlow)"/>
    <line x1="360" y1="270" x2="600" y2="270" stroke="var(--violet)" stroke-width="var(--guideW)" class="dash" opacity="0.85"/>

    <!-- center marker -->
    <line x1="472" y1="270" x2="488" y2="270" stroke="var(--muted)" stroke-width="2"/>
    <line x1="480" y1="262" x2="480" y2="278" stroke="var(--muted)" stroke-width="2"/>
    <text x="480" y="294" class="small" text-anchor="middle">center</text>

    <!-- foci -->
    <circle cx="444" cy="270" r="14" fill="var(--sun)" filter="url(#softGlow)"/>
    <circle cx="516" cy="270" r="8" fill="var(--violet)" opacity="0.95"/>
    <text x="444" y="238" class="label" text-anchor="middle">Sun</text>
    <text x="516" y="238" class="small" text-anchor="middle">empty focus</text>
  </g>

  <!-- Panel 3: e = 0.6, b = a*sqrt(1-e^2) = 96, c = 72 -->
  <g>
    <text x="800" y="132" class="panel-title" text-anchor="middle">e = 0.6 (elongated)</text>

    <ellipse cx="800" cy="270" rx="120" ry="96" fill="none" stroke="var(--teal)" stroke-width="var(--orbitW)" filter="url(#softGlow)"/>
    <line x1="680" y1="270" x2="920" y2="270" stroke="var(--violet)" stroke-width="var(--guideW)" class="dash" opacity="0.85"/>

    <!-- center marker -->
    <line x1="792" y1="270" x2="808" y2="270" stroke="var(--muted)" stroke-width="2"/>
    <line x1="800" y1="262" x2="800" y2="278" stroke="var(--muted)" stroke-width="2"/>
    <text x="800" y="294" class="small" text-anchor="middle">center</text>

    <!-- foci -->
    <circle cx="728" cy="270" r="14" fill="var(--sun)" filter="url(#softGlow)"/>
    <circle cx="872" cy="270" r="8" fill="var(--violet)" opacity="0.95"/>
    <text x="728" y="238" class="label" text-anchor="middle">Sun</text>
    <text x="872" y="238" class="small" text-anchor="middle">empty focus</text>
  </g>

  <!-- Bottom takeaway box -->
  <g transform="translate(48,440)">
    <rect x="0" y="0" width="864" height="70" rx="14" fill="#121425" stroke="var(--violet)" stroke-width="1.5" opacity="0.96"/>
    <text x="18" y="30" class="label">
      What to notice: for the <tspan fill="var(--pink)" font-weight="800">same semimajor axis</tspan>,
      larger <tspan fill="var(--pink)" font-weight="800">e</tspan> means a more stretched ellipse and a bigger focus offset.
    </text>
    <text x="18" y="56" class="small">
      In every case, the Sun is at a focus (not at the center)—that’s the defining feature of Kepler’s First Law.
    </text>
  </g>
</svg>

