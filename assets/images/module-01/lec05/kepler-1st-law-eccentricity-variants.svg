<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Eccentricity Controls Orbit Shape</title>
  <desc>Three panels showing how eccentricity controls orbit shape. e=0 (circle), e=0.3 (mild ellipse), e=0.6 (elongated ellipse). Same semimajor axis a=110.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; font-size: 14px; }
      .title-main { font-size: 18px; font-weight: 600; fill: #1a3a52; }
      .title-sub { font-size: 15px; fill: #5c6470; }
      .panel-title { font-size: 13px; font-weight: 600; fill: #1a3a52; }
      .label-sm { font-size: 12px; fill: #5c6470; }
      .label-tiny { font-size: 13px; fill: #5c6470; }
      .text-gold { fill: #c9a66b; }
      .text-mauve { fill: #8b7a8b; }
      .callout-text { font-size: 13px; fill: #1a3a52; font-weight: 500; }
    </style>

    <filter id="glow-sun">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Main title -->
  <text x="480" y="38" text-anchor="middle" class="title-main">How Eccentricity Controls Orbit Shape</text>
  <text x="480" y="56" text-anchor="middle" class="title-sub">Same semimajor axis (a = 110), different eccentricities</text>

  <!-- ===== PANEL 1: e = 0 (Perfect Circle) ===== -->
  <g id="panel-e0">
    <!-- Panel background -->
    <rect x="40" y="100" width="240" height="280" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="3" opacity="0.4"/>

    <!-- Panel title -->
    <text x="160" y="125" text-anchor="middle" class="panel-title">e = 0 (Circle)</text>

    <!-- Circle (teal) -->
    <circle cx="160" cy="240" r="110" fill="none" stroke="#6b9fa1" stroke-width="2.5"/>

    <!-- Center/Sun position (both foci coincide) -->
    <circle cx="160" cy="240" r="9" fill="#c9a66b" filter="url(#glow-sun)"/>
    <text x="160" y="295" text-anchor="middle" class="label-sm text-gold" font-weight="600">Sun</text>

    <!-- Description -->
    <text x="160" y="330" text-anchor="middle" class="label-tiny">(Foci coincide at center)</text>

    <!-- Planet dot on circle -->
    <circle cx="160" cy="130" r="4" fill="#1a3a52"/>
  </g>

  <!-- ===== PANEL 2: e = 0.3 (Mild Ellipse) ===== -->
  <g id="panel-e03">
    <!-- Panel background -->
    <rect x="360" y="100" width="240" height="280" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="3" opacity="0.4"/>

    <!-- Panel title -->
    <text x="480" y="125" text-anchor="middle" class="panel-title">e = 0.3 (Mild Ellipse)</text>

    <!-- Ellipse: a=110, b=110*√(1-0.09)=110*√0.91≈105, c=33 -->
    <ellipse cx="480" cy="240" rx="110" ry="105" fill="none" stroke="#6b9fa1" stroke-width="2.5"/>

    <!-- Major axis guide (dashed, faint) -->
    <line x1="370" y1="240" x2="590" y2="240" stroke="#ccc7c0" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- Left focus (Sun): 480-33=447 -->
    <circle cx="447" cy="240" r="8" fill="#c9a66b" filter="url(#glow-sun)"/>
    <text x="447" y="280" text-anchor="middle" class="label-tiny text-gold" font-weight="600">Sun</text>

    <!-- Right focus (empty): 480+33=513 -->
    <circle cx="513" cy="240" r="5" fill="none" stroke="#8b7a8b" stroke-width="2"/>
    <text x="513" y="280" text-anchor="middle" class="label-tiny text-mauve">empty</text>

    <!-- Center mark -->
    <circle cx="480" cy="240" r="2" fill="#1a3a52" opacity="0.5"/>

    <!-- Description -->
    <text x="480" y="330" text-anchor="middle" class="label-tiny">Offset increases</text>

    <!-- Planet dot on ellipse -->
    <circle cx="480" cy="135" r="4" fill="#1a3a52"/>
  </g>

  <!-- ===== PANEL 3: e = 0.6 (Elongated Ellipse) ===== -->
  <g id="panel-e06">
    <!-- Panel background -->
    <rect x="680" y="100" width="240" height="280" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="3" opacity="0.4"/>

    <!-- Panel title -->
    <text x="800" y="125" text-anchor="middle" class="panel-title">e = 0.6 (Elongated)</text>

    <!-- Ellipse: a=110, b=110*√(1-0.36)=110*√0.64=88, c=66 -->
    <ellipse cx="800" cy="240" rx="110" ry="88" fill="none" stroke="#6b9fa1" stroke-width="2.5"/>

    <!-- Major axis guide (dashed, faint) -->
    <line x1="690" y1="240" x2="910" y2="240" stroke="#ccc7c0" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

    <!-- Left focus (Sun): 800-66=734 -->
    <circle cx="734" cy="240" r="8" fill="#c9a66b" filter="url(#glow-sun)"/>
    <text x="734" y="280" text-anchor="middle" class="label-tiny text-gold" font-weight="600">Sun</text>

    <!-- Right focus (empty): 800+66=866 -->
    <circle cx="866" cy="240" r="5" fill="none" stroke="#8b7a8b" stroke-width="2"/>
    <text x="866" y="280" text-anchor="middle" class="label-tiny text-mauve">empty</text>

    <!-- Center mark -->
    <circle cx="800" cy="240" r="2" fill="#1a3a52" opacity="0.5"/>

    <!-- Description -->
    <text x="800" y="330" text-anchor="middle" class="label-tiny">Sun far from center</text>

    <!-- Planet dot on ellipse -->
    <circle cx="800" cy="152" r="4" fill="#1a3a52"/>
  </g>

  <!-- Bottom callout panel -->
  <rect x="80" y="420" width="800" height="90" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1.5" rx="4"/>

  <text x="480" y="448" text-anchor="middle" class="callout-text" font-weight="600">The Mathematics of Eccentricity</text>

  <text x="100" y="472" class="label-sm">• All three orbits have the same semimajor axis: a = 110</text>
  <text x="100" y="489" class="label-sm">• As e increases (0 → 0.3 → 0.6), the orbit stretches along the major axis</text>
  <text x="100" y="506" class="label-sm">• The Sun's distance from the ellipse center is given by c = ae</text>

</svg>
