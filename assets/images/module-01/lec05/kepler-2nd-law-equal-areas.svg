<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Kepler’s Second Law: Equal areas in equal times</title>
  <desc id="desc">An elliptical orbit with the Sun at one focus. Two shaded regions of equal area are swept out by the Sun-to-planet line during equal time intervals: near perihelion the planet travels a longer arc (faster), and near aphelion it travels a shorter arc (slower).</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --grid:#1a1c28;

        /* Jewel Aurora palette */
        --teal:#028391;
        --magenta:#BE5A83;
        --lavender:#7077A1;

        --sun:#f6d55c;
        --orbitW:6;
        --axisW:2.5;
      }
      text{ font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: var(--fg); }
      .small{ font-size: 18px; letter-spacing: 0.2px; }
      .label{ font-size: 20px; font-weight: 650; }
      .title{ font-size: 28px; font-weight: 750; }
      .subtitle{ font-size: 18px; fill: var(--muted); }
      .muted{ fill: var(--muted); }
      .dash{ stroke-dasharray: 10 10; }
    </style>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowTeal" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="var(--teal)"/>
    </marker>
    <marker id="arrowMagenta" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="var(--magenta)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.25">
    <path d="M0 90 H960 M0 180 H960 M0 270 H960 M0 360 H960 M0 450 H960" stroke="var(--grid)" stroke-width="1"/>
    <path d="M120 0 V540 M240 0 V540 M360 0 V540 M480 0 V540 M600 0 V540 M720 0 V540 M840 0 V540" stroke="var(--grid)" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="48" y="56" class="title">Kepler’s Second Law</text>
  <text x="48" y="82" class="subtitle">Equal areas are swept out in equal times (Δt).</text>

  <!-- Diagram geometry (center at 480,300; a=320; b=180; e=0.4; Sun focus at x=352) -->
  <!-- Orbit -->
  <ellipse cx="480" cy="300" rx="320" ry="180" fill="none" stroke="var(--teal)" stroke-width="var(--orbitW)" filter="url(#softGlow)"/>

  <!-- Major axis (dashed, for orientation only) -->
  <line x1="160" y1="300" x2="800" y2="300" stroke="var(--lavender)" stroke-width="var(--axisW)" class="dash" opacity="0.65"/>

  <!-- Sun at focus -->
  <circle cx="352" cy="300" r="18" fill="var(--sun)" filter="url(#softGlow)"/>
  <circle cx="352" cy="300" r="24" fill="none" stroke="var(--sun)" stroke-width="2" opacity="0.55"/>
  <text x="352" y="336" class="small muted" text-anchor="middle">Sun (focus)</text>

  <!-- Equal-area wedges (constructed to have equal area for this diagram) -->
  <!-- Parameters: ellipse centered at (480,300), rx=320, ry=180; e=0.4; alpha=0.9 rad; beta≈0.422603739 rad -->
  <!-- Perihelion-side wedge: longer arc (faster) -->
  <path d="M 352 300 L 281.085 410.999 A 320 180 0 0 1 281.085 129.001 Z"
        fill="var(--magenta)" opacity="0.22" stroke="var(--magenta)" stroke-width="2"/>
  <!-- Aphelion-side wedge: shorter arc (slower) -->
  <path d="M 352 300 L 771.848 196.175 A 320 180 0 0 1 771.848 343.825 Z"
        fill="var(--lavender)" opacity="0.22" stroke="var(--lavender)" stroke-width="2"/>

  <!-- Radius vectors (edges of the wedges) -->
  <line x1="352" y1="300" x2="281.085" y2="410.999" stroke="var(--magenta)" stroke-width="3" opacity="0.95"/>
  <line x1="352" y1="300" x2="281.085" y2="129.001" stroke="var(--magenta)" stroke-width="3" opacity="0.95"/>
  <line x1="352" y1="300" x2="771.848" y2="196.175" stroke="var(--lavender)" stroke-width="3" opacity="0.95"/>
  <line x1="352" y1="300" x2="771.848" y2="343.825" stroke="var(--lavender)" stroke-width="3" opacity="0.95"/>

  <!-- Planet positions at the ends of each time interval -->
  <circle cx="281.085" cy="410.999" r="6.5" fill="var(--fg)" opacity="0.92"/>
  <circle cx="281.085" cy="129.001" r="6.5" fill="var(--fg)" opacity="0.92"/>
  <circle cx="771.848" cy="196.175" r="6.5" fill="var(--fg)" opacity="0.92"/>
  <circle cx="771.848" cy="343.825" r="6.5" fill="var(--fg)" opacity="0.92"/>

  <!-- Motion arrows: show longer arc near perihelion and shorter arc near aphelion -->
  <path d="M 245 382 A 320 180 0 0 1 245 158" fill="none" stroke="var(--magenta)" stroke-width="4" marker-end="url(#arrowMagenta)" opacity="0.95"/>
  <path d="M 800 262 A 320 180 0 0 1 800 336" fill="none" stroke="var(--lavender)" stroke-width="4" marker-end="url(#arrowTeal)" opacity="0.95"/>

  <!-- Labels -->
  <text x="188" y="134" class="label" fill="var(--magenta)">Area 1</text>
  <text x="188" y="160" class="small muted">same Δt</text>

  <text x="804" y="206" class="label" fill="var(--lavender)" text-anchor="end">Area 2</text>
  <text x="804" y="232" class="small muted" text-anchor="end">same Δt</text>

  <path d="M 210 108 C 260 84, 320 90, 352 118" fill="none" stroke="var(--muted)" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="48" y="114" class="label">Equal areas: Area 1 = Area 2</text>

  <text x="150" y="410" class="label" fill="var(--magenta)">faster here</text>
  <text x="150" y="434" class="small muted">longer arc in the same time</text>

  <text x="814" y="396" class="label" fill="var(--lavender)" text-anchor="end">slower here</text>
  <text x="814" y="420" class="small muted" text-anchor="end">shorter arc in the same time</text>

  <!-- Key takeaway -->
  <g transform="translate(48,470)">
    <rect x="0" y="0" width="864" height="54" rx="12" fill="#121425" stroke="var(--lavender)" stroke-width="1.5" opacity="0.95"/>
    <text x="18" y="33" class="label">
      Kepler II is about <tspan fill="var(--magenta)" font-weight="800">area</tspan>, not distance: equal swept area → speed changes along the orbit.
    </text>
  </g>
</svg>

