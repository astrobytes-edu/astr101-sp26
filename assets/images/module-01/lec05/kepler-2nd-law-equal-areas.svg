<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Kepler’s Second Law: Equal areas in equal times</title>
  <desc id="desc">An elliptical orbit with the Sun at one focus. Two shaded regions of equal area are swept out by the Sun-to-planet line during equal time intervals: near perihelion the planet travels a longer arc (faster), and near aphelion it travels a shorter arc (slower).</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --panel:#13162a;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --grid:#1a1c28;

        /* Jewel Aurora accents */
        --teal:#028391;
        --pink:#BE5A83;
        --violet:#7077A1;

        --sun:#f6d55c;
        --orbitW:5;
        --axisW:2.5;
      }
      text{ font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: var(--fg); }
      .small{ font-size: 18px; letter-spacing: 0.2px; }
      .label{ font-size: 20px; font-weight: 650; }
      .title{ font-size: 28px; font-weight: 750; }
      .subtitle{ font-size: 18px; fill: var(--muted); }
      .muted{ fill: var(--muted); }
      .dash{ stroke-dasharray: 10 10; }
      .panel{ fill: var(--panel); stroke: var(--violet); stroke-width: 1.5; opacity: 0.96; }
      .outline{ paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
    </style>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--teal)"/>
    </marker>
    <marker id="arrowPink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pink)"/>
    </marker>
    <marker id="arrowViolet" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/>
    </marker>

    <!-- Clip highlighted wedges so fills never spill outside the orbit stroke. -->
    <clipPath id="orbitClip">
      <ellipse cx="480" cy="300" rx="320" ry="180"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.25">
    <path d="M0 90 H960 M0 180 H960 M0 270 H960 M0 360 H960 M0 450 H960" stroke="var(--grid)" stroke-width="1"/>
    <path d="M120 0 V540 M240 0 V540 M360 0 V540 M480 0 V540 M600 0 V540 M720 0 V540 M840 0 V540" stroke="var(--grid)" stroke-width="1"/>
  </g>

  <!-- Title -->
  <text x="48" y="56" class="title">Kepler’s Second Law</text>
  <text x="48" y="82" class="subtitle">Equal areas are swept out in equal times (Δt).</text>

  <!-- Diagram geometry (center at 480,300; a=320; b=180; e=0.4; Sun focus at x=352) -->
  <!-- Orbit -->
  <ellipse cx="480" cy="300" rx="320" ry="180" fill="none" stroke="var(--teal)" stroke-width="var(--orbitW)" filter="url(#softGlow)"/>

  <!-- Major axis (dashed, for orientation only) -->
  <line x1="160" y1="300" x2="800" y2="300" stroke="var(--violet)" stroke-width="var(--axisW)" class="dash" opacity="0.65"/>

  <!-- Sun at focus -->
  <circle cx="352" cy="300" r="18" fill="var(--sun)" filter="url(#softGlow)"/>
  <circle cx="352" cy="300" r="24" fill="none" stroke="var(--sun)" stroke-width="2" opacity="0.55"/>
  <text x="352" y="336" class="small muted outline" text-anchor="middle">Sun (focus)</text>

  <!-- Equal-area wedges (constructed to have equal area for this diagram) -->
  <!-- Parameters: ellipse centered at (480,300), rx=320, ry=180; e=0.4; alpha=0.9 rad; beta≈0.422603739 rad -->
  <!-- Perihelion-side wedge: longer arc (faster) -->
  <g clip-path="url(#orbitClip)">
    <path d="M 352 300 L 281.085 440.999 A 320 180 0 0 1 281.085 159.001 Z"
          fill="var(--pink)" opacity="0.22" stroke="var(--pink)" stroke-width="2"/>
    <!-- Aphelion-side wedge: shorter arc (slower) -->
    <path d="M 352 300 L 771.847 226.174 A 320 180 0 0 1 771.847 373.826 Z"
          fill="var(--violet)" opacity="0.22" stroke="var(--violet)" stroke-width="2"/>
  </g>

  <!-- Radius vectors (edges of the wedges) -->
  <line x1="352" y1="300" x2="281.085" y2="440.999" stroke="var(--pink)" stroke-width="3" opacity="0.95"/>
  <line x1="352" y1="300" x2="281.085" y2="159.001" stroke="var(--pink)" stroke-width="3" opacity="0.95"/>
  <line x1="352" y1="300" x2="771.847" y2="226.174" stroke="var(--violet)" stroke-width="3" opacity="0.95"/>
  <line x1="352" y1="300" x2="771.847" y2="373.826" stroke="var(--violet)" stroke-width="3" opacity="0.95"/>

  <!-- Planet positions at the ends of each time interval -->
  <circle cx="281.085" cy="440.999" r="6.5" fill="var(--fg)" opacity="0.92"/>
  <circle cx="281.085" cy="159.001" r="6.5" fill="var(--fg)" opacity="0.92"/>
  <circle cx="771.847" cy="226.174" r="6.5" fill="var(--fg)" opacity="0.92"/>
  <circle cx="771.847" cy="373.826" r="6.5" fill="var(--fg)" opacity="0.92"/>

  <!-- Motion arrows: show longer arc near perihelion and shorter arc near aphelion -->
  <path d="M 281.085 440.999 A 320 180 0 0 1 281.085 159.001" fill="none" stroke="var(--pink)" stroke-width="3.5" marker-end="url(#arrowPink)" opacity="0.95"/>
  <path d="M 771.847 226.174 A 320 180 0 0 1 771.847 373.826" fill="none" stroke="var(--violet)" stroke-width="3.5" marker-end="url(#arrowViolet)" opacity="0.95"/>

  <!-- Labels -->
  <text x="168" y="126" class="label outline" fill="var(--pink)">Area 1</text>
  <text x="168" y="152" class="small muted outline">same Δt</text>

  <text x="860" y="214" class="label outline" fill="var(--violet)" text-anchor="end">Area 2</text>
  <text x="860" y="240" class="small muted outline" text-anchor="end">same Δt</text>

  <!-- (No extra “Area 1 = Area 2” callout: the subtitle states the law, and the wedge labels do the comparing.) -->

  <text x="150" y="410" class="label outline" fill="var(--pink)">faster here</text>
  <text x="150" y="434" class="small muted outline">longer arc in the same time</text>

  <text x="814" y="396" class="label outline" fill="var(--violet)" text-anchor="end">slower here</text>
  <text x="814" y="420" class="small muted outline" text-anchor="end">shorter arc in the same time</text>

  <!-- Key takeaway -->
  <g transform="translate(48,470)">
    <rect x="0" y="0" width="864" height="70" rx="12" class="panel"/>
    <text x="18" y="30" class="label">
      Key idea: Kepler II is about <tspan fill="var(--pink)" font-weight="800">area</tspan>, not distance.
    </text>
    <text x="18" y="54" class="small muted">
      Equal swept area in the same Δt → speed changes along the orbit.
    </text>
  </g>
</svg>
