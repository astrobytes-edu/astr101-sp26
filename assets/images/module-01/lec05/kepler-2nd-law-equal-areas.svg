<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Kepler's Second Law</title>
  <desc id="desc">Elliptical orbit with two shaded wedges of equal area: a wide, short-radius wedge near perihelion (gold) and a narrow, long-radius wedge near aphelion (mauve). Demonstrates that a planet sweeps out equal areas in equal intervals of time.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title-main  { font-size: 22px; font-weight: 650; fill: #1a3a52; }
      .title-sub   { font-size: 15px; fill: #5c6470; }
      .label       { font-size: 13px; fill: #5c6470; }
      .label-bold  { font-size: 14px; font-weight: 600; fill: #1a3a52; }
      .gold-label  { font-size: 13px; font-weight: 600; fill: #c9a66b; }
      .mauve-label { font-size: 13px; font-weight: 600; fill: #8b7a8b; }
      .insight     { font-size: 13px; fill: #1a3a52; }
      .insight-ital{ font-size: 12px; fill: #5c6470; font-style: italic; }
      .math        { font-family: "Times New Roman", Georgia, "Computer Modern", serif; font-style: italic; }
      .math-sub    { font-family: "Times New Roman", Georgia, "Computer Modern", serif; font-style: normal; font-size: 0.75em; }
      .legend-text { font-size: 12px; fill: #5c6470; }
      .legend-math { font-family: "Times New Roman", Georgia, "Computer Modern", serif; font-style: italic; font-size: 13px; fill: #1a3a52; }
    </style>

    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c9a66b"/>
    </marker>
    <marker id="arrowMauve" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b7a8b"/>
    </marker>

    <filter id="glow-sun">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" class="title-main">Kepler's Second Law</text>
  <text x="480" y="60" text-anchor="middle" class="title-sub">A planet sweeps equal areas in equal intervals of time</text>

  <!-- ============================================================ -->
  <!-- ORBIT: cx=420 cy=235 rx=200 ry=160  e=0.55  Sun at (310,235) -->
  <!-- ============================================================ -->

  <!-- Perihelion wedge (gold) — wide angle, short radii -->
  <!-- ±35° parametric from perihelion, area ≈ 9453 px² -->
  <path d="M 310 235 L 256.2 143.2 A 200 160 0 0 0 256.2 326.8 Z"
        fill="#c9a66b" fill-opacity="0.22" stroke="#c9a66b" stroke-width="1.8"/>

  <!-- Aphelion wedge (mauve) — narrow angle, long radii -->
  <!-- ±10.94° parametric from aphelion, area ≈ 9450 px² -->
  <path d="M 310 235 L 616.4 204.6 A 200 160 0 0 1 616.4 265.4 Z"
        fill="#8b7a8b" fill-opacity="0.22" stroke="#8b7a8b" stroke-width="1.8"/>

  <!-- Orbit ellipse (drawn OVER wedges so stroke is clean) -->
  <ellipse cx="420" cy="235" rx="200" ry="160" fill="none" stroke="#6b9fa1" stroke-width="2.5"/>

  <!-- Major axis guide (faint dashed) -->
  <line x1="218" y1="235" x2="622" y2="235" stroke="#d4d0cc" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Sun at left focus -->
  <circle cx="310" cy="235" r="11" fill="#d4a843" filter="url(#glow-sun)"/>
  <text x="310" y="265" text-anchor="middle" class="gold-label">Sun</text>

  <!-- ── Perihelion labels ── -->

  <!-- Area 1 label (inside the wide wedge) -->
  <text x="258" y="238" text-anchor="middle" class="gold-label" font-size="14px">Area 1</text>

  <!-- Planet dots at wedge endpoints -->
  <circle cx="256.2" cy="143.2" r="5" fill="#1a3a52"/>
  <circle cx="256.2" cy="326.8" r="5" fill="#1a3a52"/>

  <!-- Speed arrow (tangent at upper perihelion point, pointing up-right = fast) -->
  <line x1="256" y1="143" x2="280" y2="115" stroke="#c9a66b" stroke-width="2.5" marker-end="url(#arrowGold)"/>
  <text x="290" y="108" class="gold-label">faster</text>

  <!-- Arc annotation: perihelion side -->
  <text x="175" y="230" text-anchor="middle" class="label" fill="#c9a66b">longer arc</text>
  <text x="175" y="246" text-anchor="middle" class="label" fill="#c9a66b">equal time</text>

  <!-- ── Aphelion labels ── -->

  <!-- Area 2 label (inside the narrow wedge) -->
  <text x="530" y="238" text-anchor="middle" class="mauve-label" font-size="14px">Area 2</text>

  <!-- Planet dots at wedge endpoints -->
  <circle cx="616.4" cy="204.6" r="5" fill="#1a3a52"/>
  <circle cx="616.4" cy="265.4" r="5" fill="#1a3a52"/>

  <!-- Speed arrow (tangent at upper aphelion point, small = slow) -->
  <line x1="616" y1="205" x2="622" y2="228" stroke="#8b7a8b" stroke-width="2.5" marker-end="url(#arrowMauve)"/>
  <text x="643" y="200" class="mauve-label">slower</text>

  <!-- Arc annotation: aphelion side -->
  <text x="700" y="230" text-anchor="middle" class="label" fill="#8b7a8b">shorter arc</text>
  <text x="700" y="246" text-anchor="middle" class="label" fill="#8b7a8b">equal time</text>

  <!-- ── Distance annotations along major axis ── -->

  <!-- r_p: Sun to perihelion (brace-style with label above) -->
  <!-- Sun at x=310, perihelion at x=220. Midpoint = 265 -->
  <line x1="310" y1="250" x2="310" y2="258" stroke="#c9a66b" stroke-width="1.2"/>
  <line x1="220" y1="250" x2="220" y2="258" stroke="#c9a66b" stroke-width="1.2"/>
  <line x1="220" y1="256" x2="310" y2="256" stroke="#c9a66b" stroke-width="1.2"/>
  <text x="265" y="275" text-anchor="middle" fill="#c9a66b" font-size="15px">
    <tspan class="math">r</tspan><tspan class="math-sub" dy="4" dx="-1">p</tspan>
  </text>

  <!-- r_a: Sun to aphelion (brace-style with label below) -->
  <!-- Sun at x=310, aphelion at x=620. Midpoint = 465 -->
  <line x1="310" y1="250" x2="310" y2="258" stroke="#8b7a8b" stroke-width="1.2"/>
  <line x1="620" y1="250" x2="620" y2="258" stroke="#8b7a8b" stroke-width="1.2"/>
  <line x1="310" y1="256" x2="620" y2="256" stroke="#8b7a8b" stroke-width="1.2"/>
  <text x="465" y="275" text-anchor="middle" fill="#8b7a8b" font-size="15px">
    <tspan class="math">r</tspan><tspan class="math-sub" dy="4" dx="-1">a</tspan>
  </text>

  <!-- ============================================================ -->
  <!-- BOTTOM SECTION (below orbit, y > 400)                        -->
  <!-- ============================================================ -->

  <!-- Equal-area statement -->
  <text x="480" y="418" text-anchor="middle" class="label-bold" font-size="16px">Area 1 = Area 2</text>
  <text x="480" y="438" text-anchor="middle" class="label">Different arc lengths, swept in equal intervals of time</text>

  <!-- Legend + Key Insight box -->
  <rect x="120" y="455" width="720" height="72" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="4"/>

  <!-- Legend items -->
  <text x="145" y="478" class="legend-math" font-size="14px">
    <tspan class="math">r</tspan><tspan class="math-sub" dy="3" dx="-1">p</tspan>
  </text>
  <text x="165" y="478" class="legend-text"> = perihelion distance (closest approach)</text>

  <text x="145" y="498" class="legend-math" font-size="14px">
    <tspan class="math">r</tspan><tspan class="math-sub" dy="3" dx="-1">a</tspan>
  </text>
  <text x="165" y="498" class="legend-text"> = aphelion distance (farthest point)</text>

  <!-- Vertical separator -->
  <line x1="475" y1="465" x2="475" y2="520" stroke="#d4d0cc" stroke-width="1"/>

  <!-- Key Insight -->
  <text x="495" y="478" class="label-bold">Key Insight</text>
  <text x="495" y="498" class="insight" font-size="12px">Closer to the Sun → stronger gravity → faster orbital speed.</text>
  <text x="495" y="515" class="insight-ital">Kepler's laws link orbital geometry to dynamics.</text>

</svg>
