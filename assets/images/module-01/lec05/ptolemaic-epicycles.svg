<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Ptolemaic Epicycles</title>
  <desc>Ptolemy's model with Earth at center, deferent circle, epicycle, and numbered planet positions showing retrograde motion</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; font-size: 14px; }
      .label-title { font-size: 18px; font-weight: 600; fill: #1a3a52; }
      .label-sm { font-size: 13px; fill: #5c6470; }
      .label-emphasis { font-size: 13px; font-weight: 500; fill: #1a3a52; }
      .insight-text { font-size: 14px; fill: #1a3a52; line-height: 1.4; }
      .muted { fill: #5c6470; }
    </style>

    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 3 L0 6 Z" fill="#6b9fa1"/>
    </marker>

    <marker id="arrowMauve" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 3 L0 6 Z" fill="#8b7a8b"/>
    </marker>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main diagram area: left side of canvas -->
  <rect x="20" y="20" width="600" height="500" fill="#ffffff" stroke="#d4d0cc" stroke-width="1" rx="4"/>

  <!-- Title -->
  <text x="320" y="50" text-anchor="middle" class="label-title">Ptolemaic Epicycles</text>
  <text x="320" y="68" text-anchor="middle" class="label-sm">Circles on circles explained retrograde motion</text>

  <!-- Coordinate system center: Earth at (320, 270) -->

  <!-- Deferent circle (large dashed teal) - radius 140 -->
  <circle cx="320" cy="270" r="140" fill="none" stroke="#6b9fa1" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- Earth at center -->
  <circle cx="320" cy="270" r="6" fill="#1a3a52" filter="url(#glow)"/>
  <circle cx="320" cy="270" r="10" fill="none" stroke="#6b9fa1" stroke-width="1" opacity="0.3"/>
  <text x="320" y="305" text-anchor="middle" class="label-sm">Earth</text>

  <!-- Deferent label -->
  <text x="460" y="160" class="label-emphasis">Deferent</text>

  <!-- Epicycle circle (mauve) - radius 45, centered on deferent at angle 45° -->
  <!-- Center of epicycle at: 320 + 140*cos(45°), 270 + 140*sin(45°) = 320+99, 270+99 = 419, 369 -->
  <circle cx="419" cy="369" r="45" fill="none" stroke="#8b7a8b" stroke-width="2" opacity="0.7"/>

  <!-- Epicycle label -->
  <text x="475" y="375" class="label-emphasis">Epicycle</text>

  <!-- Planet positions on epicycle (5 numbered positions showing time progression) -->
  <!-- Positions at angles: 0°, 72°, 144°, 216°, 288° around epicycle -->
  <!-- Position 1: 0° (right) -->
  <circle cx="464" cy="369" r="5" fill="#c9a66b"/>
  <text x="464" y="398" text-anchor="middle" class="label-sm" fill="#c9a66b">1</text>

  <!-- Position 2: 72° -->
  <circle cx="457.5" cy="327" r="5" fill="#c9a66b"/>
  <text x="485" y="315" class="label-sm" fill="#c9a66b">2</text>

  <!-- Position 3: 144° (top-left) -->
  <circle cx="399" cy="328" r="5" fill="#c9a66b"/>
  <text x="375" y="315" class="label-sm" fill="#c9a66b">3</text>

  <!-- Position 4: 216° (bottom-left) -->
  <circle cx="375" cy="410" r="5" fill="#c9a66b"/>
  <text x="345" y="435" class="label-sm" fill="#c9a66b">4</text>

  <!-- Position 5: 288° (bottom-right) -->
  <circle cx="438" cy="414" r="5" fill="#c9a66b"/>
  <text x="460" y="440" class="label-sm" fill="#c9a66b">5</text>

  <!-- Path traced by planet (gold dashed curve showing looping retrograde pattern) -->
  <path d="M 464 369 Q 475 340 457 327 Q 440 318 399 328 Q 375 335 375 410 Q 385 430 438 414 Q 460 405 464 369"
        fill="none" stroke="#c9a66b" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.8"/>

  <!-- Motion arrows on deferent (CCW) -->
  <path d="M 460 160 Q 420 130 380 150" fill="none" stroke="#6b9fa1" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="410" y="130" class="label-sm" fill="#6b9fa1">Deferent motion</text>
  <text x="410" y="145" class="label-sm" fill="#6b9fa1">(slow, CCW)</text>

  <!-- Motion arrow on epicycle (CCW) -->
  <path d="M 440 340 Q 430 335 425 345" fill="none" stroke="#8b7a8b" stroke-width="2" marker-end="url(#arrowMauve)"/>
  <text x="415" y="315" class="label-sm" fill="#8b7a8b">Epicycle</text>
  <text x="415" y="330" class="label-sm" fill="#8b7a8b">motion (fast)</text>

  <!-- Right panel: Insight -->
  <rect x="640" y="20" width="300" height="500" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1" rx="4"/>

  <text x="790" y="50" text-anchor="middle" class="label-title">Why Epicycles Work</text>

  <rect x="660" y="90" width="260" height="320" fill="#ffffff" stroke="#d4d0cc" stroke-width="1" rx="3"/>

  <text x="680" y="115" class="insight-text" font-weight="500">The Problem:</text>
  <text x="680" y="138" class="insight-text">Planets move backward relative to stars periodically.</text>
  <text x="680" y="158" class="insight-text">This contradicts perfect circles centered on Earth.</text>

  <text x="680" y="190" class="insight-text" font-weight="500">The Solution:</text>
  <text x="680" y="213" class="insight-text">Add a second circle (epicycle) to the first (deferent).</text>
  <text x="680" y="230" class="insight-text">The planet orbits on the epicycle while the epicycle</text>
  <text x="680" y="247" class="insight-text">orbits Earth.</text>

  <text x="680" y="280" class="insight-text" font-weight="500">The Result:</text>
  <text x="680" y="297" class="insight-text">Combined motions create looping paths → retrograde motion!</text>

  <text x="680" y="330" class="insight-text" font-weight="600" fill="#8b7a8b">Ptolemy's model saved geocentrism for 1,400 years by adding circles on circles.</text>

  <text x="680" y="380" class="label-sm" font-style="italic">Positions labeled 1–5 show time sequence.</text>
  <text x="680" y="397" class="label-sm" font-style="italic">Compare to modern heliocentric view (next slide).</text>
</svg>
