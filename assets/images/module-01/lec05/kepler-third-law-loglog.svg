<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Kepler’s Third Law on a log–log plot</title>
  <desc id="desc">Log–log plot of orbital period P versus semimajor axis a for the eight planets. The points fall on a straight line; the slope (3/2) encodes the exponent in the power law.</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --panel:#13162a;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --faint:#8f92ad;
        --grid:#1a1c28;
        --grid-strong:#24263a;

        --aurora-teal:#028391;
        --aurora-teal-bright:#41A2AC;
        --aurora-teal-dim:#02626D;
        --aurora-teal-pale:#A6D4D8;

        --aurora-pink:#BE5A83;
        --aurora-pink-bright:#CE83A2;
        --aurora-pink-dim:#8E4462;
        --aurora-pink-pale:#E8C5D4;

        --aurora-violet:#7077A1;
        --aurora-violet-bright:#9499B8;
        --aurora-violet-dim:#545979;
        --aurora-violet-pale:#CDCFDE;

        --teal:var(--aurora-teal);
        --teal-bright:var(--aurora-teal-bright);
        --teal-dim:var(--aurora-teal-dim);
        --teal-pale:var(--aurora-teal-pale);

        --pink:var(--aurora-pink);
        --pink-bright:var(--aurora-pink-bright);
        --pink-dim:var(--aurora-pink-dim);
        --pink-pale:var(--aurora-pink-pale);

        --violet:var(--aurora-violet);
        --violet-bright:var(--aurora-violet-bright);
        --violet-dim:var(--aurora-violet-dim);
        --violet-pale:var(--aurora-violet-pale);
      }

      text{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        fill: var(--fg);
      }
      .label{ font-size: 22px; font-weight: 750; }
      .small{ font-size: 18px; letter-spacing: 0.2px; fill: var(--muted); }
      .tick{ font-size: 20px; fill: var(--muted); }
      .tiny{ font-size: 16px; letter-spacing: 0.2px; fill: var(--muted); }
      .outline{ paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
      .panel{ fill: var(--panel); stroke: var(--violet); stroke-width: 1.5; opacity: 0.96; }
      .math{ font-style: italic; }
    </style>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Compact (for side-by-side use): no big header/footer -->
  <g>
    <rect x="36" y="36" width="888" height="468" rx="16" class="panel"/>

    <!-- Plot area (log–log): x=[110,900], y=[110,430] -->
    <line x1="110" y1="430" x2="900" y2="430" stroke="var(--teal)" stroke-width="4"/>
    <line x1="110" y1="430" x2="110" y2="110" stroke="var(--teal)" stroke-width="4"/>

    <!-- Gridlines at common log ticks -->
    <g opacity="0.55">
      <!-- vertical -->
      <line x1="171.2" y1="110" x2="171.2" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="290.1" y1="110" x2="290.1" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="409.0" y1="110" x2="409.0" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="566.2" y1="110" x2="566.2" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="685.1" y1="110" x2="685.1" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="804.0" y1="110" x2="804.0" y2="430" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="873.6" y1="110" x2="873.6" y2="430" stroke="var(--grid)" stroke-width="1.5"/>

      <!-- horizontal -->
      <line x1="110" y1="425.3" x2="900" y2="425.3" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="384.0" x2="900" y2="384.0" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="352.8" x2="900" y2="352.8" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="321.6" x2="900" y2="321.6" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="280.4" x2="900" y2="280.4" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="249.1" x2="900" y2="249.1" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="217.9" x2="900" y2="217.9" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="176.7" x2="900" y2="176.7" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="145.5" x2="900" y2="145.5" stroke="var(--grid)" stroke-width="1.5"/>
      <line x1="110" y1="114.3" x2="900" y2="114.3" stroke="var(--grid)" stroke-width="1.5"/>
    </g>

    <!-- Tick labels -->
    <g class="tick">
      <!-- x ticks -->
      <text x="171.2" y="460" text-anchor="middle">0.5</text>
      <text x="290.1" y="460" text-anchor="middle">1</text>
      <text x="409.0" y="460" text-anchor="middle">2</text>
      <text x="566.2" y="460" text-anchor="middle">5</text>
      <text x="685.1" y="460" text-anchor="middle">10</text>
      <text x="804.0" y="460" text-anchor="middle">20</text>
      <text x="873.6" y="460" text-anchor="middle">30</text>

      <!-- y ticks -->
      <text x="90" y="429.3" text-anchor="end">0.2</text>
      <text x="90" y="388.0" text-anchor="end">0.5</text>
      <text x="90" y="356.8" text-anchor="end">1</text>
      <text x="90" y="325.6" text-anchor="end">2</text>
      <text x="90" y="284.4" text-anchor="end">5</text>
      <text x="90" y="253.1" text-anchor="end">10</text>
      <text x="90" y="221.9" text-anchor="end">20</text>
      <text x="90" y="180.7" text-anchor="end">50</text>
      <text x="90" y="149.5" text-anchor="end">100</text>
      <text x="90" y="118.3" text-anchor="end">200</text>
    </g>

    <!-- Axis labels -->
    <text x="892" y="410" class="label outline" text-anchor="end" fill="var(--muted)"><tspan class="math">a</tspan> (AU)</text>
    <text x="132" y="152" class="label outline" text-anchor="start" fill="var(--muted)"><tspan class="math">P</tspan> (years)</text>

    <!-- Best-fit line for log–log -->
    <line x1="110.0" y1="423.7" x2="900.0" y2="112.7" stroke="var(--violet)" stroke-width="4.2" opacity="0.85"/>
    <text x="692" y="160" class="label outline" fill="var(--violet)">slope = 3/2</text>

    <!-- Planet points -->
    <g>
      <circle cx="128.6" cy="416.4" r="6.5" fill="var(--pink)"/>
      <text x="144" y="421" class="tiny outline">Mercury</text>

      <circle cx="233.7" cy="375.0" r="6.5" fill="var(--pink)"/>
      <text x="248" y="379" class="tiny outline">Venus</text>

      <circle cx="290.1" cy="352.8" r="7.5" fill="var(--pink-bright)"/>
      <text x="306" y="357" class="tiny outline">Earth</text>

      <circle cx="361.9" cy="324.5" r="6.5" fill="var(--pink)"/>
      <text x="378" y="328" class="tiny outline">Mars</text>

      <circle cx="572.9" cy="241.5" r="6.5" fill="var(--pink)"/>
      <text x="588" y="245" class="tiny outline">Jupiter</text>

      <circle cx="677.0" cy="200.5" r="6.5" fill="var(--pink)"/>
      <text x="692" y="204" class="tiny outline">Saturn</text>

      <circle cx="797.0" cy="153.3" r="6.5" fill="var(--pink)"/>
      <text x="812" y="157" class="tiny outline">Uranus</text>

      <circle cx="874.1" cy="122.9" r="6.5" fill="var(--pink)"/>
      <text x="888" y="126" class="tiny outline">Neptune</text>
    </g>

    <!-- Small note -->
    <text x="132" y="196" class="small outline" fill="var(--muted)">log–log axes → straight line</text>
  </g>
</svg>

