<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Kepler's First Law</title>
  <desc>Elliptical orbit with Sun at one focus, showing perihelion, aphelion, semimajor axis, and planetary motion</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; font-size: 14px; }
      .title-main { font-size: 18px; font-weight: 600; fill: #1a3a52; }
      .title-sub { font-size: 15px; fill: #5c6470; }
      .label-sm { font-size: 12px; fill: #5c6470; }
      .label-emphasis { font-size: 13px; font-weight: 500; fill: #1a3a52; }
      .text-gold { fill: #c9a66b; }
      .text-mauve { fill: #8b7a8b; }
    </style>

    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 3 L0 6 Z" fill="#6b9fa1"/>
    </marker>

    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 3 L0 6 Z" fill="#c9a66b"/>
    </marker>

    <filter id="glow-sun">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" class="title-main">Kepler's First Law</text>
  <text x="480" y="60" text-anchor="middle" class="title-sub">Orbits are ellipses with the Sun at one focus</text>

  <!-- Ellipse parameters: a=250, e=0.4, c=100, b=√(a²-c²)=√(62500-10000)=√52500≈229 -->
  <!-- Center at (480, 280) -->
  <!-- Left focus (Sun): 480-100=380 -->
  <!-- Right focus (empty): 480+100=580 -->

  <!-- Major axis guide (dashed, faint) -->
  <line x1="230" y1="280" x2="730" y2="280" stroke="#ccc7c0" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- Ellipse orbit (teal) -->
  <ellipse cx="480" cy="280" rx="250" ry="229" fill="none" stroke="#6b9fa1" stroke-width="2.5"/>

  <!-- Center mark -->
  <circle cx="480" cy="280" r="3" fill="#1a3a52"/>
  <text x="480" y="305" text-anchor="middle" class="label-sm">center</text>

  <!-- Sun at left focus (380, 280) -->
  <circle cx="380" cy="280" r="11" fill="#c9a66b" filter="url(#glow-sun)"/>
  <text x="380" y="325" text-anchor="middle" class="label-emphasis text-gold" font-weight="600">Sun</text>
  <text x="380" y="340" text-anchor="middle" class="label-sm text-gold">(left focus)</text>

  <!-- Empty focus at right (580, 280) -->
  <circle cx="580" cy="280" r="6" fill="none" stroke="#8b7a8b" stroke-width="2"/>
  <text x="580" y="325" text-anchor="middle" class="label-sm text-mauve">Empty</text>
  <text x="580" y="340" text-anchor="middle" class="label-sm text-mauve">focus</text>

  <!-- Perihelion (leftmost, closest): x=230, y=280 -->
  <circle cx="230" cy="280" r="5" fill="#1a3a52"/>
  <text x="230" y="310" text-anchor="middle" class="label-emphasis" font-weight="600">Perihelion</text>
  <text x="230" y="325" text-anchor="middle" class="label-sm">(closest)</text>

  <!-- Aphelion (rightmost, farthest): x=730, y=280 -->
  <circle cx="730" cy="280" r="5" fill="#1a3a52"/>
  <text x="730" y="310" text-anchor="middle" class="label-emphasis" font-weight="600">Aphelion</text>
  <text x="730" y="325" text-anchor="middle" class="label-sm">(farthest)</text>

  <!-- Semimajor axis bracket (from center to aphelion) -->
  <g id="semimajor-axis">
    <!-- Line with brackets -->
    <line x1="480" y1="250" x2="730" y2="250" stroke="#c9a66b" stroke-width="2.5"/>
    <!-- Left bracket -->
    <line x1="480" y1="240" x2="480" y2="260" stroke="#c9a66b" stroke-width="2"/>
    <!-- Right bracket -->
    <line x1="730" y1="240" x2="730" y2="260" stroke="#c9a66b" stroke-width="2"/>
    <!-- Arrow to bracket -->
    <line x1="605" y1="240" x2="605" y2="215" stroke="#c9a66b" stroke-width="2" marker-end="url(#arrowGold)"/>
    <!-- Label -->
    <text x="605" y="205" text-anchor="middle" class="label-emphasis text-gold" font-weight="600">a</text>
  </g>

  <!-- Distance labels from Sun to perihelion and aphelion -->
  <g id="distances">
    <!-- Sun to perihelion distance (c+a=380 to 230 = 150, but label at focus) -->
    <line x1="380" y1="265" x2="230" y2="265" stroke="#1a3a52" stroke-width="1" opacity="0.5"/>
    <text x="305" y="258" text-anchor="middle" class="label-sm">150</text>

    <!-- Sun to aphelion distance (730-380=350) -->
    <line x1="380" y1="295" x2="730" y2="295" stroke="#1a3a52" stroke-width="1" opacity="0.5"/>
    <text x="555" y="310" text-anchor="middle" class="label-sm">350</text>
  </g>

  <!-- Planet dot on orbit (example position at top) -->
  <!-- For point at top of ellipse (480, 280-229) -->
  <circle cx="480" cy="51" r="5" fill="#1a3a52"/>

  <!-- Orbital motion arrow (CCW at bottom) -->
  <path d="M 650 380 A 250 229 0 0 1 310 380" fill="none" stroke="#6b9fa1" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="480" y="420" text-anchor="middle" class="label-sm">Direction of orbital motion (counterclockwise)</text>

  <!-- Key insight box at bottom -->
  <rect x="100" y="460" width="760" height="60" fill="#eef1f5" stroke="#d4d0cc" stroke-width="1.5" rx="4"/>
  <text x="480" y="483" text-anchor="middle" class="label-emphasis" font-weight="600">Key Insight:</text>
  <text x="480" y="500" text-anchor="middle" class="label-sm">The elliptical orbit has constant area (same total size), but the planet is closer to the Sun</text>
  <text x="480" y="513" text-anchor="middle" class="label-sm">at perihelion than at aphelion. The Sun sits at one focus, not the center.</text>
</svg>
