<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Retrograde Motion of Mars</title>
  <desc>Two-panel figure showing retrograde motion. Left: Mars path on sky showing numbered positions and retrograde loop. Right: Heliocentric view with Earth overtaking Mars.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; font-size: 14px; }
      .title-main { font-size: 18px; font-weight: 600; fill: #1a3a52; }
      .title-sub { font-size: 15px; fill: #5c6470; }
      .label-panel { font-size: 14px; font-weight: 500; fill: #1a3a52; }
      .label-sm { font-size: 12px; fill: #5c6470; }
      .label-tiny { font-size: 13px; fill: #5c6470; }
      .text-gold { fill: #c9a66b; }
      .text-mauve { fill: #8b7a8b; }
      .text-teal { fill: #6b9fa1; }
    </style>

    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 3 L0 6 Z" fill="#6b9fa1"/>
    </marker>

    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 3 L0 6 Z" fill="#c9a66b"/>
    </marker>

    <filter id="glow-sun">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Main title -->
  <text x="480" y="35" text-anchor="middle" class="title-main">Retrograde Motion of Mars</text>
  <text x="480" y="52" text-anchor="middle" class="title-sub">Earth overtaking Mars creates an apparent backward loop</text>

  <!-- Divider line between panels -->
  <line x1="480" y1="70" x2="480" y2="530" stroke="#d4d0cc" stroke-width="1.5"/>

  <!-- ===== LEFT PANEL: Sky View ===== -->
  <g id="sky-view">
    <text x="240" y="90" text-anchor="middle" class="label-panel">As Seen on the Sky</text>
    <text x="240" y="107" text-anchor="middle" class="label-sm">(against fixed stars)</text>

    <!-- Starfield background - opacity 0.7 -->
    <circle cx="140" cy="160" r="1.5" fill="#a99f99" opacity="0.7"/>
    <circle cx="180" cy="130" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="260" cy="180" r="1.5" fill="#a99f99" opacity="0.7"/>
    <circle cx="300" cy="150" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="160" cy="270" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="220" cy="310" r="1.5" fill="#a99f99" opacity="0.7"/>
    <circle cx="280" cy="280" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="230" cy="230" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="320" cy="240" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="130" cy="240" r="1.5" fill="#a99f99" opacity="0.7"/>
    <circle cx="200" cy="390" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="290" cy="360" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="270" cy="420" r="1.5" fill="#a99f99" opacity="0.7"/>
    <circle cx="150" cy="350" r="1" fill="#a99f99" opacity="0.7"/>
    <circle cx="310" cy="310" r="1" fill="#a99f99" opacity="0.7"/>

    <text x="240" y="520" text-anchor="middle" class="label-tiny" fill="#a99f99">Fixed stars (background)</text>

    <!-- Mars path: forward (teal) → backward/retrograde (gold) → forward (teal) -->
    <!-- Forward segment 1 (positions 1-2) -->
    <path d="M 160 240 Q 180 260 200 270" fill="none" stroke="#6b9fa1" stroke-width="2.5" opacity="0.8"/>

    <!-- Retrograde loop (positions 3-4-5, gold) -->
    <path d="M 200 270 Q 220 290 240 280 Q 255 240 240 210 Q 220 200 200 210 Q 190 235 200 270"
          fill="none" stroke="#c9a66b" stroke-width="3" opacity="0.9"/>

    <!-- Forward segment 2 (positions 6-7) -->
    <path d="M 240 210 Q 260 190 290 180" fill="none" stroke="#6b9fa1" stroke-width="2.5" opacity="0.8"/>

    <!-- Numbered position markers -->
    <!-- Pos 1: forward motion start -->
    <circle cx="160" cy="240" r="4" fill="white" stroke="#1a3a52" stroke-width="1.5"/>
    <text x="155" y="265" text-anchor="middle" class="label-sm" fill="#1a3a52">1</text>

    <!-- Pos 2: forward motion continues -->
    <circle cx="180" cy="260" r="4" fill="white" stroke="#1a3a52" stroke-width="1.5"/>
    <text x="175" y="285" text-anchor="middle" class="label-sm" fill="#1a3a52">2</text>

    <!-- Pos 3: retrograde begins -->
    <circle cx="200" cy="270" r="4" fill="white" stroke="#c9a66b" stroke-width="1.5"/>
    <text x="210" y="295" text-anchor="middle" class="label-sm text-gold">3</text>

    <!-- Pos 4: retrograde maximum (leftmost) -->
    <circle cx="220" cy="290" r="4" fill="white" stroke="#c9a66b" stroke-width="1.5"/>
    <text x="230" y="315" text-anchor="middle" class="label-sm text-gold">4</text>

    <!-- Pos 5: retrograde upward turn -->
    <circle cx="240" cy="250" r="4" fill="white" stroke="#c9a66b" stroke-width="1.5"/>
    <text x="250" y="270" text-anchor="middle" class="label-sm text-gold">5</text>

    <!-- Pos 6: returning to forward -->
    <circle cx="240" cy="210" r="4" fill="white" stroke="#1a3a52" stroke-width="1.5"/>
    <text x="250" y="195" text-anchor="middle" class="label-sm" fill="#1a3a52">6</text>

    <!-- Pos 7: forward motion resumes -->
    <circle cx="290" cy="180" r="4" fill="white" stroke="#1a3a52" stroke-width="1.5"/>
    <text x="305" y="165" text-anchor="middle" class="label-sm" fill="#1a3a52">7</text>

    <!-- Retrograde label moved below the loop -->
    <text x="220" y="340" text-anchor="middle" class="label-sm text-gold" font-weight="600">Retrograde</text>
    <text x="220" y="357" text-anchor="middle" class="label-sm text-gold">backward</text>
  </g>

  <!-- ===== RIGHT PANEL: Heliocentric View ===== -->
  <g id="heliocentric-view">
    <text x="720" y="90" text-anchor="middle" class="label-panel">Top-Down Heliocentric View</text>
    <text x="720" y="107" text-anchor="middle" class="label-sm">(Sun at center)</text>

    <!-- Sun at center -->
    <circle cx="720" cy="280" r="10" fill="#c9a66b" filter="url(#glow-sun)"/>
    <text x="720" y="325" text-anchor="middle" class="label-sm text-gold" font-weight="600">Sun</text>

    <!-- Earth orbit (teal circle) -->
    <circle cx="720" cy="280" r="85" fill="none" stroke="#6b9fa1" stroke-width="2" opacity="0.6"/>

    <!-- Mars orbit (mauve dashed circle, outer) -->
    <circle cx="720" cy="280" r="140" fill="none" stroke="#8b7a8b" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>

    <!-- Configuration 1: E before M, Earth approaching -->
    <!-- Earth position E1 (right of orbit) -->
    <circle cx="805" cy="280" r="5" fill="#6b9fa1"/>
    <text x="820" y="285" class="label-sm text-teal" font-weight="600">E₁</text>

    <!-- Mars position M1 (upper right, ahead of Earth) -->
    <circle cx="835" cy="215" r="6" fill="#8b7a8b"/>
    <text x="850" y="220" class="label-sm text-mauve" font-weight="600">M₁</text>

    <!-- Sight line 1 -->
    <line x1="805" y1="280" x2="835" y2="215" stroke="#1a3a52" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Configuration 2: E overtaking M -->
    <!-- Earth position E2 (top) -->
    <circle cx="720" cy="195" r="5" fill="#6b9fa1"/>
    <text x="735" y="200" class="label-sm text-teal" font-weight="600">E₂</text>

    <!-- Mars position M2 (upper right, Earth catching up) -->
    <circle cx="780" cy="155" r="6" fill="#8b7a8b"/>
    <text x="795" y="160" class="label-sm text-mauve" font-weight="600">M₂</text>

    <!-- Sight line 2 -->
    <line x1="720" y1="195" x2="780" y2="155" stroke="#1a3a52" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Configuration 3: E overtakes M (maximum retrograde) -->
    <!-- Earth position E3 (lower left) -->
    <circle cx="635" cy="280" r="5" fill="#6b9fa1"/>
    <text x="610" y="285" class="label-sm text-teal" font-weight="600">E₃</text>

    <!-- Mars position M3 (further out, overtaken by Earth) -->
    <circle cx="600" cy="360" r="6" fill="#8b7a8b"/>
    <text x="585" y="370" class="label-sm text-mauve" font-weight="600">M₃</text>

    <!-- Sight line 3 -->
    <line x1="635" y1="280" x2="600" y2="360" stroke="#1a3a52" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>

    <!-- Earth orbit arrow (CCW) -->
    <path d="M 805 280 A 85 85 0 0 1 720 195" fill="none" stroke="#6b9fa1" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
    <text x="750" y="235" class="label-tiny text-teal">Earth orbit</text>

    <!-- Mars orbit label -->
    <text x="720" y="440" text-anchor="middle" class="label-tiny text-mauve">Mars orbit (slower, outer)</text>

    <!-- Key insight -->
    <text x="720" y="480" text-anchor="middle" class="label-sm" font-weight="600">Earth catches Mars → Mars appears to drift backward</text>
  </g>
</svg>
