<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Retrograde motion is an illusion of perspective</title>
  <desc id="desc">Two-panel conceptual diagram. Left: Mars positions against background stars trace a loop, with the retrograde segment highlighted. Right: top-down view of Earth and Mars orbiting the Sun shows Earth overtaking Mars; changing lines of sight produce the apparent backward motion on the sky.</desc>

  <defs>
    <style>
      :root{
        /* Neutrals */
        --bg:#0b0b0f;
        --panel:#13162a;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --faint:#8f92ad;
        --grid:#1a1c28;
        --grid-strong:#24263a;

        /* Accent palettes (course colors) */
        --aurora-teal:#028391;
        --aurora-teal-bright:#41A2AC;
        --aurora-teal-dim:#02626D;
        --aurora-teal-pale:#A6D4D8;

        --aurora-pink:#BE5A83;
        --aurora-pink-bright:#CE83A2;
        --aurora-pink-dim:#8E4462;
        --aurora-pink-pale:#E8C5D4;

        --aurora-violet:#7077A1;
        --aurora-violet-bright:#9499B8;
        --aurora-violet-dim:#545979;
        --aurora-violet-pale:#CDCFDE;

        /* Semantic mapping */
        --teal:var(--aurora-teal);
        --teal-bright:var(--aurora-teal-bright);
        --teal-dim:var(--aurora-teal-dim);
        --teal-pale:var(--aurora-teal-pale);

        --pink:var(--aurora-pink);
        --pink-bright:var(--aurora-pink-bright);
        --pink-dim:var(--aurora-pink-dim);
        --pink-pale:var(--aurora-pink-pale);

        --violet:var(--aurora-violet);
        --violet-bright:var(--aurora-violet-bright);
        --violet-dim:var(--aurora-violet-dim);
        --violet-pale:var(--aurora-violet-pale);

        /* Constants */
        --sun:#f6d55c;
      }

      text{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        fill: var(--fg);
      }
      .title{ font-size: 28px; font-weight: 750; }
      .subtitle{ font-size: 18px; fill: var(--muted); }
      .label{ font-size: 20px; font-weight: 700; }
      .small{ font-size: 18px; letter-spacing: 0.2px; fill: var(--muted); }
      .faint{ fill: var(--faint); }
      .outline{ paint-order: stroke; stroke: var(--bg); stroke-width: 6px; stroke-linejoin: round; }
      .panel{ fill: var(--panel); stroke: var(--violet); stroke-width: 1.5; opacity: 0.96; }
      .panel-title{ font-size: 18px; font-weight: 800; fill: var(--muted); letter-spacing: 0.2px; }
      .dash{ stroke-dasharray: 10 10; }

      .stroke-teal{ stroke: var(--teal); }
      .stroke-pink{ stroke: var(--pink); }
      .stroke-violet{ stroke: var(--violet); }
    </style>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--teal)"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pink)"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--violet)"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="var(--bg)"/>

  <!-- Header -->
  <text x="48" y="56" class="title">Retrograde motion is an illusion</text>
  <text x="48" y="82" class="subtitle">Mars never reverses its orbit — Earth passes it, and our line of sight changes.</text>

  <!-- Panels -->
  <g>
    <!-- Left: sky-view loop -->
    <rect x="48" y="110" width="430" height="340" rx="14" class="panel"/>
    <text x="70" y="146" class="panel-title">Sky view (against “fixed stars”)</text>
    <text x="70" y="172" class="small">Apparent motion only</text>

    <!-- subtle starfield -->
    <g opacity="0.75">
      <circle cx="92" cy="214" r="1.7" fill="var(--grid-strong)"/>
      <circle cx="128" cy="334" r="1.3" fill="var(--grid-strong)"/>
      <circle cx="160" cy="260" r="1.4" fill="var(--grid-strong)"/>
      <circle cx="196" cy="206" r="1.5" fill="var(--grid-strong)"/>
      <circle cx="224" cy="352" r="1.2" fill="var(--grid-strong)"/>
      <circle cx="264" cy="232" r="1.3" fill="var(--grid-strong)"/>
      <circle cx="286" cy="392" r="1.5" fill="var(--grid-strong)"/>
      <circle cx="328" cy="206" r="1.2" fill="var(--grid-strong)"/>
      <circle cx="346" cy="290" r="1.4" fill="var(--grid-strong)"/>
      <circle cx="388" cy="250" r="1.3" fill="var(--grid-strong)"/>
      <circle cx="420" cy="360" r="1.2" fill="var(--grid-strong)"/>
      <circle cx="450" cy="210" r="1.4" fill="var(--grid-strong)"/>
    </g>

    <!-- Apparent track (stylized loop) -->
    <!-- Pre-retrograde: forward -->
    <path d="M 105 370 C 175 320 245 300 320 320"
          fill="none" stroke="var(--teal)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"
          marker-end="url(#arrow-teal)"/>
    <!-- Retrograde segment: backward along the sky -->
    <path d="M 320 320 C 370 335 370 400 320 410 C 260 422 238 380 268 358 C 292 340 310 342 328 348"
          fill="none" stroke="var(--pink)" stroke-width="5" stroke-linecap="round" filter="url(#softGlow)"
          marker-end="url(#arrow-pink)"/>
    <!-- Post-retrograde: forward again -->
    <path d="M 328 348 C 360 360 396 382 440 410"
          fill="none" stroke="var(--teal)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"
          marker-end="url(#arrow-teal)"/>

    <!-- Observation points -->
    <g opacity="0.95">
      <circle cx="105" cy="370" r="5" fill="var(--fg)"/>
      <circle cx="160" cy="338" r="5" fill="var(--fg)"/>
      <circle cx="220" cy="316" r="5" fill="var(--fg)"/>
      <circle cx="280" cy="312" r="5" fill="var(--fg)"/>
      <circle cx="320" cy="320" r="5.5" fill="var(--pink)"/>
      <circle cx="318" cy="410" r="5.5" fill="var(--pink)"/>
      <circle cx="440" cy="410" r="5" fill="var(--fg)"/>
    </g>

    <text x="70" y="420" class="label outline" fill="var(--pink)">retrograde segment</text>
    <text x="70" y="444" class="small outline">apparent “backward” drift on the sky</text>

    <!-- Right: top-down geometry -->
    <rect x="502" y="110" width="410" height="340" rx="14" class="panel"/>
    <text x="524" y="146" class="panel-title">Top-down view (heliocentric geometry)</text>
    <text x="524" y="172" class="small">Earth overtakes Mars</text>

    <!-- Orbits -->
    <g>
      <circle cx="707" cy="300" r="112" fill="none" stroke="var(--teal)" stroke-width="3.5" opacity="0.95"/>
      <circle cx="707" cy="300" r="72" fill="none" stroke="var(--violet)" stroke-width="2.5" opacity="0.75" class="dash"/>

      <!-- Sun -->
      <circle cx="707" cy="300" r="14" fill="var(--sun)" filter="url(#softGlow)"/>
      <circle cx="707" cy="300" r="20" fill="none" stroke="var(--sun)" stroke-width="2" opacity="0.55"/>
      <text x="707" y="332" class="small outline" text-anchor="middle">Sun</text>

      <!-- Positions: three moments (t1, t2, t3) -->
      <!-- Earth (inner orbit) -->
      <circle cx="767" cy="270" r="5.5" fill="var(--fg)"/>
      <circle cx="777" cy="300" r="6.5" fill="var(--pink)"/>
      <circle cx="767" cy="330" r="5.5" fill="var(--fg)"/>
      <text x="790" y="272" class="small outline">E1</text>
      <text x="795" y="304" class="small outline" fill="var(--pink)">E2</text>
      <text x="790" y="336" class="small outline">E3</text>

      <!-- Mars (outer orbit) -->
      <circle cx="816" cy="262" r="5.5" fill="var(--fg)"/>
      <circle cx="819" cy="300" r="6.5" fill="var(--pink)"/>
      <circle cx="806" cy="336" r="5.5" fill="var(--fg)"/>
      <text x="832" y="264" class="small outline">M1</text>
      <text x="835" y="304" class="small outline" fill="var(--pink)">M2</text>
      <text x="820" y="342" class="small outline">M3</text>

      <!-- Motion arrows (qualitative) -->
      <path d="M 772 252 A 72 72 0 0 1 772 348" fill="none" stroke="var(--violet)" stroke-width="2.8" marker-end="url(#arrow-violet)" opacity="0.85"/>
      <path d="M 818 248 A 112 112 0 0 1 808 352" fill="none" stroke="var(--teal)" stroke-width="3.2" marker-end="url(#arrow-teal)" opacity="0.9"/>

      <!-- Lines of sight -->
      <line x1="767" y1="270" x2="816" y2="262" stroke="var(--violet)" stroke-width="2.2" opacity="0.55"/>
      <line x1="777" y1="300" x2="819" y2="300" stroke="var(--pink)" stroke-width="2.6" opacity="0.8"/>
      <line x1="767" y1="330" x2="806" y2="336" stroke="var(--violet)" stroke-width="2.2" opacity="0.55"/>

      <!-- Fixed direction cue (moved down to avoid overlapping the panel subtitle) -->
      <line x1="707" y1="206" x2="707" y2="232" stroke="var(--grid-strong)" stroke-width="2.2" marker-end="url(#arrow-violet)" opacity="0.8"/>
      <text x="707" y="198" class="small outline" text-anchor="middle">toward fixed stars</text>

      <!-- Legend -->
      <text x="872" y="196" class="small outline" text-anchor="end">E = Earth, M = Mars</text>
    </g>

    <text x="524" y="420" class="label outline">Mars always moves forward</text>
    <text x="524" y="444" class="small outline">the “backward” part comes from changing viewpoint</text>
  </g>

  <!-- Footer takeaway -->
  <g transform="translate(48,470)">
    <rect x="0" y="0" width="864" height="70" rx="12" class="panel"/>
    <text x="18" y="30" class="label">
      Key idea: retrograde is a <tspan fill="var(--pink)" font-weight="800">viewing-geometry</tspan> effect.
    </text>
    <text x="18" y="54" class="small">
      Earth overtakes Mars, so the line of sight sweeps backward across the star background for a while.
    </text>
  </g>
</svg>
