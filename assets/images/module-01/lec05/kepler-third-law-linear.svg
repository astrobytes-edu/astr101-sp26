<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Kepler's Third Law: Linear Scale</title>
  <desc>Plot of orbital period P (years) vs semi-major axis a (AU) showing the power-law relationship P = a^(3/2). Inner planets cluster near the origin. Inset zoom shows the inner four planets in detail.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .axis-label { font-size: 14px; font-weight: 500; fill: #1a3a52; }
      .tick-label { font-size: 12px; fill: #5c6470; }
      .grid-line { stroke: #ccc7c0; stroke-width: 1; }
      .axis-line { stroke: #1a3a52; stroke-width: 2; }
      .curve { fill: none; stroke: #6b9fa1; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .planet-dot { fill: #c9a66b; }
      .earth-dot { fill: #c9a66b; stroke: #1a3a52; stroke-width: 2; }
      .planet-label { font-size: 13px; fill: #5c6470; text-anchor: middle; }
      .note { font-size: 12px; fill: #5c6470; font-style: italic; }
      .inset-border { fill: none; stroke: #d4d0cc; stroke-width: 1.5; }
      .inset-bg { fill: #eef1f5; opacity: 0.85; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="30" font-size="18" font-weight="600" fill="#1a3a52" text-anchor="middle">
    Kepler's Third Law: P = a³²
  </text>

  <!-- Main plot area background -->
  <rect x="160" y="100" width="660" height="330" fill="white" stroke="#d4d0cc" stroke-width="1"/>

  <!-- Axes -->
  <line x1="160" y1="100" x2="160" y2="430" class="axis-line"/>
  <line x1="820" y1="100" x2="820" y2="430" class="axis-line"/>
  <line x1="160" y1="430" x2="820" y2="430" class="axis-line"/>
  <line x1="160" y1="100" x2="820" y2="100" class="axis-line"/>

  <!-- Vertical grid lines at a = 5, 10, 15, 20, 25, 30 -->
  <line x1="276" y1="100" x2="276" y2="430" class="grid-line"/>
  <line x1="392" y1="100" x2="392" y2="430" class="grid-line"/>
  <line x1="508" y1="100" x2="508" y2="430" class="grid-line"/>
  <line x1="624" y1="100" x2="624" y2="430" class="grid-line"/>
  <line x1="740" y1="100" x2="740" y2="430" class="grid-line"/>

  <!-- Horizontal grid lines at P = 30, 60, 90, 120, 150 -->
  <line x1="160" y1="394" x2="820" y2="394" class="grid-line"/>
  <line x1="160" y1="358" x2="820" y2="358" class="grid-line"/>
  <line x1="160" y1="322" x2="820" y2="322" class="grid-line"/>
  <line x1="160" y1="286" x2="820" y2="286" class="grid-line"/>
  <line x1="160" y1="250" x2="820" y2="250" class="grid-line"/>

  <!-- X-axis ticks and labels -->
  <line x1="276" y1="430" x2="276" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="276" y="455" class="tick-label">5</text>

  <line x1="392" y1="430" x2="392" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="392" y="455" class="tick-label">10</text>

  <line x1="508" y1="430" x2="508" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="508" y="455" class="tick-label">15</text>

  <line x1="624" y1="430" x2="624" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="624" y="455" class="tick-label">20</text>

  <line x1="740" y1="430" x2="740" y2="440" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="740" y="455" class="tick-label">25</text>

  <!-- Y-axis ticks and labels -->
  <line x1="150" y1="394" x2="160" y2="394" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="398" class="tick-label" text-anchor="end">30</text>

  <line x1="150" y1="358" x2="160" y2="358" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="362" class="tick-label" text-anchor="end">60</text>

  <line x1="150" y1="322" x2="160" y2="322" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="326" class="tick-label" text-anchor="end">90</text>

  <line x1="150" y1="286" x2="160" y2="286" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="290" class="tick-label" text-anchor="end">120</text>

  <line x1="150" y1="250" x2="160" y2="250" stroke="#1a3a52" stroke-width="1.5"/>
  <text x="145" y="254" class="tick-label" text-anchor="end">150</text>

  <!-- Axis labels -->
  <text x="490" y="500" class="axis-label" text-anchor="middle">a (AU)</text>
  <text x="90" y="265" class="axis-label" text-anchor="middle" transform="rotate(-90 90 265)">P (years)</text>

  <!-- Kepler curve: P = a^(3/2), sampled at 20 points from a=0.3 to a=35 -->
  <polyline points="
    163.4,429.6
    173.9,428.5
    185.6,427.1
    198.7,425.4
    213.3,423.3
    229.8,420.8
    248.5,417.9
    269.6,414.6
    293.6,410.8
    320.8,406.6
    351.5,401.7
    386.1,396.3
    425.0,390.0
    469.3,383.0
    519.5,375.0
    576.5,365.9
    641.0,355.6
    714.2,343.8
    798.1,330.3
    820.0,324.0
  " class="curve"/>

  <!-- Planet data points -->
  <!-- Mercury: a=0.387, P=0.241 -->
  <circle cx="172.0" cy="429.2" r="3.5" class="planet-dot"/>
  <text x="172" y="410" class="planet-label">Me</text>

  <!-- Venus: a=0.723, P=0.615 -->
  <circle cx="195.8" cy="427.9" r="3.5" class="planet-dot"/>
  <text x="195" y="410" class="planet-label">V</text>

  <!-- Earth: a=1.000, P=1.000 -->
  <circle cx="226.0" cy="426.2" r="4.5" class="earth-dot"/>
  <text x="226" y="410" class="planet-label">Earth</text>

  <!-- Mars: a=1.524, P=1.881 -->
  <circle cx="259.6" cy="423.8" r="3.5" class="planet-dot"/>
  <text x="259" y="410" class="planet-label">Ma</text>

  <!-- Jupiter: a=5.203, P=11.86 -->
  <circle cx="390.0" cy="390.0" r="4" class="planet-dot"/>
  <text x="390" y="408" class="planet-label">Jupiter</text>

  <!-- Saturn: a=9.537, P=29.46 -->
  <circle cx="542.0" cy="347.6" r="4" class="planet-dot"/>
  <text x="542" y="335" class="planet-label">Saturn</text>

  <!-- Uranus: a=19.19, P=84.01 -->
  <circle cx="704.9" cy="146.4" r="4" class="planet-dot"/>
  <text x="705" y="130" class="planet-label">Uranus</text>

  <!-- Neptune: a=30.07, P=164.8 (off scale at cy=-74.2) -->
  <!-- Removed Neptune point and added note instead -->

  <!-- Inset zoom box for inner planets -->
  <g id="inset">
    <rect x="610" y="340" width="180" height="75" class="inset-bg"/>
    <rect x="610" y="340" width="180" height="75" class="inset-border"/>

    <!-- Inset title -->
    <text x="700" y="353" font-size="12" fill="#5c6470" text-anchor="middle" font-weight="600">Inner planets</text>

    <!-- Inset axes -->
    <line x1="620" y1="410" x2="785" y2="410" stroke="#5c6470" stroke-width="1"/>
    <line x1="620" y1="365" x2="620" y2="410" stroke="#5c6470" stroke-width="1"/>

    <!-- Inset grid for a: 0-2 AU (620 to 730), P: 0-2 yr (410 to 365) -->
    <line x1="675" y1="365" x2="675" y2="410" stroke="#ccc7c0" stroke-width="0.5" opacity="0.7"/>
    <line x1="730" y1="365" x2="730" y2="410" stroke="#ccc7c0" stroke-width="0.5" opacity="0.7"/>
    <line x1="620" y1="388" x2="785" y2="388" stroke="#ccc7c0" stroke-width="0.5" opacity="0.7"/>

    <!-- Inset planet points (scaled to fit inset: a and P both 0-2) -->
    <!-- Mercury: a=0.387, P=0.241 scaled to 620-785 and 410-365 -->
    <circle cx="639.6" cy="408.0" r="2" class="planet-dot"/>

    <!-- Venus: a=0.723, P=0.615 -->
    <circle cx="656.2" cy="405.1" r="2" class="planet-dot"/>

    <!-- Earth: a=1.000, P=1.000 -->
    <circle cx="672.5" cy="403.5" r="2.5" class="earth-dot"/>

    <!-- Mars: a=1.524, P=1.881 -->
    <circle cx="698.2" cy="400.1" r="2" class="planet-dot"/>

    <!-- Inset axis labels -->
    <text x="707" y="425" font-size="10" fill="#5c6470" text-anchor="middle">a (AU)</text>
    <text x="612" y="382" font-size="10" fill="#5c6470" text-anchor="end">P</text>
  </g>

  <!-- Bottom note -->
  <text x="480" y="525" class="note" text-anchor="middle">
    Inner planets cluster near origin — log scale spreads them out
  </text>

  <!-- Neptune off-scale annotation -->
  <text x="820" y="115" class="note" text-anchor="end">Neptune (P=165 yr) off scale</text>
</svg>
