<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Energy Level Transitions</title>
  <desc>Comparison of quantized energy levels (correct) versus continuous energy (incorrect classical model).</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .panel-title { font-size: 15px; font-weight: 600; fill: #1a3a52; }
      .label-text { font-size: 13px; fill: #5c6470; }
      .axis-label { font-size: 13px; fill: #5c6470; }
      .arrow-label { font-size: 13px; fill: #1a3a52; font-weight: 500; }
    </style>
    <marker id="arrowGold" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#c9a66b"/>
    </marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#6b9fa1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Main title -->
  <text x="480" y="28" font-size="20" font-weight="600" fill="#1a3a52" text-anchor="middle">Energy Level Transitions</text>

  <!-- LEFT PANEL: Quantized Levels -->
  <g>
    <!-- Panel label -->
    <text x="230" y="35" class="panel-title" text-anchor="middle">Quantized (How Atoms Work)</text>

    <!-- Energy axis labels -->
    <text x="60" y="310" class="axis-label" text-anchor="end">lower energy</text>
    <text x="60" y="130" class="axis-label" text-anchor="end">higher energy</text>

    <!-- Ladder rungs with increasing spacing toward top (1/n² spacing) -->
    <!-- n=1 (bottom, ground state) -->
    <line x1="100" y1="400" x2="280" y2="400" stroke="#6b9fa1" stroke-width="3"/>
    
    <!-- n=2 -->
    <line x1="100" y1="310" x2="280" y2="310" stroke="#c9a66b" stroke-width="3"/>
    
    <!-- n=3 -->
    <line x1="100" y1="245" x2="280" y2="245" stroke="#6b9fa1" stroke-width="2"/>
    
    <!-- n=4 -->
    <line x1="100" y1="205" x2="280" y2="205" stroke="#6b9fa1" stroke-width="2"/>
    
    <!-- n=5 (top, ionization limit approaches) -->
    <line x1="100" y1="175" x2="280" y2="175" stroke="#6b9fa1" stroke-width="2"/>

    <!-- Electron dot on n=2 -->
    <circle cx="190" cy="310" r="5" fill="#c9a66b"/>

    <!-- ABSORB arrow (left side, upward, gold) -->
    <line x1="80" y1="340" x2="80" y2="270" stroke="#c9a66b" stroke-width="2.5" marker-end="url(#arrowGold)"/>
    <text x="35" y="310" class="arrow-label" text-anchor="middle">absorb</text>
    <text x="35" y="325" class="arrow-label" text-anchor="middle">photon</text>

    <!-- EMIT arrow (right side, downward, teal) -->
    <line x1="300" y1="280" x2="300" y2="350" stroke="#6b9fa1" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
    <text x="330" y="310" class="arrow-label" text-anchor="start">emit</text>
    <text x="330" y="325" class="arrow-label" text-anchor="start">photon</text>
  </g>

  <!-- RIGHT PANEL: Continuous (Wrong) -->
  <g>
    <!-- Panel label -->
    <text x="730" y="35" class="panel-title" text-anchor="middle">Continuous (Classical — Wrong)</text>

    <!-- Diagonal ramp (classical wrong model) -->
    <line x1="600" y1="420" x2="860" y2="140" stroke="#8b7a8b" stroke-width="3"/>

    <!-- Scattered dots (no quantization) -->
    <circle cx="620" cy="400" r="3" fill="#8b7a8b" opacity="0.6"/>
    <circle cx="660" cy="330" r="3" fill="#8b7a8b" opacity="0.6"/>
    <circle cx="710" cy="260" r="3" fill="#8b7a8b" opacity="0.6"/>
    <circle cx="760" cy="190" r="3" fill="#8b7a8b" opacity="0.6"/>
    <circle cx="800" cy="160" r="3" fill="#8b7a8b" opacity="0.6"/>

    <!-- Large X overlay -->
    <g transform="translate(730, 280)">
      <line x1="-80" y1="-80" x2="80" y2="80" stroke="#c9a66b" stroke-width="5"/>
      <line x1="-80" y1="80" x2="80" y2="-80" stroke="#c9a66b" stroke-width="5"/>
    </g>

    <!-- NOT label -->
    <text x="730" y="480" class="label-text" text-anchor="middle" fill="#c75050" font-weight="600">NOT how atoms behave</text>
  </g>
</svg>
