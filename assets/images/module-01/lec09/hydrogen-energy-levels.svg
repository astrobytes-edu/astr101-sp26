<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <title>Hydrogen Atom Energy Levels</title>
  <desc>Quantized energy levels of hydrogen with Balmer series transitions showing spectral lines.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .title-text { font-size: 20px; font-weight: 600; fill: #1a3a52; }
      .axis-label { font-size: 13px; fill: #5c6470; }
      .level-label { font-size: 12px; fill: #1a3a52; }
      .transition-label { font-size: 13px; fill: #1a3a52; font-weight: 500; }
      .note-text { font-size: 13px; fill: #5c6470; }
    </style>
    <marker id="arrowRed" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#c75050"/>
    </marker>
    <marker id="arrowTeal" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#6b9fa1"/>
    </marker>
    <marker id="arrowMauve" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#8b7a8b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="480" y="35" class="title-text" text-anchor="middle">Hydrogen Atom Energy Levels</text>

  <!-- Energy axis (left side) -->
  <line x1="80" y1="80" x2="80" y2="450" stroke="#d4d0cc" stroke-width="1"/>
  <text x="60" y="50" class="axis-label" text-anchor="end">Energy (eV)</text>

  <!-- Energy axis labels and ticks -->
  <!-- Ground state: -13.6 eV at y=430 -->
  <line x1="75" y1="430" x2="85" y2="430" stroke="#d4d0cc" stroke-width="1"/>
  <text x="65" y="435" class="axis-label" text-anchor="end">−13.6</text>
  
  <!-- n=2: -3.4 eV at y=200 -->
  <line x1="75" y1="200" x2="85" y2="200" stroke="#d4d0cc" stroke-width="1"/>
  <text x="65" y="205" class="axis-label" text-anchor="end">−3.4</text>
  
  <!-- n=3: -1.51 eV at y=145 -->
  <line x1="75" y1="145" x2="85" y2="145" stroke="#d4d0cc" stroke-width="1"/>
  <text x="55" y="150" class="axis-label" text-anchor="end">−1.51</text>
  
  <!-- n=4: -0.85 eV at y=125 -->
  <line x1="75" y1="125" x2="85" y2="125" stroke="#d4d0cc" stroke-width="1"/>
  <text x="55" y="130" class="axis-label" text-anchor="end">−0.85</text>
  
  <!-- n=5: -0.54 eV at y=115 -->
  <line x1="75" y1="115" x2="85" y2="115" stroke="#d4d0cc" stroke-width="1"/>
  <text x="55" y="120" class="axis-label" text-anchor="end">−0.54</text>

  <!-- Ionization limit: 0 eV (dashed line) -->
  <line x1="80" y1="90" x2="800" y2="90" stroke="#d4d0cc" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="65" y="95" class="axis-label" text-anchor="end">0</text>
  <text x="810" y="95" class="axis-label" text-anchor="start">ionized</text>

  <!-- ENERGY LEVEL LINES -->
  <!-- n=1 (ground state, longest, teal) -->
  <line x1="100" y1="430" x2="400" y2="430" stroke="#6b9fa1" stroke-width="4"/>
  <text x="420" y="435" class="level-label">n = 1</text>

  <!-- n=2 (Balmer target, highlighted, gold) -->
  <line x1="100" y1="200" x2="480" y2="200" stroke="#c9a66b" stroke-width="3"/>
  <text x="490" y="205" class="level-label" font-weight="600" fill="#c9a66b">n = 2 (Balmer target)</text>

  <!-- n=3 (teal) -->
  <line x1="100" y1="145" x2="450" y2="145" stroke="#6b9fa1" stroke-width="2.5"/>
  <text x="460" y="150" class="level-label">n = 3</text>

  <!-- n=4 (teal) -->
  <line x1="100" y1="125" x2="430" y2="125" stroke="#6b9fa1" stroke-width="2.5"/>
  <text x="440" y="130" class="level-label">n = 4</text>

  <!-- n=5 (teal) -->
  <line x1="100" y1="115" x2="410" y2="115" stroke="#6b9fa1" stroke-width="2.5"/>
  <text x="420" y="120" class="level-label">n = 5</text>

  <!-- BALMER TRANSITIONS (downward arrows TO n=2) -->
  <!-- Hα: 3→2 (656 nm, red-ish) -->
  <line x1="650" y1="145" x2="650" y2="200" stroke="#c75050" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <text x="665" y="165" class="transition-label" fill="#c75050">Hα</text>
  <text x="665" y="180" class="transition-label" fill="#c75050">656 nm</text>

  <!-- Hβ: 4→2 (486 nm, teal) -->
  <line x1="720" y1="125" x2="720" y2="200" stroke="#6b9fa1" stroke-width="2.5" marker-end="url(#arrowTeal)"/>
  <text x="735" y="155" class="transition-label" fill="#6b9fa1">Hβ</text>
  <text x="735" y="170" class="transition-label" fill="#6b9fa1">486 nm</text>

  <!-- Hγ: 5→2 (434 nm, mauve) -->
  <line x1="790" y1="115" x2="790" y2="200" stroke="#8b7a8b" stroke-width="2.5" marker-end="url(#arrowMauve)"/>
  <text x="805" y="150" class="transition-label" fill="#8b7a8b">Hγ</text>
  <text x="805" y="165" class="transition-label" fill="#8b7a8b">434 nm</text>

  <!-- Annotation: levels crowd together -->
  <g>
    <path d="M 300 140 L 350 110" stroke="#5c6470" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="355" y="105" class="note-text" fill="#5c6470">Energy levels crowd</text>
    <text x="355" y="120" class="note-text" fill="#5c6470">together near ionization</text>
  </g>
</svg>
