<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 540">
  <title>Fraunhofer Absorption Lines</title>
  <desc>Solar spectrum showing characteristic absorption lines from atmospheric elements.</desc>

  <defs>
    <style>
      text { font-family: Inter, system-ui, sans-serif; }
      .title-text { font-size: 18px; font-weight: 600; fill: #1a3a52; }
      .label-text { font-size: 12px; fill: #1a3a52; }
      .small-text { font-size: 12px; fill: #5c6470; }
      .wavelength-text { font-size: 12px; fill: #5c6470; }
      .line-label { font-size: 13px; font-weight: 600; fill: #1a3a52; }
    </style>
    <linearGradient id="visibleSpectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4B0082"/>
      <stop offset="16.66%" style="stop-color:#4169E1"/>
      <stop offset="33.33%" style="stop-color:#00FF00"/>
      <stop offset="50%" style="stop-color:#FFFF00"/>
      <stop offset="66.66%" style="stop-color:#FF7F00"/>
      <stop offset="83.33%" style="stop-color:#FF4500"/>
      <stop offset="100%" style="stop-color:#DC143C"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="540" fill="#ffffff"/>

  <!-- Title -->
  <text x="960" y="40" class="title-text" text-anchor="middle">Solar Spectrum — Fraunhofer Absorption Lines</text>

  <!-- Wavelength axis labels -->
  <text x="80" y="530" class="wavelength-text" text-anchor="middle">380 nm</text>
  <text x="360" y="530" class="wavelength-text" text-anchor="middle">450 nm</text>
  <text x="640" y="530" class="wavelength-text" text-anchor="middle">520 nm</text>
  <text x="920" y="530" class="wavelength-text" text-anchor="middle">590 nm</text>
  <text x="1200" y="530" class="wavelength-text" text-anchor="middle">660 nm</text>
  <text x="1480" y="530" class="wavelength-text" text-anchor="middle">730 nm</text>

  <!-- Wavelength axis ticks -->
  <line x1="80" y1="480" x2="80" y2="490" stroke="#d4d0cc" stroke-width="1"/>
  <line x1="360" y1="480" x2="360" y2="490" stroke="#d4d0cc" stroke-width="1"/>
  <line x1="640" y1="480" x2="640" y2="490" stroke="#d4d0cc" stroke-width="1"/>
  <line x1="920" y1="480" x2="920" y2="490" stroke="#d4d0cc" stroke-width="1"/>
  <line x1="1200" y1="480" x2="1200" y2="490" stroke="#d4d0cc" stroke-width="1"/>
  <line x1="1480" y1="480" x2="1480" y2="490" stroke="#d4d0cc" stroke-width="1"/>

  <!-- Spectrum strip -->
  <rect x="80" y="200" width="1760" height="180" fill="url(#visibleSpectrum)" stroke="#d4d0cc" stroke-width="1"/>

  <!-- Color labels -->
  <text x="50" y="295" class="small-text" text-anchor="end">violet</text>
  <text x="1890" y="295" class="small-text" text-anchor="start">red</text>

  <!-- STRONG ABSORPTION LINES (width=4-5px, opacity=0.9) -->
  <!-- Ca II K 393.4nm (violet side) -->
  <rect x="213" y="200" width="5" height="180" fill="#2a2a2a" opacity="0.9"/>
  <text x="213" y="165" class="line-label" text-anchor="middle">K</text>
  <text x="213" y="415" class="wavelength-text" text-anchor="middle">Ca II</text>

  <!-- Ca II H 396.8nm -->
  <rect x="230" y="200" width="5" height="180" fill="#2a2a2a" opacity="0.9"/>
  <text x="230" y="165" class="line-label" text-anchor="middle">H</text>
  <text x="230" y="415" class="wavelength-text" text-anchor="middle">Ca II</text>

  <!-- Hα (Balmer) 656.3nm (red side, very prominent) -->
  <rect x="1207" y="200" width="5" height="180" fill="#1a1a1a" opacity="0.95"/>
  <text x="1207" y="165" class="line-label" text-anchor="middle">Hα</text>
  <text x="1207" y="415" class="wavelength-text" text-anchor="middle" font-weight="600">656 nm</text>

  <!-- Na D doublet 589.0/589.6nm (very strong, yellow region) -->
  <rect x="946" y="200" width="4" height="180" fill="#1a1a1a" opacity="0.95"/>
  <text x="946" y="165" class="line-label" text-anchor="middle">D₁</text>
  <rect x="965" y="200" width="4" height="180" fill="#1a1a1a" opacity="0.95"/>
  <text x="965" y="165" class="line-label" text-anchor="middle">D₂</text>
  <text x="955" y="415" class="wavelength-text" text-anchor="middle" font-weight="600">Na D</text>

  <!-- MEDIUM STRENGTH LINES (width=2.5-3px, opacity=0.8) -->
  <!-- Hβ F 486.1nm (cyan region) -->
  <rect x="766" y="200" width="3" height="180" fill="#2a2a2a" opacity="0.8"/>
  <text x="766" y="165" class="line-label" text-anchor="middle">Hβ</text>
  <text x="766" y="415" class="wavelength-text" text-anchor="middle">486 nm</text>

  <!-- Hδ h 410.2nm -->
  <rect x="306" y="200" width="3" height="180" fill="#2a2a2a" opacity="0.8"/>
  <text x="306" y="165" class="line-label" text-anchor="middle">Hδ</text>
  <text x="306" y="415" class="wavelength-text" text-anchor="middle">410 nm</text>

  <!-- Ca/Fe G 430.8nm -->
  <rect x="387" y="200" width="3" height="180" fill="#2a2a2a" opacity="0.8"/>
  <text x="387" y="165" class="line-label" text-anchor="middle">G</text>
  <text x="387" y="415" class="wavelength-text" text-anchor="middle">Ca/Fe</text>

  <!-- Mg b 516.7nm (green region) -->
  <rect x="599" y="200" width="2.5" height="180" fill="#2a2a2a" opacity="0.8"/>
  <text x="599" y="165" class="line-label" text-anchor="middle">b</text>
  <text x="599" y="415" class="wavelength-text" text-anchor="middle">517 nm</text>

  <!-- O₂ B 686.7nm (red side) -->
  <rect x="1354" y="200" width="2.5" height="180" fill="#2a2a2a" opacity="0.8"/>
  <text x="1354" y="165" class="line-label" text-anchor="middle">B</text>
  <text x="1354" y="415" class="wavelength-text" text-anchor="middle">O₂</text>

  <!-- O₂ A 759.4nm (far red) -->
  <rect x="1543" y="200" width="2.5" height="180" fill="#2a2a2a" opacity="0.8"/>
  <text x="1543" y="165" class="line-label" text-anchor="middle">A</text>
  <text x="1543" y="415" class="wavelength-text" text-anchor="middle">O₂</text>

  <!-- WEAK LINES (width=1.5-2px, opacity=0.65) -->
  <!-- Fe e 527nm -->
  <rect x="627" y="200" width="2" height="180" fill="#3a3a3a" opacity="0.65"/>
  <text x="627" y="440" class="small-text" text-anchor="middle">Fe e</text>

  <!-- Callout annotations -->
  <!-- Hydrogen Balmer series callout -->
  <g>
    <path d="M 766 130 L 766 100 L 600 60" stroke="#6b9fa1" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="590" y="55" class="label-text" text-anchor="end" fill="#6b9fa1">Hydrogen Balmer</text>
    <text x="590" y="70" class="label-text" text-anchor="end" fill="#6b9fa1">series (→ n=2)</text>
  </g>

  <!-- Sodium D doublet callout -->
  <g>
    <path d="M 955 130 L 955 100 L 1150 60" stroke="#c9a66b" stroke-width="1.5" fill="none" stroke-dasharray="2,2"/>
    <text x="1160" y="55" class="label-text" text-anchor="start" fill="#c9a66b">Sodium D</text>
    <text x="1160" y="70" class="label-text" text-anchor="start" fill="#c9a66b">doublet</text>
  </g>
</svg>
