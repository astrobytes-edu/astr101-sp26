  seasons-effect1-sunlight-angle:
    path: /assets/images/module-01/lec03/seasons-effect1-angle-of-sunlight-nblm.webp
    caption: "Effect 1: Sunlight angle changes energy per area"
    alt: "Diagram showing sunlight hitting at a steep angle versus a shallow angle, spreading the same energy over a larger area at shallow incidence."
