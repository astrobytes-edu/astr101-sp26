    module: 1

  seasons-geometry-illumination:
    path: /assets/images/module-01/lec03/seasons-geometry-of-illumination-nblm.webp
    caption: "Geometry of illumination for seasons"
    alt: "Earth–Sun geometry diagram showing axial tilt and how it changes which hemisphere is tilted toward the Sun."
