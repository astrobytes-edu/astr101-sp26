    module: 1

  angular-size-tradeoff:
    path: /assets/images/module-01/lec03/angular-size-nblm.webp
    caption: "Angular size: the distance–size ambiguity"
    alt: "Diagram illustrating that the same angular size can result from a small nearby object or a large distant object."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  unit-circle-radians:
    path: /assets/images/module-01/lec03/unit-circle-deg-vs-rad-nblm.webp
