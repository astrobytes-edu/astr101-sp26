# Figure Registry - Single Source of Truth
# Usage: {{< fig figure-id >}} or {{< fig figure-id caption="Custom" >}}
#
# Each figure entry has:
#   path: path from project root (use /assets/images/...)
#   caption: default caption text
#   alt: accessibility text for screen readers
#   credit: attribution/source (optional)
#   module: which module uses this primarily (optional, for organization)

figures:
  # ==============================================================
  # Common/shared figures (used across multiple modules)
  # ==============================================================

  hr-diagram:
    path: /assets/images/common/hr-diagram.png
    caption: "The Hertzsprung-Russell Diagram showing stellar classification"
    alt: "H-R diagram plotting luminosity vs temperature for stars"
    credit: "ESO"

  hr-diagram-chatgpt:
    path: /assets/images/common/HR-diagram-chatGPT.png
    caption: "**What to notice:** The main sequence is a diagonal band; giants and supergiants sit above it (high luminosity), and white dwarfs sit below it (low luminosity). Hotter stars are on the left; cooler stars are on the right."
    alt: "Hertzsprung-Russell diagram plotting luminosity (in solar units) versus surface temperature (Kelvin), with regions labeled main sequence, giants, supergiants, and white dwarfs, and a spectral class bar across the top."

  blackbody-curves:
    path: /assets/images/common/blackbody-curves.png
    caption: "Blackbody radiation curves at different temperatures"
    alt: "Graph showing Planck curves for various temperatures"

  stellar-lifecycle:
    path: /assets/images/common/stellar-lifecycle.png
    caption: "Life cycle of stars of different masses"
    alt: "Diagram showing evolutionary paths for low and high mass stars"

  electromagnetic-spectrum:
    path: /assets/images/common/em-spectrum.png
    caption: "The electromagnetic spectrum from radio to gamma rays"
    alt: "Diagram showing wavelength ranges of electromagnetic radiation"

  jwst-em-spectrum:
    path: /assets/images/common/jwst-em-spectrum-ir.png
    caption: "What to notice: different wavelength bands are different information channels; infrared sits just beyond visible light."
    alt: "Graphic of the electromagnetic spectrum labeled gamma, X-ray, ultraviolet, visible, infrared, microwave, and radio, with a highlighted visible band and an extended infrared region; includes sketches of several space telescopes."

  jwst-vs-hst-ngc1566:
    path: /assets/images/common/NGC1566-jwst-vs-hst.jpg
    caption: "What to notice: the same galaxy can look dramatically different in different bands; dust that hides structure in one band may become transparent in another."
    alt: "Side-by-side comparison of a spiral galaxy in two different views, showing differing levels of detail and dust structure between the images."

  jwst-vs-hst-arp142:
    path: /assets/images/common/Arp142-penguin-jwst-vs-hst.jpg
    caption: "What to notice: changing wavelength reveals different components of the same system (stars, dust, and gas), not a different object."
    alt: "Side-by-side comparison of a galaxy system in two different views, where one image emphasizes stars and the other emphasizes dust and infrared-bright regions."

  milky-way-panoramic:
    path: /assets/images/common/eso-milky-way-panoramic.jpg
    caption: "What to notice: even a ‘pretty picture’ is a measurement—brightness and color patterns carry physical information."
    alt: "Wide panoramic view of the Milky Way band stretching across a dark night sky, with many stars and dark dust lanes."

  universe-contents-nasa:
    path: /assets/images/common/universe-contents-nasa.png
    caption: "**What to notice:** Ordinary matter is only a small fraction of the universe. Current best-fit: ~5% normal matter, ~27% dark matter, ~68% dark energy."
    alt: "NASA infographic showing the approximate composition of the universe: about 5 percent normal (ordinary) matter, about 27 percent dark matter, and about 68 percent dark energy, depicted as a pie chart with labeled sections."
    credit: "NASA"

  # ==============================================================
  # Module 1: Foundations
  # ==============================================================

  night-sky:
    path: /assets/images/common/noirlab-nightsky-mosaic.jpg
    caption: "The night sky filled with stars"
    alt: "Photograph of the night sky showing many stars as points of light"
    credit: "NOIRLab"
    module: 1

  fundamental-dimensions:
    path: /assets/images/module-01/fundamental-dims-nblm.png
    caption: "The Fundamental Alphabet: constructing physics from [M], [L], and [T]"
    alt: "Visual equation builder showing how Mass [M], Length [L], and Time [T] combine like building blocks: Velocity = L/T → [L][T]^-1, Acceleration = velocity/time → [L][T]^-2, Force = mass × acceleration → [M][L][T]^-2, Energy = force × distance → [M][L]²[T]^-2. Includes sanity check: if your energy calculation has dimensions [M][L][T]^-1, you missed a velocity term."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  universe-phone-number:
    path: /assets/images/module-01/universe-phone-number-owocki-nblm.png
    caption: "The Universe's Phone Number: (555)-711-2555 maps cosmic scales"
    alt: "Staircase diagram showing scale factors from nucleus (10^-15 m) through atom, cell, human, Earth, Jupiter, Sun, AU, light-year, parsec, galaxy, to observable universe (10^26 m). Phone number digits encode the multiplication factors between each level."
    credit: "Adapted from Owocki (course illustration)"
    module: 1

  # Dimensional Analysis Protocol (Lecture 02)
  da-protocol:
    path: /assets/images/module-01/3-step-dimensional-analysis-protocol.png
    caption: "The three-step dimensional analysis protocol for building educated guesses"
    alt: "Flowchart showing Step 1: The Ingredients (list variables M, R and constants G, c, ℏ), Step 2: The Hypothesis (assume Answer ≈ A^α B^β C^γ), Step 3: The Match (solve for exponents to match target dimensions). Icons show beaker, f(x), and balance scale."
    module: 1

  units-vs-dimensions:
    path: /assets/images/module-01/units-vs-dimensions-nblm.png
    caption: "Units are conventions; dimensions are physical reality"
    alt: "Split diagram contrasting UNITS (The Map) showing ruler, stopwatch, and weights labeled as 'human inventions, fungible, arbitrary' versus DIMENSIONS (The Territory) showing [L], [T], [M] symbols labeled as 'physical realities, invariant, fundamental'. Footer states physical laws must hold regardless of units used."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  physical-constants:
    path: /assets/images/module-01/physical-constants-nblm.png
    caption: "Physical constants encode dimensional information about the universe"
    alt: "Diagram explaining that constants like G and c are not just numbers but conversion factors. Shows c (speed of light) with dimensions [L][T]^-1 as the universal speed limit, and G (gravitational constant) derived from Newton's law with dimensions [M]^-1[L]^3[T]^-2. Highlights the inverse mass term that allows gravity to cancel mass."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  math-toolbox:
    path: /assets/images/module-01/math-toolbox-nblm.png
    caption: "The dimensional analysis toolbox for ASTR 101"
    alt: "Three-panel overview: (1) Reality vs Map - units are conventions, dimensions are physics, (2) The Radar - use scaling relations A ∝ B^α to predict behavior before solving equations, (3) Self-Correction - if dimensions don't match, the physics is wrong. Quote: 'In ASTR 101, we don't just memorize formulas. We interrogate them.'"
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # ==============================================================
  # Lecture 01: Spoiler Alerts — The Universe Is Weird
  # ==============================================================

  iclicker-qr-astr101:
    path: /assets/images/common/iclicker-qrcode-astr101.png
    caption: "Join iClicker: **join.iclicker.com/ASES**"
    alt: "iClicker QR code for joining ASTR 101, with join link join.iclicker.com/ASES."
    credit: "iClicker"

  # Section 1.1: The Four Observables
  four-observables:
    path: /assets/images/module-01/the-four-observables-nblm.png
    caption: "**What to notice:** From billions of kilometers away, we can directly measure only four things. Everything else—mass, radius, temperature, age—is a calculation."
    alt: "Four-panel diagram showing the astronomer's toolkit: Brightness (Flux) - how much energy arrives, Position (Geometry) - where is it on the sky, Wavelength (Spectroscopy) - what colors are present, Timing (Variability) - how does it change."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  four-direct-observables-nblm:
    path: /assets/images/module-01/four-direct-observables-nblm.png
    caption: "**What to notice:** The universe gives us only four direct inputs: flux, position, wavelength, and timing. Everything else must be inferred."
    alt: "Infographic titled 'The Four Direct Observables' showing four panels: flux (brightness), position, wavelength, and timing, with a note that mass, temperature, radius, age, and distance cannot be directly measured and must be inferred."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  light-cosmic-messenger:
    path: /assets/images/module-01/light-cosmic-messenger-nblm.png
    caption: "**What to notice:** Light carries information. The relations c = λν and E = hν connect wavelength/frequency to energy."
    alt: "Infographic titled 'Light Is the Cosmic Messenger' showing a rainbow wave that shifts from long wavelength to short wavelength, with equations c = λν and E = hν and text explaining how wavelength, frequency, and energy relate."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  em-spectrum-physics-ladder:
    path: /assets/images/module-01/em-spectrum-physics-ladder.png
    caption: "**What to notice:** Different wavelength bands probe different physical regimes; for thermal emission, hotter objects emit higher-energy (shorter-wavelength) photons."
    alt: "Infographic titled 'The Physics Ladder' listing radio, infrared, visible, X-ray, and gamma bands with example sources (cold gas, warm dust, stellar surfaces, million-degree plasma, nuclear/extreme events) and an explanation that different wavelengths probe different temperature regimes."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  distance-time-dial:
    path: /assets/images/module-01/distance-time-dial-nblm.png
    caption: "**What to notice:** Distance is a time dial. Because light has a finite speed, we see objects as they were, not as they are."
    alt: "Infographic titled 'Distance Is a Time Dial' showing Earth (now), the Moon (1.3 seconds ago), the Sun (8.3 minutes ago), Andromeda (2.5 million years ago), and distant galaxies (10+ billion years ago), describing lookback time."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  decoder-ring-pipeline:
    path: /assets/images/module-01/decoder-ring-pipeline-nblm.png
    caption: "**What to notice:** The astronomy workflow: signal (photons) → measurements → models → predictions → inference."
    alt: "Diagram titled 'The Decoder Ring Pipeline' showing a circular pipeline linking signal (photons), measurement (flux/position/wavelength/time), model (physics/math), test (prediction), and inference (physical reality)."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  lecture-01-summary-infographic:
    path: /assets/images/module-01/lecture-01-summary-infographic.png
    caption: "**What to notice:** A one-page summary of Lecture 1’s thesis: signals become measurements; physics turns measurements into inferences."
    alt: "Lecture 1 summary infographic titled 'Decoding the Cosmos: How Light Becomes Reality' combining the four observables, an inference pipeline/decoder ring, wavelength-to-physics mapping, lookback time, and infrared versus dust ideas."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # Spoiler 1: Nebulae
  forensic-nebula:
    path: /assets/images/module-01/forensic-analysis-of-a-nebula-nblm.png
    caption: "**What to notice:** Colors aren't decoration—they're encoded physics. Red = hydrogen (656 nm), blue-green = oxygen (500 nm), dark lanes = dust blocking light."
    alt: "Annotated nebula image showing three labeled features: (1) Hydrogen-Alpha at 656.3 nm in red regions indicating ionized gas, (2) Doubly-ionized Oxygen [OIII] at 500 nm in blue-green regions indicating extremely low density, (3) Dark Lanes showing silhouettes of interstellar dust blocking the light."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # Spoiler 2: Distance Ladder
  cosmic-distance-ladder:
    path: /assets/images/module-01/cosmic-distance-ladder-nblm.png
    caption: "**What to notice:** Each rung calibrates the next. Parallax (geometry) → Cepheids (standard candles) → Supernovae (Chandrasekhar limit) → Hubble Flow (cosmology). We infer the infinite from the infinitesimal."
    alt: "Four-rung ladder diagram titled 'The Cosmic Distance Ladder: Building on the Shoulders of Physics'. From bottom to top: Rung 1 Geometry (Parallax), Rung 2 Physics (Cepheids/Standard Candles), Rung 3 Physics (Supernovae/Chandrasekhar Limit), Rung 4 Cosmology (Hubble Flow). Footer text: Our understanding of the vastest scales relies on the microscopic atom."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  standard-candles:
    path: /assets/images/module-01/standard-candles-nblm.png
    caption: "**What to notice:** Standard candles work because physics predicts their luminosity. Measure flux (F) + know luminosity (L) → calculate distance (d)."
    alt: "Two-panel diagram: Left shows Cepheid Variable with sinusoidal light curve where pulse rate reveals wattage. Right shows Type Ia Supernova with white dwarf accreting from companion star, producing consistent peak brightness (~10^9 solar luminosities). Bottom equation: Measure Flux (F) + Know Luminosity (L) → Calculate Distance (d)."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # Spoiler 3: Origin of Elements
  periodic-table-origins:
    path: /assets/images/module-01/periodic-table-origins-nasa.png
    caption: "**What to notice:** The periodic table is a fossil record of cosmic processes. Different colors = different origins: Big Bang (H, He), dying stars (C, N, O), supernovae (Fe), neutron star mergers (Au, Pt)."
    alt: "Periodic table color-coded by nucleosynthesis origin: hydrogen and helium from Big Bang (pink), elements like carbon and oxygen from dying low-mass stars (yellow), iron-peak elements from supernovae (orange), heavy elements like gold from merging neutron stars (blue), with some human-made elements (green)."
    credit: "NASA/Jennifer Johnson"
    module: 1

  # Spoiler 4: Prism/Spectroscopy
  quantum-barcode:
    path: /assets/images/common/quantum-barcode-spectroscopy-nlbm.png
    caption: "**What to notice:** Atoms have quantized energy levels like rungs on a ladder. Electrons jumping between rungs absorb or emit photons of *exact* energies—creating unique spectral fingerprints. Hot dense sources produce continuous spectra; cool gas in front absorbs specific wavelengths; hot thin gas emits specific wavelengths."
    alt: "Diagram titled 'The Quantum Barcode' showing three parts: Left - an atom with quantized energy levels depicted as a ladder, with electrons occupying specific rungs. Center - 'The Photon Exchange' showing electrons absorbing or emitting photons of exact energy when jumping between levels. Right - 'Three Ways to See the Universe': continuous spectrum (rainbow from hot dense source), absorption spectrum (rainbow with dark lines from cool gas absorbing), and emission spectrum (bright lines on dark background from hot thin gas)."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  prism-spectrum:
    path: /assets/images/module-01/prism-spectrum-nblm.png
    caption: "**What to notice:** A prism reveals that 'white' light contains many wavelengths. Blue bends more (shorter λ, higher energy); red bends less (longer λ, lower energy)."
    alt: "Diagram of white light entering a triangular prism and separating into a rainbow spectrum. Labels indicate Cosmic Blue (high energy, short wavelength) at top and Signal Red (low energy, long wavelength) at bottom."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # Spoiler 5: EM Spectrum
  em-spectrum-temperature:
    path: /assets/images/module-01/em-spectrum-nblm.png
    caption: "**What to notice:** The EM spectrum is a temperature ladder. Gamma/X-ray = million-degree plasma; UV/Visible = stellar surfaces (3,000–50,000 K); Infrared/Radio = dust and cold gas (10–100 K)."
    alt: "Vertical electromagnetic spectrum showing wavelength bands with corresponding temperatures: Gamma/X-Ray at top for million-degree plasma and black holes, UV/Visible in middle for stars (3,000K–50,000K), Infrared/Radio at bottom for dust (100K) and cold gas (10K). Rainbow colors shown in visible band."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # --------------------------------------------------------------
  # Module 1: Lecture 11 (Solar System)
  # --------------------------------------------------------------

  planetary-portraits:
    path: /assets/images/module-01/lec11/planetary-portraits-gemini.png
    caption: "**What to notice:** we can infer basic planet properties (mass, density, temperature, winds) without visiting — by combining orbits, light, spectra, and Doppler."
    alt: "Infographic with four tiles about solar-system worlds, emphasizing that we infer properties remotely using orbits and light, including examples like Saturn’s low density, Jupiter’s large mass, Venus’s extreme heat, and Neptune’s fast winds."
    credit: "(A. Rosen/Gemini — illustrative)"
    module: 1

  solar-system-architecture:
    path: /assets/images/module-01/lec11/solar-system-architecture-gemini.png
    caption: "**What to notice:** the solar system is structured in zones (not to scale) — rocky planets inside, giant planets farther out, then icy small-body reservoirs (Kuiper Belt, Oort Cloud)."
    alt: "Diagram of the solar system labeled with zones: inner rocky planets, gas giants, ice giants, Kuiper Belt, and a distant Oort Cloud, with approximate distances in AU and a note that it is not to scale."
    credit: "(A. Rosen/Gemini — illustrative)"
    module: 1

  nebular-hypothesis:
    path: /assets/images/module-01/lec11/solar-nebular-hypothesis-gemini.png
    caption: "**What to notice:** formation as a causal chain — collapse spins up a rotating disk, temperature sets a condensation sequence, and the snow line separates rocky from ice-rich building blocks."
    alt: "Step-by-step schematic of solar system formation: a molecular cloud collapses and spins up into a protoplanetary disk, a condensation sequence and snow line separate rocky from ice-rich regions, and accretion builds rocky planets inside and giant planets outside."
    credit: "(A. Rosen/Gemini — illustrative)"
    module: 1

  protoplanetary-disk:
    path: /assets/images/module-01/lec11/protoplanetary-disk-gemini.png
    caption: "**What to notice:** we observe planet formation in progress — rings and gaps in young-star disks can be signatures of emerging planets."
    alt: "Illustration of a young star surrounded by a protoplanetary disk with labeled rings and gaps, described as possible signs of planet formation."
    credit: "(A. Rosen/Gemini — illustrative)"
    module: 1

  l11-mercury-messenger:
    path: /assets/images/module-01/lec11/mercury-from-messenger-pia15160-nasa.webp
    caption: "**What to notice:** Mercury’s surface is heavily cratered and airless — a record of early impacts with little erosion."
    alt: "Spacecraft image of Mercury showing a gray, heavily cratered rocky surface."
    credit: "NASA"
    module: 1

  l11-venus-mariner-10:
    path: /assets/images/module-01/lec11/venus-mariner-10-nasa.jpg
    caption: "**What to notice:** Venus is completely cloud-covered in visible light — we do not see the surface directly without using other wavelengths or radar."
    alt: "Image of Venus as a bright disk with thick cloud patterns and no visible surface features."
    credit: "NASA"
    module: 1

  l11-earth:
    path: /assets/images/module-01/lec11/earth-1-nasa.webp
    caption: "**What to notice:** Earth’s oceans and atmosphere matter — they shape temperature, weather, and habitability."
    alt: "Image of Earth showing blue oceans, white cloud swirls, and landmasses."
    credit: "NASA"
    module: 1

  l11-mars:
    path: /assets/images/module-01/lec11/mars-nasa.webp
    caption: "**What to notice:** Mars is a cold, rocky world with a thin atmosphere — a contrast case for climate and habitability."
    alt: "Spacecraft image of Mars showing a reddish rocky surface and polar ice cap."
    credit: "NASA"
    module: 1

  l11-phobos:
    path: /assets/images/module-01/lec11/phobos-nasa.webp
    caption: "**What to notice:** Small moons can be irregular and heavily cratered — they look more like asteroids than planets."
    alt: "Image of Phobos showing an irregular, cratered, gray-brown surface."
    credit: "NASA"
    module: 1

  l11-deimos:
    path: /assets/images/module-01/lec11/deimos-demos.webp
    caption: "**What to notice:** Deimos is tiny and irregular — evidence that not all moons form the same way."
    alt: "Image of Deimos showing a small, irregularly shaped moon against space."
    module: 1

  l11-ceres:
    path: /assets/images/module-01/lec11/ceres-dawn-nasa.webp
    caption: "**What to notice:** The asteroid belt contains large bodies too — Ceres is a dwarf planet with its own geology."
    alt: "Image of Ceres showing a round, gray dwarf planet with bright spots and craters."
    credit: "NASA"
    module: 1

  l11-jupiter:
    path: /assets/images/module-01/lec11/jupiter-nasa.webp
    caption: "**What to notice:** Jupiter is a gas giant with banded cloud layers — atmosphere, not a solid surface, dominates what we see."
    alt: "Image of Jupiter showing alternating light and dark cloud bands and a large oval storm."
    credit: "NASA"
    module: 1

  l11-saturn:
    path: /assets/images/module-01/lec11/saturn-farewell-nasa.webp
    caption: "**What to notice:** Saturn’s rings make its structure obvious: a planet plus a disk of countless small particles."
    alt: "Image of Saturn showing its rings and cloud-banded atmosphere."
    credit: "NASA"
    module: 1

  l11-titan:
    path: /assets/images/module-01/lec11/titan_carousel2_nasa.jpg
    caption: "**What to notice:** Titan is a moon with a thick atmosphere — moons can have their own ‘planet-like’ complexity."
    alt: "Image of Titan showing a hazy orange disk with an atmosphere obscuring the surface."
    credit: "NASA"
    module: 1

  l11-uranus:
    path: /assets/images/module-01/lec11/uranus-voyager-2-nasa.jpg
    caption: "**What to notice:** The ice giants are distant and cold — their atmospheres and compositions differ from Jupiter and Saturn."
    alt: "Image of Uranus showing a pale blue-green disk with subtle cloud features."
    credit: "NASA"
    module: 1

  l11-neptune:
    path: /assets/images/module-01/lec11/neptune-voyager-2-nasa.webp
    caption: "**What to notice:** Neptune’s deep blue color and storms emphasize that ice giant atmospheres can be active."
    alt: "Image of Neptune showing a deep blue disk with bright clouds and a dark storm feature."
    credit: "NASA"
    module: 1

  l11-pluto:
    path: /assets/images/module-01/lec11/pluto-new-horizons-nasa.webp
    caption: "**What to notice:** Pluto lives in the Kuiper Belt — the outer solar system includes dwarf planets and icy worlds, not just the eight planets."
    alt: "Image of Pluto showing a mottled surface with a bright heart-shaped region."
    credit: "NASA"
    module: 1

  l11-jupiter-position-illustration:
    path: /assets/images/module-01/lec11/Illustration_showing_Jupiters_position_in_the_solar_system_relative_to_Earth_and_the_Sun-nasa.jpeg
    caption: "**What to notice:** Distances in the solar system are easiest to compare in AU — the inner planets are packed close together compared to the giant-planet region."
    alt: "Illustration showing Jupiter’s position relative to Earth and the Sun, with orbits drawn to compare distances."
    credit: "NASA"
    module: 1

  l11-young-solar-nebula-disk:
    path: /assets/images/module-01/lec11/solar-system-young-disk-artist-schematic-nasa.jpg
    caption: "**What to notice:** The nebular hypothesis starts with a rotating disk of gas and dust. Collisions and gravity flatten the system into a plane, which is why most planets end up orbiting in nearly the same plane and direction."
    alt: "Artist’s concept of the young Sun surrounded by a dusty protoplanetary disk, with material clumping and forming planets and smaller bodies within the disk."
    module: 1

  # --------------------------------------------------------------
  # Module 1: Lecture 12 (Planetary Climate + Exoplanets)
  # --------------------------------------------------------------

  disk-approximation:
    path: /assets/images/module-01/lec12/planet-projected-disk-gemini.png
    caption: "**What to notice:** a planet intercepts sunlight over its projected disk (πR²) but emits thermal radiation from its whole surface (4πR²) — that factor of 4 is why equilibrium temperatures use 16π in the denominator."
    alt: "Two-panel schematic labeled 'Why πR² (Not 4πR²)?' showing incoming sunlight intercepted by a planet’s projected disk area πR² and thermal emission radiated from the full spherical surface 4πR², highlighting the factor-of-four difference."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  greenhouse-effect:
    path: /assets/images/module-01/lec12/greenhouse-effect-gemini.png
    caption: "**What to notice:** the same energy must leave to space, but greenhouse gases shift the effective emission level upward to colder air, so the surface warms until energy balance is restored."
    alt: "Schematic of the greenhouse effect showing incoming visible light, outgoing infrared, greenhouse-gas absorption and re-emission, and an effective emission level higher in the atmosphere where it is colder."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  planet-temperatures-baseline-vs-reality:
    path: /assets/images/module-01/lec12/planet-temperatures-baseline-vs-reality-gemini.png
    caption: "**What to notice:** equilibrium temperature is a baseline from sunlight-in vs IR-out; greenhouse physics shifts the real surface temperature above that baseline by different amounts on Venus, Earth, and Mars."
    alt: "Bar chart comparing equilibrium temperature and actual surface temperature for Venus, Earth, and Mars, with labeled temperature differences showing large greenhouse warming on Venus, moderate warming on Earth, and small warming on Mars."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  transit-geometry:
    path: /assets/images/module-01/lec12/transit-geometry-gemini.png
    caption: "**What to notice:** transits require a lucky alignment — we only see a transit when the orbit is edge-on, so most planets do not transit from our viewpoint."
    alt: "Two-panel diagram showing an edge-on orbit producing a transit across a star versus a tilted orbit producing no transit, emphasizing that alignment is rare."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  transit-light-curve:
    path: /assets/images/module-01/lec12/transit-light-curve-gemini.png
    caption: "**What to notice:** the dip depth sets planet size (≈ (Rp/R*)²) and the timing between dips sets the orbital period."
    alt: "Schematic transit light curve showing a normalized brightness dip with labeled ingress, duration, egress, and period, with an annotation that depth is approximately (Rp/R*) squared."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  rv-transit-combined:
    path: /assets/images/module-01/lec12/rv-transit-combined-gemini.png
    caption: "**What to notice:** radial velocity gives planet mass (or minimum mass), transit gives radius; together they give density — a first clue to rocky vs gas/ice composition."
    alt: "Three-step schematic showing radial velocity measuring stellar wobble to infer planet mass, transit measuring brightness dip to infer planet radius, and combining them to compute density and infer whether a planet is rocky or gas/ice-rich."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  habitable-zone:
    path: /assets/images/module-01/lec12/habitable-zone-gemini.png
    caption: "**What to notice:** habitable zone distance depends on stellar luminosity — brighter stars push the zone outward, dimmer stars pull it inward — and the zone is not a guarantee of habitability."
    alt: "Two-panel diagram comparing the habitable zone around a Sun-like star versus a dimmer star, showing that the habitable zone shifts closer for dim stars and farther out for brighter stars, with labels for too hot and too cold regions."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  greenhouse-comparison:
    path: /assets/images/module-01/lec12/greenhouse-comparison.png
    caption: "**What to notice:** Venus, Earth, and Mars start at similar equilibrium temperatures (set by distance and albedo), but the greenhouse effect adds vastly different amounts of warming — over 500 K for Venus, 33 K for Earth, and only 8 K for Mars."
    alt: "Bar chart comparing equilibrium temperature versus actual surface temperature for Venus, Earth, and Mars, with the greenhouse warming difference highlighted for each planet."
    credit: "ASTR 201 (generated)"
    module: 1

  earth-energy-balance-blackbodies:
    path: /assets/images/module-01/lec12/energy_breakdown.png
    caption: "**What to notice:** the Sun's emission peaks in visible light (short wavelength), while Earth's emission peaks in the infrared (long wavelength). Greenhouse gases absorb selectively in the infrared, which is why the atmosphere is transparent to sunlight but opaque to Earth's thermal emission."
    alt: "Plot showing two blackbody curves — one for the Sun peaking in the visible and one for Earth peaking in the infrared — with shaded regions indicating greenhouse gas absorption bands in the infrared."
    credit: "NOAA JetStream"
    module: 1

  exoplanet-radius-vs-period:
    path: /assets/images/module-01/lec12/nea_scatter_PS_output_pl_orbper_pl_rade_pres.png
    caption: "**What to notice:** detected planets cluster at short periods because transits are more likely and repeat faster there. This map is powerful, but it is detection-biased rather than a complete census."
    alt: "Scatter plot of confirmed exoplanets with orbital period in days on the x-axis and planet radius in Earth radii on the y-axis (both logarithmic), symbol-coded by discovery method, with solar-system planets marked for comparison."
    credit: "NASA Exoplanet Archive (exported 2026-02-26)"
    module: 1

  exoplanet-insolation-vs-period:
    path: /assets/images/module-01/lec12/nea_scatter_PS_output_pl_orbper_pl_insol_pres.png
    caption: "**What to notice:** average stellar flux drops with orbital period, but planets at the same period can sit at very different fluxes because host stars have different luminosities."
    alt: "Scatter plot of confirmed exoplanets with orbital period in days on the x-axis and insolation flux in Earth-flux units on the y-axis (both logarithmic), color-coded by discovery method."
    credit: "NASA Exoplanet Archive (exported 2026-02-26)"
    module: 1

  exoplanet-radius-vs-mass:
    path: /assets/images/module-01/lec12/nea_scatter_PS_output_pl_masse_pl_rade_pres.png
    caption: "**What to notice:** mass plus radius constrains composition. Reference curves for iron, silicate rock, and water show why radius alone cannot uniquely identify what a planet is made of."
    alt: "Scatter plot of confirmed exoplanets with planet mass in Earth masses on the x-axis and planet radius in Earth radii on the y-axis, including reference composition curves and solar-system planet markers."
    credit: "NASA Exoplanet Archive (exported 2026-02-26)"
    module: 1

  # --------------------------------------------------------------
  # Module 1: Lecture 13 (Are We Alone? — Synthesis)
  # --------------------------------------------------------------

  drake-equation-framework:
    path: /assets/images/module-01/lec13/drake-equation-framework-gemini.png
    caption: "**What to notice:** The Drake Equation is a framework — a product of factors. The first few terms are astronomy-constrained; the later terms are still unknown."
    alt: "Graphic showing the Drake Equation N = R* × f_p × n_e × f_l × f_i × f_c × L with icons for each term; the first three terms are labeled constrained (evidence-informed) and the last four terms are labeled unknown."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  drake-terms-measured-vs-unknown:
    path: /assets/images/module-01/lec13/drake-equation-terms-gemini.png
    caption: "**What to notice:** Today, astronomy constrains $R_*$, $f_p$, and $n_e$ reasonably well — but $f_l$, $f_i$, $f_c$, and $L$ remain unknown."
    alt: "Two-column table titled 'The Drake Terms: Measured vs Unknown' listing R*, f_p, and n_e as mostly measurable today (astronomy-informed) and f_l, f_i, f_c, and L as unknown so far (biology and sociology)."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  drake-equation-scenarios:
    path: /assets/images/module-01/lec13/drake-equation-scenarios-gemini.png
    caption: "**What to notice:** Holding $R_*$, $f_p$, and $n_e$ fixed, changing $f_l$, $f_i$, $f_c$, and $L$ can swing $N$ by many orders of magnitude. The numbers shown are illustrative."
    alt: "Table comparing pessimistic, middle, and optimistic Drake-equation assumptions and resulting N, alongside a log-scale plot showing how N ranges from much less than 1 to tens of thousands."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  drake-expected-value:
    path: /assets/images/module-01/lec13/drake-equation-expected-value-meaning-gemini.png
    caption: "**What to notice:** $N$ is an expected value — a long-run average, not a guarantee. Values like $N \\ll 1$ can still produce rare ‘one-off’ cases."
    alt: "Three-panel graphic titled 'What Expected Value Means' showing examples for N much less than 1 (rare dot), N about 6 (several clusters), and N much greater than 1 (crowded network), emphasizing expected value as a statistical average."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  fermi-paradox:
    path: /assets/images/module-01/lec13/fermi-paradox-gemini.png
    caption: "**What to notice:** The Fermi Paradox is the mismatch between ‘big expected numbers’ and ‘no detections yet.’ Multiple explanations are possible — we don’t know which (if any) is right."
    alt: "Mind-map centered on 'Where is everybody?' with branches suggesting explanations such as life is rare, civilizations don’t last, we haven’t noticed, they aren’t interested in communicating, travel/communication is harder than we think, or we haven’t looked hard enough."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  stars-make-elements:
    path: /assets/images/module-01/lec13/stars-make-the-elements-gemini.png
    caption: "**What to notice:** Stars build the periodic table over generations. Fusion makes elements up to iron; supernovae and neutron star mergers make many heavier elements, enriching gas for later stars and rocky planets."
    alt: "Timeline-style diagram showing a star’s life stages producing H→He, He→C/O, and C/O→…→Fe, then explosions/mergers producing elements heavier than iron and enriching gas that forms new stars and rocky planets."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  module-1-concept-map:
    path: /assets/images/module-01/lec13/module-01-concept-map-gemini.png
    caption: "**What to notice:** Module 1’s toolkit (geometry, gravity, and light) is how we infer properties of worlds and stars we can’t touch — and it all feeds into exoplanets and the Drake Equation."
    alt: "Concept map titled 'Module 1 Concept Map (The Toolkit)' showing three circles labeled Geometry, Gravity, and Light feeding into 'How we know things we can’t touch,' with arrows toward Solar System, Climate and Exoplanets, and Drake Equation."
    credit: "(A. Rosen/Gemini — schematic)"
    module: 1

  # Spoilers 6-8: Multi-wavelength
  multi-wavelength-reality:
    path: /assets/images/module-01/multi-wavelength-reality-nblm.png
    caption: "**What to notice:** Same objects look completely different at different wavelengths because different emission mechanisms dominate. Radio = cold gas & magnetic fields; Optical = stellar surfaces & ionized gas; X-ray = million-degree plasma & shocks."
    alt: "Three-panel comparison showing astronomical objects at Radio (low energy <1 eV, cold gas and magnetic fields), Optical (mid energy 2-3 eV, stellar surfaces and ionized gas), and X-Ray (high energy >100 eV, million-degree plasma and shocks). Each panel shows different structures in the same cosmic objects."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # Spoiler 6: M51 optical vs radio
  m51-optical-radio:
    path: /assets/images/module-01/m51-optical-radio.png
    caption: "**What to notice:** Left (optical) shows stars and dust lanes. Right (radio/21-cm) shows cold neutral hydrogen gas. The distributions don't perfectly overlap—different wavelengths reveal different physical components."
    alt: "Side-by-side comparison of the Whirlpool Galaxy (M51): Left panel shows optical image with blue-white spiral arms (stars) and dark dust lanes. Right panel shows 21-cm radio emission in red/pink revealing the distribution of cold neutral hydrogen gas extending beyond the visible stellar disk."
    credit: "NASA/ESA/STScI/AURA (Optical); NRAO/AUI (Radio)"
    module: 1

  # Spoiler 7: Pillars of Creation
  pillars-hubble-jwst:
    path: /assets/images/module-01/pillars-hubble-jwst.png
    caption: "**What to notice:** Left (Hubble optical)—dark, opaque columns block visible light. Right (JWST infrared)—thousands of embedded newborn stars revealed. Infrared penetrates the dust that blocks optical light."
    alt: "Side-by-side comparison of the Pillars of Creation in the Eagle Nebula: Left panel shows Hubble optical image with dark opaque dust pillars against glowing gas. Right panel shows JWST near-infrared image revealing thousands of previously hidden stars embedded within and behind the pillars."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  cosmic-cliffs-jwst:
    path: /assets/images/common/cosmic-cliffs-jwst.png
    caption: "**What to notice:** the ridge is not a quiet landscape. It is a wall of gas and dust inside a star-forming region, and infrared imaging reveals dense structure plus many young stars that visible light would not show as clearly."
    alt: "JWST image of the Cosmic Cliffs showing a long jagged ridge of glowing orange-brown gas and dust below a blue star-filled background, with many bright young stars embedded around the ridge."
    module: 2

  # Spoiler 8: Crab Nebula multiwavelength
  crab-multiwavelength:
    path: /assets/images/module-01/crab-multiwavelength-chandra.jpg
    caption: "**What to notice:** The same supernova remnant looks completely different at each wavelength. Radio (red) = synchrotron from magnetic fields; Infrared (yellow) = warm dust; Optical (green) = ionized filaments; X-ray (blue/purple) = hot plasma and pulsar jets. Many windows, one truth."
    alt: "Composite image of the Crab Nebula with five individual wavelength views shown below: Radio (red, showing magnetic field structure), Infrared (yellow, warm dust), Optical (green, ionized gas filaments), Ultraviolet (blue), and X-ray (purple, hot plasma and central pulsar jets). The main image combines all wavelengths into a single colorful view."
    credit: "NASA/CXC/SAO"
    module: 1

  # Section 1.3: Decoder Ring
  decoder-ring:
    path: /assets/images/module-01/decoder-ring-flowchart-nblm.png
    caption: "**What to notice:** The cycle that makes astronomy a science: Signal → Measurement → Model → Inference → Correction → back to Model. Failed predictions drive model revision."
    alt: "Circular flowchart titled 'The Astronomer's Decoder Ring' with Inference (Reality Revealed) at center. Four stages around the circle: Signal (photons arrive from distant objects), Measurement (flux and wavelength quantified through instruments), Model (apply physics like L=4πR²σT⁴), Correction (account for dust and distance). Caption: From photons to physical reality—this is the scientific method in action."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  decoding-the-cosmos-infographic:
    path: /assets/images/module-01/decoding-the-cosmos-infographic.png
    caption: "**What to notice:** A big-picture map of the course thesis: light → measurements → models → physical claims."
    alt: "Infographic titled 'Decoding the Cosmos: How Astronomers Turn Light into Reality' showing four observables (brightness, position, wavelength, timing) feeding into an inference pipeline and a 'decoder ring' that connects signals to inferences; includes callouts that pretty pictures are datasets, physics makes inference legal, wavelength maps to a temperature ladder, and distance is a time dial."
    module: 1

  # Section 1.4: Light properties
  energy-wavelength-connection:
    path: /assets/images/module-01/energy-wavelength-connection.png
    caption: "**What to notice:** E = hc/λ means shorter wavelength = higher energy. Wien's Law lets us calculate temperature from color: cool stars are red (~3,000 K), hot stars are blue (~30,000 K)."
    alt: "Two-part diagram: Top shows 'The Energy-Wavelength Connection' with equation E = hc/λ and wave illustration transitioning from red (long wavelength) to blue (short wavelength). Bottom shows 'The Temperature Signature' as a color gradient from cool red star (3,000 K) to hot blue star (30,000 K), noting Wien's Law allows temperature calculation from peak color."
    module: 1

  # Section 1.5: Lookback Time
  universe-time-machine:
    path: /assets/images/module-01/universe-time-machine-nblm.png
    caption: "**What to notice:** Distance is a time dial. Looking at the Moon = 1.3 seconds ago; the Sun = 8 minutes ago; Andromeda = 2.5 million years ago; distant galaxies = 10 billion years ago."
    alt: "Timeline showing lookback time: Earth (Now), Moon (1.3 seconds ago), Sun (8 minutes ago), Andromeda galaxy (2.5 million years ago), distant galaxies (10 billion years ago), and cosmic microwave background (Big Bang). Each object shown as thumbnail image above the timeline."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # Extra figures for context/motivation
  three-big-questions:
    path: /assets/images/module-01/three-big-questions-nblm.png
    caption: "**What to notice:** Three questions drive modern astronomy—and we answer all of them using the same method: inference from signals."
    alt: "Three circular images with questions: (1) How does the universe work? - Physics of the cosmos, (2) How did we get here? - Cosmic origins and evolution, (3) Are we alone? - Life in the universe. Footer states: We answer all three using the same superpower: Inference from signals."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  answering-big-questions:
    path: /assets/images/module-01/answering-the-big-questions-nblm.png
    caption: "**What to notice:** The tools we'll learn answer humanity's biggest questions: distance measurements give the universe's age, spectroscopy proves our stellar origins, atmospheric analysis searches for life."
    alt: "Three-panel diagram: Age of Universe (hourglass icon) - measuring distances to supernovae gives 13.8 billion years; Our Origins (atom icon) - spectroscopy proves iron in our blood was forged in stellar explosions; Are We Alone (planet icon) - we scan exoplanet atmospheres for biosignatures."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  interstellar-reddening:
    path: /assets/images/module-01/interstellar-reddening-nblm.png
    caption: "**What to notice:** Dust preferentially scatters blue light, making distant stars appear redder than they truly are. This 'reddening' must be corrected before inferring temperatures."
    alt: "Diagram showing interstellar reddening: a hot blue star emits light through a dust cloud (grains ~0.1 μm). Blue rays scatter away while red rays pass through, so observer sees a red star. Labels indicate Source (Hot/Blue), Dust Grain size, and Observer sees Red Star."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  logarithmic-cosmic-scales:
    path: /assets/images/module-01/logarithmic-cosmic-scales-gemini.png
    caption: "Cosmic Scales: A Powers of 10 Logarithmic Journey"
    alt: "Horizontal logarithmic scale from 10^-15 m (femto) to 10^26 m showing icons for atom, DNA helix, cell, grain of sand, human (reference point), mountain, Earth, Sun, solar system, Oort cloud/nearby stars, star cluster, Milky Way, local supercluster, and observable universe. Each step represents multiplication by 10."
    credit: "(A. Rosen/Gemini)"
    module: 1

  # Rubin Observatory First Light
  lsst-cosmic-treasure-chest:
    path: /assets/images/module-01/lsst-cosmic-treasure-chest-zoom.jpg
    caption: "**What to notice:** A single deep-field image contains thousands of galaxies at different distances—each a snapshot from a different cosmic era. This is Rubin Observatory's first light 'Cosmic Treasure Chest'."
    alt: "Deep-field image from Rubin Observatory showing thousands of galaxies of various shapes, sizes, and colors against the dark background of space. Spiral galaxies, elliptical galaxies, and distant faint objects are visible throughout the field."
    credit: "Rubin Observatory/NSF/AURA"
    module: 1

  # Cosmic Timeline
  universe-history-nasa:
    path: /assets/images/module-01/universe-history-nasa.png
    caption: "**What to notice:** The universe has a history. Inflation (10⁻³² s) → First Particles (1 μs) → First Nuclei (3 min) → First Light (380,000 yr) → First Stars (200 Myr) → Galaxies (400 Myr) → Dark Energy (10 Gyr) → Today (13.8 Gyr)."
    alt: "NASA timeline diagram titled 'History of the Universe' showing cosmic evolution as an expanding cone from left to right. Major epochs labeled: Inflation (initial expansion), First Particles (neutrons, protons, electrons form), First Nuclei (helium and hydrogen form), First Light (the first atoms form), First Stars (gas and dust condense), Galaxies & Dark Matter (galaxies form in dark matter cradles), Dark Energy (expansion accelerates), Today (humans observe the universe at 13.8 billion years)."
    credit: "NASA"
    module: 1

  # DESI 3D Galaxy Map
  desi-3d-map:
    path: /assets/images/module-01/DESI-Universe-3D-Map.jpg
    caption: "**What to notice:** The cosmic web—galaxies aren't scattered randomly. They cluster into filaments, walls, and voids. You are at the center; colors show distance (cyan = nearby, red = billions of light-years away). Gravity is still pulling these structures together."
    alt: "3D map of galaxy distribution from DESI showing the cosmic web structure. Galaxies form filaments and clusters connected by walls, with large voids between. Color gradient from cyan (nearby) through yellow to red (distant) shows lookback time up to 2.5 billion years. 'You Are Here' marks Earth's position at center."
    credit: "DESI Collaboration/NOIRLab/NSF/AURA/Kitt Peak"
    module: 1

  # Case Study A: Planetary Orbits
  planetary-orbit:
    path: /assets/images/module-01/planetary-orbit.png
    caption: "Planetary orbit with central star mass M and orbital radius r"
    alt: "Diagram showing a planet orbiting a star, with labels for stellar mass M and orbital distance r"
    module: 1

  case-a-orbits-1:
    path: /assets/images/module-01/case-A-planetary-orbits-dimensional-analysis-1.png
    caption: "Case Study A: Deriving orbital period from first principles"
    alt: "Diagram showing planetary orbit with star mass M and orbital radius r. Lists ingredients: Distance r with dimension [L], Star Mass M with dimension [M], Gravity G with dimension [M]^-1[L]^3[T]^-2. Target dimension: Time [T]."
    module: 1

  case-a-orbits-2:
    path: /assets/images/module-01/case-A-planetary-orbits-dimensional-analysis-2.png
    caption: "Recovering Kepler's Third Law through dimensional analysis"
    alt: "Three-step derivation: Step A (Kill Mass) - multiply G×M to get [L]^3[T]^-2, Step B (Kill Length) - divide by r^3 to get [T]^-2, Step C (Isolate Time) - invert and square root to get P ≈ √(r^3/GM). Result achieved with zero calculus."
    module: 1

  case-a-orbits-3:
    path: /assets/images/module-01/case-A-planetary-orbits-dimensional-analysis-3.png
    caption: "Physical interpretation of the orbital period formula"
    alt: "Explanation of P ≈ √(r³/GM) showing: The Mass Effect (larger M in denominator → stronger gravity → shorter year) and The Distance Effect (larger r in numerator → longer path and weaker gravity → much longer year). Connection to observation: squaring both sides gives P² ∝ r³, matching Kepler's empirical Third Law exactly."
    module: 1

  # Case Study B: Black Holes
  case-b-blackhole-1:
    path: /assets/images/module-01/case-B-black-hole-dimensional-analysis-nblm-1.png
    caption: "Case Study B: Finding the event horizon radius"
    alt: "Diagram with black hole illustration showing curved spacetime. Goal: Find Schwarzschild radius R_sch. Ingredients: Mass M [M], Gravity G [M]^-1[L]^3[T]^-2, Speed of Light c [L][T]^-1. Target dimension: Length [L]."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  case-b-blackhole-2:
    path: /assets/images/module-01/case-B-black-hole-dimensional-analysis-nblm-2.png
    caption: "Deriving the Schwarzschild radius through dimensional analysis"
    alt: "Solution logic: (1) Eliminate Mass: G×M → [L]^3[T]^-2, (2) Eliminate Time: divide by c² → [L], (3) Result: R_sch ≈ GM/c². Image of accretion disk around black hole. Note: General Relativity yields exactly this scaling factor."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # Case Study C: White Dwarfs
  case-c-whitedwarf-1:
    path: /assets/images/module-01/case-C-white-dwarf-dimensional-analysis-nblm-1.png
    caption: "Advanced Application: Degeneracy pressure in white dwarfs"
    alt: "Diagram showing compressed electrons in white dwarf. Explains that density is so high electrons are squeezed, quantum mechanics (ℏ) and electron mass (m_e) take over, temperature becomes irrelevant. Matching dimensions for pressure [M][L]^-1[T]^-2 using ℏ, m_e, and number density n gives P_deg ∝ ℏ²n^(5/3)/m_e."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  case-c-whitedwarf-2:
    path: /assets/images/module-01/case-C-white-dwarf-dimensional-analysis-nblm-2.png
    caption: "The counter-intuitive white dwarf mass-radius relation"
    alt: "Shows R ∝ M^(-1/3) derived by equating gravity (P ~ GM²/R⁴) with quantum pressure (P ~ ρ^(5/3)). Diagram compares stellar evolution path and white dwarf sizes: a 0.6 M☉ white dwarf is Earth-sized while a 1.2 M☉ white dwarf is significantly SMALLER than Earth. More mass = smaller size."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  powers-of-ten:
    path: /assets/images/module-01/powers-of-ten.png
    caption: "Cosmic scales span over 40 orders of magnitude"
    alt: "Logarithmic scale showing sizes from atomic nucleus to observable universe"
    module: 1

  inverse-square-law:
    path: /assets/images/module-01/inverse-square-law-gemini.png
    caption: "Brightness & the Inverse-Square Law: Double the distance → 4× the area → ¼ the flux"
    alt: "Spherical geometry diagram showing light from a central source spreading over increasing surface area. At radius r, area is 4πr². At radius 2r, area is 16πr², so flux drops to 1/4. Equations show F(r) = L/4πr² and F(2r) = F(r)/4."
    credit: "(A. Rosen/Gemini)"
    module: 1

  kepler-orbits:
    path: /assets/images/module-01/kepler-orbits.png
    caption: "Kepler's laws of planetary motion"
    alt: "Elliptical orbit diagram showing equal areas in equal times"
    module: 1

  kepler-1st-law-ellipse:
    path: /assets/images/module-01/lec05/kepler-1st-law-ellipse-focus.svg
    caption: "What to notice: planetary orbits are ellipses, and the Sun sits at one focus (not at the center)."
    alt: "Diagram of an elliptical orbit with the Sun drawn at one focus and the other focus marked. The closest point (perihelion) and farthest point (aphelion) are labeled, and the semimajor axis a is shown."
    credit: "(A. Rosen/Codex)"
    module: 1

  kepler-2nd-law-equal-areas:
    path: /assets/images/module-01/lec05/kepler-2nd-law-equal-areas.svg
    caption: "What to notice: equal areas are swept out in equal times; the planet moves faster near perihelion and slower near aphelion."
    alt: "Diagram of an elliptical orbit with the Sun at one focus and two shaded regions of equal area swept out by the Sun-to-planet line during equal time intervals. The perihelion region spans a longer arc than the aphelion region."
    credit: "(A. Rosen/Codex)"
    module: 1

  kepler-1st-law-eccentricity-variants:
    path: /assets/images/module-01/lec05/kepler-1st-law-eccentricity-variants.svg
    caption: "What to notice: eccentricity e controls how stretched an orbit is—and how far the focus (where the Sun sits) is from the center."
    alt: "Three-panel diagram comparing orbits with e=0, e=0.3, and e=0.6, each with the center marked and the Sun shown at a focus (with foci coinciding for the circle)."
    credit: "(A. Rosen/Codex)"
    module: 1

  # ==============================================================
  # Lecture 05: Kepler’s Laws (additional figures)
  # ==============================================================

  retrograde-motion-mars:
    path: /assets/images/module-01/lec05/retrograde-motion-mars.svg
    caption: "What to notice: retrograde is apparent motion against the star background — Earth passes Mars, so our line of sight temporarily sweeps backward."
    alt: "Two-panel diagram: Mars positions trace a loop against background stars, with the retrograde segment highlighted; a top-down view shows Earth overtaking Mars and the changing lines of sight that produce the apparent reversal."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  ptolemaic-epicycles:
    path: /assets/images/module-01/lec05/ptolemaic-epicycles.svg
    caption: "What to notice: epicycle + deferent can reproduce retrograde-like backtracking while preserving the assumption of circular motion around Earth."
    alt: "Diagram with Earth at the center, a large deferent circle, and a smaller epicycle circle carrying the planet; arrows show how the combined motion can create an apparent backward drift."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  kepler-third-law-graph:
    path: /assets/images/module-01/lec05/kepler-third-law-graph.svg
    caption: "What to notice: on a log–log plot, Kepler’s Third Law is a straight line — the slope (3/2) encodes the exponent."
    alt: "Log–log plot of orbital period versus semimajor axis for the eight planets. The points fall on a straight line with slope 3/2, illustrating the power-law relationship between period and distance for Solar System orbits."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  kepler-third-law-linear:
    path: /assets/images/module-01/lec05/kepler-third-law-linear.svg
    caption: "What to notice: on linear axes, Kepler’s Third Law looks curved — and the inner planets bunch up near the origin."
    alt: "Linear-axis plot of orbital period P versus semimajor axis a for the eight planets. The curve rises steeply for outer planets, and an inset zoom shows the inner planets (up to 2 AU and 2.5 years) more clearly."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  kepler-third-law-loglog:
    path: /assets/images/module-01/lec05/kepler-third-law-graph.svg
    caption: "What to notice: on a log–log plot, Kepler’s Third Law becomes a straight line — the slope (3/2) encodes the exponent."
    alt: "Log–log plot of orbital period P versus semimajor axis a for the eight planets. The points line up along a straight best-fit line with slope 3/2."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  orbits-historical-infographic-nblm:
    path: /assets/images/module-01/lec05/orbits-historical-infographic-nblm.webp
    caption: "What to notice: each revolution in astronomical thinking required abandoning an assumption — from Earth-centered (Ptolemy) to Sun-centered (Copernicus) to elliptical (Kepler)."
    alt: "Infographic showing the evolution of orbital models: Ptolemaic geocentric system with Earth at center and epicycles, Copernican heliocentric system with Sun at center and circular orbits, and Keplerian system with elliptical orbits and the Sun at one focus."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # ==============================================================
  # Lecture 06: Newton’s Gravity (figures)
  # ==============================================================

  newtons-cannon:
    path: /assets/images/module-01/lec06/newtons-cannon.svg
    caption: "What to notice: orbiting is falling — with enough sideways speed, you keep missing Earth."
    alt: "Newton’s cannon thought experiment: from a mountain, four projectiles are fired with increasing sideways speed, showing near crash, far crash, orbit (keeps missing Earth), and escape. A gravity arrow indicates inward pull on all paths."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  apple-and-moon:
    path: /assets/images/module-01/lec06/apple-and-moon.svg
    caption: "What to notice: the apple and the Moon are both pulled inward by gravity — the difference is sideways motion."
    alt: "Two panels: an apple falls straight down under gravity; the Moon also accelerates inward but has sideways velocity, so it keeps missing Earth and orbits."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  acceleration-direction-change:
    path: /assets/images/module-01/lec06/acceleration-direction-change.svg
    caption: "What to notice: changing direction changes velocity — so an object can accelerate even at constant speed."
    alt: "Circular-motion diagram showing velocity vectors tangent to the path at multiple points and an inward acceleration vector, demonstrating that direction change implies acceleration."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  centripetal-force-examples:
    path: /assets/images/module-01/lec06/centripetal-force-examples.svg
    caption: "What to notice: “centripetal” is a role, not a new force — gravity, tension, or friction can supply the required inward pull."
    alt: "Three-panel diagram showing an orbit (gravity inward), a ball on a string (tension inward), and a car turning (friction inward), each with an inward force arrow."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  gravity-equation-visual:
    path: /assets/images/module-01/lec06/gravity-equation-visual.svg
    caption: "What to notice: both masses pull with equal and opposite forces, and the force drops with distance squared."
    alt: "Two masses labeled m1 and m2 separated by distance r, with equal and opposite force arrows pointing inward. A callout shows F = G m1 m2 / r^2 and highlights the inverse-square dependence."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  inverse-square-diagram:
    path: /assets/images/module-01/lec06/inverse-square-diagram.svg
    caption: "What to notice: inverse-square comes from spreading over spherical area — double distance means 4× the area and 1/4 the per-area strength."
    alt: "Concentric spheres shown as circles at distances r, 2r, and 3r around a source. Labels show per-area strength decreasing as 1, 1/4, and 1/9 because surface area grows like r squared."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  free-fall-astronaut:
    path: /assets/images/module-01/lec06/free-fall-astronaut.svg
    caption: "What to notice: weight is the floor’s push (normal force) — in free fall there is gravity but no supporting push, so you feel weightless."
    alt: "Two panels: standing on Earth shows gravity down and a normal force up; in orbit, gravity still acts but there is no normal force because everything falls together."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  conic-sections-orbits:
    path: /assets/images/module-01/lec06/conic-sections-orbits.svg
    caption: "What to notice: inverse-square gravity produces conic-section paths — bound orbits (circle/ellipse) versus escape (parabola/hyperbola)."
    alt: "Four panels show trajectories around a central mass: circle (e=0), ellipse (0<e<1), parabola (e=1), and hyperbola (e>1). The central mass is shown at a focus and bound versus escape cases are labeled."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  # ==============================================================
  # Module 1: Cococubed figures (supplemental)
  # ==============================================================

  cococubed-center-of-mass-orbits:
    path: /assets/images/module-01/cococubed/center_of_mass.svg
    caption: "What to notice: both bodies orbit the shared center of mass, and the star’s orbit is smaller when it is more massive."
    alt: "Diagram showing a star and a planet connected by a line with a marked center of mass between them; both bodies trace orbits around that point."
    credit: "cococubed.com"
    module: 1

  cococubed-center-of-mass-location:
    path: /assets/images/module-01/cococubed/center_of_mass1.svg
    caption: "What to notice: the center of mass shifts toward the more massive body and can lie inside the star."
    alt: "Two panels comparing center-of-mass location for a smaller star and for a much larger star; the center of mass moves closer to the larger body."
    credit: "cococubed.com"
    module: 1

  cococubed-center-of-mass-examples:
    path: /assets/images/module-01/cococubed/center_of_mass2.svg
    caption: "What to notice: equal masses place the center of mass halfway; unequal masses move it toward the larger body."
    alt: "Three panels showing the center of mass for equal-mass stars, a 2M star with an M companion, and a star with a small planet where the center lies inside the star."
    credit: "cococubed.com"
    module: 1

  cococubed-angular-momentum-orbit:
    path: /assets/images/module-01/cococubed/conservation_angular_momentum_01.svg
    caption: "What to notice: when distance r is larger, speed v is smaller so angular momentum stays constant along the orbit."
    alt: "Elliptical orbit with a star at one focus, showing larger r with smaller v and smaller r with larger v, emphasizing angular momentum conservation."
    credit: "cococubed.com"
    module: 1

  cococubed-orbit-energy-conservation:
    path: /assets/images/module-01/cococubed/conservation_energy_orbit.svg
    caption: "What to notice: as r decreases, kinetic energy increases while gravitational potential energy decreases so total energy stays constant."
    alt: "Elliptical orbit labeled with larger r and slower speed on one side and smaller r with faster speed on the other, illustrating energy exchange."
    credit: "cococubed.com"
    module: 1

  cococubed-momentum-collision:
    path: /assets/images/module-01/cococubed/conservation_momentum_01.svg
    caption: "What to notice: momentum transfers between objects during a collision while total momentum is conserved."
    alt: "Before-and-after collision diagram: a moving ball strikes a stationary ball, and after collision the second ball moves while the first stops."
    credit: "cococubed.com"
    module: 1

  cococubed-coriolis-disk:
    path: /assets/images/module-01/cococubed/coriolis_effect.svg
    caption: "What to notice: on a rotating disk, motion appears to curve because different radii have different tangential speeds."
    alt: "Rotating disk with balls moving inward and outward, showing curved paths relative to the rotation due to differing linear speeds."
    credit: "cococubed.com"
    module: 1

  cococubed-escape-velocity-rocket:
    path: /assets/images/module-01/cococubed/escape_velocity.svg
    caption: "What to notice: adding energy raises an orbit, and enough energy produces an escape trajectory."
    alt: "Earth with a rocket in low orbit, a higher elliptical orbit after a burn, and an open escape path after a stronger burn."
    credit: "cococubed.com"
    module: 1

  cococubed-falling-to-orbit:
    path: /assets/images/module-01/cococubed/falling_toward_earth_to_orbit.svg
    caption: "What to notice: increasing sideways speed makes the fall land farther away; enough speed produces a circular orbit."
    alt: "Earth with a tower and multiple trajectories showing a person falling closer or farther and eventually orbiting with sufficient sideways speed."
    credit: "cococubed.com"
    module: 1

  cococubed-falling-to-orbit-trajectories:
    path: /assets/images/module-01/cococubed/falling_toward_earth_to_orbit02.svg
    caption: "What to notice: all trajectories curve toward Earth’s center; fast enough yields orbit or escape."
    alt: "Multiple projectile paths around Earth showing impacts, bound orbits, and unbound escape trajectories."
    credit: "cococubed.com"
    module: 1

  cococubed-kepler-first-law:
    path: /assets/images/module-01/cococubed/first_law.svg
    caption: "What to notice: an orbit is an ellipse with the Sun at one focus; the semimajor axis sets the size."
    alt: "Elliptical orbit labeled aphelion and perihelion with the Sun at one focus and the semimajor axis marked."
    credit: "cococubed.com"
    module: 1

  cococubed-gravity-curved-space:
    path: /assets/images/module-01/cococubed/gravity_as_curved_space.svg
    caption: "What to notice: Newton’s inverse-square law and Einstein’s curved spacetime are two descriptions of gravity, with different domains of use."
    alt: "Split illustration with a Newtonian orbit and F = G m1 m2 / r^2 on the left and a curved spacetime grid with Einstein’s field equation on the right."
    credit: "cococubed.com"
    module: 1

  cococubed-gravity-law:
    path: /assets/images/module-01/cococubed/gravity_law.svg
    caption: "What to notice: gravitational force depends on both masses and decreases with distance squared."
    alt: "Two masses labeled M1 and M2 separated by distance d with the formula F = G M1 M2 / d^2 shown between them."
    credit: "cococubed.com"
    module: 1

  cococubed-moon-falling:
    path: /assets/images/module-01/cococubed/moon_falling.svg
    caption: "What to notice: gravity pulls inward while velocity points sideways, producing an elliptical orbit."
    alt: "Earth with a Moon moving along an elliptical path, showing tangent velocity arrows and inward gravitational force arrows."
    credit: "cococubed.com"
    module: 1

  cococubed-ball-on-string:
    path: /assets/images/module-01/cococubed/newton_ball_on_string.svg
    caption: "What to notice: without inward force, circular motion becomes straight-line motion at constant velocity."
    alt: "Two panels: a ball on a string moving in a circle with an inward force, and after the string breaks the ball moves straight."
    credit: "cococubed.com"
    module: 1

  cococubed-orbit-types-simple:
    path: /assets/images/module-01/cococubed/orbit_types.svg
    caption: "What to notice: bound orbits are elliptical; escape paths are parabolic or hyperbolic."
    alt: "Central mass with three trajectory types labeled bound elliptical, unbound parabolic, and unbound hyperbolic."
    credit: "cococubed.com"
    module: 1

  cococubed-planet-orbits:
    path: /assets/images/module-01/cococubed/planet_orbits2.svg
    caption: "What to notice: the planets share nearly coplanar orbits, and the outer planets occupy much larger scales."
    alt: "Diagram of the Solar System showing labeled planetary orbits with inner and outer planet scales shown separately."
    credit: "cococubed.com"
    module: 1

  cococubed-retrograde-heliocentric:
    path: /assets/images/module-01/cococubed/retrograde_heliocentric.svg
    caption: "What to notice: apparent retrograde motion comes from Earth overtaking Mars in their heliocentric orbits."
    alt: "Heliocentric diagram of Earth and Mars orbits with numbered positions and the apparent retrograde path of Mars against background stars."
    credit: "cococubed.com"
    module: 1

  cococubed-rotation-curve-solar-system:
    path: /assets/images/module-01/cococubed/rotation_curve_b.svg
    caption: "What to notice: in the Solar System, orbital speed decreases with distance, following a Keplerian decline."
    alt: "Plot of orbital speed versus mean distance from the Sun in AU with labeled planets and a downward-sloping curve."
    credit: "cococubed.com"
    module: 1

  cococubed-kepler-second-law:
    path: /assets/images/module-01/cococubed/second_law.svg
    caption: "What to notice: equal areas are swept in equal times even though the shape of the swept region changes."
    alt: "Elliptical orbit with two red swept areas at perihelion and aphelion labeled as equal for the same time interval."
    credit: "cococubed.com"
    module: 1

  cococubed-tides-force-vectors:
    path: /assets/images/module-01/cococubed/tides_force_vectors.svg
    caption: "What to notice: the Moon’s gravity is stronger on the near side and weaker on the far side, stretching Earth into tidal bulges."
    alt: "Earth with tidal bulge shading and gravity arrows pointing toward the Moon, which is shown to the right."
    credit: "cococubed.com"
    module: 1

  cococubed-conic-sections:
    path: /assets/images/module-01/cococubed/types_of_orbits.svg
    caption: "What to notice: conic sections classify orbit types — circles and ellipses are bound; parabolas and hyperbolas are unbound."
    alt: "Two-part diagram showing orbit curves around a planet and a cone section graphic labeling circle, ellipse, parabola, and hyperbola."
    credit: "cococubed.com"
    module: 1

  cococubed-venus-geocentric-100yr:
    path: /assets/images/module-01/cococubed/venus_orbit_geocentric_100year.svg
    caption: "What to notice: Venus traces a repeating multi-lobed pattern in geocentric coordinates over long timescales."
    alt: "Plot of Venus position in geocentric coordinates over 100 years, forming a flower-like pattern centered near the origin."
    credit: "cococubed.com"
    module: 1

  # ==============================================================
  # Lecture 03: Sky Is a Map
  # ==============================================================

  constellations-are-projections:
    path: /assets/images/module-01/lec03/constellations-are-projections-gemini.webp
    caption: "**What to notice:** Constellations are patterns on the sky, not physical groupings; stars can be at very different distances."
    alt: "Illustration showing constellation lines drawn on stars, emphasizing that the pattern is a projection on the sky rather than a physical cluster."
    credit: "(A. Rosen/Gemini)"
    module: 1

  celestial-sphere-directions:
    path: /assets/images/module-01/lec03/celestial-sphere-gemini.webp
    caption: "Celestial sphere directions and local sky coordinates"
    alt: "Diagram of the celestial sphere showing cardinal directions and the observer’s horizon-based coordinate system."
