    module: 1

  celestial-sphere-reference-points:
    path: /assets/images/module-01/lec03/celestial-sphere-great-circles-chatgpt.webp
    caption: "Reference points and great circles on the celestial sphere"
    alt: "Diagram illustrating great circles and reference points on the celestial sphere used for defining coordinates."
    credit: "(A. Rosen/ChatGPT)"
    module: 1

  celestial-sphere-ecliptic:
    path: /assets/images/module-01/lec03/celestial-sphere-ecliptic-chatgpt.webp
