    alt: "Unit circle diagram comparing degree measures to radian measures and emphasizing arc length definition of radians."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # ==============================================================
  # Lecture 04: Moon Geometry (Phases + Eclipses)
  # ==============================================================

  moon-phases-not-shadows:
    path: /assets/images/module-01/lec04/moon-phases-misconception-nblm.webp
    caption: "**What to notice:** Moon phases are not caused by Earth’s shadow; phases are about which half of the Moon is lit and what part you can see."
    alt: "Graphic contrasting the incorrect idea that Earth’s shadow causes phases with the correct illumination-and-viewing-geometry explanation."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  moon-half-always-lit:
    path: /assets/images/module-01/lec04/moon-illumination-nblm.webp
    caption: "**What to notice:** At any moment, half of the Moon is illuminated by the Sun; the phase is the fraction of that lit half you can see from Earth."
    alt: "Diagram showing the Moon with one hemisphere illuminated by the Sun regardless of phase, emphasizing constant illumination geometry."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  moon-phase-cycle:
    path: /assets/images/module-01/moon_phases_cococubed.svg
    caption: "The moon phase cycle around Earth"
    alt: "Diagram showing the Moon orbiting Earth with labeled phases around the orbit."
    credit: "Cococubed"
    module: 1

  earth-moon-system:
    path: /assets/images/earth_moon_system02_cococubed.svg
    caption: "The Earth-Moon system: orbital geometry that creates phases and eclipses"
    alt: "Diagram showing Earth and the Moon's orbit, illustrating the geometry of the Earth-Moon system with orbital paths marked."
    credit: "Cococubed"
    module: 1

  moon-phases-synodic-month:
    path: /assets/images/module-01/lec04/moon-phases-synodic-month-nblm.webp
    caption: "Synodic month: why the phase cycle is not the same as the Moon’s orbital period"
    alt: "Diagram showing the Moon’s orbit around Earth combined with Earth’s orbit around the Sun, explaining why returning to the same phase takes longer than one orbit."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  moon-as-a-clock:
    path: /assets/images/module-01/lec04/moon-as-a-clock-nblm.webp
    caption: "Using the Moon’s phase as a rough clock"
    alt: "Diagram linking approximate Moon phase to time since new moon, emphasizing that phases progress predictably over the month."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  eclipses-when-shadows-matter:
    path: /assets/images/module-01/lec04/eclipses-when-shadows-matter-nblm.webp
    caption: "**What to notice:** Eclipses are about shadows (umbra/penumbra) and alignment; phases are not."
    alt: "Diagram showing Sun–Earth–Moon alignment cases that produce lunar and solar eclipses via shadows."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  eclipse-varieties:
    path: /assets/images/module-01/lec04/eclipse-varieties-nblm.webp
    caption: "Varieties of eclipses from alignment geometry"
    alt: "Diagram summarizing different eclipse types (solar and lunar) and the role of umbra and penumbra."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  eclipses-5deg-difference:
    path: /assets/images/module-01/lec04/eclipses-5deg-difference-nblm.webp
    caption: "Why eclipses don’t happen every month: the Moon’s orbit is tilted"
    alt: "Diagram showing the Moon’s orbital plane tilted relative to the ecliptic plane by a small angle, preventing perfect alignment most months."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  eclipses-nodes-why-not-monthly:
    path: /assets/images/module-01/lec04/eclipses-nodes-nblm.webp
    caption: "Orbital nodes: the alignment gateways for eclipses"
    alt: "Diagram illustrating the Moon’s ascending and descending nodes where its orbit crosses the ecliptic, and showing that eclipses require the Sun to be near a node at new/full moon."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  eclipses-nodes-gateways:
    path: /assets/images/module-01/lec04/eclipses-nodes-illustration-nblm.webp
    caption: "Nodes as eclipse “gateways” along the Moon’s orbit"
    alt: "Diagram highlighting the Moon’s nodes and showing how eclipse seasons occur when the Sun lies near a node direction."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  solar-eclipse-types-photo:
    path: /assets/images/module-01/lec04/partial-annular-total-solar-eclipses.jpg
    caption: "Solar eclipse types: partial, annular, and total"
    alt: "Three-panel photo/graphic showing partial, annular (ring), and total solar eclipses for visual comparison."
    credit: "Source: [VERIFY]"
    module: 1

  lunar-eclipse-blood-moon:
    path: /assets/images/module-01/lec04/lunar-eclipse-nblm.webp
    caption: "Total lunar eclipse (“blood moon”) from Earth’s atmospheric filtering"
    alt: "Illustration of a lunar eclipse showing Earth casting a shadow on the Moon, with an emphasis on the Moon appearing reddish during totality."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  # ==============================================================
  # Week 04 / Lecture 08: Temperature from Light (Blackbodies)
  # ==============================================================

  betelgeuse-size-eso:
    path: /assets/images/module-01/week-04/betelgeuse-size-eso.jpg
    caption: "What to notice: this ALMA millimeter-continuum image shows Betelgeuse—around 1400 times the Sun’s size in the millimeter continuum—with an overlay comparing it to the Solar System; it would engulf the inner planets and even Jupiter, while Saturn would remain beyond its surface."
    alt: "ALMA millimeter-continuum image of the red supergiant star Betelgeuse with an overlaid scale comparison to the Solar System, indicating Betelgeuse would engulf Mercury, Venus, Earth, Mars, and Jupiter, while Saturn would remain beyond the star’s surface."
    credit: "ESO/ALMA"
    module: 1

  multiwavelength-crab:
    path: /assets/images/module-01/crab-multiwavelength-chandra.jpg
    caption: "**What to notice:** The same object can look completely different at different wavelengths; each band highlights different physics."
    alt: "Composite/multi-panel view of the Crab Nebula at multiple wavelengths, where different structures are emphasized in different bands."
    credit: "NASA/CXC/SAO"
    module: 1

  lunar-eclipse-red:
    path: /assets/images/module-01/lec04/lunar-eclipse-nblm.webp
    caption: "What to notice: during a total lunar eclipse, sunlight filtered through Earth’s atmosphere illuminates the Moon, often giving it a reddish color."
    alt: "Illustration of a lunar eclipse showing Earth casting a shadow on the Moon, with emphasis on the Moon appearing reddish during totality."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  light-inverse-square:
    path: /assets/images/module-01/inverse-square-law-gemini.png
    caption: "What to notice: as distance increases, the same light spreads over a larger area, so intensity drops as 1/r²."
    alt: "Diagram illustrating the inverse-square law for light: the same total light spreads over larger spherical surfaces at greater distances, reducing intensity."
    credit: "(A. Rosen/Gemini)"
    module: 1

  electromagnetic-wave:
    path: /assets/images/module-01/week-04/em-wave-only-jwst.png
    caption: "What to notice: light is an electromagnetic wave—electric and magnetic fields oscillate at right angles while the wave travels forward."
    alt: "Diagram of an electromagnetic wave showing oscillating electric and magnetic fields perpendicular to each other and to the direction of propagation, with x, y, and z axes labeled."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  mechanical-vs-em-wave:
    path: /assets/images/module-01/week-04/mechanical-vs-em-wave-jwst.png
    caption: "What to notice: both mechanical waves and electromagnetic waves have wavelength, but EM waves do not require a material medium."
    alt: "Side-by-side diagram comparing a mechanical wave with a labeled wavelength to an electromagnetic wave with labeled electric and magnetic fields."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  em-spectrum-full:
    path: /assets/images/module-01/week-04/em-spectrum-astro-objects-jwst.png
    caption: "What to notice: the electromagnetic spectrum is much bigger than visible light; different wavelength bands reveal different kinds of astronomical objects and physics."
    alt: "Infographic of the electromagnetic spectrum from gamma rays to radio, with visible light highlighted and short descriptions of example astronomical sources in each band."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  em-spectrum-jwst:
    path: /assets/images/module-01/week-04/em-spectrum-jwst.png
    caption: "What to notice: visible light is a tiny slice of the electromagnetic spectrum, between ultraviolet and infrared."
    alt: "Graphic of the electromagnetic spectrum labeled gamma ray through radio, with a narrow visible-light band marked between 380 and 780 nanometers."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  wavelength-energy:
    path: /assets/images/module-01/week-04/wavelength-energy-jwst.png
    caption: "What to notice: shorter wavelength means higher photon energy; moving from red to violet increases energy."
    alt: "Visible-light spectrum bar labeled roughly 400 to 700 nanometers with arrows indicating higher energy at shorter wavelengths (ultraviolet side) and lower energy at longer wavelengths (infrared side)."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  prism-spectrum-jwst:
    path: /assets/images/module-01/week-04/prism-spectrum-jwst.png
    caption: "What to notice: white light contains many wavelengths; a prism separates them into a spectrum from ultraviolet through visible into infrared."
    alt: "Diagram of sunlight entering a prism and emerging as a spread-out rainbow spectrum, with ultraviolet below and infrared above the visible band indicated."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  atmospheric-transmission-windows:
    path: /assets/images/module-01/week-04/EMS_Diagram_NASA.jpg
    caption: "What to notice: Earth is transparent mainly in two windows (optical and radio), so many wavelengths require space telescopes."
    alt: "Electromagnetic spectrum diagram with wavelength and frequency scales plus an atmospheric transmission curve showing strong opacity at many wavelengths and two major windows in optical and radio."
    credit: "NASA"
    module: 1

  light-matter-interactions:
    path: /assets/images/module-01/week-04/light-matter-interactions-jwst.png
    caption: "What to notice: light can be absorbed, emitted, transmitted, reflected, or refracted—those interactions are how spectra are made."
    alt: "Row of five panels labeled absorption, emission, transmission, reflection, and refraction, each showing a light ray interacting with a material."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  types-of-spectra-jwst:
    path: /assets/images/module-01/week-04/types-of-spectra-jwst.png
    caption: "What to notice: three common spectra—continuous, emission-line, and absorption-line—come from different physical setups."
    alt: "Illustration showing a continuous light source producing a continuous spectrum, a cloud of gas producing an emission spectrum, and light passing through gas producing an absorption spectrum."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  absorption-emission-spectra-jwst:
    path: /assets/images/module-01/week-04/absorption-emission-spectra-jwst.png
    caption: "What to notice: absorption and emission lines occur at the same wavelengths for a given element—same atomic fingerprints, seen in opposite ways."
    alt: "Chart comparing absorption and emission spectra for several elements (including sodium, nitrogen, hydrogen, and oxygen) across the visible wavelength range."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  altair-spectrum-jwst:
    path: /assets/images/module-01/week-04/altair-spectrum-jwst.png
    caption: "What to notice: a spectrum can be shown as both an image (colored strip) and a graph; the dips and features are where atoms absorb light."
    alt: "Graphic showing a spectrum as a colored strip and as a plotted curve of brightness versus wavelength, with absorption features highlighted and labeled."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  doppler-shift-star-jwst:
    path: /assets/images/module-01/week-04/doppler-shift-star-jwst.png
    caption: "What to notice: Doppler shift moves spectral lines—toward blue for motion toward us and toward red for motion away—so spectra can measure motion."
    alt: "Diagram illustrating Doppler shift of starlight, with spectral features shifted toward shorter wavelengths (blueshift) or longer wavelengths (redshift) depending on motion."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  reflectance-spectra-earth-jwst:
    path: /assets/images/module-01/week-04/reflectance-spectra-earth-jwst.png
    caption: "What to notice: reflectance spectra can reveal surface and atmospheric materials by showing which wavelengths are absorbed or reflected."
    alt: "Plot comparing reflectance as a function of wavelength for different materials or surfaces associated with Earth, showing distinct spectral shapes."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  absorption-of-light-hydrogen-jwst:
    path: /assets/images/module-01/week-04/absorption-of-light-hydrogen-jwst.png
    caption: "What to notice: when cooler hydrogen gas sits in front of a hotter source, it absorbs specific wavelengths—creating dark absorption lines."
    alt: "Diagram showing a light source shining through a region of hydrogen gas, producing a spectrum with dark absorption lines at specific wavelengths."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  emission-of-light-hydrogen-jwst:
    path: /assets/images/module-01/week-04/emission-of-light-hydrogen-jwst.png
    caption: "What to notice: a hot, low-density hydrogen gas emits light at specific wavelengths—creating bright emission lines."
    alt: "Diagram showing a cloud of hydrogen gas emitting light, producing a spectrum with bright emission lines at specific wavelengths."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  sun-spectrum-green:
    path: /assets/images/module-01/week-04/lightbulb-vs-sun-spectrum-jwst.png
    caption: "What to notice: the Sun’s spectrum is broad (a smooth-ish continuum), not a narrow spike at one color—so the mix of wavelengths looks white/yellow-white."
    alt: "Comparison graphic showing the Sun and a fluorescent light bulb with their spectra plotted versus wavelength; the Sun’s spectrum is broad while the bulb shows distinct peaks."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  blackbody-spectrum-temps:
    path: /assets/images/module-01/week-04/blackbody-spectra-jwst.jpg
    caption: "What to notice: hotter objects peak at shorter wavelengths and emit more total light; cooler objects peak at longer wavelengths."
    alt: "Graph of blackbody curves for stars of different temperatures, showing the peak shifting to shorter wavelengths for hotter stars and to longer wavelengths for cooler stars."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  star-colors-temperature:
    path: /assets/images/module-01/lec08/ngc-6355-colors-of-stars-nasa-esa-hubble.webp
    caption: "What to notice: the globular cluster NGC 6355 shows stars of many colors — blue, white, yellow, orange, and red — each color directly reflecting the star's surface temperature via Wien's Law."
    alt: "Hubble Space Telescope image of the globular cluster NGC 6355 showing a dense field of stars in a range of colors from blue-white through yellow to orange-red, illustrating the relationship between star color and temperature."
    credit: "NASA, ESA, Hubble"
    module: 1

  # ==============================================================
  # Lectures 07–10: Light → Spectra → Doppler (SVG + registry aliases)
  # ==============================================================

  rayleigh-scattering-sky:
    path: /assets/images/module-01/lec07/rayleigh-scattering-nblm.png
    caption: "What to notice: short-wavelength (blue) light scatters much more than long-wavelength (red) light, filling the sky with scattered blue photons."
    alt: "Cross-section schematic of sunlight entering Earth’s atmosphere where blue light is scattered in many directions by air molecules while red light mostly continues forward; an observer sees scattered blue from the sky."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  rayleigh-scattering-nblm:
    path: /assets/images/module-01/lec07/rayleigh-scattering-nblm.png
    caption: "What to notice: short-wavelength (blue) light scatters much more than long-wavelength (red) light, so scattered blue light dominates the daytime sky."
    alt: "Rayleigh-scattering diagram showing sunlight entering Earth’s atmosphere, with blue light scattered in many directions and red light traveling more directly along the incoming path."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  rayleigh-scattering-gemini:
    path: /assets/images/module-01/week-04/rayleigh-scattering-gemini.png
    caption: "What to notice: in real sky observations, shorter wavelengths scatter more, producing blue daytime skies and redder light when path length through atmosphere is long."
    alt: "Educational sky-scattering visual showing how blue light scatters strongly through the atmosphere while redder light remains more direct along longer paths."
    credit: "Gemini Observatory"
    module: 1

  sunset-scattering:
    path: /assets/images/module-01/lec07/rayleigh-scattering-nblm.png
    caption: "What to notice: at sunset, sunlight travels through much more atmosphere; blue light scatters out along the long path, leaving redder light to reach you."
    alt: "Two-panel schematic comparing noon (short atmospheric path) and sunset (long atmospheric path); blue light scatters out more during the longer sunset path so the remaining direct light is redder."
    credit: "(A. Rosen/NotebookLM)"
    module: 1

  sun-flare-sdo:
    path: /assets/images/module-01/lec08/Sun_Emits_Flare_NASA_SDO.jpeg
    caption: "What to notice: the Sun's surface (photosphere) glows because of its ~5800 K temperature — this is thermal radiation. The bright flares show localized regions of extreme heating, with magnetic loops visible at the limb."
    alt: "NASA Solar Dynamics Observatory image of the Sun showing its glowing photosphere in extreme ultraviolet light, with bright solar flares and magnetic loop structures visible at the surface and limb."
    credit: "NASA/SDO"
    module: 1

  hr-diagram-eso:
    path: /assets/images/module-01/lec08/hr-diagram-eso.jpg
    caption: "What to notice: the H-R diagram plots luminosity vs. temperature; most stars fall on the main sequence, while giants (upper right) and white dwarfs (lower left) occupy separate regions. Star size and color vary systematically with position."
    alt: "ESO Hertzsprung-Russell diagram showing luminosity versus surface temperature, with the main sequence running diagonally, giants and supergiants in the upper right, and white dwarfs in the lower left. Stars are depicted as colored spheres whose size and color reflect their physical properties."
    credit: "ESO"
    module: 1

  ngc6355-star-colors:
    path: /assets/images/module-01/lec08/ngc-6355-colors-of-stars-nasa-esa-hubble.webp
    caption: "What to notice: in the globular cluster NGC 6355, star colors range from blue-white (hot) through yellow to orange-red (cool) — Wien's Law in one image."
    alt: "Hubble Space Telescope image of the dense globular cluster NGC 6355 showing thousands of stars in a range of colors from blue-white through yellow to orange-red."
    credit: "NASA, ESA, Hubble"
    module: 1

  jwst-spectroscopy-density:
    path: /assets/images/module-01/lec08/jwst-spectroscopy-1.png
    caption: "What to notice: spectral lines carry information beyond composition — line widths reveal surface gravity and density. A giant star (low density) has narrow lines, while a white dwarf (high density) has broadened lines due to intense surface pressure."
    alt: "JWST infographic comparing the spectra of a blue giant (large, low-density star with narrow spectral lines) and a white dwarf (small, high-density star with broad spectral lines), illustrating how spectral line width depends on surface pressure and density."
    credit: "NASA, ESA, CSA"
    module: 1

  photosphere-line-formation:
    path: /assets/images/module-01/lec08/photosphere_line_formation-cococubed.svg
    caption: "What to notice: the photosphere is the layer where photons finally escape the star. Below it, the star is opaque and radiation is thermalized (blackbody). Absorption lines form as photons pass through the cooler outer layers."
    alt: "Diagram showing photosphere line formation in a stellar atmosphere, with the hot opaque interior producing a blackbody continuum and the cooler outer layers imprinting absorption lines."
    credit: "cococubed.com"
    module: 1

  betelgeuse-eso:
    path: /assets/images/module-01/lec08/betelgeuse-eso.jpg
    caption: "What to notice: Betelgeuse is a red supergiant with a surface temperature of only ~3500 K, yet its luminosity is ~100,000 L☉ — the ratio method reveals it must be ~880 times the Sun's radius."
    alt: "ESO image of the red supergiant star Betelgeuse showing its resolved surface and extended atmosphere."
    credit: "ESO"
    module: 1

  fraunhofer-lines:
    path: /assets/images/module-01/lec09/fraunhofer-lines.svg
    caption: "What to notice: the solar spectrum is crossed by dark absorption lines at specific wavelengths. Each line is labeled with its Fraunhofer letter and the element responsible — hydrogen (Hα, Hβ, Hδ), sodium (D doublet), calcium (H & K), iron, and magnesium. These are the chemical fingerprints of atoms in the Sun's atmosphere."
    alt: "Visible solar spectrum from 380 to 750 nm crossed by dark absorption lines at scientifically correct wavelengths, with major Fraunhofer lines labeled by letter designation and absorbing element."
    credit: "Illustration: A. Rosen"
    module: 1

  kirchhoff-three-laws:
    path: /assets/images/module-01/week-04/types-of-spectra-jwst.png
    caption: "What to notice: continuous, emission-line, and absorption-line spectra come from different physical setups (Kirchhoff’s three laws)."
    alt: "Illustration showing a continuous spectrum, an emission-line spectrum from hot thin gas, and an absorption-line spectrum produced when light passes through cooler gas."
    credit: "Illustration: NASA, ESA, CSA"
    module: 1

  energy-level-ladder:
    path: /assets/images/module-01/lec09/energy-level-ladder.svg
    caption: "What to notice: energy levels in atoms are rungs, not a ramp; only specific energy gaps are allowed, so only specific photon energies (wavelengths) appear."
    alt: "Two-panel diagram comparing quantized energy levels shown as ladder rungs to an incorrect continuous ramp, highlighting that discrete levels produce discrete photon energies."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  hydrogen-energy-levels:
    path: /assets/images/module-01/lec09/hydrogen-energy-levels.svg
    caption: "What to notice: hydrogen's energy levels get closer together as n increases; drops to n = 2 produce the visible Balmer lines."
    alt: "Hydrogen energy-level diagram with labeled levels and arrows for transitions to n=2 (Balmer series), annotated with representative line names and wavelengths."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  morgan-keenan-classification:
    path: /assets/images/module-01/lec09/800px-Morgan-Keenan_spectral_classificatio.max-1000x1000.png
    caption: "What to notice: the Morgan–Keenan system classifies stars by spectral type (O through M) and luminosity class. Hotter stars are bluer and more luminous; cooler stars are redder and dimmer. Size differences between giants and dwarfs are dramatic."
    alt: "Chart showing the Morgan–Keenan spectral classification system with representative stars arranged by spectral type (O, B, A, F, G, K, M) and luminosity class, illustrating color and size differences from hot blue supergiants to cool red dwarfs."
    credit: "Wikimedia Commons (public domain)"
    module: 1

  obafgkm-spectra-noao:
    path: /assets/images/module-01/lec09/obafgkm_noao_big.jpg
    caption: "What to notice: real stellar spectra change dramatically across spectral types. Hot O stars show few lines (ionized gas); A stars show strong hydrogen Balmer lines; cool M stars show broad molecular absorption bands. The pattern reflects temperature, not composition."
    alt: "Montage of real stellar spectra from the National Optical Astronomy Observatory showing spectral types O6.5 through M5, with absorption lines and molecular bands changing systematically with temperature."
    credit: "NOAO/AURA/NSF"
    module: 1

  energy-radiation-breakdown:
    path: /assets/images/module-01/lec09/energy_breakdown.png
    caption: "What to notice: incoming solar radiation is partially reflected, partially absorbed by the atmosphere, and partially absorbed by the surface. Outgoing radiation is emitted as infrared from the surface and atmosphere. The balance between incoming and outgoing determines equilibrium temperature."
    alt: "Diagram showing the breakdown of incoming solar radiation and outgoing thermal radiation for a planet, with arrows indicating reflection, atmospheric absorption, surface absorption, and infrared emission."
    module: 1

  harvard-computers:
    path: /assets/images/module-01/lec09/harvard-computers.jpg
    caption: "What to notice: the women of the Harvard Observatory — including Williamina Fleming, Annie Jump Cannon, and Cecilia Payne — classified hundreds of thousands of stellar spectra by hand, creating the system we still use today."
    alt: "Historical photograph of the Harvard Computers, a group of women astronomers at Harvard College Observatory in the late 1800s who classified stellar spectra and made foundational contributions to astrophysics."
    credit: "Harvard College Observatory"
    module: 1

  hr-diagram-preview:
    path: /assets/images/module-01/lec08/hr-diagram-eso.jpg
    caption: "What to notice: the H-R diagram maps stars by temperature and luminosity; the main sequence, giants, and white dwarfs occupy distinct regions."
    alt: "ESO Hertzsprung-Russell diagram plotting stellar luminosity versus temperature, with the main sequence running diagonally, giants and supergiants in the upper right, and white dwarfs in the lower left."
    credit: "ESO"
    module: 1

  radial-vs-transverse:
    path: /assets/images/module-01/lec10/radial-vs-transverse.svg
    caption: "What to notice: Doppler shifts measure only line-of-sight (radial) velocity; purely sideways (transverse) motion produces no wavelength shift."
    alt: "Two-panel diagram showing a star moving toward or away from an observer produces a shifted spectral line, while a star moving sideways shows the same spectral line."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  radial-velocity-method:
    path: /assets/images/module-01/lec10/radial-velocity-method.svg
    caption: "What to notice: an orbiting planet makes its star wobble; the star’s back-and-forth line-of-sight motion produces a periodic Doppler signal."
    alt: "Two-panel diagram showing star–planet orbits about a barycenter and a corresponding sinusoidal radial-velocity curve labeled for approaching and receding motion."
    credit: "Illustration: A. Rosen (SVG)"
    module: 1

  galaxy-rotation-curve:
    path: /assets/images/module-01/cococubed/rotation_curve_b.svg
    caption: "What to notice: galaxy rotation curves stay flat at large radii — visible matter alone would predict a decline, so extra mass is implied."
    alt: "Plot comparing expected Keplerian decline in orbital speed with observed flat galaxy rotation curve as radius increases."
    credit: "Figure: CoCoCubed (SVG)"
    module: 1

  # ==============================================================
  # Module 2: Inferring Star Properties
  # ==============================================================

  anatomy-of-the-sun:
    path: /assets/images/module-02/anatomy-of-the-sun.png
    caption: "What to notice: the Sun is layered because different physical jobs happen in different regions. Fusion is confined to the core, energy moves outward through radiative and convective zones, and the photosphere, chromosphere, and corona are the observable outer layers."
    alt: "Annotated cutaway diagram of the Sun showing its interior and atmosphere, including the core, radiative zone, convective zone, photosphere, chromosphere, and corona, with labels indicating that fusion happens in the core and solar activity originates in the outer layers."
    module: 2

  solar-hydrostatic-equilibrium:
    path: /assets/images/module-02/stellar-stability-hse.png
    caption: "What to notice: the Sun remains stable only because inward gravity is balanced by outward pressure. Fusion keeps renewing that pressure, so the star behaves like a self-regulating thermostat rather than collapsing all at once."
    alt: "Infographic cutaway of the Sun showing blue arrows of gravity pointing inward, orange arrows of pressure pushing outward, and labels explaining hydrostatic equilibrium and the solar thermostat."
    module: 2

  solar-mass-energy-equivalence:
    path: /assets/images/module-02/e-mc2-infographic.png
    caption: "What to notice: when four protons become one helium nucleus, the tiny missing mass does not vanish. It becomes energy, which is why a star can shine for billions of years."
    alt: "Infographic showing four protons fusing into a helium nucleus, with a highlighted mass difference converted into energy according to E equals mc squared, plus notes connecting this to stellar power and human fusion research."
    module: 2

  solar-quantum-tunneling:
    path: /assets/images/module-02/fusion-quantum-tunneling.png
    caption: "What to notice: classically, the Sun's core is too cool for protons to fuse easily. Quantum tunneling lets some proton pairs penetrate the Coulomb barrier anyway, making stellar fusion possible."
    alt: "Infographic comparing the Sun's core temperature to the much higher classical fusion threshold and illustrating protons tunneling through the electrostatic barrier because of quantum mechanics."
    module: 2

  solar-butterfly-diagram:
    path: /assets/images/module-02/sporer-butterfly-diagram.png
    caption: "What to notice: sunspots do not appear at random. Early in each cycle they emerge at mid-latitudes, then drift toward the equator, revealing the organized rhythm of the Sun's magnetic field."
    alt: "Data-first infographic of the Sporer butterfly diagram showing sunspot latitude versus time across two solar cycles, with sunspot bands starting near plus or minus 30 to 40 degrees and drifting toward the equator; includes a small solar inset in the corner."
    module: 2

  parallax-geometry-cococubed:
    path: /assets/images/module-02/parallax1-cococubed.svg
    caption: "What to notice: the nearby star appears to shift only because Earth observes it from opposite sides of its orbit. The parallax angle is half the full swing, and more distant stars make smaller triangles."
    alt: "Geometry diagram of stellar parallax showing Earth at two positions in its orbit, a nearby star above the orbital circle, distant background stars, and sight lines that define a small parallax angle at the star."
    credit: "cococubed.com"
    module: 2

  bright-star-problem-module2:
    path: /assets/images/module-02/bright-star-problem.svg
    caption: "What to notice: a bright-looking star is an ambiguous clue. It could be nearby, intrinsically powerful, or both. Astronomy becomes a science when we separate those possibilities."
    alt: "Three-panel teaching diagram showing three stars that appear equally bright to an observer on Earth: one nearby but modest, one far away and very luminous, and one in between, emphasizing that apparent brightness alone does not reveal intrinsic power."
    module: 2

  observation-to-stellar-physics-module2:
    path: /assets/images/module-02/observation-to-stellar-physics.svg
    caption: "What to notice: the logic runs in stages. Position change gives parallax, parallax gives distance, brightness plus distance gives luminosity, and luminosity combined with temperature places the star on the H-R diagram."
    alt: "Flowchart titled From Observation to Stellar Physics, showing observables feeding into parallax and inverse-square-law reasoning, then into distance and luminosity, and finally into the H-R diagram."
    module: 2

  parallax-scale-comparison-module2:
    path: /assets/images/module-02/parallax-scale-comparison.svg
    caption: "What to notice: stellar parallax is tiny compared with familiar sky angles. The Full Moon spans about 1800 arcseconds, while many stellar parallaxes are hundredths or thousandths of an arcsecond."
    alt: "Scale comparison chart showing angles in arcseconds for the Full Moon, Jupiter, a typical stellar parallax, and Gaia precision, with bars shrinking dramatically toward the tiny stellar values."
    module: 2

  inverse-square-stepwise-module2:
    path: /assets/images/module-02/inverse-square-stepwise.svg
    caption: "What to notice: the inverse-square law is geometry, not magic. At twice the distance, the same light must cover four times the area, so the per-area brightness falls to one quarter."
    alt: "Two-panel geometry diagram showing light from a star spreading over a sphere of radius d and then a sphere of radius 2d, with surface areas labeled 4 pi d squared and 16 pi d squared and a note that brightness drops to one fourth."
    module: 2

  magnitude-distance-toolkit-module2:
    path: /assets/images/module-02/magnitude-distance-toolkit.svg
    caption: "What to notice: two useful translation rules tame the magnitude system. A difference of 5 magnitudes means a factor of 100 in brightness, and the distance modulus compares how bright a star looks now to how bright it would look at 10 pc."
    alt: "Two-panel infographic with a table converting magnitude differences to brightness ratios and a simple distance-modulus visual comparing a star at 10 parsecs to the same star farther away, labeled with M, m, and m minus M."
    module: 2

  gaia-reach-module2:
    path: /assets/images/module-02/gaia-reach-milky-way.svg
    caption: "What to notice: Gaia does not merely improve one nearby distance here or there. Its parallax reach extends across a large fraction of the Milky Way, turning local geometry into a three-dimensional galactic map."
    alt: "Milky Way context diagram showing the Sun's location in the disk, a smaller nearby neighborhood, and a much larger Gaia reach region extending across a substantial fraction of the galaxy."
    module: 2

  hr-diagram-observer-module2:
    path: /assets/images/module-02/hr-diagram-observer.png
    caption: "What to notice: the observer's H-R diagram uses quantities astronomers measure most directly for many stars: color and absolute magnitude. The same four regions still appear: main sequence, giants, supergiants, and white dwarfs."
    alt: "Observer-style Hertzsprung-Russell diagram with color index on the horizontal axis, absolute magnitude on the vertical axis, and labeled regions for main sequence, giants, supergiants, white dwarfs, and the Sun."
    module: 2

  hr-diagram-theorist-module2:
    path: /assets/images/module-02/hr-diagram-theorist.png
    caption: "What to notice: the theorist's H-R diagram makes the physics explicit. Dashed diagonals mark constant radius, so red giants line up with huge radii while white dwarfs sit on tiny-radius tracks."
    alt: "Theorist-style Hertzsprung-Russell diagram with effective temperature decreasing to the right, luminosity on the vertical axis, dashed lines of constant radius, and labeled regions for the main sequence, giants, supergiants, white dwarfs, and the Sun."
    module: 2

  hr-diagram-first-look-module2:
    path: /assets/images/module-02/HR-Diagram-Overview.jpg
    caption: "What to notice: this is the first-look map students need. The diagonal main sequence dominates, giants and supergiants sit high on the right, and white dwarfs sit low on the left. The Sun lands near the middle of the main sequence, not at the center of the whole diagram."
    alt: "Annotated Hertzsprung-Russell diagram with spectral class across the top, luminosity on the vertical axis, and labeled regions for bright supergiants, giants, subgiants, main sequence stars, and white dwarfs, including named stars such as the Sun, Rigel, Betelgeuse, Sirius, Procyon B, and Proxima Centauri."
    module: 2

  hr-diagram-mass-radius-lifetime-module2:
    path: /assets/images/module-02/hr_diagram.jpeg
    caption: "What to notice: several ideas stack on top of each other here. Constant-radius lines run diagonally, mass labels climb toward the upper left, and stellar lifetimes shrink dramatically for hot luminous stars. Moving along the main sequence mostly means changing mass, not age."
    alt: "Hertzsprung-Russell diagram with colored stellar regions, diagonal constant-radius guide lines, labeled masses from low-mass red dwarfs to massive blue stars, and lifetime annotations showing very long lives for cool low-mass stars and short lives for hot massive stars."
    module: 2

  gaia-hr-diagram-module2:
    path: /assets/images/module-02/Gaia_s_Hertzsprung-Russell_diagram.jpg
    caption: "What to notice: this is not a cartoon. Gaia measured these stars directly, and the same structures still appear: a dense main sequence, a giant branch peeling upward, and a separate white-dwarf track. Real survey data still obey the same stellar physics."
    alt: "Gaia color-magnitude diagram plotting Gaia color on the horizontal axis and absolute magnitude or luminosity on the vertical axis, with a bright main sequence, an upward giant branch, and a separate white dwarf sequence."
    credit: "ESA / Gaia"
    module: 2

  two-ways-to-be-luminous-module2:
    path: /assets/images/module-02/two-ways-to-be-luminous.svg
    caption: "What to notice: luminosity is not just about temperature. A star can shine intensely because it is very hot, because it has an enormous surface area, or because both effects work together."
    alt: "Side-by-side teaching diagram comparing a small hot blue-white star and a large cool orange-red giant, with labels noting that luminosity depends on both radius squared and temperature to the fourth power."
    module: 2

  sirius-a-b-hubble-photo:
    path: /assets/images/module-02/Sirius_A_and_B_Hubble_photo.jpg
    caption: "What to notice: Sirius B is easy to miss next to the glare of Sirius A, but resolving the pair visually is what turns a point of light into a measurable gravitational system."
    alt: "Hubble image of the Sirius binary showing the very bright primary Sirius A dominating the frame and the much fainter white dwarf Sirius B appearing as a small point offset below and left."
    credit: "NASA/ESA/Hubble"
    module: 2

  sirius-orbit-history:
    path: /assets/images/module-02/sirius-orbit.jpg
    caption: "What to notice: measuring stellar masses is often slow astronomy. Decades of astrometric points trace Sirius B's orbit around Sirius A and reveal the period, separation, and center-of-mass geometry needed for the mass calculation."
    alt: "Astrometric orbit plot for the Sirius system showing many measured positions of Sirius B over time, a fitted orbital curve, and right ascension and declination axes in arcseconds."
    module: 2

  eclipsing-binary-gemini:
    path: /assets/images/module-02/eclipsing-binary-gemini.png
    caption: "What to notice: the deeper dip happens when the hotter, brighter star is blocked. The shallower dip happens when the cooler star is hidden. Dip depth and width encode temperature contrast, orbital geometry, and stellar size."
    alt: "Two-panel diagram of an eclipsing binary with four orbital phases above and a light curve below, showing a deep primary eclipse and a shallower secondary eclipse in total system brightness."
    credit: "Gemini Observatory"
    module: 2

  mass-luminosity-relation-main-sequence:
    path: /assets/images/module-02/mass-luminosity-relation.png
    caption: "What to notice: along the main sequence, luminosity rises much faster than mass. Small changes in mass produce enormous changes in power output, which is why massive stars burn through their fuel so quickly."
    alt: "Log-log plot of main-sequence stellar luminosity versus mass with colored points by spectral type, a dashed best-fit relation L proportional to M to the 3.5 power, and the Sun marked at 1 solar mass and 1 solar luminosity."
    module: 2

  orion-nebula-hubble:
    path: /assets/images/module-02/orion-nebula-hubble.jpg
    caption: "What to notice: emission nebulae are not uniform glows. Bright ionized gas, embedded young stars, and dark dust lanes all appear together, so one image already tells you that star birth happens in a messy gas-and-dust environment."
    alt: "Hubble image of the Orion Nebula showing a bright central glowing region, pink and blue ionized gas, many embedded stars, and dark dusty lanes crossing the nebula."
    credit: "NASA/ESA/Hubble"
    module: 2

  bubble-nebula-emission:
    path: /assets/images/module-02/Bubble-Nebula-emission-nebula.webp
    caption: "What to notice: an emission nebula can trace a shell or bubble rather than a fuzzy uniform cloud. The glowing rim marks gas being energized by hot stars, so the shape still tells you how starlight is affecting the surrounding gas."
    alt: "Color image of the Bubble Nebula showing a large blue spherical shell of glowing gas surrounded by darker space and warmer orange clouds, with bright stars embedded nearby."
    module: 2

  m78-reflection-nebula:
    path: /assets/images/module-02/M78_JaredBowens_reflection_nebula.webp
    caption: "What to notice: the brightest parts of a reflection nebula appear as a blue glow around nearby stars, while the dark lanes show dust mixed through the region. The dust is scattering starlight rather than emitting strongly on its own."
    alt: "Wide-field image of the reflection nebula M78 showing two bright blue glowing patches around embedded stars, crossed by dark dusty lanes against a star-filled background."
    credit: "Jared Bowens"
    module: 2

  horsehead-nebula-dark:
    path: /assets/images/module-02/horsehead-nebula-eso.webp
    caption: "What to notice: a dark nebula stands out because it blocks the bright background behind it. The Horsehead's silhouette shows that the cloud is dense enough to absorb and scatter visible light rather than glow brightly itself."
    alt: "Image of the Horsehead Nebula showing a dark horse-head-shaped dust cloud silhouetted against a bright pink glowing background, with stars scattered around it."
    credit: "ESO"
    module: 2

  carina-nebula-star-formation-hubble:
    path: /assets/images/module-02/carina-nebula-star-formation-hubble.jpg
    caption: "What to notice: visible light makes the dusty pillar look opaque, while infrared reveals stars and structure hidden inside and behind it. Same cloud, different wavelength, different information."
    alt: "Two-panel Hubble comparison of a star-forming pillar in the Carina Nebula: the top visible-light panel shows a bright dusty pillar against glowing gas, while the bottom infrared panel reveals many stars and more internal structure through the dust."
    credit: "NASA/ESA/Hubble"
    module: 2

  star-formation-disk-jet-artist:
    path: /assets/images/module-02/star-formation-disk-jet-artist.jpeg
    caption: "What to notice: outflows are not random. Material falls inward through a flattened disk while bipolar jets shoot outward along the rotation axis, showing that accretion and ejection happen together during stellar birth."
    alt: "Artist's concept of a young forming star surrounded by a glowing flattened disk, with narrow bipolar jets emerging perpendicular to the disk."
    module: 2

  jwst-protostar-outflows:
    path: /assets/images/module-02/jwst-protostar-outflows.jpg
    caption: "What to notice: this is the observational version of the outflow story. A young star at the center is launching bipolar flows into the surrounding gas, so star birth involves both infall and ejection."
    alt: "JWST image of a young protostar with a bright central source and two opposing lobes of glowing gas, with an orange-red outflow extending upward and a blue-white outflow extending downward."
    module: 2

  star-planet-formation-sequence:
    path: /assets/images/module-02/star-planet-formation-american-scientist.webp
    caption: "What to notice: star birth is a sequence, not a single moment. A dark cloud becomes a collapsing core, then a protostar with a disk and bipolar flow, then a T Tauri star, and eventually a young planetary system."
    alt: "Six-panel schematic showing stages from a dark cloud core through gravitational collapse, a protostar with disk and bipolar flow, a T Tauri star, a pre-main-sequence star with planetary debris disk, and a young stellar system."
    credit: "American Scientist"
    module: 2

  hl-tauri-protoplanetary-disk-alma:
    path: /assets/images/module-02/hl-tauri-protoplanetary-disk-alma.jpg
    caption: "What to notice: a young disk is structured, not smooth. Bright rings and dark gaps show that planet-forming disks can develop organized patterns very early."
    alt: "ALMA image of the young star HL Tauri surrounded by an orange protoplanetary disk with multiple bright rings and dark gaps labeled around the central star."
    credit: "ALMA"
    module: 2

  hr-pre-main-sequence-tracks:
    path: /assets/images/module-02/HR-PMS.jpg
    caption: "What to notice: protostars do not all take the same route to adulthood. Massive protostars plunge onto the main sequence quickly, while low-mass stars spend much longer contracting and descending their pre-main-sequence tracks."
    alt: "Hertzsprung-Russell diagram with pre-main-sequence evolutionary tracks for stars of different masses, labeled with approximate contraction times from tens of thousands of years for high-mass stars to tens of millions of years for low-mass stars."
    module: 2

  hr-post-main-sequence-tracks:
    path: /assets/images/module-02/hrpostmainsuntrack.jpg
    caption: "What to notice: once a Sun-like star exhausts core hydrogen, it does not drift gently. It leaves the main sequence, climbs the red giant branch, flashes helium, and later returns to the upper right on the asymptotic giant branch."
    alt: "Hertzsprung-Russell diagram showing evolutionary tracks off the main sequence for several stellar masses, including labels for the red giant branch, horizontal branch, asymptotic giant branch, helium flash, and the Sun's approximate path."
    module: 2

  hr-massive-star-evolution:
    path: /assets/images/module-02/MassiveStar_Evolution_HR.jpeg
    caption: "What to notice: massive stars race across the H-R diagram. Their tracks peel away from the main sequence after only a short time and loop through supergiant phases before stellar death."
    alt: "Hertzsprung-Russell diagram highlighting evolutionary tracks for massive stars of about 9 to 85 solar masses, starting on the hot luminous main sequence and looping through supergiant regions."
    module: 2

  white-dwarf-mass-radius:
    path: /assets/images/module-02/wd-mass-radius.png
    caption: "What to notice: white dwarfs obey a deeply counterintuitive rule: adding mass makes them smaller. The curve ends at the Chandrasekhar limit, where electron degeneracy can no longer hold gravity back."
    alt: "Plot of white dwarf radius in Earth radii versus white dwarf mass in solar masses, showing radius decreasing as mass increases and marking the Chandrasekhar limit near 1.44 solar masses."
    module: 2

  onion-shell-burning-25msun:
    path: /assets/images/module-02/onion-shell-burning.png
    caption: "What to notice: the last stages of massive-star fusion are nested and frantic. Outer hydrogen burning lasts millions of years, but the innermost silicon-burning shell lasts only about a day before collapse."
    alt: "Concentric onion-shell diagram of a 25-solar-mass star shortly before collapse, labeling hydrogen, helium, carbon-oxygen, neon-oxygen-magnesium, oxygen-silicon, silicon-iron burning layers, their temperatures, and approximate burning timescales."
    module: 2

  eta-carinae-hubble:
    path: /assets/images/module-02/Hubble_EtaCarinae.jpeg
    caption: "What to notice: some very massive stars are already unstable before they explode. Eta Carinae has blown off huge lobes of gas, a reminder that the most massive stars live fast, shed mass violently, and die in dramatic ways."
    alt: "Hubble image of Eta Carinae showing a brilliant central massive star system surrounded by two large opposing lobes of ejected gas and dust glowing red and blue."
    credit: "NASA, ESA, and the Hubble Heritage Team (STScI/AURA)"
    module: 2

  jwst-ring-nebula:
    path: /assets/images/module-02/jwst-ring-nebula.png
    caption: "What to notice: a planetary nebula is not a fuzzy cloud with no structure. JWST resolves the shell, knots, and central cavity, making it easier to see that we are looking at gas recently shed by a dying low-mass star and lit by its hot remnant."
    alt: "JWST image of the Ring Nebula showing a bright oval shell with intricate filamentary structure, a dimmer outer halo, and a small hot central star inside the nebula."
    credit: "NASA, ESA, CSA, STScI"
    module: 2

  jwst-wr124:
    path: /assets/images/module-02/jwst-wr124-miri.png
    caption: "What to notice: some massive stars shed matter violently even before the final explosion. WR 124 is a Wolf-Rayet star surrounded by previously ejected gas, showing that mass loss is already reshaping the environment before core collapse."
    alt: "JWST infrared image of the Wolf-Rayet star WR 124 surrounded by a bright irregular shell of ejected gas and dust, with clumpy structure and a luminous central star."
    credit: "NASA, ESA, CSA, STScI, Webb ERO Production Team"
    module: 2

  binding-energy-iron-peak:
    path: /assets/images/module-02/binding-energy-curve.png
    caption: "What to notice: energy is released when fusion climbs upward toward iron on the binding-energy curve. Iron sits near the peak, so pushing beyond it no longer pays out energy. That is why an iron core is a dead end for normal stellar fusion."
    alt: "Graph of binding energy per nucleon versus mass number, rising steeply for light nuclei, peaking near iron-56, and then slowly declining for heavier nuclei, with arrows indicating why fusion of light elements and fission of very heavy elements release energy."
    module: 2

  core-collapse-sequence:
    path: /assets/images/module-02/Core_collapse.png
    caption: "What to notice: core collapse is a sequence, not a single instant. The core implodes, compresses to nuclear density, rebounds, and drives an outward shock that becomes the supernova."
    alt: "Six-panel schematic sequence of stellar core collapse showing a layered star zooming into the core, inward arrows during collapse, a compact high-density core, and later outward arrows representing rebound and explosion."
    module: 2

  typeii-core-collapse-neutrino-heating:
    path: /assets/images/module-02/TypeII_CoreCollapse_Schematic.png
    caption: "What to notice: the outgoing shock does not simply blast through on its own. A proto-neutron star forms at the center, neutrinos pour out, and a small fraction of that energy reheats material behind the stalled shock and helps revive the explosion."
    alt: "Core-collapse supernova schematic showing a proto-neutron star at the center, infalling stellar material, a stalled shock front, a neutrino-cooled inner region, and a neutrino-heated region behind the shock."
    module: 2

  crab-nebula-jwst:
    path: /assets/images/module-02/crab-nebula-jwst.jpg
    caption: "What to notice: centuries after the explosion, the Crab Nebula still preserves the wreckage of a core-collapse supernova. JWST resolves tangled filaments, dust, and synchrotron-emitting structures, reminding us that a supernova does not just produce a flash of light. It leaves behind expanding, chemically enriched debris and a compact remnant at the center."
    alt: "JWST image of the Crab Nebula showing a broad web of blue, pink, and green filamentary supernova debris spread across space, with labeled filter information and a scale bar indicating the remnant is a few light-years across."
    credit: "NASA, ESA, CSA, STScI"
    module: 2

  supernova-xray-fingerprints:
    path: /assets/images/module-02/ironfingerprints_SNe_CCvs1A.jpeg
    caption: "What to notice: supernova remnants carry spectral fingerprints of how they exploded. Type Ia remnants peak at different iron-line energies than core-collapse remnants, so X-ray spectroscopy lets astronomers classify an explosion after the blast."
    alt: "Infographic comparing X-ray images and iron-line spectra of several supernova remnants, with separate panels showing Type Ia white dwarf detonation remnants and core-collapse remnants with higher-energy iron features."
    credit: "NASA / Goddard Space Flight Center"
    module: 2

  snr-fingerprint-remnant:
    path: /assets/images/module-02/snr_fingerprint.webp
    caption: "What to notice: even after the bright supernova is gone, a remnant can keep X-ray spectral fingerprints of the explosion. Differences in iron-line emission and abundance patterns help astronomers distinguish thermonuclear Type Ia remnants from core-collapse remnants."
    alt: "Comparison graphic of supernova remnants highlighting differing X-ray spectral fingerprints and iron-line behavior for thermonuclear Type Ia remnants versus core-collapse remnants."
    module: 2

  snr-chart-large-remnant:
    path: /assets/images/module-02/snr_chart_large.webp
    caption: "What to notice: remnant classification uses the same evidence habit as supernova classification more generally. Astronomers compare spectral features and inferred element patterns to decide whether the original explosion was thermonuclear or core collapse."
    alt: "Summary chart comparing supernova-remnant spectral or elemental signatures used to infer whether the original explosion was a Type Ia or a core-collapse supernova."
    module: 2

  compact-object-scale-comparison:
    path: /assets/images/module-02/compact-object-scale.svg
    caption: "What to notice: compact remnants differ most dramatically in radius, not just in mass. Earth and a white dwarf are similar in size, while neutron stars and stellar-mass black holes are hundreds of times smaller. The right-hand pair is magnified so you can actually see them, and the black-hole marker shows the event horizon radius rather than a solid surface."
    alt: "Clean two-panel comparison showing Earth and a white dwarf at the same displayed scale on the left, and a 600-times zoomed panel on the right showing a neutron star and the event horizon radius of a 3-solar-mass black hole as true circles."
    credit: "Illustration: A. Rosen (SVG)"
    module: 2

  neutron-star-cross-section:
    path: /assets/images/module-02/Neutron_star_cross_section.png
    caption: "What to notice: even a neutron star is layered. The crust, outer core, and possible exotic inner core remind us that neutron stars are laboratories for matter under conditions we cannot reproduce on Earth."
    alt: "Cutaway schematic of a neutron star labeling the outer crust, inner crust, outer core, and possible inner core, with notes about ions, electrons, neutrons, and possible quark matter."
    module: 2

  stellar-graveyard-gwtc4:
    path: /assets/images/module-02/Stellar_Graveyard_GWTC-4_mass_gap_26Aug2025-1-scaled.png
    caption: "What to notice: stellar remnants do not all land at one mass. White dwarfs, neutron stars, and stellar-mass black holes occupy different parts of the compact-object graveyard, and the transitions between them are tied to which pressure support fails."
    alt: "Mass-distribution plot of compact stellar remnants showing white dwarfs, neutron stars, and stellar-mass black holes across different mass ranges, with highlighted transition regions and merger detections from gravitational-wave observations."
    module: 2

  neutron-star-types-nasa:
    path: /assets/images/module-02/NASA_NeutronStars.jpeg
    caption: "What to notice: 'neutron star' is a family name, not a single appearance. The same compact remnant can show up as a pulsar, a magnetar, or both, depending on its magnetic field, rotation, and how its beams are oriented relative to Earth."
    alt: "NASA infographic comparing neutron star types, with panels for a magnetar, a pulsar, and an object that is both, each showing magnetic fields and radio-beam geometry."
    credit: "NASA/JPL-Caltech"
    module: 2

  parallax-geometry:
    path: /assets/images/module-02/parallax-geometry.png
    caption: "Geometry of stellar parallax measurement"
    alt: "Diagram showing Earth's orbit and parallax angle to nearby star"
    module: 2

  spectral-lines:
    path: /assets/images/module-02/spectral-lines.png
    caption: "Absorption and emission spectral lines"
    alt: "Comparison of continuous, absorption, and emission spectra"
    module: 2

  doppler-shift:
    path: /assets/images/module-02/doppler-shift.png
    caption: "Doppler shift of spectral lines reveals stellar motion"
    alt: "Diagram showing blueshift and redshift of spectral lines"
    module: 2

  photon-random-walk-solar-core:
    path: /assets/images/module-02/random-walk.png
    caption: "What to notice: a photon born in the solar core does not travel straight outward. Repeated absorption and re-emission turn escape into a random walk, so radiative transport is a diffusion problem, not a direct beam."
    alt: "Teaching infographic titled Random Walk: 2000 Scatterings, showing a tangled photon path and a side panel explaining mean free path, number of scatterings, diffusion time of about 170,000 years, and the much shorter straight-line travel time."
    module: 2

  stellar-tug-of-war-hse:
    path: /assets/images/module-02/stellar-tug-of-war-hse.png
    caption: "What to notice: hydrostatic equilibrium is a balance between inward gravity and outward pressure, not a frozen state. The same tug-of-war appears in the main sequence, red giant expansion, and the collapse to compact remnants."
    alt: "Infographic cutaway of a star titled The Stellar Tug-of-War, with arrows showing gravity inward and pressure outward, labeled stellar layers, and side panels comparing the balance during the main sequence, red giant expansion, and compact-remnant formation."
    module: 2

  hydrogen-shell-burning-red-giant:
    path: /assets/images/module-02/hshellburningsml.jpg
    caption: "What to notice: once core hydrogen fusion ends, the action moves into a thin hydrogen-burning shell around an inert helium core. That shell produces enough energy to puff up the outer envelope and make the star a red giant."
    alt: "Simple red-giant schematic showing a helium-rich core, a hydrogen-burning shell around it, arrows indicating increased radiation pressure, and a large expanded cool hydrogen-rich outer envelope."
    module: 2

  stellar-evolution-inference-flow:
    path: /assets/images/module-02/stellar-evolution-inference-flow.svg
    caption: "What to notice: astronomers do not watch one star age from birth to death. They compare many stellar populations, organize those observations with the H-R diagram, and use stellar physics to infer a coherent life story."
    alt: "Three-card teaching diagram labeled Observable, Model, and Inference. The Observable panel shows young clusters, main-sequence stars, red giants, and white dwarfs. The Model panel shows a miniature H-R diagram with physics cues for equilibrium, fusion, and mass. The Inference panel shows a simple evolutionary path from main sequence to red giant and then to either white dwarf or supernova remnant."
    credit: "Illustration: A. Rosen (Python/Matplotlib)"
    module: 2

  stellar-evolution-hero:
    path: /assets/images/module-02/stellar-evolution-hero.svg
    caption: "What to notice: the red-giant stage is the structural turning point. Once the core fuel changes, the star leaves the main sequence, and mass determines which broad fate follows."
    alt: "Overview diagram showing a main-sequence star evolving into a red giant, then branching toward a white dwarf path for lower-mass stars and a supernova path for higher-mass stars."
    credit: "Illustration: A. Rosen (SVG)"
    module: 2

  red-giant-causal-chain:
    path: /assets/images/module-02/red-giant-causal-chain.svg
    caption: "What to notice: the red-giant phase is not just 'the star got old.' It is the structural consequence of core hydrogen exhaustion, core contraction, shell burning, and envelope expansion."
    alt: "Four-step process diagram showing core hydrogen exhaustion, core contraction and heating, hydrogen shell burning, and outer-envelope expansion into a red giant."
    credit: "Illustration: A. Rosen (SVG)"
    module: 2

  same-temperature-different-luminosity-radius:
    path: /assets/images/module-02/same-temperature-different-luminosity-radius.svg
    caption: "What to notice: if two stars have the same surface temperature, the more luminous one must have the larger radius. That is the key inference behind why red giants can be cool but bright."
    alt: "Side-by-side teaching figure showing two orange stars with the same labeled surface temperature of 4,500 kelvin but very different sizes. The larger star is labeled as having higher luminosity because of its larger radius. A mini H-R diagram on the right shows two same-temperature points at different luminosities along a vertical line."
    credit: "Illustration: A. Rosen (Python/Matplotlib)"
    module: 2

  cluster-turnoff-clock:
    path: /assets/images/module-02/cluster-turnoff-clock.svg
    caption: "What to notice: as a cluster ages, the main-sequence turnoff moves downward and to the right. That shift lets astronomers estimate the cluster's age."
    alt: "Paired H-R diagrams comparing a young cluster and an older cluster. The young cluster has a hot blue turnoff high on the main sequence, while the older cluster has a cooler, lower turnoff farther to the right, with giant stars above the main-sequence end."
    credit: "Illustration: A. Rosen (Python/Matplotlib)"
    module: 2

  solar-system-element-origins-module2:
    path: /assets/images/module-02/Chandra_PeriodicTable.jpeg
    caption: "What to notice: the periodic table is a cosmic origin story. Hydrogen and much of helium are primordial, many common elements are forged in stars, and the heaviest elements require the most violent astrophysical events."
    alt: "Color-coded periodic table titled Origins: Solar System Elements, with a legend for Big Bang fusion, dying low-mass stars, exploding massive stars, merging neutron stars, exploding white dwarfs, and cosmic-ray fission, plus a human silhouette showing major element fractions in the body."
    module: 2

  recycled-pulsar-xray-binary:
    path: /assets/images/module-02/NS_heartbeatsNature.jpeg
    caption: "What to notice: the accretion disk is not just glowing scenery. Infalling gas releases X-rays and delivers angular momentum, which can spin an old neutron star back up into a recycled pulsar."
    alt: "Diagram of a neutron star in an accretion disk, with magnetic field lines, rotation arrows, matter accreting onto the neutron star, density fluctuations in the disk, and labeled X-ray bursts."
    module: 2

  black-hole-warped-spacetime-module2:
    path: /assets/images/module-02/webb-STScI-blackholes-warped-spacetime.png
    caption: "What to notice: the black hole itself stays dark. The light comes from hot gas outside the event horizon, and strong gravity bends light from the far side of the disk into the bright ring we can see."
    alt: "Artist's concept of a black hole with a glowing accretion disk whose far side appears warped into a bright ring by gravitational lensing around the dark central shadow."
    module: 2

  # ==============================================================
  # Module 3: Stellar Structure & Evolution
  # ==============================================================

  hydrostatic-equilibrium:
    path: /assets/images/module-03/hydrostatic-equilibrium.png
    caption: "Hydrostatic equilibrium balances gravity and pressure"
    alt: "Diagram showing pressure gradient opposing gravitational force in a star"
    module: 3

  pp-chain:
    path: /assets/images/module-02/pp-chain.png
    caption: "What to notice: the proton-proton chain gradually turns four protons into one helium nucleus, releasing photons, neutrinos, and energy that helps support the Sun against gravity."
    alt: "Step-by-step diagram of the proton-proton chain in the solar core, showing proton fusion into deuterium, helium-3 production, helium-4 formation, and the release of positrons, neutrinos, photons, and energy."
    module: 2

  stellar-endpoints:
    path: /assets/images/module-03/stellar-endpoints.png
    caption: "Stellar remnants depend on initial mass"
    alt: "Chart showing white dwarf, neutron star, and black hole formation by mass"
    module: 3

  milky-way-anatomy:
    path: /assets/images/module-03/Milky_Way_Anatomy_Infographic_Simple_Final.jpg
    caption: "What to notice: the Milky Way is not just a flat spiral disk. It has a thin disk, thick disk, central bar and bulge, spiral arms, interstellar medium, stellar halo, and extended dark-matter halo."
    alt: "Infographic titled Milky Way Anatomy showing a face-on and edge-on view of the galaxy. Labels identify the interstellar medium, central bar, spiral arms, Sun, disk, thin disk, thick disk, bulge, dark matter halo, and stellar halo, with approximate sizes for several components."
    credit: "Course illustration"
    module: 3

  globular-cluster-47-tuc:
    path: /assets/images/module-03/eso1302a-gc-47-tuc.jpg
    caption: "What to notice: a globular cluster is not a loose patch of random stars. It is a dense, old, gravitationally bound stellar population, exactly the kind of object that helps trace the Milky Way's halo."
    alt: "Wide-field image of the globular cluster 47 Tucanae. A dense bright core of many stars sits slightly left of center, surrounded by a gradually thinning halo of stars against a dark background."
    credit: "ESO/M.-R. Cioni/VISTA Magellanic Cloud survey"
    license: "CC-BY-4.0"
    source: "https://www.eso.org/public/images/eso1302a/"
    module: 3

  galactic-center-multiwavelength-eso:
    path: /assets/images/module-03/eso1606e-multiwavelength-MW-galactic-center.jpg
    caption: "What to notice: the same Galactic Center looks almost opaque in visible light but becomes richly structured at infrared and submillimeter wavelengths. Changing wavelength changes which physical component you can see."
    alt: "Four horizontal views of the central Milky Way at different wavelengths. From top to bottom the panels show APEX plus Planck submillimeter emission, Spitzer infrared emission, VISTA near-infrared light, and an optical view by S. Guisard, with the Galactic Centre marked in each panel."
    credit: "ESO/ATLASGAL consortium/NASA/GLIMPSE consortium/VVV Survey/ESA/Planck/D. Minniti/S. Guisard"
    license: "CC-BY-4.0"
    source: "https://www.eso.org/public/images/eso1606e/"
    module: 3

  hi4pi-milky-way-map:
    path: /assets/images/module-03/HI4PI-MW-map.jpg
    caption: "What to notice: 21-cm radio emission turns neutral hydrogen into an all-sky map. The bright band is the Milky Way's gas-rich disk, and the colors encode velocity information as well as column density."
    alt: "All-sky HI4PI map of neutral hydrogen in the Milky Way shown in a Mollweide projection. A bright horizontal band traces the Galactic plane, with color indicating line-of-sight velocity and brightness indicating hydrogen column density."
    credit: "Benjamin Winkel and the HI4PI Collaboration"
    source: "https://www.icrar.org/hi4pi/"
    module: 3

  galactic-center-great-observatories:
    path: /assets/images/module-03/nasa-mw-gc.jpg
    caption: "What to notice: the Galactic Center is not one picture. Spitzer infrared, Hubble near-infrared, and Chandra X-ray observations reveal dust, stars, hot gas, and compact high-energy sources in the same crowded region."
    alt: "NASA Great Observatories composite of the center of the Milky Way. A large false-color panel combines infrared and X-ray views, with smaller panels below labeled Spitzer infrared, Hubble near infrared, and Chandra X-ray."
    credit: "NASA, ESA, SSC, CXC, and STScI"
    source: "https://science.nasa.gov/asset/hubble/views-of-the-galactic-center-region-from-nasas-great-observatories/"
    module: 3

  rotation-curve-observed-expected:
    path: /assets/images/module-03/rotation-curve-dark-matter1.jpg
    caption: "What to notice: the observed rotation curve stays high at large radius, while the curve expected from the observed luminosity alone falls. The gap between those two curves is the dark-matter inference in one picture."
    alt: "Plot over a galaxy image comparing rotational velocity with radius. A red observed curve remains high across the disk, while a blue expected curve from observed luminosity rises near the center and then declines at larger radius."
    credit: "Course-provided figure"
    module: 3

  milky-way-rotation-curve-data:
    path: /assets/images/module-03/Rotation_curve_Milky_Way.png
    caption: "What to notice: many independent tracers of the Milky Way's rotation stay near the same circular speed even far from the Galactic Center. The baryonic-mass curve falls, so the measured speeds require additional mass."
    alt: "Plot titled Rotation curve of the Milky Way showing circular velocity in kilometers per second versus radius from the galactic center in kiloparsecs. Multiple data sets, including K giant stars, globular clusters, Gaia DR3, BHB stars, masers, McClure-Griffiths, VVV survey, and Wang, remain near 200 to 250 kilometers per second, while the baryonic mass curve declines at large radius."
    credit: "Course-provided figure"
    module: 3

  ugc11455-rotation-curve-lensing:
    path: /assets/images/module-03/Rotation_Curve_UGC11455.png
    caption: "What to notice: UGC 11455 rotates faster than its baryonic mass can explain, and weak lensing extends the same mass discrepancy to much larger radii. Dark matter is not just a Milky Way bookkeeping problem."
    alt: "Plot titled Rotation curve of UGC11455 extended by weak lensing using the matching KiDS mass bin. Blue points, triangles, and squares show stellar, hydrogen gas, and weak-lensing rotation-curve measurements. Black baryonic mass curves lie well below the observed velocities, and red arrows mark the velocity gap that dark matter can explain."
    credit: "Course-provided figure"
    module: 3

  hubble-tuning-fork-kingfish:
    path: /assets/images/module-03/Interactive_Hubble_Tuning_Fork.jpg
    caption: "What to notice: the Hubble tuning fork is a classification map, not an evolutionary conveyor belt. The images here are infrared views of dust in nearby galaxies, so morphology is being connected to interstellar material and star formation."
    alt: "Hubble tuning fork diagram populated with infrared images of nearby galaxies. Elliptical galaxies appear on the left handle, spirals and intermediate spirals follow the upper branch, barred spirals follow the lower branch, and irregular galaxies sit below the handle."
    credit: "C. North, M. Galametz & the KINGFISH Team"
    license: "ESA Standard Licence"
    source: "https://www.esa.int/ESA_Multimedia/Images/2012/11/Interactive_Hubble_Tuning_Fork"
    module: 3

  galaxy-types-visual-vocabulary:
    path: /assets/images/module-03/types-of-galaxies-2.webp
    caption: "What to notice: these labels are visual starting points. A galaxy's type is a clue about stars, gas, dust, and interaction history, not a complete biography by itself."
    alt: "Six-panel visual guide titled Types of Galaxies. The panels show examples labeled spiral, barred spiral, elliptical, irregular, lenticular, and peculiar."
    credit: "Course-provided figure"
    module: 3

  sombrero-galaxy-hubble:
    path: /assets/images/module-03/sombrero-galaxy-hubble.jpg
    caption: "What to notice: the Sombrero Galaxy mixes a bright bulge with a thin dust-rich disk. Real galaxies often sit between tidy textbook categories, so classification is a starting point for physical interpretation."
    alt: "Hubble image of the Sombrero Galaxy seen nearly edge-on, with a large bright central bulge and a thin dark dust lane across the disk."
    credit: "NASA/ESA/Hubble"
    module: 3

  whirlpool-galaxy-merger:
    path: /assets/images/module-03/whirlpool-galaxy-merger.jpg
    caption: "What to notice: the Whirlpool Galaxy turns interaction into structure. Its companion helps organize spiral arms, dust lanes, and star-forming regions, reminding us that morphology records environment."
    alt: "Hubble image of the Whirlpool Galaxy with a bright spiral disk, pink star-forming regions, dark dust lanes, and a smaller companion galaxy connected by tidal structure."
    credit: "NASA/ESA/Hubble"
    module: 3

  starburst-m82:
    path: /assets/images/module-03/starburst-M82.jpg
    caption: "What to notice: starburst galaxies convert gas into stars at an extreme rate. The red outflowing material in M82 is feedback: young massive stars and supernovae pushing gas out of the galaxy."
    alt: "Image of the starburst galaxy M82 showing a bright blue-white disk crossed by dust lanes and red glowing gas streaming out above and below the galaxy."
    credit: "NASA/ESA/Hubble"
    module: 3

  s-star-orbits-keck-ucla:
    path: /assets/images/module-03/S-stars-Orbits.png
    caption: "What to notice: the stars do not drift randomly. They trace closed, high-speed orbits around a common focus, which lets astronomers weigh the compact object at the Galactic Center with Kepler's third law."
    alt: "Keck UCLA Galactic Center Group image showing colored orbital paths of S-stars around the Galactic Center from 1995 to 2020. The legend labels stars S0-2, S0-3, S0-5, S0-16, S0-19, S0-20, S0-49, S0-38, and S0-102."
    credit: "Keck/UCLA Galactic Center Group"
    module: 3

  sgr-a-eht-polarized:
    path: /assets/images/module-03/eso2406a-EHT-SagAstar-polarized.jpg
    caption: "What to notice: this is a horizon-scale radio image of Sgr A* in polarized light. The bright ring surrounds the black-hole shadow, and the fine lines trace polarization directions related to magnetic fields near the event horizon."
    alt: "Event Horizon Telescope image of Sagittarius A star in polarized light. A bright orange ring surrounds a dark central shadow, with many fine curved line segments overlaid around the ring to mark polarization orientation."
    credit: "EHT Collaboration"
    license: "CC-BY-4.0"
    source: "https://www.eso.org/public/images/eso2406a/"
    module: 3

  milky-way-polarization-context:
    path: /assets/images/module-03/Milky_Way_polarization-ENG.webp
    caption: "What to notice: polarization is a magnetic-field tracer across enormous scale ranges. The same technique links plasma near Sgr A*, dust near the Galactic Center, and polarized dust emission across the Milky Way."
    alt: "Composite teaching graphic comparing polarized emission from plasma around Sagittarius A star, polarized emission from dust at the center of the Milky Way, and polarized dust emission across the full Milky Way sky map."
    credit: "Event Horizon Telescope Collaboration; NASA/SOFIA; NASA/Hubble Space Telescope/NICMOS; ESA and the Planck Collaboration"
    module: 3

  module-3-evidence-chain-concept-map:
    path: /assets/images/module-03/module-3-evidence-chain-concept-map.svg
    caption: "What to notice: Module 3 uses the same evidence chain over and over. Galaxy shapes, Cepheid periods, supernova brightness, galaxy redshifts, AGN jets, CMB anisotropies, and light-element abundances become physical claims only after a model translates them."
    alt: "Concept map for Module 3 organized as five observable-to-model-to-inference chains. Galaxy shapes, colors, gas, and dust connect through stellar populations and gas physics to star-formation histories. Cepheid periods and supernova brightness connect through the distance ladder and flux law to galaxy distances, sizes, and luminosities. Galaxy positions and redshifts connect through expanding space and gravity to cosmic expansion and the cosmic web. AGN spectra, jets, and variability connect through black-hole accretion to feeding supermassive black holes and quasars. CMB anisotropies and light elements connect through recombination and nuclear reactions to the hot Big Bang and recycled atoms."
    credit: "Illustration: A. Rosen (SVG)"
    module: 3

  milky-way-satellite-galaxies-map:
    path: /assets/images/module-03/map_milky_way_1000_1000_0.jpg
    caption: "What to notice: the Milky Way is surrounded by faint satellite galaxies, not just by isolated stars. These companions help trace the Galaxy's larger gravitational environment and its extended dark-matter halo."
    alt: "Three-dimensional schematic of the Milky Way and nearby satellite galaxies. Labels identify the Large and Small Magellanic Clouds, Sagittarius, Sculptor, Fornax, Carina, Leo V, Sextans, Segue 1, Ursa Minor, Draco, Hercules, and other dwarf companions, with a 100,000 light-year scale bar."
    credit: "Course-provided figure"
    module: 3

  galactic-disk-warp:
    path: /assets/images/module-03/galactic-disk-warp.jpg
    caption: "What to notice: galactic disks are not perfectly flat plates. Dust lanes, warps, and tilted outer gas layers show that a galaxy is a dynamical system shaped by gravity, accretion, and interactions."
    alt: "Edge-on spiral galaxy with a bright central bulge and a dark dust lane cutting across a thin disk whose outer regions appear warped or tilted."
    credit: "Course-provided figure"
    module: 3

  milky-way-new-dwarf-galaxies:
    path: /assets/images/module-03/mw-newdwarfgalaxies.jpg
    caption: "What to notice: the Milky Way's halo is still being mapped. Known dwarf galaxies, globular clusters, and newly identified faint companions show that the Galaxy's environment extends far beyond the bright disk."
    alt: "All-sky map centered on the Milky Way plane. The Large and Small Magellanic Clouds are labeled, known globular clusters are shown in blue, known dwarf galaxies in green, and newly discovered dwarf-galaxy candidates in red."
    credit: "Course-provided figure"
    module: 3

  hubble-galactic-center:
    path: /assets/images/module-03/hubble-galactic-center.jpg
    caption: "What to notice: the Galactic Center is crowded, dusty, and multiwavelength by necessity. Near-infrared and high-energy views turn an apparently hidden region into a map of stars, gas, and compact sources."
    alt: "False-color panoramic image of the Milky Way's Galactic Center, with blue and purple high-energy emission mixed with reddish and golden dust and star-forming structures."
    credit: "Course-provided figure"
    module: 3

  milky-way-outflow-quasar-probes:
    path: /assets/images/module-03/mw-outflow-hubble-probed-by-quasars.jpg
    caption: "What to notice: background quasars can act like flashlights shining through the Milky Way's halo. Absorption lines in their spectra reveal otherwise invisible gas flowing above and below the Galactic disk."
    alt: "Illustration of the Milky Way seen edge-on with red and blue outflow lobes above and below the disk, a distant quasar used as a background light source, and a small absorption-spectrum inset."
    credit: "Course-provided figure"
    module: 3

  bullet-cluster-composite:
    path: /assets/images/module-03/bullet-cluster-composite.jpg
    caption: "What to notice: the pink X-ray gas marks much of the ordinary matter, while the blue lensing map marks where most of the gravitating mass is. Their separation is why the Bullet Cluster is a clean dark-matter test."
    alt: "Composite image of the Bullet Cluster showing galaxies in visible light, pink X-ray emitting gas, and blue regions marking the gravitational-lensing mass distribution offset from the gas."
    credit: "NASA/CXC/CfA/STScI/ESO/Magellan"
    module: 3

  bullet-cluster-jwst-chandra:
    path: /assets/images/module-03/bullet-cluster-jwst-chandra.png
    caption: "What to notice: multi-observatory images separate luminous galaxies, hot gas, and lensing mass. The dark-matter argument is strongest because different messengers point to different physical components."
    alt: "Wide multiwavelength image of the Bullet Cluster field with many galaxies and foreground stars, overlaid by blue, purple, and pink emission across the merging cluster."
    credit: "Course-provided figure"
    module: 3

  local-group-map:
    path: /assets/images/module-03/06-Local_Group.png
    caption: "What to notice: the Milky Way is one member of a small gravitational neighborhood. Andromeda, Triangulum, the Magellanic Clouds, and many dwarf galaxies together make up the Local Group."
    alt: "Map of the Local Group showing the Milky Way, Andromeda, Triangulum, the Large and Small Magellanic Clouds, and many dwarf galaxies with approximate distances."
    credit: "Course-provided figure"
    module: 3

  local-group-size-comparison:
    path: /assets/images/module-03/Local_Group_Galaxies_Comparison.png
    caption: "What to notice: the Local Group contains a few large galaxies and many much smaller companions. Galaxy size varies enormously even before we leave our own neighborhood."
    alt: "Size comparison of Local Group galaxies, including the Small Magellanic Cloud, Large Magellanic Cloud, NGC 3109, Triangulum, the Milky Way, and Andromeda, with approximate diameters labeled."
    credit: "Course-provided figure"
    module: 3

  local-group-nearest-galaxies-map:
    path: /assets/images/module-03/Local_Group_and_nearest_galaxies.jpg
    caption: "What to notice: the Local Group is the nearby knot in a larger galactic neighborhood. The next galaxies are already millions of light-years away, so distance changes the scale of the story quickly."
    alt: "Map of the Local Group and nearest galaxies with circular distance markers at about 2, 4, 6, and 8 million light-years. The Milky Way, Andromeda, Triangulum, Magellanic Clouds, and nearby dwarf and spiral galaxies are labeled."
    credit: "Course-provided figure"
    module: 3

  andromeda-panoramic-hubble:
    path: /assets/images/module-03/andromeda-panoramic-hubble.jpg
    caption: "What to notice: Andromeda is close enough for Hubble to resolve enormous numbers of individual stars. That makes it both a neighboring galaxy and a bridge between stellar astronomy and galaxy astronomy."
    alt: "Long panoramic Hubble image of the Andromeda galaxy showing a bright yellow-white bulge, blue star-forming disk regions, dust lanes, and a wide field of resolved stars."
    credit: "NASA/ESA/Hubble"
    module: 3

  lsst-cosmic-treasure-chest-module3:
    path: /assets/images/module-03/lsst-cosmic-treasure-chest.webp
    caption: "What to notice: a deep survey image is a population sample. Each galaxy is both an object with a morphology and a distance marker waiting for the ladder to place it in three-dimensional space."
    alt: "Deep Rubin Observatory field showing thousands of galaxies and stars, including many small spiral and elliptical galaxies at different apparent sizes and colors."
    credit: "Rubin Observatory/NSF/AURA"
    module: 3

  hubble-ultra-deep-field-hst:
    path: /assets/images/module-03/hubble-ultra-deep-field-hst.jpg
    caption: "What to notice: nearly every tiny smudge is a galaxy. A deep field turns an apparently empty patch of sky into evidence for a universe filled with galaxies at many distances and lookback times."
    alt: "Hubble Ultra Deep Field image showing a dark patch of sky filled with hundreds of tiny galaxies of many colors and shapes, plus a few foreground stars."
    credit: "NASA/ESA/Hubble"
    module: 3

  agn-structure-basic:
    path: /assets/images/module-03/agn_structure_illustration.png
    caption: "What to notice: the AGN engine is compact. A black hole plus accretion disk sits inside a dusty torus, and some systems launch jets perpendicular to the disk."
    alt: "Labeled illustration of an active galactic nucleus showing a central black hole, surrounding accretion disk, dusty torus of neutral gas and dust, and a jet emerging perpendicular to the disk."
    credit: "Course-provided figure"
    module: 3

  agn-eso-artist-impression:
    path: /assets/images/module-03/Active-Galactic-Nucleus-ESO.jpg
    caption: "What to notice: an active nucleus is embedded inside a host galaxy. Dust can hide the central engine in some directions while jets carry energy far beyond the black hole's immediate surroundings."
    alt: "Artist's impression of an active galactic nucleus inside a galaxy, with a bright central source, dark dust lane, and a jet or outflow extending from the nucleus."
    credit: "ESO"
    module: 3

  quasar-agn-artist-impression:
    path: /assets/images/module-03/quasar-agn-artist-impression.jpg
    caption: "What to notice: a quasar is an accretion engine, not a star. The bright disk and jets are powered by gravitational energy released near a supermassive black hole."
    alt: "Artist's impression of a quasar or active galactic nucleus with a dark dusty disk around a brilliant central source and blue-white jets emerging in opposite directions."
    credit: "Course-provided figure"
    module: 3

  agn-nustar-accretion-artist:
    path: /assets/images/module-03/agn-nustar-artist-rendition.jpg
    caption: "What to notice: the light source is not fusion in stars. Gas releases gravitational energy as it spirals through a hot accretion disk close to a supermassive black hole."
    alt: "Artist's rendition of a black hole with a glowing accretion disk and a jet, illustrating gas falling inward and producing high-energy radiation."
    credit: "NASA/JPL-Caltech"
    module: 3

  agn-feedback-flows:
    path: /assets/images/module-03/NASA_AGN-SupermassiveBlackHoles-PinpointingFlows-01.jpg
    caption: "What to notice: AGN energy does not stay near the event horizon. Jets, winds, and cavities connect light-hour scales near the black hole to galaxy-scale environments."
    alt: "NASA infographic titled Supermassive Black Holes: Pinpointing the Flows, showing a galaxy, winds, jets, and cavities across scales from light-hours near the black hole to hundreds of thousands of light-years in the galaxy environment."
    credit: "NASA"
    module: 3

  m-sigma-smbh-relation:
    path: /assets/images/module-03/Mass-Sigma-SMBH-relationship-Astronomy-Magazine.jpg
    caption: "What to notice: central black-hole mass increases with the random motions of stars in the galaxy bulge. The plot is not saying the black hole directly controls the whole bulge; it is showing that the black hole and bulge somehow grew in linked ways."
    alt: "Astronomy magazine plot titled Mass relationships, showing black-hole mass in solar masses on the vertical axis versus stellar velocity dispersion in kilometers per second on the horizontal axis. Elliptical, lenticular, and spiral galaxies cluster along an upward trend, with labeled points including the Milky Way, Andromeda, M87, M60, NGC 1277, and Circinus."
    credit: "Astronomy: Roen Kelly, after Kayhan Gultekin et al."
    module: 3

  agn-types-unified-model:
    path: /assets/images/module-03/NASA-types-of-AGN.jpg
    caption: "What to notice: many AGN names partly encode viewing angle. The same basic engine can look like a Seyfert galaxy, quasar, or blazar depending on how the disk, torus, and jets point toward us."
    alt: "NASA infographic comparing types of active galactic nuclei, including Seyfert galaxies, quasars, and blazars, with cones showing how the observer's viewing angle changes the classification."
    credit: "NASA"
    module: 3

  hercules-a-multiwavelength-agn:
    path: /assets/images/module-03/NASA_Hercules_A-composite.jpg
    caption: "What to notice: visible light alone makes Hercules A look fairly ordinary, but radio and X-ray views reveal enormous jets and lobes powered by the central AGN."
    alt: "Multiwavelength image of the galaxy Hercules A with panels for a combined composite, visible light, X-ray emission, and radio emission. The radio view shows large lobes extending far beyond the visible galaxy."
    credit: "NASA, ESA, NRAO, and STScI"
    module: 3

  antlia-cluster-noirlab:
    path: /assets/images/module-03/noirlab2501a-antlia-cluster.jpg
    caption: "What to notice: a galaxy cluster is not a single object but a gravitational city of galaxies. The Antlia Cluster lets students see the step from individual galaxies to environments where galaxies live together."
    alt: "Wide-field image of the Antlia Cluster showing many stars and galaxies, including several large diffuse elliptical galaxies and numerous smaller galaxies across the field."
    credit: "NSF NOIRLab"
    module: 3

  carina-radio-continuum-map:
    path: /assets/images/module-03/carina_1-3radiocontinuum-scaled.webp
    caption: "What to notice: radio maps reveal gas structures that optical light can miss or confuse. In the Carina region, shells, fronts, and plumes trace how massive stars reshape the surrounding interstellar medium."
    alt: "False-color radio-continuum map of the Carina region in Galactic longitude and latitude, with labels for plumes, north fronts, north shell, south fronts, Gum 31, and PMN J1032-5917, plus a 20 parsec scale bar."
    credit: "Course-provided figure"
    module: 3

  cats-paw-nebula-jwst:
    path: /assets/images/module-03/cats-paw-nebula-jwst.jpg
    caption: "What to notice: infrared light turns dusty star-forming gas from an obstacle into evidence. The same dust that hides visible light can outline where new stars are forming."
    alt: "JWST infrared image of the Cat's Paw Nebula showing a bright blue-white cavity, orange and brown dust clouds, embedded young stars, and darker dusty lanes."
    credit: "Course-provided figure"
    module: 3

  merging-galaxies-molecular-gas-maps:
    path: /assets/images/module-03/distribution-molecular-gas-merging-galaxies.webp
    caption: "What to notice: galaxy interactions rearrange cold molecular gas in many different ways. The gas distribution is the clue to where future star formation can be triggered, suppressed, or concentrated."
    alt: "Grid of false-color molecular-gas maps for many interacting or merging galaxies. Each small panel shows a different galaxy pair or merger with gas concentrated in irregular, offset, or extended structures."
    credit: "Course-provided figure"
    module: 3

  antennae-hubble-alma:
    path: /assets/images/module-03/eso1137a-antennae-merging-galaxies-hubble-alma.jpg
    caption: "What to notice: the Antennae collision is both a stellar event and a gas event. Blue starlight shows young populations, while the radio and submillimeter gas overlay marks where compressed material can fuel new star formation."
    alt: "Composite image of the Antennae Galaxies merger with blue stellar light and bright red, pink, and yellow gas emission concentrated along the overlap region and tidal structures."
    credit: "ESO/ALMA/Hubble"
    module: 3

  desi-noirlab-3d-map:
    path: /assets/images/module-03/desi-noirlab2512aa-scaled.jpg
    caption: "What to notice: every point is a galaxy with a measured redshift. The cosmic web is not a drawing; it is the pattern that appears when distances are added to sky positions."
    alt: "Three-dimensional galaxy redshift-survey map made of colored points, with a wedge-shaped survey volume and a zoomed inset showing filamentary structure."
    credit: "NSF NOIRLab/DESI Collaboration"
    module: 3

  cepheid-light-curve-m31:
    path: /assets/images/module-03/cepheid-light-curve-eso.jpg
    caption: "What to notice: a Cepheid's period is directly observable. Repeated brightness measurements turn a distant unresolved star into a clock, and that clock predicts the star's luminosity."
    alt: "Light curve of a Cepheid variable star labeled V1 in galaxy M31, with brightness on the vertical axis, dates on the horizontal axis, and a repeating sawtooth-like blue curve over a background image of Andromeda."
    credit: "ESO"
    module: 3

  cepheid-period-luminosity-plot:
    path: /assets/images/module-03/cepheids-P-L-plot.jpg
    caption: "What to notice: longer-period Cepheids are intrinsically brighter. This plot is the ladder step: period is easy to measure, luminosity follows from the relation, and flux then gives distance."
    alt: "Calibrated period-luminosity relation plot for Cepheids, showing luminosity or absolute magnitude versus period of variability. Cepheids in the Milky Way and Large Magellanic Cloud lie along a tight diagonal trend, with arrows indicating brighter and longer period."
    credit: "NASA/IPAC Extragalactic Database"
    module: 3

  hubble-sne-host-galaxies:
    path: /assets/images/module-03/hubble-host-sne-galaxies-galaxy-zoo.jpg
    caption: "What to notice: Type Ia supernova calibration is a host-galaxy problem. Cepheids in nearby galaxies set the distance to the host, and that distance calibrates any Type Ia supernova that appeared there."
    alt: "Montage of many Hubble galaxy images used as Type Ia supernova host galaxies, showing spirals, inclined disks, and irregular-looking systems in small panels."
    credit: "NASA/ESA/Hubble"
    module: 3

  measuring-hubble-constant-three-ways:
    path: /assets/images/module-03/measuring-hubble-constant-3ways.jpg
    caption: "What to notice: $H_0$ is not one measurement. Local distance ladders, supernova calibration, and early-universe inferences are different routes to the same expansion rate, which is why disagreement between them matters."
    alt: "Infographic titled Three Steps to Measuring the Hubble Constant, showing parallax calibration, Cepheid variables, Type Ia supernova host galaxies, and the cosmic microwave background as linked measurements."
    credit: "Course-provided figure"
    module: 3

  black-hole-schematic-eso:
    path: /assets/images/module-03/eso1907h-blackhole-schematic.jpg
    caption: "What to notice: the event horizon, accretion disk, photon sphere, and jets are different physical regions. The singularity label is a signpost for where classical general relativity reaches its limit, not something directly observed."
    alt: "Wide annotated schematic of a black hole with an accretion disk and relativistic jet. Labels identify the event horizon, photon sphere, innermost stable orbit, accretion disc, relativistic jet, and singularity, with explanatory text."
    credit: "ESO"
    module: 3

  early-universe-redshift-schematic:
    path: /assets/images/module-03/expansion-universe-galaxies-schematic.jpeg
    caption: "What to notice: redshift is a lookback-time coordinate. Use this as a schematic for how distant galaxies probe earlier cosmic epochs, not as a current record-holder table because the farthest-known objects change."
    alt: "Timeline-style schematic from present-day modern galaxies at redshift 0 back toward the Big Bang, marking redshifts 8, 12, and 30, the reionization era, cosmic dark ages, first stars, and example farthest-galaxy labels."
    credit: "Course-provided figure"
    module: 3

  jwst-cosmological-redshift:
    path: /assets/images/module-03/jwst-cosmological-redshift.png
    caption: "What to notice: cosmological redshift is expansion written onto light. Space stretches while the photon travels, so the received wavelength is longer than the emitted wavelength."
    alt: "Infographic titled What Is Cosmological Redshift, showing expanding space stretching light to longer wavelengths, a visible-to-infrared wavelength scale, and telescope lookback limits from modern galaxies toward the first galaxies."
    credit: "Course-provided figure"
    module: 3

  distant-star-forming-galaxies-hudf:
    path: /assets/images/module-03/distant-star-forming-galaxies-alma-vla-HST.jpg
    caption: "What to notice: distant galaxies are often multiwavelength measurements, not simple photographs. Visible light shows the stellar body, while radio emission can flag dust-obscured star formation."
    alt: "Four-panel image titled Distant Star-Forming Galaxies in the Hubble Ultra-Deep Field. Each panel shows a distant galaxy with a red radio overlay and a labeled light-travel distance of 9.0, 9.4, 10.9, or 11.2 billion light-years."
    credit: "Hubble Space Telescope and Karl G. Jansky Very Large Array"
    module: 3

  star-formation-across-cosmic-time:
    path: /assets/images/module-03/star-formation-across-cosmic-time-nas.jpg
    caption: "What to notice: star formation is a history, not a constant background process. Treat this as a model summary to read critically: modern course language places the broad high-star-formation era, cosmic noon, about 2-3 billion years after the Big Bang."
    alt: "NASA timeline graphic showing star formation across cosmic time, with star birth beginning after the dark era, peaking within the first billion years in a new model, then declining toward the present."
    credit: "NASA"
    module: 3

  jwst-mom-z14-field:
    path: /assets/images/module-03/MoM-z14-jwst.jpg
    caption: "What to notice: an extremely high-redshift galaxy can look like a tiny smudge in a deep JWST field. The scientific weight comes from the measured spectrum and redshift, not from how dramatic the image looks."
    alt: "JWST deep-field image filled with many small galaxies and foreground stars, with an inset zoom labeling a faint yellow-green source as MoM-z14."
    credit: "Course-provided figure"
    module: 3

  # ==============================================================
  # Module 4: Galaxies & Cosmology
  # ==============================================================

  milky-way-structure:
    path: /assets/images/module-04/milky-way-structure.png
    caption: "Structure of the Milky Way galaxy"
    alt: "Diagram showing disk, bulge, halo, and spiral arms of our galaxy"
    module: 4

  rotation-curve:
    path: /assets/images/module-01/cococubed/rotation_curve_b.svg
    caption: "Galaxy rotation curves reveal dark matter"
    alt: "Graph comparing expected Keplerian rotation to observed flat rotation curve"
    credit: "Figure: CoCoCubed (SVG)"
    module: 4

  hubble-diagram:
    path: /assets/images/module-04/hubble-diagram.svg
    caption: "What to notice: Hubble's law is a slope on a velocity-distance plot. The trend is the expansion rate; the scatter reminds us that nearby galaxies also have local motions."
    alt: "Teaching plot of Hubble's law showing galaxy recession velocity increasing approximately linearly with distance, with a highlighted line labeled v equals H sub zero times d."
    credit: "Illustration: A. Rosen (SVG)"
    module: 4

  cmb-map:
    path: /assets/images/module-04/cmb-map.svg
    caption: "What to notice: the CMB is almost perfectly uniform, but the tiny temperature fluctuations are the seeds that later grow into cosmic structure."
    alt: "Schematic all-sky oval map of the cosmic microwave background with small warm and cool patches, labeled as a nearly uniform 2.725 kelvin glow with tiny fluctuations."
    credit: "Illustration: A. Rosen (SVG), concept after CMB all-sky maps"
    module: 4
