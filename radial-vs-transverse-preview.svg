<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc" data-theme="dark" data-palette="aurora">
  <title id="title">Radial vs. transverse motion</title>
  <desc id="desc">Two-panel diagram showing that only line-of-sight (radial) motion produces a Doppler shift in spectral lines, while purely sideways (transverse) motion does not shift the spectrum.</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0b0f;
        --panel:#13162a;
        --fg:#eef0ff;
        --muted:#c9cbe5;
        --faint:#8f92ad;

        --aurora-teal:#028391;
        --aurora-teal-bright:#41A2AC;
        --aurora-teal-dim:#02626D;
        --aurora-pink:#BE5A83;
        --aurora-pink-bright:#CE83A2;
        --aurora-violet:#7077A1;
        --aurora-violet-bright:#9499B8;

        --teal:var(--aurora-teal);
        --teal-bright:var(--aurora-teal-bright);
        --teal-dim:var(--aurora-teal-dim);
        --pink:var(--aurora-pink);
        --pink-bright:var(--aurora-pink-bright);
        --violet:var(--aurora-violet);
        --violet-bright:var(--aurora-violet-bright);

        --red:#ff5b5b;
        --blue:#59a8ff;
        --green:#5bffa0;
      }

      text{
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        fill: var(--fg);
      }
      .title{ font-size: 32px; font-weight: 800; }
      .subtitle{ font-size: 17px; fill: var(--muted); }
      .panel-title{ font-size: 19px; font-weight: 750; }
      .panel-sub{ font-size: 15px; fill: var(--muted); }
      .label{ font-size: 14px; font-weight: 600; fill: var(--muted); }
      .label-bright{ font-size: 14px; font-weight: 600; }
      .tiny{ font-size: 13px; fill: var(--faint); }
      .result{ font-size: 16px; font-weight: 700; }
      .outline{ paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }

      .panel{ fill: var(--panel); stroke: var(--violet); stroke-width: 1.4; rx: 16; }
      .scene-bg{ fill: #0d1024; rx: 12; }

      .los{ stroke: var(--teal-dim); stroke-width: 2.5; stroke-dasharray: 8 6; opacity: 0.8; }
      .star-body{ fill: var(--fg); opacity: 0.95; }
      .star-glow{ fill: none; stroke: var(--teal-bright); stroke-width: 2; opacity: 0.5; }
      .star-glow-outer{ fill: none; stroke: var(--teal-bright); stroke-width: 1; opacity: 0.2; }

      .spec-bg{ fill: #080a18; rx: 8; stroke: var(--violet); stroke-width: 1; opacity: 0.9; }
      .spec-line-rest{ stroke: var(--fg); stroke-width: 2.5; opacity: 0.4; stroke-dasharray: 4 3; }
      .spec-line-obs{ stroke-width: 3; opacity: 0.95; }
    </style>

    <!-- Arrow markers -->
    <marker id="arr-pink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--pink-bright)"/>
    </marker>
    <marker id="arr-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0 L10 4 L0 8 z" fill="var(--violet-bright)"/>
    </marker>

    <!-- Visible spectrum gradient -->
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#7c00dc"/>
      <stop offset="16%"  stop-color="#3b00fb"/>
      <stop offset="30%"  stop-color="#0090ff"/>
      <stop offset="44%"  stop-color="#00c89c"/>
      <stop offset="58%"  stop-color="#5cda00"/>
      <stop offset="72%"  stop-color="#c8c800"/>
      <stop offset="86%"  stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#ee0000"/>
    </linearGradient>

    <!-- Eye icon -->
    <symbol id="eye" viewBox="0 0 40 24">
      <ellipse cx="20" cy="12" rx="18" ry="10" fill="none" stroke="var(--teal-bright)" stroke-width="2.5"/>
      <circle cx="20" cy="12" r="5" fill="var(--teal-bright)" opacity="0.9"/>
      <circle cx="20" cy="12" r="2" fill="var(--bg)"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="var(--bg)"/>

  <!-- Header -->
  <text x="44" y="52" class="title">Radial vs. transverse motion</text>
  <text x="44" y="78" class="subtitle">Only motion along your line of sight produces a Doppler shift.</text>

  <!-- ===== LEFT PANEL: RADIAL ===== -->
  <rect x="36" y="96" width="430" height="430" class="panel"/>

  <!-- Panel header -->
  <text x="56" y="126" class="panel-title" fill="var(--pink-bright)">Radial (line-of-sight)</text>
  <text x="56" y="146" class="panel-sub">Star moves toward or away from you</text>

  <!-- Scene area -->
  <rect x="52" y="160" width="398" height="140" class="scene-bg"/>

  <!-- Observer eye -->
  <use href="#eye" x="68" y="218" width="36" height="22"/>
  <text x="86" y="254" text-anchor="middle" class="tiny">you</text>

  <!-- Line of sight -->
  <line x1="112" y1="229" x2="360" y2="229" class="los"/>
  <text x="220" y="220" text-anchor="middle" class="label" fill="var(--teal-dim)">line of sight</text>

  <!-- Star -->
  <circle cx="378" cy="229" r="14" class="star-glow-outer"/>
  <circle cx="378" cy="229" r="10" class="star-glow"/>
  <circle cx="378" cy="229" r="6" class="star-body"/>

  <!-- Velocity arrow: toward observer (leftward, pink) -->
  <line x1="364" y1="229" x2="306" y2="229" stroke="var(--pink-bright)" stroke-width="4" marker-end="url(#arr-pink)"/>
  <text x="334" y="261" text-anchor="middle" class="label-bright" fill="var(--pink-bright)">v (toward you)</text>

  <!-- Spectrum comparison area -->
  <text x="56" y="326" class="label">SPECTRUM</text>

  <!-- Rest spectrum strip -->
  <rect x="52" y="336" width="398" height="36" class="spec-bg"/>
  <rect x="60" y="340" width="382" height="28" fill="url(#spectrum)" opacity="0.35" rx="4"/>
  <line x1="251" y1="338" x2="251" y2="370" class="spec-line-rest"/>
  <line x1="195" y1="338" x2="195" y2="370" class="spec-line-rest"/>
  <line x1="310" y1="338" x2="310" y2="370" class="spec-line-rest"/>
  <text x="430" y="358" class="tiny" text-anchor="middle">rest</text>

  <!-- Observed (blueshifted) spectrum strip -->
  <rect x="52" y="382" width="398" height="36" class="spec-bg"/>
  <rect x="60" y="386" width="382" height="28" fill="url(#spectrum)" opacity="0.35" rx="4"/>
  <!-- Lines shifted LEFT (blueshift — toward observer) -->
  <line x1="233" y1="384" x2="233" y2="416" class="spec-line-obs" stroke="var(--blue)"/>
  <line x1="177" y1="384" x2="177" y2="416" class="spec-line-obs" stroke="var(--blue)"/>
  <line x1="292" y1="384" x2="292" y2="416" class="spec-line-obs" stroke="var(--blue)"/>
  <text x="430" y="404" class="tiny" text-anchor="middle">observed</text>

  <!-- Shift annotation arrow -->
  <line x1="251" y1="376" x2="233" y2="376" stroke="var(--blue)" stroke-width="2" marker-end="url(#arr-pink)" opacity="0.6"/>

  <!-- Result badge -->
  <rect x="52" y="432" width="398" height="40" rx="10" fill="var(--teal-dim)" opacity="0.25"/>
  <text x="72" y="458" class="result" fill="var(--blue)">← Blueshift detected</text>
  <text x="340" y="458" class="panel-sub" fill="var(--muted)">Lines shift left</text>

  <!-- Result badge 2: receding -->
  <rect x="52" y="478" width="398" height="36" rx="10" fill="var(--pink)" opacity="0.12"/>
  <text x="72" y="502" class="result" fill="var(--red)">→ Redshift if receding</text>
  <text x="344" y="502" class="panel-sub" fill="var(--muted)">Lines shift right</text>


  <!-- ===== RIGHT PANEL: TRANSVERSE ===== -->
  <rect x="494" y="96" width="430" height="430" class="panel"/>

  <!-- Panel header -->
  <text x="514" y="126" class="panel-title" fill="var(--violet-bright)">Transverse (sideways)</text>
  <text x="514" y="146" class="panel-sub">Star moves across your field of view</text>

  <!-- Scene area -->
  <rect x="510" y="160" width="398" height="140" class="scene-bg"/>

  <!-- Observer eye -->
  <use href="#eye" x="526" y="218" width="36" height="22"/>
  <text x="544" y="254" text-anchor="middle" class="tiny">you</text>

  <!-- Line of sight -->
  <line x1="570" y1="229" x2="818" y2="229" class="los"/>
  <text x="680" y="220" text-anchor="middle" class="label" fill="var(--teal-dim)">line of sight</text>

  <!-- Star -->
  <circle cx="836" cy="229" r="14" class="star-glow-outer"/>
  <circle cx="836" cy="229" r="10" class="star-glow"/>
  <circle cx="836" cy="229" r="6" class="star-body"/>

  <!-- Velocity arrow: downward (perpendicular, violet) -->
  <line x1="836" y1="243" x2="836" y2="290" stroke="var(--violet-bright)" stroke-width="4" marker-end="url(#arr-violet)"/>
  <text x="836" y="275" text-anchor="end" class="label-bright" fill="var(--violet-bright)" dx="-12">v (sideways)</text>

  <!-- Right-angle indicator -->
  <rect x="828" y="237" width="8" height="8" fill="none" stroke="var(--violet-bright)" stroke-width="1.5" opacity="0.7"/>

  <!-- Spectrum comparison area -->
  <text x="514" y="326" class="label">SPECTRUM</text>

  <!-- Rest spectrum strip -->
  <rect x="510" y="336" width="398" height="36" class="spec-bg"/>
  <rect x="518" y="340" width="382" height="28" fill="url(#spectrum)" opacity="0.35" rx="4"/>
  <line x1="709" y1="338" x2="709" y2="370" class="spec-line-rest"/>
  <line x1="653" y1="338" x2="653" y2="370" class="spec-line-rest"/>
  <line x1="768" y1="338" x2="768" y2="370" class="spec-line-rest"/>
  <text x="890" y="358" class="tiny" text-anchor="middle">rest</text>

  <!-- Observed spectrum strip: NO SHIFT -->
  <rect x="510" y="382" width="398" height="36" class="spec-bg"/>
  <rect x="518" y="386" width="382" height="28" fill="url(#spectrum)" opacity="0.35" rx="4"/>
  <!-- Lines at SAME position (no shift) -->
  <line x1="709" y1="384" x2="709" y2="416" class="spec-line-obs" stroke="var(--fg)" opacity="0.8"/>
  <line x1="653" y1="384" x2="653" y2="416" class="spec-line-obs" stroke="var(--fg)" opacity="0.8"/>
  <line x1="768" y1="384" x2="768" y2="416" class="spec-line-obs" stroke="var(--fg)" opacity="0.8"/>
  <text x="890" y="404" class="tiny" text-anchor="middle">observed</text>

  <!-- "Same" annotation -->
  <text x="709" y="376" text-anchor="middle" class="tiny" fill="var(--faint)">identical</text>

  <!-- Result badge -->
  <rect x="510" y="432" width="398" height="40" rx="10" fill="var(--pink)" opacity="0.15"/>
  <text x="530" y="458" class="result" fill="var(--faint)">✗  No Doppler shift</text>
  <text x="760" y="458" class="panel-sub" fill="var(--faint)">Lines unchanged</text>

  <!-- Explanation -->
  <rect x="510" y="478" width="398" height="36" rx="10" fill="var(--violet)" opacity="0.1"/>
  <text x="530" y="502" class="panel-sub" fill="var(--faint)">Detected instead via proper motion</text>
  <text x="855" y="502" class="panel-sub" fill="var(--faint)">(years)</text>

</svg>
